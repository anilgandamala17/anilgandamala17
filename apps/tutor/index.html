<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Served under /tutor-media/* so the icons still resolve when these pages are
      proxied through the landing app on :3000, where bare /favicon.* belongs to Next.
      Cache buster stops browsers reusing another localhost project's favicon.
    -->
    <link rel="icon" type="image/png" href="/tutor-media/aira-mark.png?v=aira-logo" />
    <link rel="apple-touch-icon" href="/tutor-media/aira-mark.png?v=aira-logo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aɪra — Your Intelligent Learning Companion. Interactive AI-powered teaching platform with personalized learning, real-time doubt resolution, and automated resource generation." />
    <meta name="theme-color" content="#2F6BFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <!-- Plain script from /public avoids Vite import-analysis bugs with inline HTML + spaced paths -->
    <script src="/theme-boot.js"></script>
    <title>Aɪra — Your Intelligent Learning Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
