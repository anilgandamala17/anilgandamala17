<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Periodisation in Indian History</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">How historians divide history into periods based on dominant features</text>

<rect x="50" y="100" width="700" height="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="125" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">James Mill's Classification (1817)</text>
<text x="400" y="150" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">"A History of British India"</text>

<rect x="100" y="170" width="180" height="60" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2" rx="5"/>
<text x="190" y="205" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">HINDU</text>

<rect x="310" y="170" width="180" height="60" fill="rgba(255,213,79,0.1)" stroke="#ffd54f" stroke-width="2" rx="5"/>
<text x="400" y="205" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">MUSLIM</text>

<rect x="520" y="170" width="180" height="60" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="2" rx="5"/>
<text x="610" y="205" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">BRITISH</text>

<text x="400" y="270" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f48fb1" text-anchor="middle" font-weight="bold">Problem: Ignored diversity and the common people's lives.</text>

<line x1="20" y1="310" x2="780" y2="310" stroke="#fb923c" stroke-width="1"/>

<rect x="50" y="340" width="700" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="370" font-family="'Segoe UI',sans-serif" font-size="16" fill="#86efac" text-anchor="middle" font-weight="bold">Modern Historical Classification</text>

<g transform="translate(100,420)">
  <circle cx="0" cy="0" r="40" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">ANCIENT</text>
  <text x="0" y="65" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Early civilisations</text>
</g>

<path d="M140,420 L260,420" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>

<g transform="translate(300,420)">
  <circle cx="0" cy="0" r="40" fill="rgba(255,213,79,0.1)" stroke="#ffd54f" stroke-width="2"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">MEDIEVAL</text>
  <text x="0" y="65" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Regional kingdoms</text>
</g>

<path d="M340,420 L460,420" stroke="rgba(255,255,255,0.3)" stroke-width="2" marker-end="url(#arrowhead)"/>

<g transform="translate(500,420)">
  <circle cx="0" cy="0" r="40" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="2"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">MODERN</text>
  <text x="0" y="65" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Science, Reason, Liberty</text>
</g>

<text x="400" y="520" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Colonial: The period under British rule (subjugation &amp; change)</text>
<text x="400" y="545" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Modernity in Europe vs Lack of freedom in Colonial India</text>

<defs>
  <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="rgba(255,255,255,0.3)" />
  </marker>
</defs>
</svg>
