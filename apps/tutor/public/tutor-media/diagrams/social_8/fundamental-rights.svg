<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Fundamental Rights of Indian Citizens</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Universal rights ensured by the Constitution to protect against state misuse of power</text>

<rect x="25" y="85" width="370" height="140" fill="none" stroke="#ffd54f" stroke-width="2" rx="10"/>
<text x="210" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">1. Right to Equality</text>
<text x="50" y="140" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• All are equal before the law</text>
<text x="50" y="165" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• No discrimination (Religion, Caste, Sex)</text>
<text x="50" y="190" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Equal access to public places</text>
<text x="50" y="215" font-family="'Segoe UI',sans-serif" font-size="11" fill="#86efac" text-anchor="start">Abolition of Untouchability &amp; Titles</text>

<rect x="405" y="85" width="370" height="140" fill="none" stroke="#86efac" stroke-width="2" rx="10"/>
<text x="590" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">2. Right to Freedom</text>
<text x="430" y="140" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Speech and Expression</text>
<text x="430" y="165" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Assemble peacefully (without arms)</text>
<text x="430" y="190" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Move freely / Reside in any part of India</text>
<text x="430" y="215" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ffd54f" text-anchor="start">Practice any profession or occupation</text>

<rect x="25" y="235" width="370" height="140" fill="none" stroke="#f48fb1" stroke-width="2" rx="10"/>
<text x="210" y="260" font-family="'Segoe UI',sans-serif" font-size="15" fill="#f48fb1" text-anchor="middle" font-weight="bold">3. Right against Exploitation</text>
<text x="50" y="290" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Prohibition of human trafficking</text>
<text x="50" y="315" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Prohibition of forced labor (Begar)</text>
<text x="50" y="340" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• No child labor (under 14 yrs)</text>
<text x="210" y="365" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Protects the dignity of every individual</text>

<rect x="405" y="235" width="370" height="140" fill="none" stroke="#c084fc" stroke-width="2" rx="10"/>
<text x="590" y="260" font-family="'Segoe UI',sans-serif" font-size="15" fill="#c084fc" text-anchor="middle" font-weight="bold">4. Right to Freedom of Religion</text>
<text x="430" y="290" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Freedom of conscience</text>
<text x="430" y="315" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Profess, practice &amp; propagate religion</text>
<text x="430" y="340" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="start">State cannot taxes for specific religions</text>
<text x="590" y="365" font-family="'Segoe UI',sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Essential for secular India</text>

<rect x="25" y="385" width="370" height="140" fill="none" stroke="#fb923c" stroke-width="2" rx="10"/>
<text x="210" y="410" font-family="'Segoe UI',sans-serif" font-size="15" fill="#fb923c" text-anchor="middle" font-weight="bold">5. Cultural &amp; Educational Rights</text>
<text x="50" y="440" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Minorities can set up own institutions</text>
<text x="50" y="465" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Preserve distinct language and script</text>
<text x="50" y="490" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• No discrimination in admission to State-aided</text>
<text x="210" y="515" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Protects linguistic and religious minorities</text>

<rect x="405" y="385" width="370" height="140" fill="none" stroke="#22d3ee" stroke-width="2" rx="10"/>
<text x="590" y="410" font-family="'Segoe UI',sans-serif" font-size="15" fill="#22d3ee" text-anchor="middle" font-weight="bold">6. Right to Constitutional Remedies</text>
<text x="430" y="440" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Move Courts if any right is violated</text>
<text x="430" y="465" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="start">• Courts can issue "Writs" for enforcement</text>
<text x="590" y="495" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Heart and Soul of Constitution</text>
<text x="590" y="515" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Empowers citizens to defend their rights</text>

<text x="400" y="565" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Rights are Justiciable: enforceable in Courts | Suspension possible during Emergency</text>
<text x="400" y="585" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Part III (Articles 12-35) | Fundamental Duties in Part IV-A (Article 51-A)</text>
</svg>