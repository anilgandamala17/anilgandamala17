<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Sustainable Development</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Development that meets the needs of the present without compromising future generations</text>

<circle cx="400" cy="220" r="100" fill="none" stroke="#ffd54f" stroke-width="3" stroke-dasharray="8,4"/>
<text x="400" y="225" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">SUSTAINABILITY</text>

<!-- 3 Pillars -->
<rect x="230" y="340" width="110" height="150" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2" rx="10"/>
<text x="285" y="370" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Environment</text>
<text x="285" y="400" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Conserve Biology</text>
<text x="285" y="420" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Reduce Waste</text>
<text x="285" y="440" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Clean Energy</text>

<rect x="350" y="340" width="100" height="150" fill="rgba(255,213,79,0.1)" stroke="#ffd54f" stroke-width="2" rx="10"/>
<text x="400" y="370" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Society</text>
<text x="400" y="400" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Education</text>
<text x="400" y="420" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Health</text>
<text x="400" y="440" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Equality</text>

<rect x="460" y="340" width="110" height="150" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="2" rx="10"/>
<text x="515" y="370" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle" font-weight="bold">Economy</text>
<text x="515" y="400" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Decent Jobs</text>
<text x="515" y="420" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Green Tech</text>
<text x="515" y="440" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">Fair Trade</text>

<line x1="20" y1="520" x2="780" y2="520" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="550" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Core Principles</text>
<text x="400" y="575" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">Respect and care for all forms of life | Conserve diversity | Change personal attitudes</text>

<path d="M150,220 Q100,220 100,150" fill="none" stroke="#ffd54f" stroke-width="1.5" marker-end="url(#dot)"/>
<text x="130" y="140" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="end">Resource</text>
<text x="130" y="160" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="end">Efficiency</text>

<path d="M650,220 Q700,220 700,150" fill="none" stroke="#ffd54f" stroke-width="1.5" marker-end="url(#dot)"/>
<text x="670" y="140" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="start">Equity &amp;</text>
<text x="670" y="160" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="start">Fairness</text>

<defs>
  <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
    <circle cx="3" cy="3" r="2" fill="#ffd54f"/>
  </marker>
</defs>
</svg>