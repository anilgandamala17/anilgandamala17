<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Historical Sources &amp; Archives</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">How we know about the last 250 years of Indian history</text>

<rect x="25" y="90" width="370" height="230" fill="none" stroke="#ffd54f" stroke-width="2" rx="10"/>
<text x="210" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Official Records</text>
<text x="60" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">1. Administrative Records</text>
<text x="60" y="165" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Letters, memos, reports, files</text>
<text x="60" y="195" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">2. National Archives of India</text>
<text x="60" y="215" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Preserved official documents in Delhi</text>
<text x="60" y="245" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">3. Calligraphists</text>
<text x="60" y="265" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Professionals who copy records beautifully</text>
<text x="210" y="300" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle">Records show what officials thought &amp; felt</text>

<rect x="405" y="90" width="370" height="230" fill="none" stroke="#86efac" stroke-width="2" rx="10"/>
<text x="590" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Surveys &amp; Data</text>
<text x="440" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">1. Mapping &amp; Topography</text>
<text x="440" y="175" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">2. Census (every 10 years)</text>
<text x="460" y="195" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Population, Caste, Occupation data</text>
<text x="440" y="225" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">3. Specialized Surveys</text>
<text x="460" y="245" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="start">Botanical, Zoological, Archaeological</text>
<text x="440" y="275" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">4. Anthropological Surveys</text>
<text x="590" y="305" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Helped the British administration rule better</text>

<line x1="20" y1="340" x2="780" y2="340" stroke="#fb923c" stroke-width="1"/>

<rect x="25" y="360" width="750" height="180" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="385" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fb923c" text-anchor="middle" font-weight="bold">What Records Do NOT Tell</text>
<text x="400" y="415" font-family="'Segoe UI',sans-serif" font-size="14" fill="#fff" text-anchor="middle">Official records exclude or ignore the experiences of:</text>

<g transform="translate(150,470)">
  <circle cx="0" cy="0" r="35" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">PEASANTS</text>
</g>
<g transform="translate(310,470)">
  <circle cx="0" cy="0" r="35" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">TRIBALS</text>
</g>
<g transform="translate(470,470)">
  <circle cx="0" cy="0" r="35" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">WORKERS</text>
</g>
<g transform="translate(630,470)">
  <circle cx="0" cy="0" r="35" fill="rgba(244,143,177,0.1)" stroke="#f48fb1" stroke-width="1.5"/>
  <text x="0" y="5" font-family="'Segoe UI',sans-serif" font-size="11" fill="#fff" text-anchor="middle">OUTCASTS</text>
</g>

<text x="400" y="530" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Unofficial Sources: Diaries, Pilgrims' accounts, Autobiographies, Newspapers</text>
<text x="400" y="555" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Reveal the feelings and struggles of ordinary Indians during colonial rule.</text>
</svg>
