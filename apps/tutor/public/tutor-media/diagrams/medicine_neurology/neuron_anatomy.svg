<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowN" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fef08a" />
    </marker>
  </defs>

  <!-- Dendrites -->
  <path d="M40 100 L75 125 M30 140 L70 140 M40 180 L75 158"
    stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none" />
  <text x="30" y="88" font-size="9" fill="#93c5fd" font-weight="bold">DENDRITES</text>
  <text x="30" y="99" font-size="7" fill="rgba(255,255,255,0.30)">(receive signals)</text>

  <!-- Cell body / Soma -->
  <circle cx="90" cy="140" r="28" fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="2" />
  <text x="90" y="137" font-size="8" fill="rgba(255,255,255,0.90)" text-anchor="middle" font-weight="bold">SOMA</text>
  <text x="90" y="148" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(cell body)</text>
  <!-- Nucleus -->
  <circle cx="90" cy="140" r="10" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Axon -->
  <line x1="118" y1="140" x2="310" y2="140" stroke="#fef08a" stroke-width="3" />
  <text x="200" y="128" font-size="9" fill="#fef08a" text-anchor="middle" font-weight="bold">AXON</text>
  <text x="200" y="138" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(transmits signal)</text>

  <!-- Myelin sheaths -->
  <rect x="140" y="133" width="20" height="14" rx="3" fill="none" stroke="#86efac" stroke-width="1" />
  <rect x="185" y="133" width="20" height="14" rx="3" fill="none" stroke="#86efac" stroke-width="1" />
  <rect x="230" y="133" width="20" height="14" rx="3" fill="none" stroke="#86efac" stroke-width="1" />
  <text x="200" y="162" font-size="7" fill="#86efac" text-anchor="middle">Myelin Sheath</text>

  <!-- Axon terminals -->
  <circle cx="325" cy="125" r="8" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <circle cx="325" cy="155" r="8" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <text x="360" y="143" font-size="9" fill="#fca5a5" font-weight="bold">TERMINALS</text>
  <text x="360" y="154" font-size="7" fill="rgba(255,255,255,0.30)">(synapse)</text>

  <!-- Signal direction -->
  <path d="M118 155 L310 155" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowN)" opacity="0.5" />

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Neuron Anatomy</text>
</svg>
