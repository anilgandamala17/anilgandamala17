<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .chalk { font-family: 'Segoe UI', sans-serif; }
      .title { font-size: 26px; font-weight: bold; fill: #a5d6a7; }
      .label { font-size: 17px; fill: #c8e6c9; }
      .num { font-size: 20px; fill: #fff9c4; font-weight: bold; }
      .muted { font-size: 14px; fill: #81c784; }
      .highlight { fill: rgba(102,187,106,0.12); stroke: #66bb6a; stroke-width: 1.5; }
    </style>
  </defs>
  <text x="400" y="44" text-anchor="middle" class="chalk title">Number Line – Whole Numbers</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Main Number Line -->
  <g transform="translate(60,100)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#a5d6a7" stroke-width="3"/>
    <!-- Arrow right -->
    <polygon points="680,0 670,-6 670,6" fill="#a5d6a7"/>
    <!-- Tick marks 0-10 -->
    <g id="ticks">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#66bb6a" stroke-width="2"/>
      <text y="30" text-anchor="middle" class="chalk num" style="font-size:18px">0</text>
      <line x1="62" y1="-10" x2="62" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="62" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">1</text>
      <line x1="124" y1="-10" x2="124" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="124" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">2</text>
      <line x1="186" y1="-10" x2="186" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="186" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">3</text>
      <line x1="248" y1="-10" x2="248" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="248" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">4</text>
      <line x1="310" y1="-10" x2="310" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="310" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">5</text>
      <line x1="372" y1="-10" x2="372" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="372" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">6</text>
      <line x1="434" y1="-10" x2="434" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="434" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">7</text>
      <line x1="496" y1="-10" x2="496" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="496" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">8</text>
      <line x1="558" y1="-10" x2="558" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="558" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">9</text>
      <line x1="620" y1="-10" x2="620" y2="10" stroke="#66bb6a" stroke-width="1.5"/>
      <text x="620" y="30" text-anchor="middle" class="chalk num" style="font-size:18px">10</text>
    </g>
    <!-- dot at 0 -->
    <circle cx="0" cy="0" r="6" fill="#a5d6a7"/>
    <text x="0" y="-24" text-anchor="middle" class="chalk muted" style="fill:#fff176">Zero (0)</text>
    <text x="0" y="-10" text-anchor="middle" class="chalk muted" style="fill:#fff176; font-size:11px">Start of whole #s</text>
  </g>

  <!-- Operations on number line -->
  <g transform="translate(60,200)">
    <text x="0" y="0" class="chalk label" style="fill:#fff176">3 + 4 = 7  (move 4 steps right from 3)</text>
    <line x1="0" y1="20" x2="680" y2="20" stroke="#66bb6a" stroke-width="1.5"/>
    <line x1="186" y1="14" x2="186" y2="26" stroke="#fff176" stroke-width="2"/>
    <line x1="434" y1="14" x2="434" y2="26" stroke="#fff176" stroke-width="2"/>
    <path d="M 186 20 Q 310 -10 434 20" fill="none" stroke="#fff176" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="434,20 424,14 428,22" fill="#fff176"/>
    <text x="186" y="42" text-anchor="middle" class="chalk num" style="font-size:15px;fill:#fff176">3</text>
    <text x="434" y="42" text-anchor="middle" class="chalk num" style="font-size:15px;fill:#fff176">7</text>
  </g>

  <g transform="translate(60,280)">
    <text x="0" y="0" class="chalk label" style="fill:#ef9a9a">8 − 5 = 3  (move 5 steps left from 8)</text>
    <line x1="0" y1="20" x2="680" y2="20" stroke="#66bb6a" stroke-width="1.5"/>
    <line x1="186" y1="14" x2="186" y2="26" stroke="#ef9a9a" stroke-width="2"/>
    <line x1="496" y1="14" x2="496" y2="26" stroke="#ef9a9a" stroke-width="2"/>
    <path d="M 496 20 Q 341 -10 186 20" fill="none" stroke="#ef9a9a" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="186,20 196,14 192,22" fill="#ef9a9a"/>
    <text x="186" y="42" text-anchor="middle" class="chalk num" style="font-size:15px;fill:#ef9a9a">3</text>
    <text x="496" y="42" text-anchor="middle" class="chalk num" style="font-size:15px;fill:#ef9a9a">8</text>
  </g>

  <!-- Key facts -->
  <g transform="translate(60,360)">
    <rect x="0" y="0" width="320" height="110" class="highlight" rx="10"/>
    <text x="160" y="24" text-anchor="middle" class="chalk label">Key Facts</text>
    <text x="14" y="48" class="chalk muted">• Every point = exactly one number</text>
    <text x="14" y="68" class="chalk muted">• Numbers increase left → right</text>
    <text x="14" y="88" class="chalk muted">• Extends infinitely to the right</text>
    <text x="14" y="106" class="chalk muted">• Fractions &amp; decimals fit between!</text>

    <rect x="340" y="0" width="320" height="110" class="highlight" rx="10"/>
    <text x="500" y="24" text-anchor="middle" class="chalk label">Predecessor &amp; Successor</text>
    <text x="354" y="48" class="chalk muted">Predecessor of 5 = 4</text>
    <text x="354" y="68" class="chalk muted">Successor of 5 = 6</text>
    <text x="354" y="88" class="chalk muted">0 has no predecessor in whole #s</text>
  </g>
</svg>
