<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .chalk { font-family: 'Segoe UI', sans-serif; }
      .title { font-size: 26px; font-weight: bold; fill: #a5d6a7; }
      .label { font-size: 17px; fill: #c8e6c9; }
      .num { font-size: 20px; fill: #fff9c4; font-weight: bold; }
      .muted { font-size: 14px; fill: #81c784; }
      .highlight { fill: rgba(102,187,106,0.12); stroke: #66bb6a; stroke-width: 1.5; }
      .yellow { fill: rgba(255,245,157,0.12); stroke: #fff176; stroke-width: 1.5; }
    </style>
  </defs>
  <text x="400" y="44" text-anchor="middle" class="chalk title">Basic Geometrical Ideas – Points</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Point definition -->
  <g transform="translate(60,75)">
    <rect x="0" y="0" width="680" height="60" class="highlight" rx="10"/>
    <text x="340" y="24" text-anchor="middle" class="chalk label">A Point marks an exact location in space.</text>
    <text x="340" y="48" text-anchor="middle" class="chalk muted">It has NO size, NO length, NO width — it is dimensionless. Represented by a dot (•) with a capital letter.</text>
  </g>

  <!-- Points diagram -->
  <g transform="translate(60,155)">
    <!-- Plane background -->
    <rect x="0" y="0" width="340" height="220" class="highlight" rx="10"/>
    <text x="170" y="22" text-anchor="middle" class="chalk label">Points on a Plane</text>

    <!-- Scattered points -->
    <circle cx="80" cy="80" r="5" fill="#fff176" stroke="#ffee58" stroke-width="1.5"/>
    <text x="92" y="76" class="chalk num" style="font-size:18px;fill:#fff176">A</text>

    <circle cx="200" cy="55" r="5" fill="#a5d6a7" stroke="#66bb6a" stroke-width="1.5"/>
    <text x="212" y="51" class="chalk num" style="font-size:18px;fill:#a5d6a7">B</text>

    <circle cx="290" cy="130" r="5" fill="#ef9a9a" stroke="#e57373" stroke-width="1.5"/>
    <text x="302" y="126" class="chalk num" style="font-size:18px;fill:#ef9a9a">C</text>

    <circle cx="120" cy="170" r="5" fill="#ce93d8" stroke="#ba68c8" stroke-width="1.5"/>
    <text x="132" y="166" class="chalk num" style="font-size:18px;fill:#ce93d8">D</text>

    <circle cx="250" cy="185" r="5" fill="#80deea" stroke="#4dd0e1" stroke-width="1.5"/>
    <text x="262" y="181" class="chalk num" style="font-size:18px;fill:#80deea">E</text>

    <text x="170" y="215" text-anchor="middle" class="chalk muted">Each named by a CAPITAL letter</text>

    <!-- Properties side -->
    <rect x="360" y="0" width="320" height="220" class="highlight" rx="10"/>
    <text x="520" y="22" text-anchor="middle" class="chalk label">Properties of Points</text>
    <line x1="370" y1="32" x2="670" y2="32" stroke="#66bb6a" stroke-width="0.8"/>
    <text x="376" y="58" class="chalk muted">• Zero dimensions</text>
    <text x="376" y="84" class="chalk muted">• Infinite number of points on  </text>
    <text x="376" y="100" class="chalk muted">  any line or curve</text>
    <text x="376" y="126" class="chalk muted">• 2 distinct points → exactly</text>
    <text x="376" y="142" class="chalk muted">  one line passes through them</text>
    <text x="376" y="168" class="chalk muted">• Distance between A &amp; B :</text>
    <text x="376" y="188" class="chalk num" style="font-size:16px">AB = √[(x₂-x₁)²+(y₂-y₁)²]</text>
  </g>

  <!-- Collinear vs Non-collinear -->
  <g transform="translate(60,396)">
    <rect x="0" y="0" width="320" height="80" class="yellow" rx="10"/>
    <text x="160" y="22" text-anchor="middle" class="chalk label">Collinear Points</text>
    <line x1="20" y1="50" x2="300" y2="50" stroke="#fff176" stroke-width="2"/>
    <circle cx="60" cy="50" r="5" fill="#fff176"/>
    <text x="60" y="68" text-anchor="middle" class="chalk muted" style="fill:#fff176">P</text>
    <circle cx="160" cy="50" r="5" fill="#fff176"/>
    <text x="160" y="68" text-anchor="middle" class="chalk muted" style="fill:#fff176">Q</text>
    <circle cx="260" cy="50" r="5" fill="#fff176"/>
    <text x="260" y="68" text-anchor="middle" class="chalk muted" style="fill:#fff176">R</text>
    <text x="160" y="16" text-anchor="middle" class="chalk muted">P, Q, R on same line</text>

    <rect x="360" y="0" width="320" height="80" class="highlight" rx="10"/>
    <text x="520" y="22" text-anchor="middle" class="chalk label">Non-Collinear Points</text>
    <circle cx="430" cy="55" r="5" fill="#a5d6a7"/>
    <text x="430" y="72" text-anchor="middle" class="chalk muted">A</text>
    <circle cx="540" cy="35" r="5" fill="#a5d6a7"/>
    <text x="540" y="28" text-anchor="middle" class="chalk muted">B</text>
    <circle cx="610" cy="65" r="5" fill="#a5d6a7"/>
    <text x="610" y="78" text-anchor="middle" class="chalk muted">C</text>
    <text x="520" y="16" text-anchor="middle" class="chalk muted">Not all on same line</text>
  </g>
</svg>
