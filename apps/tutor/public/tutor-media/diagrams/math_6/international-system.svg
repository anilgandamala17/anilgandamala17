<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .chalk { font-family: 'Segoe UI', sans-serif; }
      .title { font-size: 26px; font-weight: bold; fill: #a5d6a7; }
      .label { font-size: 17px; fill: #c8e6c9; }
      .num { font-size: 20px; fill: #fff9c4; font-weight: bold; }
      .muted { font-size: 14px; fill: #81c784; }
      .highlight { fill: rgba(102,187,106,0.12); stroke: #66bb6a; stroke-width: 1.5; }
      .blue { fill: rgba(66,165,245,0.12); stroke: #42a5f5; stroke-width: 1.5; }
      .yellow { fill: rgba(255,245,157,0.12); stroke: #fff176; stroke-width: 1.5; }
    </style>
  </defs>
  <text x="400" y="44" text-anchor="middle" class="chalk title">International vs Indian Number System</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- International System -->
  <g transform="translate(60,70)">
    <text x="170" y="0" text-anchor="middle" class="chalk label" style="fill:#42a5f5">International System (Commas every 3 digits)</text>
    <rect x="0" y="10" width="120" height="60" class="blue" rx="8"/>
    <text x="60" y="32" text-anchor="middle" class="chalk muted" style="fill:#90caf9">Billions</text>
    <text x="60" y="56" text-anchor="middle" class="chalk num" style="fill:#bbdefb">_ _ _</text>

    <rect x="130" y="10" width="120" height="60" class="blue" rx="8"/>
    <text x="190" y="32" text-anchor="middle" class="chalk muted" style="fill:#90caf9">Millions</text>
    <text x="190" y="56" text-anchor="middle" class="chalk num" style="fill:#bbdefb">_ _ _</text>

    <rect x="260" y="10" width="120" height="60" class="blue" rx="8"/>
    <text x="320" y="32" text-anchor="middle" class="chalk muted" style="fill:#90caf9">Thousands</text>
    <text x="320" y="56" text-anchor="middle" class="chalk num" style="fill:#bbdefb">_ _ _</text>

    <rect x="390" y="10" width="120" height="60" class="blue" rx="8"/>
    <text x="450" y="32" text-anchor="middle" class="chalk muted" style="fill:#90caf9">Ones</text>
    <text x="450" y="56" text-anchor="middle" class="chalk num" style="fill:#bbdefb">_ _ _</text>
  </g>

  <!-- Indian System -->
  <g transform="translate(60,190)">
    <text x="170" y="0" text-anchor="middle" class="chalk label" style="fill:#a5d6a7">Indian System (Commas: 3, then 2, 2...)</text>
    <rect x="0" y="10" width="100" height="60" class="highlight" rx="8"/>
    <text x="50" y="32" text-anchor="middle" class="chalk muted">Crores</text>
    <text x="50" y="56" text-anchor="middle" class="chalk num">_ _</text>

    <rect x="110" y="10" width="100" height="60" class="highlight" rx="8"/>
    <text x="160" y="32" text-anchor="middle" class="chalk muted">Lakhs</text>
    <text x="160" y="56" text-anchor="middle" class="chalk num">_ _</text>

    <rect x="220" y="10" width="120" height="60" class="highlight" rx="8"/>
    <text x="280" y="32" text-anchor="middle" class="chalk muted">Thousands</text>
    <text x="280" y="56" text-anchor="middle" class="chalk num">_ _</text>

    <rect x="350" y="10" width="120" height="60" class="highlight" rx="8"/>
    <text x="410" y="32" text-anchor="middle" class="chalk muted">Ones</text>
    <text x="410" y="56" text-anchor="middle" class="chalk num">_ _ _</text>
  </g>

  <!-- Comparison table -->
  <g transform="translate(60,300)">
    <text x="0" y="0" class="chalk label">Equivalence Table:</text>
    <rect x="0" y="12" width="680" height="150" class="highlight" rx="10"/>

    <!-- Headers -->
    <text x="20" y="36" class="chalk muted" style="fill:#42a5f5;font-weight:bold">International</text>
    <text x="280" y="36" class="chalk muted" style="fill:#a5d6a7;font-weight:bold">Indian</text>
    <text x="500" y="36" class="chalk muted" style="font-weight:bold">Relation</text>
    <line x1="10" y1="44" x2="670" y2="44" stroke="#66bb6a" stroke-width="0.8"/>

    <text x="20" y="68" class="chalk muted">1 Million (10,00,000)</text>
    <text x="280" y="68" class="chalk num">10 Lakhs</text>
    <text x="500" y="68" class="chalk muted">1M = 10L</text>

    <text x="20" y="96" class="chalk muted">10 Million (1,00,00,000)</text>
    <text x="280" y="96" class="chalk num">1 Crore</text>
    <text x="500" y="96" class="chalk muted">10M = 1 Cr</text>

    <text x="20" y="124" class="chalk muted">1 Billion (1,00,00,00,000)</text>
    <text x="280" y="124" class="chalk num">100 Crores</text>
    <text x="500" y="124" class="chalk muted">1B = 100 Cr</text>

    <text x="20" y="152" class="chalk muted">1 Thousand (1,000)</text>
    <text x="280" y="152" class="chalk num">1 Thousand</text>
    <text x="500" y="152" class="chalk muted">Same!</text>
  </g>
</svg>
