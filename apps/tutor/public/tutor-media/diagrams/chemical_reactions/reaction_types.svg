<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .label { font-size: 10px; fill: #94a3b8; }
      .atom { stroke: #fff; stroke-width: 1.5; }
      .arrow { stroke: #fbbf24; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
  </defs>
  
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">TYPES OF CHEMICAL REACTIONS</text>
  
  <!-- 1. Combination Reaction: A + B -> AB -->
  <g transform="translate(40, 60)">
    <text x="0" y="-10" class="label">COMBINATION (A + B → AB)</text>
    <circle cx="20" cy="20" r="12" fill="#ef4444" class="atom" />
    <text x="16" y="24" fontSize="10" fill="white" fontWeight="bold">A</text>
    <text x="45" y="25" fontSize="14">+</text>
    <circle cx="70" cy="20" r="12" fill="#3b82f6" class="atom" />
    <text x="66" y="24" fontSize="10" fill="white" fontWeight="bold">B</text>
    <line x1="95" y1="20" x2="125" y2="20" class="arrow" />
    <circle cx="150" cy="20" r="12" fill="#ef4444" class="atom" />
    <circle cx="165" cy="20" r="12" fill="#3b82f6" class="atom" />
    <text x="152" y="24" fontSize="10" fill="white" fontWeight="bold">AB</text>
  </g>

  <!-- 2. Decomposition Reaction: AB -> A + B -->
  <g transform="translate(40, 120)">
    <text x="0" y="-10" class="label">DECOMPOSITION (AB → A + B)</text>
    <circle cx="20" cy="20" r="12" fill="#10b981" class="atom" />
    <circle cx="35" cy="20" r="12" fill="#f59e0b" class="atom" />
    <text x="22" y="24" fontSize="10" fill="white" fontWeight="bold">AB</text>
    <line x1="60" y1="20" x2="90" y2="20" class="arrow" />
    <circle cx="115" cy="20" r="12" fill="#10b981" class="atom" />
    <text x="111" y="24" fontSize="10" fill="white" fontWeight="bold">A</text>
    <text x="135" y="25" fontSize="14">+</text>
    <circle cx="160" cy="20" r="12" fill="#f59e0b" class="atom" />
    <text x="156" y="24" fontSize="10" fill="white" fontWeight="bold">B</text>
  </g>

  <!-- 3. Displacement Reaction: A + BC -> AC + B -->
  <g transform="translate(40, 180)">
    <text x="0" y="-10" class="label">DISPLACEMENT (A + BC → AC + B)</text>
    <circle cx="20" cy="20" r="12" fill="#8b5cf6" class="atom" />
    <text x="16" y="24" fontSize="10" fill="white" fontWeight="bold">A</text>
    <text x="40" y="25" fontSize="14">+</text>
    <circle cx="65" cy="20" r="12" fill="#3b82f6" class="atom" />
    <circle cx="80" cy="20" r="12" fill="#ef4444" class="atom" />
    <text x="68" y="24" fontSize="10" fill="white" fontWeight="bold">BC</text>
    <line x1="105" y1="20" x2="135" y2="20" class="arrow" />
    <circle cx="160" cy="20" r="12" fill="#8b5cf6" class="atom" />
    <circle cx="175" cy="20" r="12" fill="#ef4444" class="atom" />
    <text x="162" y="24" fontSize="10" fill="white" fontWeight="bold">AC</text>
    <text x="200" y="25" fontSize="14">+</text>
    <circle cx="225" cy="20" r="12" fill="#3b82f6" class="atom" />
    <text x="221" y="24" fontSize="10" fill="white" fontWeight="bold">B</text>
  </g>
</svg>
