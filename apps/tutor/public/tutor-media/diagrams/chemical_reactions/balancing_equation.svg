<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .label { font-size: 10px; fill: #94a3b8; }
      .scale { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .atom-h { fill: #cbd5e1; stroke: #fff; }
      .atom-o { fill: #ef4444; stroke: #fff; }
    </style>
  </defs>
  
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">BALANCING EQUATIONS: 2H₂ + O₂ → 2H₂O</text>

  <!-- Left Side: Reactants -->
  <g transform="translate(50, 100)">
    <text x="40" y="-30" class="label" text-anchor="middle">REACTANTS</text>
    <!-- 2 H2 molecules -->
    <g transform="translate(0,0)">
      <circle cx="10" cy="10" r="8" class="atom-h"/>
      <circle cx="22" cy="10" r="8" class="atom-h"/>
      <text x="10" y="35" fontSize="10">H₂</text>
    </g>
    <g transform="translate(0, 40)">
      <circle cx="10" cy="10" r="8" class="atom-h"/>
      <circle cx="22" cy="10" r="8" class="atom-h"/>
      <text x="10" y="35" fontSize="10">H₂</text>
    </g>
    <!-- 1 O2 molecule -->
    <g transform="translate(50, 20)">
      <circle cx="10" cy="10" r="10" class="atom-o"/>
      <circle cx="26" cy="10" r="10" class="atom-o"/>
      <text x="12" y="35" fontSize="10">O₂</text>
    </g>
    
    <text x="0" y="90" fontSize="12" fill="#fbbf24">Total: 4H, 2O</text>
  </g>

  <!-- Arrow -->
  <path d="M 160 120 L 220 120" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Right Side: Products -->
  <g transform="translate(260, 100)">
    <text x="40" y="-30" class="label" text-anchor="middle">PRODUCTS</text>
    <!-- 2 H2O molecules -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="10" r="10" class="atom-o"/>
      <circle cx="8" cy="20" r="8" class="atom-h"/>
      <circle cx="32" cy="20" r="8" class="atom-h"/>
      <text x="15" y="45" fontSize="10">H₂O</text>
    </g>
    <g transform="translate(60, 0)">
       <circle cx="20" cy="10" r="10" class="atom-o"/>
      <circle cx="8" cy="20" r="8" class="atom-h"/>
      <circle cx="32" cy="20" r="8" class="atom-h"/>
      <text x="15" y="45" fontSize="10">H₂O</text>
    </g>
    
    <text x="0" y="90" fontSize="12" fill="#fbbf24">Total: 4H, 2O</text>
  </g>
  
  <text x="140" y="240" class="title" fill="#4ade80">BALANCED ✅</text>
</svg>
