<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <defs>
    <marker id="arrowW" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#ffffff"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#86efac"/></marker>
  </defs>
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Amygdala — Fear &amp; Anxiety Pathway</text>
  <!-- Brain outline -->
  <path d="M80 80 Q60 60 70 40 Q90 20 130 25 Q170 15 200 30 Q240 15 280 25 Q320 20 330 40 Q340 60 320 80 Q340 110 330 145 Q320 175 290 185 Q260 200 200 205 Q140 200 110 185 Q80 175 70 145 Q60 110 80 80Z" fill="rgba(134,239,172,0.06)" stroke="#86efac" stroke-width="1.5"/>
  <!-- Amygdala (almond shape, deep in temporal lobe) -->
  <ellipse cx="155" cy="140" rx="28" ry="20" fill="rgba(252,165,165,0.3)" stroke="#fca5a5" stroke-width="2"/>
  <text x="155" y="136" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace" font-weight="bold">Amygdala</text>
  <text x="155" y="148" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">"Fear center"</text>
  <!-- Hippocampus -->
  <path d="M185 155 Q210 145 225 155 Q235 165 225 175 Q210 185 195 178" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <text x="215" y="192" font-size="8" fill="#93c5fd" text-anchor="middle" font-family="monospace">Hippocampus</text>
  <text x="215" y="202" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(memory context)</text>
  <!-- Prefrontal cortex -->
  <ellipse cx="200" cy="55" rx="50" ry="22" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="200" y="51" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Prefrontal</text>
  <text x="200" y="63" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Cortex</text>
  <!-- Stimulus box -->
  <rect x="15" y="120" width="60" height="40" rx="4" fill="rgba(147,197,253,0.15)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="45" y="136" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Threat</text>
  <text x="45" y="150" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Stimulus</text>
  <!-- Pathway arrows -->
  <line x1="75" y1="140" x2="125" y2="140" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="100" y="132" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Thalamus</text>
  <!-- Amygdala to responses -->
  <line x1="183" y1="140" x2="250" y2="110" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <rect x="250" y="90" width="70" height="30" rx="3" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1"/>
  <text x="285" y="108" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Cortisol ↑</text>
  <line x1="183" y1="148" x2="250" y2="148" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <rect x="250" y="133" width="70" height="30" rx="3" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1"/>
  <text x="285" y="151" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Adrenaline ↑</text>
  <line x1="183" y1="155" x2="250" y2="185" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowW)"/>
  <rect x="250" y="172" width="70" height="30" rx="3" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1"/>
  <text x="285" y="190" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Heart rate ↑</text>
  <!-- PFC inhibition -->
  <line x1="200" y1="77" x2="175" y2="122" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <text x="175" y="100" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">Inhibits</text>
  <text x="175" y="110" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">(rational</text>
  <text x="175" y="120" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">control)</text>
  <!-- Fight/Flight label -->
  <rect x="250" y="215" width="130" height="22" rx="3" fill="rgba(252,165,165,0.1)" stroke="#fca5a5" stroke-width="1"/>
  <text x="315" y="230" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Fight-or-Flight Response</text>
  <!-- HPA axis note -->
  <text x="200" y="268" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle" font-family="monospace">HPA Axis: Hypothalamus → Pituitary → Adrenal gland → Cortisol</text>
</svg>
