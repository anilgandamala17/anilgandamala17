<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Parent Alleles -->
  <text x="140" y="40" font-size="12" fill="#fef08a" text-anchor="middle" font-weight="bold">B</text>
  <text x="260" y="40" font-size="12" fill="#fef08a" text-anchor="middle" font-weight="bold">b</text>
  <text x="40" y="110" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="bold">B</text>
  <text x="40" y="190" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="bold">b</text>

  <!-- Punnett Square Grid -->
  <rect x="80" y="60" width="240" height="160" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="2" />
  <line x1="200" y1="60" x2="200" y2="220" stroke="rgba(255,255,255,0.30)" stroke-width="2" />
  <line x1="80" y1="140" x2="320" y2="140" stroke="rgba(255,255,255,0.30)" stroke-width="2" />

  <!-- Offspring Genotypes -->
  <text x="140" y="110" font-size="14" fill="rgba(255,255,255,0.90)" text-anchor="middle" font-weight="bold">BB</text>
  <text x="260" y="110" font-size="14" fill="rgba(255,255,255,0.90)" text-anchor="middle" font-weight="bold">Bb</text>
  <text x="140" y="190" font-size="14" fill="rgba(255,255,255,0.90)" text-anchor="middle" font-weight="bold">Bb</text>
  <text x="260" y="190" font-size="14" fill="rgba(255,255,255,0.90)" text-anchor="middle" font-weight="bold">bb</text>

  <!-- Legend -->
  <text x="80" y="245" font-size="8" fill="rgba(255,255,255,0.30)">Ratio: 1:2:1 (Genotype) | 3:1 (Phenotype)</text>

  <!-- Title -->
  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Punnett Square — Mendelian Inheritance</text>
</svg>
