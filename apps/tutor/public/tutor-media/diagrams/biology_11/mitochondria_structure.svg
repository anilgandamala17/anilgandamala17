<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="mito-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Mitochondria: Powerhouse of the Cell</text>
  <path d="M 230,60 L 570,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.3" />

  <g transform="translate(400, 230)">
    <!-- Full organelle — used for overview / default -->
    <g id="mito-part-overview" data-mito-part="overview" class="mito-layer">
      <ellipse cx="0" cy="0" rx="220" ry="120" fill="none" stroke="#fcd34d" stroke-width="3" opacity="0.35" />
    </g>

    <!-- Outer membrane -->
    <g id="mito-part-outer" data-mito-part="outer" class="mito-layer">
      <ellipse cx="0" cy="0" rx="220" ry="120" fill="none" stroke="#fcd34d" stroke-width="3" opacity="0.95" />
      <text x="180" y="-130" font-family="Georgia, serif" font-size="16" fill="#fcd34d" font-weight="bold" text-anchor="start">Outer Membrane</text>
    </g>

    <!-- Inner membrane + cristae (folds) -->
    <g id="mito-part-inner" data-mito-part="inner" class="mito-layer">
      <path d="M -180,0 
               Q -150,80 -120,0
               Q -90,-80 -60,0
               Q -30,80 0,0
               Q 30,-80 60,0
               Q 90,80 120,0
               Q 150,-80 180,0
               Q 150,110 0,110
               Q -150,110 -180,0 Z" 
            fill="none" stroke="#fca5a5" stroke-width="2.5" />
      <text x="-210" y="110" font-family="Georgia, serif" font-size="16" fill="#fca5a5" font-weight="bold" text-anchor="end">Inner Membrane</text>
    </g>

    <g id="mito-part-cristae" data-mito-part="cristae" class="mito-layer">
      <path d="M -150,40 Q -90,-40 -30,40 Q 30,-40 90,40 Q 120,20 150,0" fill="none" stroke="#fb7185" stroke-width="2" opacity="0.95" />
      <text x="120" y="-95" font-family="Georgia, serif" font-size="15" fill="#fb7185" font-weight="bold" text-anchor="start">Cristae</text>
    </g>

    <!-- Matrix -->
    <g id="mito-part-matrix" data-mito-part="matrix" class="mito-layer">
      <circle cx="30" cy="40" r="5" fill="#fef08a" opacity="0.55" />
      <circle cx="-50" cy="-20" r="5" fill="#fef08a" opacity="0.55" />
      <text x="0" y="20" font-family="Georgia, serif" font-size="20" fill="#f8fafc" text-anchor="middle" font-weight="bold" opacity="0.55">MATRIX</text>
    </g>

    <!-- DNA & ribosomes — Krebs / mtDNA context -->
    <g id="mito-part-mtdna" data-mito-part="mtdna" class="mito-layer">
      <path d="M -80,50 Q -60,30 -40,50" stroke="#fef08a" stroke-width="1.5" opacity="0.85" />
      <text x="-100" y="70" font-family="Arial" font-size="12" fill="#fef08a" font-weight="bold">Circular DNA</text>
      <circle cx="80" cy="50" r="2" fill="#f8fafc" />
      <circle cx="85" cy="55" r="2" fill="#f8fafc" />
      <text x="100" y="70" font-family="Arial" font-size="12" fill="#f8fafc">70S Ribosomes</text>
    </g>
  </g>

  <text x="400" y="125" font-family="Arial" font-size="11" fill="#fca5a5" text-anchor="middle" opacity="0.75">Inner folds = cristae — increase surface area for ATP synthase</text>
  <text x="400" y="410" font-family="Arial" font-size="16" fill="#fef08a" text-anchor="middle" font-weight="bold">Site of Aerobic Respiration (ATP Production)</text>
</svg>
