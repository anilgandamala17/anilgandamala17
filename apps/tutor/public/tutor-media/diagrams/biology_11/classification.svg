<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

  

  <!-- NO BACKGROUND RECT -->

  <!-- Title -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Binomial Nomenclature Rules</text>
  <path d="M 230,60 L 570,60" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,2" opacity="0.4" />

  <!-- Main Example Box -->
  <rect x="50" y="90" width="700" height="320" rx="12" fill="none" stroke="#f8fafc" stroke-width="1" stroke-dasharray="8,4" opacity="0.2" />

  <!-- Example: Mangifera indica -->
  <g transform="translate(400, 170)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="44" fill="#fef08a" text-anchor="middle" font-style="italic">Mangifera indica</text>
    <!-- Individual underlines (chalk strokes) -->
    <path d="M -160,15 L -20,15" stroke="#f8fafc" stroke-width="2" opacity="0.8" />
    <path d="M 10,15 L 120,15" stroke="#f8fafc" stroke-width="2" opacity="0.8" />
    
    <text x="-90" y="50" font-family="Arial" font-size="16" fill="#fef08a" text-anchor="middle">Generic Name</text>
    <text x="65" y="50" font-family="Arial" font-size="16" fill="#f8fafc" text-anchor="middle">Specific Epithet</text>
    
    <text x="-90" y="70" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">(Capital letter)</text>
    <text x="65" y="70" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">(Small letter)</text>
  </g>

  <!-- Key Rules (Bullet Points) -->
  <g transform="translate(100, 280)">
    <circle cx="10" cy="18" r="4" fill="#fef08a" opacity="0.6" />
    <text x="30" y="24" font-family="Georgia, serif" font-size="16" fill="#f8fafc">Biological names are generally in <tspan fill="#fef08a" font-weight="bold">Latin</tspan> and written in <tspan font-style="italic">italics</tspan>.</text>
    
    <circle cx="10" cy="48" r="4" fill="#fef08a" opacity="0.6" />
    <text x="30" y="54" font-family="Georgia, serif" font-size="16" fill="#f8fafc">The first word represents <tspan fill="#fef08a" font-weight="bold">Genus</tspan>, second is <tspan fill="#fef08a" font-weight="bold">Species</tspan>.</text>
    
    <circle cx="10" cy="78" r="4" fill="#fef08a" opacity="0.6" />
    <text x="30" y="84" font-family="Georgia, serif" font-size="16" fill="#f8fafc">When handwritten, names are <tspan font-weight="bold" text-decoration="underline">underlined separately</tspan>.</text>

    <circle cx="10" cy="108" r="4" fill="#fef08a" opacity="0.6" />
    <text x="30" y="114" font-family="Georgia, serif" font-size="16" fill="#f8fafc">Author's name appears after species e.g., <tspan font-style="italic">Mangifera indica</tspan> <tspan font-weight="bold" fill="#fef08a">Linn.</tspan></text>
  </g>
</svg>