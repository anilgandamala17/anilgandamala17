<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Plant Tissues: Classification</text>
  <path d="M 300,60 L 500,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3" />

  <!-- Meristematic vs Permanent -->
  <g transform="translate(400, 100)">
    <rect x="-150" y="-30" width="300" height="60" rx="15" fill="none" stroke="#fef08a" stroke-width="2.5" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="20" fill="#fef08a" text-anchor="middle" font-weight="bold">PLANT TISSUE</text>
  </g>

  <!-- Split -->
  <path d="M 400,130 L 400,160 L 150,160 L 150,190" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.5" />
  <path d="M 400,160 L 650,160 L 650,190" stroke="#f8fafc" stroke-width="2" fill="none" opacity="0.5" />

  <!-- Meristematic -->
  <g transform="translate(150, 220)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="none" stroke="#86efac" stroke-width="2" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#86efac" text-anchor="middle" font-weight="bold">Meristematic</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Actively dividing cells</text>
    <text x="0" y="70" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.6">(Apical, Intercalary, Lateral)</text>
  </g>

  <!-- Permanent -->
  <g transform="translate(650, 220)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="none" stroke="#93c5fd" stroke-width="2" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#93c5fd" text-anchor="middle" font-weight="bold">Permanent</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Non-dividing, Specialized</text>
    
    <!-- Sub-split -->
    <path d="M 0,80 L 0,110 L -60,110 L -60,130" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" />
    <path d="M 0,110 L 60,110 L 60,130" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" />
    
    <text x="-60" y="150" font-family="Georgia, serif" font-size="14" fill="#f8fafc" text-anchor="middle">Simple</text>
    <text x="-60" y="165" font-family="Arial" font-size="10" fill="#f8fafc" text-anchor="middle" opacity="0.5">(Parenchyma, Collenchyma, Sclerenchyma)</text>
    
    <text x="60" y="150" font-family="Georgia, serif" font-size="14" fill="#f8fafc" text-anchor="middle">Complex</text>
    <text x="60" y="165" font-family="Arial" font-size="10" fill="#f8fafc" text-anchor="middle" opacity="0.5">(Xylem, Phloem)</text>
  </g>
</svg>