<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Bryophytes: Amphibians of Plant Kingdom</text>
  <path d="M 230,60 L 570,60" stroke="#fef08a" stroke-width="1" stroke-dasharray="2,2" opacity="0.3" />

  <!-- Diagram: Moss lifecycle/structure -->
  <g transform="translate(400, 240)">
    <!-- Gametophyte (Leafy) -->
    <path d="M -40,100 L 0,-20 L 40,100 Z" fill="none" stroke="#86efac" stroke-width="2" />
    <path d="M -20,80 L 0,60 L 20,80 M -30,60 L 0,40 L 30,60" stroke="#86efac" stroke-width="1.5" opacity="0.6" />
    <text x="-60" y="100" font-family="Georgia, serif" font-size="16" fill="#86efac" text-anchor="end" font-weight="bold">Gametophyte (n)</text>
    <text x="-60" y="120" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="end" opacity="0.7">Dominant, Photosynthetic</text>

    <!-- Sporophyte -->
    <line x1="0" y1="-20" x2="0" y2="-120" stroke="#fef08a" stroke-width="2" /> <!-- Seta -->
    <ellipse cx="0" cy="-130" rx="15" ry="20" fill="none" stroke="#fef08a" stroke-width="2" /> <!-- Capsule -->
    <text x="60" y="-120" font-family="Georgia, serif" font-size="16" fill="#fef08a" text-anchor="start" font-weight="bold">Sporophyte (2n)</text>
    <text x="60" y="-100" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="start" opacity="0.7">Dependent on Gametophyte</text>
    <text x="20" y="-130" font-family="Arial" font-size="10" fill="#f8fafc" opacity="0.8">Capsule (Spore formation)</text>
    <text x="10" y="-70" font-family="Arial" font-size="10" fill="#f8fafc" opacity="0.8">Seta</text>
    <text x="10" y="-20" font-family="Arial" font-size="10" fill="#f8fafc" opacity="0.8">Foot</text>

    <!-- Rhizoids -->
    <path d="M -20,100 Q -10,120 0,105 Q 10,125 20,105" stroke="#f8fafc" stroke-width="1" opacity="0.5" />
    <text x="0" y="135" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle">Rhizoids (Root-like)</text>
  </g>

  <!-- Key Groups -->
  <g transform="translate(100, 350)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" fill="#fef08a" font-weight="bold">Major Groups:</text>
    <text x="0" y="25" font-family="Arial" font-size="14" fill="#f8fafc">• Liverworts (Marchantia)</text>
    <text x="0" y="50" font-family="Arial" font-size="14" fill="#f8fafc">• Mosses (Funaria)</text>
  </g>
</svg>