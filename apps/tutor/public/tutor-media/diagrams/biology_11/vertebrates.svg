<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Animal Kingdom: Vertebrates (Chordata)</text>
  <path d="M 230,60 L 570,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="5,2" opacity="0.3" />

  <!-- The Chordate Body Plan -->
  <g transform="translate(400, 200)">
    <!-- Main Body Shape -->
    <path d="M -250,0 Q -100,-80 150,-20 L 250,50 L 150,120 Q -100,80 -250,0 Z" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.4" />
    
    <!-- NOTOCHORD -->
    <path d="M -200,10 Q 0,10 180,50" stroke="#fef08a" stroke-width="5" stroke-linecap="round" filter="url(#chordGlow)" />
    <text x="0" y="-10" font-family="Georgia, serif" font-size="18" fill="#fef08a" font-weight="bold">NOTOCHORD</text>

    <!-- Nerve Cord -->
    <path d="M -210,-10 Q 0,-15 170,30" stroke="#fca5a5" stroke-width="3" stroke-dasharray="4,2" />
    <text x="0" y="-35" font-family="Georgia, serif" font-size="14" fill="#fca5a5">Dorsal Hollow Nerve Cord</text>

    <!-- Pharyngeal Slits -->
    <path d="M -150,40 L -140,70 M -130,45 L -120,75 M -110,50 L -100,80" stroke="#93c5fd" stroke-width="4" opacity="0.8" />
    <text x="-130" y="100" font-family="Georgia, serif" font-size="14" fill="#93c5fd">Pharyngeal Gill Slits</text>

    <!-- Post-anal tail -->
    <text x="210" y="80" font-family="Georgia, serif" font-size="14" fill="#f8fafc" opacity="0.7">Post-anal Tail</text>
  </g>

  <!-- Vertebrate Classes -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="700" height="100" rx="12" fill="none" stroke="#f8fafc" stroke-width="1" stroke-dasharray="8,4" opacity="0.2" />
    <text x="70" y="40" font-family="Georgia, serif" font-size="16" fill="#fef08a" font-weight="bold">Classes:</text>
    
    <text x="70" y="70" font-family="Arial" font-size="14" fill="#f8fafc">Cyclostomata • <tspan fill="#86efac">Chondrichthyes</tspan> • <tspan fill="#86efac">Osteichthyes</tspan> • <tspan fill="#fca5a5">Amphibia</tspan> • <tspan fill="#fcd34d">Reptilia</tspan> • <tspan fill="#f8fafc">Aves</tspan> • <tspan fill="#93c5fd">Mammalia</tspan></text>
  </g>

  <defs>
    <filter id="chordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>