<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Animal Kingdom: Invertebrates</text>
  <path d="M 230,60 L 570,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="5,2" opacity="0.3" />

  <!-- Phyla Overview -->
  <g transform="translate(100, 110)">
    <!-- Porifera -->
    <g transform="translate(0, 0)">
      <path d="M 0,0 L 20,-40 L 40,0 Z" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.5" />
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" fill="#f8fafc" text-anchor="middle" font-weight="bold">Porifera</text>
      <text x="20" y="45" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Sponges, canal system</text>
    </g>

    <!-- Coelenterata -->
    <g transform="translate(150, 0)">
      <path d="M 0,-40 Q 20,-60 40,-40 L 40,0 L 0,0 Z" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" fill="#fca5a5" text-anchor="middle" font-weight="bold">Coelenterata</text>
      <text x="20" y="45" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Cnidarians, stinger cells</text>
    </g>

    <!-- Platyhelminthes -->
    <g transform="translate(300, 0)">
      <path d="M 0,-20 Q 20,-30 40,-20 L 40,0 L 0,0 Z" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.6" />
      <text x="20" y="25" font-family="Georgia, serif" font-size="16" fill="#fcd34d" text-anchor="middle" font-weight="bold">Platyhelminthes</text>
      <text x="20" y="45" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Flatworms, acoelomate</text>
    </g>

    <!-- Annelida -->
    <g transform="translate(450, 0)">
      <rect x="0" y="-30" width="40" height="30" rx="5" fill="none" stroke="#86efac" stroke-width="1.5" />
      <rect x="0" y="-10" width="40" height="30" rx="5" fill="none" stroke="#86efac" stroke-width="1.5" />
      <text x="20" y="35" font-family="Georgia, serif" font-size="16" fill="#86efac" text-anchor="middle" font-weight="bold">Annelida</text>
      <text x="20" y="55" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Segmented worms</text>
    </g>

    <!-- Arthropoda -->
    <g transform="translate(75, 140)">
      <rect x="0" y="0" width="100" height="80" rx="10" fill="none" stroke="#fef08a" stroke-width="2" />
      <path d="M 0,20 L -20,10 M 0,50 L -20,40" stroke="#fef08a" stroke-width="2" /> <!-- Legs -->
      <path d="M 100,20 L 120,10 M 100,50 L 120,40" stroke="#fef08a" stroke-width="2" />
      <text x="50" y="45" font-family="Georgia, serif" font-size="18" fill="#fef08a" text-anchor="middle" font-weight="bold">Arthropoda</text>
      <text x="50" y="105" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Largest Phylum • Jointed appendages</text>
    </g>

    <!-- Mollusca -->
    <g transform="translate(275, 140)">
      <path d="M 0,80 Q 50,0 100,80 Z" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.6" />
      <text x="50" y="45" font-family="Georgia, serif" font-size="18" fill="#93c5fd" text-anchor="middle" font-weight="bold">Mollusca</text>
      <text x="50" y="105" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Soft bodied • Calcareous shell</text>
    </g>

    <!-- Echinodermata -->
    <g transform="translate(475, 140)">
      <path d="M 50,0 L 60,30 L 90,30 L 65,50 L 75,80 L 50,60 L 25,80 L 35,50 L 10,30 L 40,30 Z" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
      <text x="50" y="45" font-family="Georgia, serif" font-size="18" fill="#fca5a5" text-anchor="middle" font-weight="bold">Echinodermata</text>
      <text x="50" y="105" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Spiny skinned • Water vascular system</text>
    </g>
  </g>

  <text x="400" y="410" font-family="Arial" font-size="14" fill="#fef08a" text-anchor="middle" font-style="italic">Organisms lacking a vertebral column</text>
</svg>