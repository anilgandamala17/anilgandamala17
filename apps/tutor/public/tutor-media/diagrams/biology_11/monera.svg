<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Kingdom Monera: Bacterial Shapes</text>
  <path d="M 240,60 L 560,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3" />

  <!-- Cocci (Spherical) -->
  <g transform="translate(150, 160)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#fef08a" stroke-width="2" />
    <circle cx="25" cy="5" r="15" fill="none" stroke="#fef08a" stroke-width="2" />
    <circle cx="10" cy="25" r="15" fill="none" stroke="#fef08a" stroke-width="2" />
    <text x="12" y="70" font-family="Georgia, serif" font-size="18" fill="#fef08a" text-anchor="middle" font-weight="bold">Cocci</text>
    <text x="12" y="90" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.7">(Spherical)</text>
  </g>

  <!-- Bacilli (Rod-shaped) -->
  <g transform="translate(400, 160)">
    <rect x="-40" y="-10" width="80" height="20" rx="10" fill="none" stroke="#86efac" stroke-width="2" />
    <rect x="-30" y="20" width="80" height="20" rx="10" fill="none" stroke="#86efac" stroke-width="2" />
    <text x="10" y="70" font-family="Georgia, serif" font-size="18" fill="#86efac" text-anchor="middle" font-weight="bold">Bacilli</text>
    <text x="10" y="90" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.7">(Rod-shaped)</text>
  </g>

  <!-- Spirilla (Spiral) -->
  <g transform="translate(650, 160)">
    <path d="M -30,0 Q -15,-30 0,0 T 30,0" stroke="#93c5fd" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 30,0 Q 45,20 60,0" stroke="#93c5fd" stroke-width="2" fill="none" opacity="0.6" />
    <text x="15" y="70" font-family="Georgia, serif" font-size="18" fill="#93c5fd" text-anchor="middle" font-weight="bold">Spirilla</text>
    <text x="15" y="90" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.7">(Spiral-shaped)</text>
  </g>

  <!-- Vibrio (Comma-shaped) -->
  <g transform="translate(400, 320)">
    <path d="M -20,-15 Q 10,-15 15,15" stroke="#fca5a5" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle cx="-20" cy="-15" r="5" fill="#fca5a5" />
    <text x="0" y="55" font-family="Georgia, serif" font-size="18" fill="#fca5a5" text-anchor="middle" font-weight="bold">Vibrio</text>
    <text x="0" y="75" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.7">(Comma-shaped)</text>
  </g>

  <!-- Key Info -->
  <rect x="580" y="280" width="180" height="130" rx="10" fill="none" stroke="#f8fafc" stroke-width="1" stroke-dasharray="5,2" opacity="0.3" />
  <text x="670" y="310" font-family="Georgia, serif" font-size="16" fill="#fef08a" text-anchor="middle" font-weight="bold">Bacterial Cell</text>
  <text x="600" y="340" font-family="Arial" font-size="12" fill="#f8fafc" opacity="0.9">• Prokaryotic</text>
  <text x="600" y="365" font-family="Arial" font-size="12" fill="#f8fafc" opacity="0.9">• Circular DNA (Plasmid)</text>
  <text x="600" y="390" font-family="Arial" font-size="12" fill="#f8fafc" opacity="0.9">• Peptidoglycan wall</text>
</svg>