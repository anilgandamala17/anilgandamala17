<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">Kingdom Protista: Diversity</text>
  <path d="M 280,60 L 520,60" stroke="#fef08a" stroke-width="1" stroke-dasharray="5,2" opacity="0.4" />

  <!-- Chrysophytes -->
  <g transform="translate(180, 150)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.3" />
    <path d="M -15,-5 L 15,-5 L 10,10 L -10,10 Z" fill="#fef08a" opacity="0.6" /> <!-- Diatom like -->
    <text x="0" y="60" font-family="Georgia, serif" font-size="16" fill="#fef08a" text-anchor="middle" font-weight="bold">Chrysophytes</text>
    <text x="0" y="80" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Diatoms, Golden Algae</text>
  </g>

  <!-- Dinoflagellates -->
  <g transform="translate(400, 150)">
    <rect x="-35" y="-30" width="70" height="60" rx="15" fill="none" stroke="#fca5a5" stroke-width="2" />
    <path d="M 0,-30 L 0,30 M -35,0 L 35,0" stroke="#fca5a5" stroke-width="1" opacity="0.5" />
    <text x="0" y="60" font-family="Georgia, serif" font-size="16" fill="#fca5a5" text-anchor="middle" font-weight="bold">Dinoflagellates</text>
    <text x="0" y="80" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Red Tides, 2 Flagella</text>
  </g>

  <!-- Euglenoids -->
  <g transform="translate(620, 150)">
    <ellipse cx="0" cy="0" rx="25" ry="40" fill="none" stroke="#86efac" stroke-width="2" />
    <path d="M 0,-35 Q 20,-50 30,-20" stroke="#86efac" stroke-width="1.5" fill="none" /> <!-- Flagellum -->
    <text x="0" y="60" font-family="Georgia, serif" font-size="16" fill="#86efac" text-anchor="middle" font-weight="bold">Euglenoids</text>
    <text x="0" y="80" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Pellicle, Protein rich</text>
  </g>

  <!-- Slime Moulds -->
  <g transform="translate(290, 320)">
    <path d="M -40,0 Q -20,-30 0,-10 T 40,-20" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" opacity="0.4" />
    <text x="0" y="45" font-family="Georgia, serif" font-size="16" fill="#fcd34d" text-anchor="middle" font-weight="bold">Slime Moulds</text>
    <text x="0" y="65" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Saprophytic, Plasmodium</text>
  </g>

  <!-- Protozoans -->
  <g transform="translate(510, 320)">
    <path d="M -30,-20 Q 0,-40 30,-20 Q 40,0 30,20 Q 0,40 -30,20 Q -40,0 -30,-20" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,2" /> <!-- Amoeba shape -->
    <text x="0" y="45" font-family="Georgia, serif" font-size="16" fill="#93c5fd" text-anchor="middle" font-weight="bold">Protozoans</text>
    <text x="0" y="65" font-family="Arial" font-size="11" fill="#f8fafc" text-anchor="middle" opacity="0.7">Amoeboid, Flagellated, Ciliated</text>
  </g>
</svg>