<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <g id="pro-part-overview" data-mito-part="overview" class="mito-layer">
    <text x="400" y="40" font-family="Georgia, serif" font-size="26" fill="#fef08a" text-anchor="middle" font-weight="bold">Prokaryotic Cell Structure</text>
    <path d="M 300,50 L 500,50" stroke="#fef08a" stroke-width="1" opacity="0.3" />
  </g>

  <g transform="translate(350, 240)">
    <g id="pro-part-capsule" data-mito-part="capsule" class="mito-layer">
      <rect x="-180" y="-100" width="360" height="200" rx="80" fill="none" stroke="#fca5a5" stroke-width="3" opacity="0.4" />
      <text x="-160" y="-110" font-family="Georgia, serif" font-size="14" fill="#fca5a5" font-weight="bold">Capsule</text>
    </g>

    <g id="pro-part-wall" data-mito-part="wall" class="mito-layer">
      <rect x="-170" y="-90" width="340" height="180" rx="70" fill="none" stroke="#fcd34d" stroke-width="2" />
      <text x="-150" y="-75" font-family="Georgia, serif" font-size="14" fill="#fcd34d" font-weight="bold">Cell Wall</text>
    </g>

    <g id="pro-part-membrane" data-mito-part="membrane" class="mito-layer">
      <rect x="-160" y="-80" width="320" height="160" rx="60" fill="none" stroke="#86efac" stroke-width="1.5" />
      <text x="-140" y="-45" font-family="Georgia, serif" font-size="14" fill="#86efac" font-weight="bold">Cell Membrane</text>
    </g>

    <g id="pro-part-nucleoid" data-mito-part="nucleoid" class="mito-layer">
      <path d="M -100,0 Q -50,-50 0,0 T 100,0" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="5,2" />
      <text x="0" y="40" font-family="Georgia, serif" font-size="18" fill="#fef08a" text-anchor="middle" font-weight="bold">NUCLEOID (DNA)</text>
      <text x="0" y="60" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">(No nuclear membrane)</text>
    </g>

    <g id="pro-part-ribosomes" data-mito-part="ribosomes" class="mito-layer">
      <circle cx="-120" cy="20" r="3" fill="#f8fafc" />
      <circle cx="110" cy="-30" r="3" fill="#f8fafc" />
      <circle cx="50" cy="80" r="3" fill="#f8fafc" />
      <text x="130" y="90" font-family="Georgia, serif" font-size="14" fill="#f8fafc" font-weight="bold">70S Ribosomes</text>
    </g>

    <g id="pro-part-flagellum" data-mito-part="flagellum" class="mito-layer">
      <path d="M 180,0 Q 250,-50 320,0" stroke="#f8fafc" stroke-width="2.5" fill="none" opacity="0.5" />
      <text x="250" y="-50" font-family="Georgia, serif" font-size="14" fill="#f8fafc" font-weight="bold">Flagellum</text>
    </g>

    <g id="pro-part-pili" data-mito-part="pili" class="mito-layer">
      <line x1="-180" y1="-50" x2="-210" y2="-60" stroke="#f8fafc" stroke-width="1" />
      <line x1="-150" y1="-100" x2="-160" y2="-130" stroke="#f8fafc" stroke-width="1" />
      <text x="-210" y="-130" font-family="Georgia, serif" font-size="14" fill="#f8fafc" opacity="0.7">Pili / Fimbriae</text>
    </g>
  </g>
</svg>
