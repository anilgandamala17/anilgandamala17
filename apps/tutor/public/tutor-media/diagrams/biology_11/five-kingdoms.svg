<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <!-- NO BACKGROUND RECT -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" fill="#fef08a" text-anchor="middle" font-weight="bold">R.H. Whittaker's Five Kingdoms</text>
  <path d="M 280,60 L 520,60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />

  <defs>
    <filter id="chalkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Evolutionary Flow Labels -->
  <text x="50" y="240" font-family="Georgia, serif" font-size="14" fill="#f8fafc" transform="rotate(-90, 50, 240)" opacity="0.6">COMPLEXITY INCREASE</text>

  <!-- Kingdom Nodes -->
  <!-- Monera -->
  <g transform="translate(400, 360)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="none" stroke="#fef08a" stroke-width="2" filter="url(#chalkGlow)" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#fef08a" text-anchor="middle" font-weight="bold">MONERA</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Prokaryotic • Unicellular</text>
  </g>

  <!-- Transition Up -->
  <path d="M 400,330 L 400,280" stroke="#f8fafc" stroke-width="2" marker-end="url(#chalkArrow)" opacity="0.5" />

  <!-- Protista -->
  <g transform="translate(400, 240)">
    <rect x="-80" y="-30" width="160" height="60" rx="10" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="6,2" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#f8fafc" text-anchor="middle" font-weight="bold">PROTISTA</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.8">Eukaryotic • Unicellular</text>
  </g>

  <!-- Three-way divergence -->
  <path d="M 400,210 L 400,160" stroke="#f8fafc" stroke-width="1.5" opacity="0.4" />
  <path d="M 400,180 L 150,180 L 150,150" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 400,180 L 650,180 L 650,150" stroke="#f8fafc" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Plantae -->
  <g transform="translate(150, 110)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#86efac" stroke-width="2" opacity="0.7" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#86efac" text-anchor="middle" font-weight="bold">PLANTAE</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">Autotrophic</text>
  </g>

  <!-- Fungi -->
  <g transform="translate(400, 110)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.7" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#fca5a5" text-anchor="middle" font-weight="bold">FUNGI</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">Heterotrophic (Saprophyte)</text>
  </g>

  <!-- Animalia -->
  <g transform="translate(650, 110)">
    <rect x="-70" y="-30" width="140" height="60" rx="10" fill="none" stroke="#93c5fd" stroke-width="2" opacity="0.7" />
    <text x="0" y="5" font-family="Georgia, serif" font-size="18" fill="#93c5fd" text-anchor="middle" font-weight="bold">ANIMALIA</text>
    <text x="0" y="55" font-family="Arial" font-size="12" fill="#f8fafc" text-anchor="middle" opacity="0.6">Heterotrophic (Ingestive)</text>
  </g>

  <defs>
    <marker id="chalkArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#f8fafc" />
    </marker>
  </defs>
</svg>