<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">

  

  
  
  
  <!-- Header -->
  <rect x="150" y="20" width="500" height="50" rx="10" fill="#44403c" />
  <text x="400" y="55" font-family="Georgia, serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Basis of Animal Classification</text>

  <!-- Level of Organization -->
  <g transform="translate(100, 150)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Level of Org.</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="12" fill="#78716c" text-anchor="middle">Cellular, Tissue, Organ</text>
  </g>

  <!-- Symmetry -->
  <g transform="translate(300, 150)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Symmetry</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="12" fill="#78716c" text-anchor="middle">Radial, Bilateral</text>
  </g>

  <!-- Coelom -->
  <g transform="translate(500, 150)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Coelom</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="12" fill="#78716c" text-anchor="middle">Acoelo, Pseudo, Coelo</text>
  </g>

  <!-- Germ Layers -->
  <g transform="translate(700, 150)">
    <rect x="-80" y="-40" width="160" height="80" rx="10" fill="white" stroke="#78716c" stroke-width="2"/>
    <text x="0" y="5" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Germ Layers</text>
    <text x="0" y="25" font-family="Georgia, serif" font-size="12" fill="#78716c" text-anchor="middle">Diplo/Triploblastic</text>
  </g>

  <!-- Flowchart summary -->
  <rect x="50" y="240" width="700" height="180" rx="15" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" />
  <text x="400" y="275" font-family="Georgia, serif" font-size="20" fill="#44403c" text-anchor="middle" font-weight="bold">Animal Kingdom (Metazoa)</text>
  
  <line x1="400" y1="285" x2="200" y2="330" stroke="#a8a29e" stroke-width="2"/>
  <line x1="400" y1="285" x2="600" y2="330" stroke="#a8a29e" stroke-width="2"/>

  <g transform="translate(200, 350)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Parazoa</text>
    <text x="0" y="20" font-family="Georgia, serif" font-size="14" fill="#78716c" text-anchor="middle">Porifera</text>
  </g>

  <g transform="translate(600, 350)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="16" fill="#44403c" text-anchor="middle" font-weight="bold">Eumetazoa</text>
    <text x="0" y="20" font-family="Georgia, serif" font-size="14" fill="#78716c" text-anchor="middle">All other phyla</text>
  </g>
</svg>