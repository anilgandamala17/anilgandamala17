<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>

<rect x="0" y="0" width="800" height="58" fill="#0d2418" opacity="0.9"/>
<text x="400" y="39" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Number Line: Whole Numbers</text>
<rect x="20" y="65" width="760" height="80" fill="#0d2418" rx="6" opacity="1"/>
<text x="400" y="88" font-family="'Segoe UI',sans-serif" font-size="15" fill="#81c784" text-anchor="middle" font-weight="normal">A Number Line shows numbers in order, equally spaced</text>
<text x="400" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="normal">← Numbers decrease going left | Numbers increase going right →</text>
<text x="400" y="140" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">0 is the smallest Whole Number — there is no negative whole number</text>
<rect x="30" y="178" width="740" height="3" fill="#81c784" rx="2" opacity="1"/>
<line x1="55" y1="168" x2="55" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="55" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">0</text>
<line x1="124" y1="168" x2="124" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="124" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">1</text>
<line x1="193" y1="168" x2="193" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="193" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">2</text>
<line x1="262" y1="168" x2="262" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="262" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">3</text>
<line x1="331" y1="168" x2="331" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="331" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">4</text>
<line x1="400" y1="168" x2="400" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="400" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">5</text>
<line x1="469" y1="168" x2="469" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="469" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">6</text>
<line x1="538" y1="168" x2="538" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="538" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">7</text>
<line x1="607" y1="168" x2="607" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="607" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">8</text>
<line x1="676" y1="168" x2="676" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="676" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">9</text>
<line x1="745" y1="168" x2="745" y2="190" stroke="#81c784" stroke-width="2.5"/>
<text x="745" y="210" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">10</text>
<text x="25" y="182" font-family="'Segoe UI',sans-serif" font-size="22" fill="#81c784" text-anchor="middle" font-weight="normal">←</text>
<text x="775" y="182" font-family="'Segoe UI',sans-serif" font-size="22" fill="#81c784" text-anchor="middle" font-weight="normal">→</text>
<rect x="20" y="225" width="240" height="140" fill="#1e4a30" rx="8"/>
<text x="140" y="249" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">Whole Numbers</text>
<text x="140" y="269" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">0, 1, 2, 3, 4, 5, ...</text>
<text x="140" y="287" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Start from 0</text>
<text x="140" y="305" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Go on forever</text>
<rect x="280" y="225" width="240" height="140" fill="#1e4a30" rx="8"/>
<text x="400" y="249" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">On Number Line</text>
<text x="400" y="269" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Add → move right</text>
<text x="400" y="287" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Subtract → move left</text>
<text x="400" y="305" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Compare size by position</text>
<rect x="540" y="225" width="240" height="140" fill="#1e4a30" rx="8"/>
<text x="660" y="249" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">Natural Numbers</text>
<text x="660" y="269" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">1, 2, 3, 4, 5, ...</text>
<text x="660" y="287" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">No zero</text>
<text x="660" y="305" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Whole Nos. = Nat. Nos. + 0</text>
<rect x="20" y="373" width="760" height="50" fill="#0d2418" rx="6" opacity="1"/>
<text x="400" y="393" font-family="'Segoe UI',sans-serif" font-size="13" fill="#81c784" text-anchor="middle" font-weight="normal">Predecessor = number to the left  |  Successor = number to the right</text>
<text x="400" y="415" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="normal">Predecessor of 5 → 4  |  Successor of 5 → 6</text>
<rect x="20" y="430" width="760" height="55" fill="#1e4a30" rx="6" opacity="1"/>
<text x="400" y="452" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Operations on Number Line</text>
<text x="400" y="476" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">3 + 4 = Start at 3, move 4 steps RIGHT = 7</text>
<text x="400" y="498" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">9 − 4 = Start at 9, move 4 steps LEFT = 5</text>

</svg>