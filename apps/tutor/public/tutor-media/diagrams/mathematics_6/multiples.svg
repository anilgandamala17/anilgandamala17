<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Multiples and LCM</text>

<rect x="50" y="80" width="700" height="55" fill="#1e4a30" rx="8" opacity="0.9"/>
<text x="400" y="110" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">Multiples of a number = Table of that number</text>
<text x="400" y="147" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="normal">Multiples of 3: 3, 6, 9, 12, 15, 18, 21, ...</text>
<rect x="50" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Multiples of 4</text><text x="215" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">4, 8, 12, 16, 20, 24…</text><text x="215" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Every 4th number</text><text x="215" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">LCM(3,4) = 12</text><rect x="400" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Multiples of 6</text><text x="565" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">6, 12, 18, 24, 30…</text><text x="565" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Every 6th number</text><text x="565" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Common with 4: 12,24</text><rect x="50" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">LCM</text><text x="215" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Least Common Multiple</text><text x="215" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Smallest common multiple</text><text x="215" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">LCM(4,6) = 12</text><rect x="400" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">HCF</text><text x="565" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Highest Common Factor</text><text x="565" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Largest common factor</text><text x="565" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">HCF(12,18) = 6</text>

</svg>