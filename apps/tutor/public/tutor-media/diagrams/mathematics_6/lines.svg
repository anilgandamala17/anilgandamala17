<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Lines, Line Segments and Rays</text>

<rect x="50" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Line</text><text x="156.66666666666669" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Extends both sides infinitely</text><text x="156.66666666666669" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Has NO endpoints</text><text x="156.66666666666669" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Drawn as ←——————→</text><rect x="283.33333333333337" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Line Segment</text><text x="390.00000000000006" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Has TWO endpoints</text><text x="390.00000000000006" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Fixed length</text><text x="390.00000000000006" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Drawn as •——•</text><rect x="516.6666666666667" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Ray</text><text x="623.3333333333334" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">One endpoint</text><text x="623.3333333333334" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Extends infinitely one side</text><text x="623.3333333333334" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Drawn as •——————→</text><rect x="50" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Intersecting Lines</text><text x="156.66666666666669" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Meet at one point</text><text x="156.66666666666669" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Form angles at intersection</text><text x="156.66666666666669" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. crossroads</text><rect x="283.33333333333337" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Parallel Lines</text><text x="390.00000000000006" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Never meet</text><text x="390.00000000000006" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Same distance apart</text><text x="390.00000000000006" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Railway tracks</text><rect x="516.6666666666667" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Perpendicular Lines</text><text x="623.3333333333334" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Meet at 90°</text><text x="623.3333333333334" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Form right angle</text><text x="623.3333333333334" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. + symbol</text>

</svg>