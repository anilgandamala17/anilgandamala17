<rect x="50" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 2</text><text x="156.66666666666669" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Last digit even</text><text x="156.66666666666669" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">0,2,4,6,8</text><text x="156.66666666666669" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 348 ✓</text><rect x="283.33333333333337" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 3</text><text x="390.00000000000006" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum of digits ÷ 3</text><text x="390.00000000000006" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 123: 1+2+3=6</text><text x="390.00000000000006" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">6 ÷ 3 = 2 ✓</text><rect x="516.6666666666667" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 4</text><text x="623.3333333333334" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Last two digits ÷ 4</text><text x="623.3333333333334" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 316: 16÷4=4</text><text x="623.3333333333334" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">316 ÷ 4 ✓</text><rect x="50" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 5</text><text x="156.66666666666669" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Last digit 0 or 5</text><text x="156.66666666666669" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 125, 360</text><text x="156.66666666666669" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Quick & easy rule</text><rect x="283.33333333333337" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 9</text><text x="390.00000000000006" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum of digits ÷ 9</text><text x="390.00000000000006" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 108: 1+0+8=9</text><text x="390.00000000000006" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">108 ÷ 9 ✓</text><rect x="516.6666666666667" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">÷ 10</text><text x="623.3333333333334" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Last digit is 0</text><text x="623.3333333333334" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. 560, 1000</text><text x="623.3333333333334" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Always exact</text>

