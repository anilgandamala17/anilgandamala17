<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Basic Geometrical Ideas: Points</text>

<rect x="200" y="80" width="400" height="55" fill="#1e4a30" rx="8" opacity="0.9"/>
<text x="400" y="113" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">A Point has no length, breadth or thickness</text>
<circle cx="275" cy="220" r="5" fill="#ffd54f"/><text x="275" y="250" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="normal">P1</text><circle cx="400" cy="220" r="5" fill="#ffd54f"/><text x="400" y="250" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="normal">P2</text><circle cx="525" cy="220" r="5" fill="#ffd54f"/><text x="525" y="250" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="normal">P3</text><circle cx="650" cy="220" r="5" fill="#ffd54f"/><text x="650" y="250" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="normal">P4</text>
<text x="400" y="290" font-family="'Segoe UI',sans-serif" font-size="15" fill="#aaa" text-anchor="middle" font-weight="normal">Points are represented by dots and named with capital letters</text>
<rect x="50" y="80" width="330" height="404" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Collinear Points</text><text x="215" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Points on same line</text><text x="215" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. A, B, C on line l</text><text x="215" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Can draw one line through all</text><rect x="400" y="80" width="330" height="404" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Non-Collinear Points</text><text x="565" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Points NOT on same line</text><text x="565" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. vertices of triangle</text><text x="565" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Cannot all be on one line</text>

</svg>