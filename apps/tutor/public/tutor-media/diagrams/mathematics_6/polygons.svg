<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Polygons: Sides and Angles</text>

<rect x="50" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Triangle</text><text x="156.66666666666669" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">3 sides, 3 angles</text><text x="156.66666666666669" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum of angles = 180°</text><text x="156.66666666666669" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. Set-square</text><rect x="283.33333333333337" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Quadrilateral</text><text x="390.00000000000006" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">4 sides, 4 angles</text><text x="390.00000000000006" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum of angles = 360°</text><text x="390.00000000000006" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Square, Rectangle</text><rect x="516.6666666666667" y="80" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Pentagon</text><text x="623.3333333333334" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">5 sides, 5 angles</text><text x="623.3333333333334" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum = 540°</text><text x="623.3333333333334" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. Home plate</text><rect x="50" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="156.66666666666669" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Hexagon</text><text x="156.66666666666669" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">6 sides, 6 angles</text><text x="156.66666666666669" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sum = 720°</text><text x="156.66666666666669" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. Honeycomb</text><rect x="283.33333333333337" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="390.00000000000006" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Regular Polygon</text><text x="390.00000000000006" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">All sides equal</text><text x="390.00000000000006" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">All angles equal</text><text x="390.00000000000006" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. equilateral triangle</text><rect x="516.6666666666667" y="290" width="213.33333333333334" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="623.3333333333334" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Irregular Polygon</text><text x="623.3333333333334" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sides/angles unequal</text><text x="623.3333333333334" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">e.g. most land plots</text><text x="623.3333333333334" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Still a closed figure</text>

</svg>