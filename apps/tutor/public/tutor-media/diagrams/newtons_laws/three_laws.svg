<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <defs>
    <marker id="arrowW" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#ffffff"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#86efac"/></marker>
  </defs>
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Newton's Three Laws of Motion</text>
  <!-- Law 1: Inertia -->
  <rect x="15" y="35" width="110" height="90" rx="5" fill="rgba(147,197,253,0.08)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="70" y="52" font-size="10" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">1st Law</text>
  <text x="70" y="64" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">Inertia</text>
  <!-- Ball at rest -->
  <circle cx="45" cy="95" r="12" fill="rgba(147,197,253,0.3)" stroke="#93c5fd" stroke-width="2"/>
  <text x="45" y="118" font-size="8" fill="#93c5fd" text-anchor="middle" font-family="monospace">At rest</text>
  <!-- Ball in motion -->
  <circle cx="95" cy="95" r="12" fill="rgba(147,197,253,0.3)" stroke="#93c5fd" stroke-width="2"/>
  <line x1="107" y1="95" x2="118" y2="95" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="95" y="118" font-size="8" fill="#93c5fd" text-anchor="middle" font-family="monospace">Moving</text>
  <text x="70" y="135" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">No net force → no change</text>
  <!-- Law 2: F=ma -->
  <rect x="145" y="35" width="110" height="90" rx="5" fill="rgba(134,239,172,0.08)" stroke="#86efac" stroke-width="1.5"/>
  <text x="200" y="52" font-size="10" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">2nd Law</text>
  <text x="200" y="64" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">F = ma</text>
  <!-- Block with force arrow -->
  <rect x="175" y="78" width="50" height="30" rx="3" fill="rgba(134,239,172,0.2)" stroke="#86efac" stroke-width="1.5"/>
  <text x="200" y="98" font-size="10" fill="#86efac" text-anchor="middle" font-family="monospace">m</text>
  <line x1="225" y1="93" x2="248" y2="93" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="240" y="78" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">F</text>
  <line x1="200" y1="108" x2="200" y2="120" stroke="#86efac" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <text x="215" y="118" font-size="9" fill="#86efac" font-family="monospace">a</text>
  <text x="200" y="135" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">More force → more acceleration</text>
  <!-- Law 3: Action-Reaction -->
  <rect x="275" y="35" width="110" height="90" rx="5" fill="rgba(252,165,165,0.08)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="330" y="52" font-size="10" fill="#fca5a5" text-anchor="middle" font-family="monospace" font-weight="bold">3rd Law</text>
  <text x="330" y="64" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">Action-Reaction</text>
  <!-- Two blocks -->
  <rect x="285" y="78" width="35" height="28" rx="3" fill="rgba(147,197,253,0.2)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="302" y="97" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">A</text>
  <rect x="365" y="78" width="15" height="28" rx="3" fill="rgba(252,165,165,0.2)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="372" y="97" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">B</text>
  <!-- Action arrow -->
  <line x1="320" y1="88" x2="362" y2="88" stroke="#fca5a5" stroke-width="2"/>
  <polygon points="360,84 368,88 360,92" fill="#fca5a5"/>
  <text x="341" y="82" font-size="7" fill="#fca5a5" text-anchor="middle" font-family="monospace">Action</text>
  <!-- Reaction arrow -->
  <line x1="362" y1="98" x2="320" y2="98" stroke="#93c5fd" stroke-width="2"/>
  <polygon points="322,94 314,98 322,102" fill="#93c5fd"/>
  <text x="341" y="112" font-size="7" fill="#93c5fd" text-anchor="middle" font-family="monospace">Reaction</text>
  <text x="330" y="135" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Equal &amp; opposite</text>
  <!-- Free body diagram section -->
  <rect x="15" y="155" width="370" height="110" rx="5" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="172" font-size="10" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">Free Body Diagram — 2nd Law</text>
  <!-- Object -->
  <rect x="165" y="185" width="70" height="50" rx="4" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="2"/>
  <text x="200" y="215" font-size="11" fill="#86efac" text-anchor="middle" font-family="monospace">5 kg</text>
  <!-- Forces -->
  <line x1="235" y1="210" x2="270" y2="210" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <text x="285" y="205" font-size="9" fill="#fbbf24" font-family="monospace">F=20N</text>
  <line x1="165" y1="210" x2="130" y2="210" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="100" y="205" font-size="9" fill="#fca5a5" font-family="monospace">f=5N</text>
  <line x1="200" y1="185" x2="200" y2="158" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="215" y="170" font-size="9" fill="#93c5fd" font-family="monospace">N</text>
  <line x1="200" y1="235" x2="200" y2="258" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowW)"/>
  <text x="215" y="255" font-size="9" fill="#fca5a5" font-family="monospace">W=mg</text>
  <!-- Calculation -->
  <text x="50" y="255" font-size="9" fill="#fbbf24" font-family="monospace">a = F_net/m = (20-5)/5 = 3 m/s²</text>
</svg>
