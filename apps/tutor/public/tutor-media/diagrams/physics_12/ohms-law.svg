<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Ohm's Law</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- V-I Graph -->
  <g transform="translate(100, 100)">
    <!-- Axes -->
    <line x1="50" y1="350" x2="450" y2="350" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="460" y="360" fill="#f8fafc" font-size="16">I (Current)</text>
    
    <line x1="50" y1="350" x2="50" y2="20" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="10" y="15" fill="#f8fafc" font-size="16">V (Voltage)</text>
    
    <!-- Ohmic Line -->
    <line x1="50" y1="350" x2="400" y2="50" stroke="#86efac" stroke-width="3" opacity="0.8"/>
    <text x="410" y="60" fill="#86efac" font-size="18" font-style="italic">V ∝ I</text>
    <text x="250" y="180" fill="#86efac" transform="rotate(-40 250 180)" font-size="16">Slope = R</text>
  </g>

  <!-- Magic Triangle -->
  <g transform="translate(550, 150)">
    <polygon points="0,0 120,180 -120,180" fill="rgba(254, 240, 138, 0.05)" stroke="#fef08a" stroke-width="3"/>
    <line x1="-80" y1="110" x2="80" y2="110" stroke="#fef08a" stroke-width="2"/>
    <line x1="0" y1="110" x2="0" y2="180" stroke="#fef08a" stroke-width="2"/>
    
    <text x="0" y="85" fill="#fef08a" text-anchor="middle" font-size="40" font-weight="bold">V</text>
    <text x="-40" y="155" fill="#fef08a" text-anchor="middle" font-size="32" font-weight="bold">I</text>
    <text x="40" y="155" fill="#fef08a" text-anchor="middle" font-size="32" font-weight="bold">R</text>
  </g>

  <!-- Key Equation -->
  <rect x="250" y="480" width="300" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="530" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" font-style="italic">V = I · R</text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>