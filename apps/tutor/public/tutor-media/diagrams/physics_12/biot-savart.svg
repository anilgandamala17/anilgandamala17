<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Biot-Savart Law</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Field Diagram -->
  <g transform="translate(0, 50)">
    <!-- Wire -->
    <path d="M 200 450 Q 300 350 500 450" fill="none" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrowhead)"/>
    <text x="510" y="470" fill="#f8fafc" font-weight="bold">I</text>
    
    <!-- Element dl -->
    <line x1="300" y1="400" x2="330" y2="380" stroke="#86efac" stroke-width="8"/>
    <text x="270" y="415" fill="#86efac" font-weight="bold">dl</text>
    
    <!-- Position Vector r -->
    <line x1="315" y1="390" x2="445" y2="155" stroke="rgba(248, 250, 252, 0.4)" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="380" y="280" fill="rgba(248, 250, 252, 0.6)" transform="rotate(-60 380 280)">r</text>
    
    <!-- Point P -->
    <circle cx="450" cy="150" r="8" fill="#fef08a"/>
    <text x="465" y="150" fill="#fef08a" font-weight="bold">Point P</text>
    
    <!-- Field Vector dB -->
    <line x1="450" y1="150" x2="450" y2="50" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="465" y="70" fill="#fef08a" font-style="italic" font-weight="bold">dB</text>
  </g>

  <!-- Vector Equation -->
  <rect x="150" y="450" width="500" height="100" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="510" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">
    dB = (μ₀/4π) · (I dl × r̂ / r²)
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>