<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Faraday's Law of Inductions</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <g transform="translate(50, 50)">
    <!-- Bar Magnet -->
    <rect x="50" y="200" width="120" height="60" fill="#f87171" stroke="#f8fafc"/>
    <text x="110" y="240" fill="#f8fafc" text-anchor="middle" font-weight="bold">N</text>
    <rect x="170" y="200" width="120" height="60" fill="#60a5fa" stroke="#f8fafc"/>
    <text x="230" y="240" fill="#f8fafc" text-anchor="middle" font-weight="bold">S</text>
    
    <!-- Motion Vector -->
    <line x1="320" y1="230" x2="450" y2="230" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="380" y="210" fill="#fef08a" font-weight="bold">Moving Magnet</text>
    
    <!-- Coil -->
    <g transform="translate(550, 100)">
       <ellipse cx="0" cy="130" rx="40" ry="100" fill="none" stroke="#86efac" stroke-width="5"/>
       <path d="M 0 30 Q 80 130 0 230" fill="none" stroke="#86efac" stroke-width="2" opacity="0.4"/>
       <text x="0" y="260" fill="#86efac" text-anchor="middle">Induced emf (ε)</text>
    </g>
    
    <!-- Magnetic Flux symbols -->
    <path d="M 120 200 C 120 100 600 100 600 180" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.2"/>
    <path d="M 120 260 C 120 360 600 360 600 280" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.2"/>
    <text x="400" y="140" fill="#fef08a" opacity="0.5" font-style="italic">Φ_B (Flux)</text>
  </g>

  <!-- Key Equation -->
  <rect x="250" y="470" width="300" height="90" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="525" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="36" font-style="italic">
    ε = - N · (dΦ / dt)
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>