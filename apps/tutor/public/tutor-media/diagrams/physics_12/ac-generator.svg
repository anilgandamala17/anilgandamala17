<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86efac" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">AC Generator Schematic</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Poles -->
  <g transform="translate(100, 150)">
    <path d="M 0 50 L 150 0 L 150 250 L 0 200 Z" fill="rgba(134,239,172,0.1)" stroke="#f8fafc" stroke-width="2"/>
    <text x="50" y="140" fill="#f8fafc" font-size="50" font-weight="bold">N</text>
    
    <path d="M 450 0 L 600 50 L 600 200 L 450 250 Z" fill="rgba(96,165,250,0.1)" stroke="#f8fafc" stroke-width="2"/>
    <text x="500" y="140" fill="#f8fafc" font-size="50" font-weight="bold">S</text>
    
    <!-- Armature (Rotating Coil) -->
    <rect x="250" y="50" width="100" height="150" transform="skewY(-15) translate(-30, 20)" fill="rgba(254,240,138,0.2)" stroke="#fef08a" stroke-width="5"/>
    <line x1="300" y1="50" x2="300" y2="-20" stroke="#86efac" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="310" y="10" fill="#86efac">ω (Rotation)</text>
    
    <!-- Slip Rings -->
    <circle cx="300" cy="300" r="15" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="300" cy="350" r="15" fill="none" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- AC Waveform -->
  <g transform="translate(50, 480)">
    <line x1="0" y1="50" x2="300" y2="50" stroke="#f8fafc" stroke-width="1" stroke-dasharray="4,2"/>
    <path d="M 0 50 Q 25 0 50 50 T 100 50 T 150 50 T 200 50 T 250 50" fill="none" stroke="#86efac" stroke-width="3"/>
    <text x="125" y="100" fill="#86efac" text-anchor="middle" font-size="18">Induced AC Voltage (ε)</text>
    
    <!-- Equation -->
    <text x="500" y="60" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="36" font-style="italic">
       ε = NBAω · sin(ωt)
    </text>
  </g>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>