<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86efac" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Ampere's Law</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Ampere Loop Diagram -->
  <g transform="translate(400, 300)">
    <!-- Wire -->
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#f8fafc" stroke-width="20" opacity="0.9"/>
    <text x="25" y="-150" fill="#f8fafc" font-weight="bold">Current (I)</text>
    
    <!-- Amperian Loop -->
    <ellipse cx="0" cy="0" rx="160" ry="70" fill="none" stroke="#86efac" stroke-width="4" stroke-dasharray="10,5"/>
    
    <!-- B-Field Vector -->
    <path d="M 160 0 L 160 50" stroke="#fef08a" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="170" y="40" fill="#fef08a" font-style="italic" font-weight="bold">B</text>
    
    <!-- dl element -->
    <line x1="155" y1="-5" x2="165" y2="5" stroke="#fef08a" stroke-width="4"/>
    <text x="175" y="0" fill="#fef08a" font-size="14">dl</text>
  </g>

  <!-- Line Integral Equation -->
  <rect x="200" y="480" width="400" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="535" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="40" font-style="italic">
    ∮ B · dl = μ₀ I_enc
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>