<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Gauss Law</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Gaussian Surface -->
  <g transform="translate(400, 280)">
    <ellipse cx="0" cy="0" rx="180" ry="140" fill="rgba(134, 239, 172, 0.05)" stroke="#86efac" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="0" y="-150" fill="#86efac" text-anchor="middle" font-size="18">Gaussian Surface (S)</text>
    
    <!-- Enclosed Charges -->
    <circle cx="-50" cy="-20" r="10" fill="#fef08a"/>
    <text x="-50" y="-35" fill="#f8fafc" text-anchor="middle" font-size="14">+q₁</text>
    <circle cx="40" cy="30" r="10" fill="#fef08a"/>
    <text x="40" y="50" fill="#f8fafc" text-anchor="middle" font-size="14">+q₂</text>
    
    <!-- Flux vectors -->
    <g stroke="#fef08a" stroke-width="2" marker-end="url(#arrowhead)">
       <line x1="160" y1="-65" x2="240" y2="-97" />
       <line x1="-160" y1="65" x2="-240" y2="97" />
    </g>
    <text x="250" y="-105" fill="#fef08a" font-style="italic" font-size="20">E</text>
    
    <!-- Area element -->
    <rect x="155" y="-75" width="25" height="25" transform="rotate(-21 165 -65)" fill="rgba(255,255,255,0.1)" stroke="#f8fafc" stroke-width="1"/>
    <text x="140" y="-95" fill="#f8fafc" font-size="14" font-style="italic">dA</text>
  </g>

  <!-- Integral Equation -->
  <rect x="150" y="450" width="500" height="100" rx="15" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="400" y="510" fill="#86efac" text-anchor="middle" font-family="'Times New Roman', serif" font-size="40" font-style="italic">
    Φ_E = ∮ <tspan fill="#fef08a">E · dA</tspan> = q_enc / ε₀
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>