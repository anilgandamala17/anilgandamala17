<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Kirchhoff's Laws</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- KCL Junction -->
  <g transform="translate(100, 150)">
    <text x="100" y="-30" fill="#86efac" font-weight="bold" font-size="20">1. KCL (Current Law)</text>
    <circle cx="100" cy="100" r="10" fill="#f8fafc"/>
    
    <!-- Currents In -->
    <line x1="0" y1="100" x2="90" y2="100" stroke="#fef08a" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="20" y="90" fill="#fef08a">I₁</text>
    <line x1="40" y1="30" x2="90" y2="90" stroke="#fef08a" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="30" y="45" fill="#fef08a">I₂</text>
    
    <!-- Currents Out -->
    <line x1="110" y1="100" x2="210" y2="150" stroke="#86efac" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="170" y="130" fill="#86efac">I₃</text>
    <line x1="110" y1="100" x2="210" y2="50" stroke="#86efac" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="170" y="65" fill="#86efac">I₄</text>
    
    <text x="100" y="240" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-style="italic">Σ I_in = Σ I_out</text>
  </g>

  <!-- KVL Loop -->
  <g transform="translate(450, 150)">
    <text x="100" y="-30" fill="#86efac" font-weight="bold" font-size="20">2. KVL (Voltage Law)</text>
    <rect x="0" y="20" width="200" height="150" fill="transparent" stroke="#f8fafc" stroke-width="2" rx="5"/>
    
    <!-- Components -->
    <line x1="0" y1="80" x2="0" y2="110" stroke="white" stroke-width="4"/> <!-- Battery -->
    <path d="M 80 20 L 90 10 L 110 30 L 130 10 L 140 20" fill="none" stroke="#fef08a" stroke-width="2"/> <!-- Resistor -->
    
    <!-- Loop Direction -->
    <path d="M 60 95 A 40 40 0 1 1 140 95" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="4,2"/>
    <text x="100" y="105" fill="#86efac" text-anchor="middle">↻ ΣV = 0</text>
    
    <text x="100" y="240" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="24" font-style="italic">Σ V_loop = 0</text>
  </g>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>