<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Electric Field Lines</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Radial Field Diagram -->
  <g transform="translate(400, 300)">
    <!-- Positive Point Charge -->
    <circle cx="0" cy="0" r="30" fill="#86efac" opacity="0.9"/>
    <text x="0" y="10" fill="#0d2b1a" text-anchor="middle" font-weight="bold" font-size="28">+</text>
    
    <!-- Field Lines -->
    <g stroke="#fef08a" stroke-width="2" marker-end="url(#arrowhead)">
      <line x1="40" y1="0" x2="200" y2="0" />
      <line x1="-40" y1="0" x2="-200" y2="0" />
      <line x1="0" y1="-40" x2="0" y2="-200" />
      <line x1="0" y1="40" x2="0" y2="200" />
      <line x1="28.2" y1="-28.2" x2="141.4" y2="-141.4" />
      <line x1="-28.2" y1="28.2" x2="-141.4" y2="141.4" />
      <line x1="28.2" y1="28.2" x2="141.4" y2="141.4" />
      <line x1="-28.2" y1="-28.2" x2="-141.4" y2="-141.4" />
    </g>
    
    <text x="0" y="240" fill="#86efac" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">E = k · (q / r²)</text>
  </g>

  <!-- Labels -->
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>