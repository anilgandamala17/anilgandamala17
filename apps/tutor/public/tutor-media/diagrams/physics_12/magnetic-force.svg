<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>
  
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Magnetic Lorentz Force</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Fields Area -->
  <g transform="translate(100, 100)">
    <!-- B-Field Symbols (Into Page) -->
    <g opacity="0.4">
       <text x="50" y="50" fill="#86efac" font-size="24">×</text>
       <text x="150" y="50" fill="#86efac" font-size="24">×</text>
       <text x="250" y="50" fill="#86efac" font-size="24">×</text>
       <text x="350" y="50" fill="#86efac" font-size="24">×</text>
       <text x="450" y="50" fill="#86efac" font-size="24">×</text>
       
       <text x="50" y="150" fill="#86efac" font-size="24">×</text>
       <text x="150" y="150" fill="#86efac" font-size="24">×</text>
       <text x="250" y="150" fill="#86efac" font-size="24">×</text>
       <text x="350" y="150" fill="#86efac" font-size="24">×</text>
       <text x="450" y="150" fill="#86efac" font-size="24">×</text>
       
       <text x="50" y="250" fill="#86efac" font-size="24">×</text>
       <text x="150" y="250" fill="#86efac" font-size="24">×</text>
       <text x="250" y="250" fill="#86efac" font-size="24">×</text>
       <text x="350" y="250" fill="#86efac" font-size="24">×</text>
       <text x="450" y="250" fill="#86efac" font-size="24">×</text>
    </g>
    <text x="500" y="40" fill="#86efac" font-style="italic">B (Uniform)</text>

    <!-- Path of charge -->
    <path d="M 0 300 Q 250 300 250 0" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- Charge at a point -->
    <circle cx="210" cy="210" r="15" fill="#fef08a"/>
    <text x="210" y="217" fill="#0d2b1a" text-anchor="middle" font-weight="bold">+</text>
    <text x="240" y="240" fill="#fef08a">q</text>
    
    <!-- Vectors -->
    <line x1="210" y1="210" x2="310" y2="130" stroke="#f8fafc" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="290" y="110" fill="#f8fafc">v (velocity)</text>
    
    <line x1="210" y1="210" x2="110" y2="110" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="110" y="90" fill="#fef08a" font-weight="bold">F (Lorentz Force)</text>
  </g>

  <!-- Vector Cross Product -->
  <rect x="250" y="480" width="300" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="530" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="42" font-style="italic">
    F = q ( v × B )
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Physics Grade 12</text>
</svg>