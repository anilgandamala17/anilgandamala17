<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Supply &amp; Demand Equilibrium</text>
  <!-- Axes -->
  <line x1="60" y1="240" x2="370" y2="240" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <line x1="60" y1="30" x2="60" y2="245" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="215" y="260" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">Quantity (Q)</text>
  <text x="18" y="140" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace" transform="rotate(-90 18 140)">Price (P)</text>
  <!-- Grid lines -->
  <line x1="60" y1="80" x2="370" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="130" x2="370" y2="130" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="60" y1="180" x2="370" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Demand curve (downward sloping) -->
  <line x1="80" y1="50" x2="350" y2="230" stroke="#fca5a5" stroke-width="2.5"/>
  <text x="360" y="235" font-size="11" fill="#fca5a5" font-family="monospace" font-weight="bold">D</text>
  <text x="70" y="45" font-size="9" fill="#fca5a5" font-family="monospace">High P</text>
  <text x="330" y="248" font-size="9" fill="#fca5a5" font-family="monospace">High Q</text>
  <!-- Supply curve (upward sloping) -->
  <line x1="80" y1="230" x2="350" y2="50" stroke="#93c5fd" stroke-width="2.5"/>
  <text x="360" y="48" font-size="11" fill="#93c5fd" font-family="monospace" font-weight="bold">S</text>
  <!-- Equilibrium point -->
  <circle cx="215" cy="140" r="8" fill="#fbbf24" stroke="#ffffff" stroke-width="2"/>
  <!-- Equilibrium lines -->
  <line x1="60" y1="140" x2="215" y2="140" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="215" y1="140" x2="215" y2="240" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Equilibrium labels -->
  <text x="42" y="144" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">P*</text>
  <text x="215" y="255" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Q*</text>
  <text x="240" y="130" font-size="9" fill="#fbbf24" font-family="monospace">Equilibrium</text>
  <text x="240" y="142" font-size="8" fill="rgba(255,255,255,0.5)" font-family="monospace">(market clears)</text>
  <!-- Surplus region -->
  <text x="300" y="100" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Surplus</text>
  <text x="300" y="112" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(P &gt; P*)</text>
  <!-- Shortage region -->
  <text x="120" y="200" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Shortage</text>
  <text x="120" y="212" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(P &lt; P*)</text>
  <!-- Law labels -->
  <rect x="15" y="248" width="370" height="24" rx="3" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="200" y="264" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Law of Demand: P↑ → Qd↓   |   Law of Supply: P↑ → Qs↑</text>
</svg>
