<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Constitutional Design (India)</text>

  <!-- Left: What is a Constitution -->
  <rect x="15" y="55" width="365" height="165" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fde68a" stroke-width="2"/>
  <text x="197" y="78" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">What is a Constitution?</text>
  <g transform="translate(25,90)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="345" height="36" rx="6" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="172" y="22" text-anchor="middle" fill="#d4d4d8">Supreme document governing a nation</text>
    <text x="172" y="38" text-anchor="middle" fill="#7dd3fc">Lays down fundamental principles, rights, duties</text>
    <rect x="0" y="44" width="345" height="36" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="172" y="62" text-anchor="middle" fill="#fde68a" font-weight="bold">India: Longest written constitution in world</text>
    <text x="172" y="80" text-anchor="middle" fill="#d4d4d8">Adopted 26 Nov 1949 | In force 26 Jan 1950</text>
    <rect x="0" y="88" width="345" height="26" rx="6" fill="#134e4a" stroke="#86efac" stroke-width="1.5"/>
    <text x="172" y="106" text-anchor="middle" fill="#86efac" font-weight="bold">Dr. B.R. Ambedkar — Chief Architect / Drafting Committee Chair</text>
  </g>

  <!-- Right: Constituent Assembly -->
  <rect x="395" y="55" width="390" height="165" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia,serif" font-weight="bold">Constituent Assembly</text>
  <g transform="translate(405,90)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="370" height="30" rx="6" fill="#0f2a1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="185" y="20" text-anchor="middle" fill="#d4d4d8">Formed in 1946 — 299 members</text>
    <rect x="0" y="38" width="370" height="30" rx="6" fill="#0f2a1a" stroke="#fde68a" stroke-width="1.5"/>
    <text x="185" y="58" text-anchor="middle" fill="#fde68a">Debates took 2 years 11 months 18 days</text>
    <rect x="0" y="76" width="370" height="30" rx="6" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="185" y="96" text-anchor="middle" fill="#a3e635">Dr Rajendra Prasad — President of Assembly</text>
    <rect x="0" y="114" width="370" height="30" rx="6" fill="#134e4a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="185" y="134" text-anchor="middle" fill="#7dd3fc">Jawaharlal Nehru — Tryst with Destiny speech</text>
  </g>

  <!-- Key features in 2×3 grid -->
  <rect x="15" y="230" width="183" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="106" y="252" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia,serif" font-weight="bold">Secular</text>
  <text x="106" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">No state religion</text>
  <text x="106" y="290" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">All religions equal</text>
  <text x="106" y="308" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">Freedom of religion</text>
  <text x="106" y="350" text-anchor="middle" fill="#7dd3fc" font-size="9" font-family="Georgia,serif" font-style="italic">Inserted by 42nd Amendment 1976</text>

  <rect x="205" y="230" width="183" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fde68a" stroke-width="2"/>
  <text x="296" y="252" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">Sovereign Democratic</text>
  <text x="296" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">People are supreme</text>
  <text x="296" y="290" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Universal adult suffrage</text>
  <text x="296" y="308" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">18+ can vote (Art 326)</text>
  <text x="296" y="326" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">No foreign interference</text>

  <rect x="395" y="230" width="183" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="486" y="252" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="Georgia,serif" font-weight="bold">Federal</text>
  <text x="486" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Centre + States</text>
  <text x="486" y="290" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Division of powers</text>
  <text x="486" y="308" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">Union + State + Concurrent lists</text>
  <text x="486" y="326" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Residual powers: Centre</text>

  <rect x="585" y="230" width="200" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="685" y="252" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia,serif" font-weight="bold">Rights &amp; Duties</text>
  <text x="685" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">6 Fundamental Rights</text>
  <text x="685" y="290" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Art 12–35 enforceable in court</text>
  <text x="685" y="308" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">Directive Principles (Art 36–51)</text>
  <text x="685" y="326" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Fundamental Duties (Art 51A)</text>

  <!-- Fundamental Rights table -->
  <rect x="15" y="370" width="770" height="120" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="400" y="393" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">Six Fundamental Rights</text>
  <g font-size="11" font-family="Georgia,serif">
    <text x="25" y="418" fill="#fde68a" font-weight="bold">Art 12-18: </text><text x="105" y="418" fill="#d4d4d8">Right to Equality (no discrimination; equal opportunity)</text>
    <text x="25" y="436" fill="#a3e635" font-weight="bold">Art 19-22: </text><text x="105" y="436" fill="#d4d4d8">Right to Freedom (speech, assembly, profession, movements)</text>
    <text x="25" y="454" fill="#38bdf8" font-weight="bold">Art 23-24: </text><text x="105" y="454" fill="#d4d4d8">Right against Exploitation (no bonded labour, child labour)</text>
    <text x="490" y="418" fill="#f472b6" font-weight="bold">Art 25-28: </text><text x="570" y="418" fill="#d4d4d8">Right to Religion</text>
    <text x="490" y="436" fill="#c4b5fd" font-weight="bold">Art 29-30: </text><text x="570" y="436" fill="#d4d4d8">Cultural &amp; Educational Rights (minorities)</text>
    <text x="490" y="454" fill="#86efac" font-weight="bold">Art 32: </text><text x="540" y="454" fill="#d4d4d8">Right to Constitutional Remedies (Heart of Constitution — Ambedkar)</text>
  </g>
  <text x="400" y="482" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Right to Property (Art 31) removed from FRs by 44th Amendment 1978 — made a legal right</text>
</svg>
