<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">What is Democracy?</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Definition banner -->
  <rect x="60" y="62" width="680" height="40" rx="5" fill="rgba(134,239,172,0.10)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="rgba(255,255,255,0.8)" font-style="italic">"Government of the People, by the People, for the People" — Abraham Lincoln</text>
  <text x="400" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(134,239,172,0.7)">A form of government where rulers are elected by the people</text>

  <!-- Column 1: Who Rules? -->
  <rect x="60" y="120" width="200" height="340" rx="8" fill="rgba(250,204,21,0.07)" stroke="#facc15" stroke-width="1.5"/>
  <text x="160" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#facc15" font-weight="bold">Who Rules?</text>
  <line x1="75" y1="155" x2="245" y2="155" stroke="#facc15" stroke-width="0.5" opacity="0.5"/>
  <text x="160" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">The PEOPLE</text>
  <text x="160" y="198" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.6)">Through chosen</text>
  <text x="160" y="213" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.6)">representatives</text>
  <!-- Icon rows -->
  <circle cx="105" cy="255" r="18" fill="rgba(250,204,21,0.15)" stroke="#facc15" stroke-width="1"/>
  <text x="105" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#facc15">🗳</text>
  <text x="105" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Elections</text>
  <circle cx="160" cy="255" r="18" fill="rgba(250,204,21,0.15)" stroke="#facc15" stroke-width="1"/>
  <text x="160" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#facc15">⚖</text>
  <text x="160" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Rights</text>
  <circle cx="215" cy="255" r="18" fill="rgba(250,204,21,0.15)" stroke="#facc15" stroke-width="1"/>
  <text x="215" y="260" text-anchor="middle" font-family="Arial" font-size="18" fill="#facc15">📜</text>
  <text x="215" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Constitution</text>
  <text x="160" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.6)">India, USA, France</text>
  <text x="160" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#facc15">are democracies</text>
  <text x="160" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.5)">Myanmar, China</text>
  <text x="160" y="375" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(239,68,68,0.7)">are NOT democracies</text>

  <!-- Column 2: Key Requirements -->
  <rect x="300" y="120" width="200" height="340" rx="8" fill="rgba(56,189,248,0.07)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#38bdf8" font-weight="bold">Key Requirements</text>
  <line x1="315" y1="155" x2="485" y2="155" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  <!-- Requirements list -->
  <text x="320" y="178" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="178" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Free &amp; Fair Elections</text>
  <text x="320" y="200" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="200" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">One Person, One Vote</text>
  <text x="320" y="222" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="222" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Rule of Law</text>
  <text x="320" y="244" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="244" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Protection of Rights</text>
  <text x="320" y="266" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="266" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Independent Judiciary</text>
  <text x="320" y="288" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="288" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Majority Rule</text>
  <text x="320" y="310" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="310" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Minority Rights</text>
  <text x="320" y="332" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="332" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Press Freedom</text>
  <text x="320" y="354" font-family="Georgia, serif" font-size="11" fill="#38bdf8">▸</text>
  <text x="338" y="354" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">Accountability</text>

  <!-- Column 3: Types -->
  <rect x="540" y="120" width="200" height="340" rx="8" fill="rgba(167,139,250,0.07)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="640" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#a78bfa" font-weight="bold">Types of Democracy</text>
  <line x1="555" y1="155" x2="725" y2="155" stroke="#a78bfa" stroke-width="0.5" opacity="0.5"/>
  <!-- Direct -->
  <rect x="562" y="168" width="156" height="70" rx="5" fill="rgba(167,139,250,0.10)" stroke="#a78bfa" stroke-width="1"/>
  <text x="640" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a78bfa" font-weight="bold">Direct Democracy</text>
  <text x="640" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">People vote on every</text>
  <text x="640" y="223" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">issue (Ancient Greece)</text>
  <!-- Representative -->
  <rect x="562" y="252" width="156" height="70" rx="5" fill="rgba(134,239,172,0.10)" stroke="#86efac" stroke-width="1"/>
  <text x="640" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#86efac" font-weight="bold">Representative</text>
  <text x="640" y="292" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Elect representatives</text>
  <text x="640" y="307" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#86efac">India, USA, UK</text>
  <!-- Example -->
  <rect x="562" y="336" width="156" height="70" rx="5" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1"/>
  <text x="640" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f97316" font-weight="bold">India Example</text>
  <text x="640" y="376" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Parliamentary</text>
  <text x="640" y="391" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f97316">Federal + Unitary</text>
</svg>
