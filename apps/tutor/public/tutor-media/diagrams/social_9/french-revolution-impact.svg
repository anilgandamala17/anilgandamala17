<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">Impact and Legacy of the French Revolution</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Central node -->
  <ellipse cx="400" cy="240" rx="80" ry="45" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="233" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#86efac" font-weight="bold">French</text>
  <text x="400" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#86efac" font-weight="bold">Revolution</text>

  <!-- Spoke: Liberty -->
  <line x1="320" y1="217" x2="188" y2="152" stroke="rgba(250,204,21,0.6)" stroke-width="1.5"/>
  <rect x="90" y="100" width="140" height="80" rx="6" fill="rgba(250,204,21,0.10)" stroke="#facc15" stroke-width="1.5"/>
  <text x="160" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#facc15" font-weight="bold">Liberty</text>
  <text x="160" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Freedom from</text>
  <text x="160" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">feudal oppression</text>
  <text x="160" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#facc15">Press &amp; speech freed</text>

  <!-- Spoke: Equality -->
  <line x1="480" y1="217" x2="612" y2="152" stroke="rgba(249,115,22,0.6)" stroke-width="1.5"/>
  <rect x="570" y="100" width="140" height="80" rx="6" fill="rgba(249,115,22,0.10)" stroke="#f97316" stroke-width="1.5"/>
  <text x="640" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f97316" font-weight="bold">Equality</text>
  <text x="640" y="143" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">End of aristocracy</text>
  <text x="640" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Universal rights</text>
  <text x="640" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f97316">Rule of Law</text>

  <!-- Spoke: Fraternity -->
  <line x1="400" y1="285" x2="400" y2="365" stroke="rgba(167,139,250,0.6)" stroke-width="1.5"/>
  <rect x="310" y="365" width="180" height="70" rx="6" fill="rgba(167,139,250,0.10)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="388" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a78bfa" font-weight="bold">Fraternity</text>
  <text x="400" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Nationalism &amp; solidarity</text>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#a78bfa">Inspired world democracies</text>

  <!-- Spoke: Democratic Ideals left-bottom -->
  <line x1="335" y1="272" x2="205" y2="345" stroke="rgba(56,189,248,0.6)" stroke-width="1.5"/>
  <rect x="75" y="330" width="165" height="70" rx="6" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="158" y="353" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#38bdf8" font-weight="bold">Declaration of Rights</text>
  <text x="158" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Rights of Man &amp; Citizen</text>
  <text x="158" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#38bdf8">1789 Declaration</text>

  <!-- Spoke: Napoleon right-bottom -->
  <line x1="465" y1="272" x2="595" y2="345" stroke="rgba(239,68,68,0.6)" stroke-width="1.5"/>
  <rect x="560" y="330" width="165" height="70" rx="6" fill="rgba(239,68,68,0.10)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="643" y="353" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#ef4444" font-weight="bold">Napoleonic Legacy</text>
  <text x="643" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Civil Code spread</text>
  <text x="643" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#ef4444">across Europe</text>

  <!-- Slogan banner -->
  <rect x="200" y="65" width="400" height="22" rx="4" fill="rgba(134,239,172,0.08)" stroke="#86efac" stroke-width="0.5"/>
  <text x="400" y="81" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(134,239,172,0.8)" font-style="italic">"Liberté, Égalité, Fraternité" — The Revolutionary Motto</text>
</svg>
