<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">Farming in Village Palampur</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Central: Farming Activity -->
  <rect x="285" y="185" width="230" height="100" rx="8" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="2.5"/>
  <text x="400" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#86efac" font-weight="bold">Farming Activities</text>
  <text x="400" y="243" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.7)">Main occupation in Palampur</text>
  <text x="400" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.7)">75% land used for farming</text>

  <!-- Factor of Production: Land -->
  <rect x="55" y="68" width="170" height="120" rx="7" fill="rgba(250,204,21,0.08)" stroke="#facc15" stroke-width="1.5"/>
  <text x="140" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#facc15" font-weight="bold">Land</text>
  <text x="140" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Fixed resource</text>
  <text x="140" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">200 families hold</text>
  <text x="140" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">most of the land</text>
  <text x="140" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#facc15">Unequal distribution</text>
  <line x1="225" y1="130" x2="285" y2="220" stroke="rgba(250,204,21,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Factor of Production: Labour -->
  <rect x="55" y="228" width="170" height="120" rx="7" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="140" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#38bdf8" font-weight="bold">Labour</text>
  <text x="140" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Farm workers from</text>
  <text x="140" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">landless families</text>
  <text x="140" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Paid daily wages</text>
  <text x="140" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#38bdf8">Below minimum wage</text>
  <line x1="225" y1="285" x2="285" y2="255" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Factor of Production: Capital -->
  <rect x="578" y="68" width="167" height="120" rx="7" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1.5"/>
  <text x="662" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f97316" font-weight="bold">Capital</text>
  <text x="662" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Tools, seeds, fertilizers</text>
  <text x="662" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Working capital vs.</text>
  <text x="662" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Fixed capital (tractors)</text>
  <text x="662" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f97316">Farmers borrow from</text>
  <line x1="578" y1="130" x2="515" y2="220" stroke="rgba(249,115,22,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Technology -->
  <rect x="578" y="228" width="167" height="120" rx="7" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="662" y="254" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a78bfa" font-weight="bold">Technology</text>
  <text x="662" y="274" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">HYV Seeds post-1960s</text>
  <text x="662" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Green Revolution impact</text>
  <text x="662" y="306" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Tube wells for irrigation</text>
  <text x="662" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#a78bfa">3 crops per year now</text>
  <line x1="578" y1="285" x2="515" y2="255" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Crops timeline bar -->
  <rect x="55" y="380" width="690" height="90" rx="7" fill="rgba(134,239,172,0.06)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="404" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#86efac" font-weight="bold">Crop Seasons in Palampur</text>
  <!-- Kharif -->
  <rect x="80" y="415" width="190" height="40" rx="4" fill="rgba(250,204,21,0.12)" stroke="#facc15" stroke-width="1"/>
  <text x="175" y="431" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#facc15" font-weight="bold">Kharif (Monsoon)</text>
  <text x="175" y="447" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Jowar, Bajra, Cotton</text>
  <!-- Rabi -->
  <rect x="305" y="415" width="190" height="40" rx="4" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="431" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#38bdf8" font-weight="bold">Rabi (Winter)</text>
  <text x="400" y="447" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Wheat, Gram, Mustard</text>
  <!-- Zaid -->
  <rect x="530" y="415" width="190" height="40" rx="4" fill="rgba(134,239,172,0.12)" stroke="#86efac" stroke-width="1"/>
  <text x="625" y="431" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#86efac" font-weight="bold">Zaid (Summer)</text>
  <text x="625" y="447" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Vegetables, Fruits</text>
</svg>
