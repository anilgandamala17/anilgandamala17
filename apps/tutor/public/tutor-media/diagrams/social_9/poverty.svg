<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Poverty as a Challenge</text>

  <!-- Definition box -->
  <rect x="15" y="55" width="770" height="65" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fde68a" stroke-width="2"/>
  <text x="400" y="79" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Poverty = inability to fulfil minimum basic needs of livelihood</text>
  <text x="400" y="103" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Includes lack of food, shelter, clothing, healthcare, education, employment and social dignity</text>

  <!-- Two main types -->
  <rect x="15" y="130" width="375" height="170" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="202" y="153" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Absolute vs Relative Poverty</text>
  <g transform="translate(25,163)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="355" height="50" rx="6" fill="#0f2a1a" stroke="#86efac" stroke-width="1.5"/>
    <text x="177" y="18" text-anchor="middle" fill="#86efac" font-weight="bold">Absolute Poverty</text>
    <text x="177" y="36" text-anchor="middle" fill="#d4d4d8">Income below poverty line (BPL) — can't meet basics</text>
    <text x="177" y="50" text-anchor="middle" fill="#fde68a" font-size="10">India BPL: ₹32/day rural, ₹47/day urban (Tendulkar)</text>
    <rect x="0" y="58" width="355" height="50" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="177" y="76" text-anchor="middle" fill="#fbbf24" font-weight="bold">Relative Poverty</text>
    <text x="177" y="94" text-anchor="middle" fill="#d4d4d8">Compared to others in same society</text>
    <text x="177" y="108" text-anchor="middle" fill="#d4d4d8">Rich-poor gap / Gini coefficient</text>
  </g>

  <!-- Causes -->
  <rect x="405" y="130" width="380" height="170" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#ef4444" stroke-width="2"/>
  <text x="595" y="153" text-anchor="middle" fill="#ef4444" font-size="14" font-family="Georgia,serif" font-weight="bold">Causes of Poverty</text>
  <g transform="translate(415,163)" font-size="10" font-family="Georgia,serif">
    <rect x="0" y="0" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#ef4444" stroke-width="1"/>
    <text x="180" y="16" text-anchor="middle" fill="#fca5a5">Historical: British colonialism drained India's wealth</text>
    <rect x="0" y="28" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#fde68a" stroke-width="1"/>
    <text x="180" y="44" text-anchor="middle" fill="#fde68a">Low economic growth — GDP per capita low</text>
    <rect x="0" y="56" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#a3e635" stroke-width="1"/>
    <text x="180" y="72" text-anchor="middle" fill="#a3e635">Unequal distribution of land and assets</text>
    <rect x="0" y="84" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#38bdf8" stroke-width="1"/>
    <text x="180" y="100" text-anchor="middle" fill="#7dd3fc">Unemployment and lack of skills</text>
    <rect x="0" y="112" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#a78bfa" stroke-width="1"/>
    <text x="180" y="128" text-anchor="middle" fill="#c4b5fd">Caste system, social discrimination</text>
    <rect x="0" y="140" width="360" height="22" rx="4" fill="#3b0f0f" stroke="#86efac" stroke-width="1"/>
    <text x="180" y="156" text-anchor="middle" fill="#86efac">High population growth rate</text>
  </g>

  <!-- Poverty in India statistics -->
  <rect x="15" y="310" width="375" height="180" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="202" y="333" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia,serif" font-weight="bold">Poverty in India — Key Data</text>
  <g transform="translate(25,345)" font-size="11" font-family="Georgia,serif" fill="#d4d4d8">
    <text x="0" y="0" fill="#fde68a" font-weight="bold">~21.9% </text><text x="58" y="0">below poverty line (2011-12 Tendulkar)</text>
    <text x="0" y="20">Highest poverty: Bihar, Jharkhand, Odisha</text>
    <text x="0" y="40" fill="#ef4444">SC/ST communities — most vulnerable</text>
    <text x="0" y="60" fill="#a3e635">Rural poverty &gt; Urban poverty</text>
    <text x="0" y="80">NSSO surveys measure poverty rate</text>
    <text x="0" y="100">Human Poverty Index (HPI) — multi-dimensional</text>
    <text x="0" y="120">Child poverty: malnutrition, child labour</text>
    <text x="0" y="138" fill="#7dd3fc">BIMARU states = Bihar, MP, Rajasthan, UP (originally)</text>
  </g>

  <!-- Government measures -->
  <rect x="405" y="310" width="380" height="180" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="595" y="333" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Government Anti-Poverty Measures</text>
  <g transform="translate(415,345)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="360" height="28" rx="4" fill="#0f2a1a" stroke="#86efac" stroke-width="1.5"/>
    <text x="180" y="18" text-anchor="middle" fill="#86efac" font-weight="bold">MGNREGA — 100 days guaranteed rural work</text>
    <rect x="0" y="36" width="360" height="28" rx="4" fill="#0f2a1a" stroke="#fde68a" stroke-width="1.5"/>
    <text x="180" y="54" text-anchor="middle" fill="#fde68a" font-weight="bold">PDS — Public Distribution System (ration shops)</text>
    <rect x="0" y="72" width="360" height="28" rx="4" fill="#0f2a1a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="90" text-anchor="middle" fill="#7dd3fc" font-weight="bold">PM Jan Dhan Yojana — financial inclusion</text>
    <rect x="0" y="108" width="360" height="28" rx="4" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="180" y="126" text-anchor="middle" fill="#f9a8d4" font-weight="bold">Sarva Shiksha Abhiyan — free education</text>
    <rect x="0" y="144" width="360" height="26" rx="4" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="180" y="162" text-anchor="middle" fill="#a3e635" font-weight="bold">SDG Goal 1: End poverty in all forms by 2030</text>
  </g>
</svg>
