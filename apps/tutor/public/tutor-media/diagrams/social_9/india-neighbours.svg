<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">India and Its Neighbours</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- India central box -->
  <rect x="310" y="185" width="180" height="130" rx="8" fill="rgba(134,239,172,0.18)" stroke="#86efac" stroke-width="2.5"/>
  <text x="400" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#86efac" font-weight="bold">INDIA</text>
  <text x="400" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.6)">7th Largest Country</text>
  <text x="400" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.6)">3.28 million km²</text>
  <text x="400" y="293" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#86efac">Land + Maritime borders</text>

  <!-- Pakistan (West) -->
  <rect x="68" y="175" width="148" height="78" rx="6" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="1.5"/>
  <text x="142" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f97316" font-weight="bold">Pakistan</text>
  <text x="142" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">West border</text>
  <text x="142" y="233" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">3,323 km shared</text>
  <text x="142" y="244" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f97316">Radcliffe Line (1947)</text>
  <line x1="216" y1="214" x2="310" y2="235" stroke="rgba(249,115,22,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- China (North) -->
  <rect x="280" y="68" width="200" height="78" rx="6" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="380" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ef4444" font-weight="bold">China</text>
  <text x="380" y="111" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Northern border (Himalaya)</text>
  <text x="380" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">3,488 km shared</text>
  <text x="380" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#ef4444">McMahon Line</text>
  <line x1="380" y1="146" x2="395" y2="185" stroke="rgba(239,68,68,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Nepal (North) -->
  <rect x="570" y="105" width="148" height="68" rx="6" fill="rgba(250,204,21,0.10)" stroke="#facc15" stroke-width="1.5"/>
  <text x="644" y="128" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#facc15" font-weight="bold">Nepal</text>
  <text x="644" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Open border policy</text>
  <text x="644" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#facc15">1,751 km shared</text>
  <line x1="570" y1="140" x2="490" y2="200" stroke="rgba(250,204,21,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Bhutan (NE) -->
  <rect x="572" y="210" width="148" height="68" rx="6" fill="rgba(167,139,250,0.10)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="646" y="233" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a78bfa" font-weight="bold">Bhutan</text>
  <text x="646" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">NE border, 699 km</text>
  <text x="646" y="266" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#a78bfa">Treaty of Friendship</text>
  <line x1="572" y1="244" x2="490" y2="248" stroke="rgba(167,139,250,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Bangladesh (East) -->
  <rect x="574" y="318" width="148" height="68" rx="6" fill="rgba(56,189,248,0.10)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="648" y="341" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#38bdf8" font-weight="bold">Bangladesh</text>
  <text x="648" y="359" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">East border, 4,096 km</text>
  <text x="648" y="374" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#38bdf8">Longest shared border</text>
  <line x1="574" y1="352" x2="490" y2="295" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Sri Lanka (South) -->
  <rect x="310" y="388" width="180" height="68" rx="6" fill="rgba(134,239,172,0.08)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="411" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4ade80" font-weight="bold">Sri Lanka</text>
  <text x="400" y="429" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">South — Palk Strait</text>
  <text x="400" y="444" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#4ade80">Island nation (22 km gap)</text>
  <line x1="400" y1="388" x2="400" y2="315" stroke="rgba(74,222,128,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Afghanistan (NW) -->
  <rect x="68" y="310" width="148" height="68" rx="6" fill="rgba(251,146,60,0.10)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="142" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#fb923c" font-weight="bold">Afghanistan</text>
  <text x="142" y="351" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">NW, 106 km shared</text>
  <text x="142" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#fb923c">Durand Line area</text>
  <line x1="216" y1="340" x2="310" y2="290" stroke="rgba(251,146,60,0.5)" stroke-width="1.5" stroke-dasharray="5,3"/>
</svg>
