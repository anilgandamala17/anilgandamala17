<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">The French Revolution (1789)</text>

  <!-- Timeline -->
  <rect x="15" y="55" width="770" height="80" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fde68a" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">Key Timeline</text>
  <!-- Timeline line -->
  <line x1="40" y1="108" x2="760" y2="108" stroke="#86efac" stroke-width="3"/>
  <g font-size="10" font-family="Georgia,serif" text-anchor="middle">
    <circle cx="80" cy="108" r="6" fill="#f472b6"/><text x="80" y="126" fill="#f9a8d4">1789</text><text x="80" y="140" fill="#d4d4d8">Revolution</text>
    <circle cx="200" cy="108" r="6" fill="#fde68a"/><text x="200" y="126" fill="#fde68a">1791</text><text x="200" y="140" fill="#d4d4d8">Constitution</text>
    <circle cx="340" cy="108" r="6" fill="#ef4444"/><text x="340" y="126" fill="#ef4444">1793</text><text x="340" y="140" fill="#d4d4d8">Terror</text>
    <circle cx="480" cy="108" r="6" fill="#a3e635"/><text x="480" y="126" fill="#a3e635">1795</text><text x="480" y="140" fill="#d4d4d8">Directory</text>
    <circle cx="620" cy="108" r="6" fill="#38bdf8"/><text x="620" y="126" fill="#38bdf8">1799</text><text x="620" y="140" fill="#d4d4d8">Napoleon</text>
    <circle cx="740" cy="108" r="6" fill="#a78bfa"/><text x="740" y="126" fill="#c4b5fd">1815</text><text x="740" y="140" fill="#d4d4d8">Waterloo</text>
  </g>

  <!-- Left: Causes -->
  <rect x="15" y="148" width="370" height="330" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" fill="#f9a8d4" font-size="14" font-family="Georgia,serif" font-weight="bold">Causes of the Revolution</text>
  <g transform="translate(25,182)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="350" height="44" rx="6" fill="#3b0f1a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="175" y="18" text-anchor="middle" fill="#ef4444" font-weight="bold">Political: Absolute Monarchy</text>
    <text x="175" y="36" text-anchor="middle" fill="#d4d4d8">Louis XVI — no representation, unjust taxes</text>
    <rect x="0" y="50" width="350" height="44" rx="6" fill="#3b1e00" stroke="#fde68a" stroke-width="1.5"/>
    <text x="175" y="68" text-anchor="middle" fill="#fde68a" font-weight="bold">Economic: Financial Crisis</text>
    <text x="175" y="86" text-anchor="middle" fill="#d4d4d8">Huge debt from wars, famine, heavy taxation on 3rd Estate</text>
    <rect x="0" y="100" width="350" height="44" rx="6" fill="#1a1a3b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="175" y="118" text-anchor="middle" fill="#c4b5fd" font-weight="bold">Social: Three Estates System</text>
    <text x="175" y="136" text-anchor="middle" fill="#d4d4d8">Clergy + Nobility exempt. Third Estate paid all</text>
    <rect x="0" y="150" width="350" height="44" rx="6" fill="#1a3a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="175" y="168" text-anchor="middle" fill="#a3e635" font-weight="bold">Philosophical: Enlightenment Ideas</text>
    <text x="175" y="186" text-anchor="middle" fill="#d4d4d8">Rousseau, Voltaire, Montesquieu — liberty &amp; equality</text>
    <rect x="0" y="200" width="350" height="80" rx="6" fill="#134e4a" stroke="#86efac" stroke-width="2"/>
    <text x="175" y="220" text-anchor="middle" fill="#86efac" font-weight="bold">The Three Estates</text>
    <text x="175" y="240" text-anchor="middle" fill="#d4d4d8">1st: Clergy | 2nd: Nobility | 3rd: Common people</text>
    <text x="175" y="258" text-anchor="middle" fill="#fde68a" font-size="10">Only 3rd Estate paid taxes, had no political power</text>
    <text x="175" y="274" text-anchor="middle" fill="#d4d4d8" font-size="10">Formed National Assembly 1789 → Declared Revolution</text>
  </g>

  <!-- Right: Effects and Ideals -->
  <rect x="400" y="148" width="385" height="330" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="592" y="172" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Impact and Legacy</text>

  <g transform="translate(410,182)">
    <rect x="0" y="0" width="365" height="50" rx="6" fill="#0f2a1a" stroke="#fde68a" stroke-width="1.5"/>
    <text x="182" y="20" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="bold" font-family="Georgia,serif">Liberté, Égalité, Fraternité</text>
    <text x="182" y="38" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Liberty, Equality, Fraternity — rallying slogan</text>

    <rect x="0" y="58" width="365" height="44" rx="6" fill="#0f2a1a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="182" y="76" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="Georgia,serif">Declaration of Rights of Man (1789)</text>
    <text x="182" y="94" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Natural rights: liberty, property, security, resistance</text>

    <rect x="0" y="110" width="365" height="44" rx="6" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="182" y="128" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="bold" font-family="Georgia,serif">Reign of Terror (1793−94) — Jacobins</text>
    <text x="182" y="146" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Robespierre — guillotine used on thousands</text>

    <rect x="0" y="162" width="365" height="44" rx="6" fill="#0f2a1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="182" y="180" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold" font-family="Georgia,serif">Napoleon Bonaparte (1799−1815)</text>
    <text x="182" y="198" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Napoleon Code — equality before law, property rights</text>

    <rect x="0" y="214" width="365" height="70" rx="6" fill="#134e4a" stroke="#a3e635" stroke-width="2"/>
    <text x="182" y="234" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="Georgia,serif">Global Impact</text>
    <text x="182" y="254" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Inspired revolutions worldwide — Latin America, Europe</text>
    <text x="182" y="270" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">End of feudalism, birth of nationalism, democracy</text>
    <text x="182" y="286" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif" font-style="italic">Ideas of Revolution spread to India's independence movement</text>
  </g>
</svg>
