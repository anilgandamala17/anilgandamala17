<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">Causes of the French Revolution (1789)</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Central node -->
  <ellipse cx="400" cy="255" rx="78" ry="44" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="2.5"/>
  <text x="400" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ef4444" font-weight="bold">French</text>
  <text x="400" y="265" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#ef4444" font-weight="bold">Revolution</text>

  <!-- POLITICAL Causes — top left -->
  <line x1="327" y1="232" x2="197" y2="155" stroke="rgba(250,204,21,0.6)" stroke-width="1.5"/>
  <rect x="55" y="68" width="190" height="140" rx="7" fill="rgba(250,204,21,0.09)" stroke="#facc15" stroke-width="1.8"/>
  <text x="150" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#facc15" font-weight="bold">⚔ Political</text>
  <line x1="70" y1="103" x2="230" y2="103" stroke="#facc15" stroke-width="0.5" opacity="0.4"/>
  <text x="75" y="122" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Absolute monarchy of Louis XVI</text>
  <text x="75" y="140" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• No role for common people</text>
  <text x="75" y="158" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Corruption of the nobility</text>
  <text x="75" y="176" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Weak and indecisive king</text>
  <text x="150" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#facc15">Autocratic governance</text>

  <!-- ECONOMIC Causes — top right -->
  <line x1="473" y1="232" x2="603" y2="155" stroke="rgba(249,115,22,0.6)" stroke-width="1.5"/>
  <rect x="555" y="68" width="190" height="140" rx="7" fill="rgba(249,115,22,0.09)" stroke="#f97316" stroke-width="1.8"/>
  <text x="650" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f97316" font-weight="bold">💰 Economic</text>
  <line x1="570" y1="103" x2="730" y2="103" stroke="#f97316" stroke-width="0.5" opacity="0.4"/>
  <text x="575" y="122" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• France was bankrupt (wars)</text>
  <text x="575" y="140" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Heavy taxation on Third Estate</text>
  <text x="575" y="158" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Nobility &amp; clergy tax-exempt</text>
  <text x="575" y="176" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Crop failure, food shortage 1788</text>
  <text x="650" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#f97316">Fiscal collapse + hunger</text>

  <!-- SOCIAL Causes — bottom left -->
  <line x1="336" y1="295" x2="205" y2="368" stroke="rgba(56,189,248,0.6)" stroke-width="1.5"/>
  <rect x="55" y="310" width="190" height="140" rx="7" fill="rgba(56,189,248,0.09)" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="150" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#38bdf8" font-weight="bold">🏛 Social</text>
  <line x1="70" y1="345" x2="230" y2="345" stroke="#38bdf8" stroke-width="0.5" opacity="0.4"/>
  <text x="75" y="364" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Estate system (3 estates)</text>
  <text x="75" y="382" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• 97% = Third Estate (no rights)</text>
  <text x="75" y="400" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Feudal privileges for clergy</text>
  <text x="75" y="418" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Growing inequality, resentment</text>
  <text x="150" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#38bdf8">Rigid class hierarchy</text>

  <!-- PHILOSOPHICAL Causes — bottom right -->
  <line x1="464" y1="295" x2="595" y2="368" stroke="rgba(167,139,250,0.6)" stroke-width="1.5"/>
  <rect x="555" y="310" width="190" height="140" rx="7" fill="rgba(167,139,250,0.09)" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="650" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a78bfa" font-weight="bold">📖 Philosophical</text>
  <line x1="570" y1="345" x2="730" y2="345" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>
  <text x="575" y="364" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Enlightenment thinkers</text>
  <text x="575" y="382" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Voltaire → criticized Church</text>
  <text x="575" y="400" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Rousseau → Social Contract</text>
  <text x="575" y="418" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.8)">• Montesquieu → separation</text>
  <text x="650" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#a78bfa">New ideas of liberty &amp; rights</text>
</svg>
