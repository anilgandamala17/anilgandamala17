<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">India: Location — Latitudes, Longitudes &amp; Hemispheres</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Globe / Grid visual -->
  <!-- Equator line -->
  <line x1="60" y1="280" x2="460" y2="280" stroke="rgba(239,68,68,0.6)" stroke-width="2"/>
  <text x="465" y="285" font-family="Georgia, serif" font-size="10" fill="#ef4444">Equator (0°)</text>
  <!-- Prime Meridian -->
  <line x1="260" y1="68" x2="260" y2="430" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="265" y="80" font-family="Georgia, serif" font-size="10" fill="#38bdf8">Prime Meridian (0°)</text>

  <!-- Grid lines horizontal -->
  <line x1="60" y1="180" x2="460" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="62" y="176" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.4)">30°N</text>
  <line x1="60" y1="230" x2="460" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="62" y="226" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.4)">15°N</text>
  <line x1="60" y1="330" x2="460" y2="330" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="62" y="326" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.4)">15°S</text>
  <!-- Grid lines vertical -->
  <line x1="160" y1="68" x2="160" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="360" y1="68" x2="360" y2="430" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- India shape (simplified polygon) -->
  <polygon points="240,118 295,105 340,135 360,170 355,215 335,255 305,285 270,305 235,290 210,265 190,230 200,190 220,155" 
           fill="rgba(134,239,172,0.25)" stroke="#86efac" stroke-width="2"/>
  <text x="275" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#86efac" font-weight="bold">INDIA</text>

  <!-- Tropic of Cancer line through India -->
  <line x1="60" y1="162" x2="460" y2="162" stroke="rgba(250,204,21,0.7)" stroke-width="1.8" stroke-dasharray="8,4"/>
  <text x="465" y="167" font-family="Georgia, serif" font-size="10" fill="#facc15">Tropic of Cancer (23½°N)</text>

  <!-- Latitude labels -->
  <text x="62" y="114" font-family="Georgia, serif" font-size="9" fill="rgba(255,255,255,0.4)">37°N</text>
  <line x1="60" y1="118" x2="460" y2="118" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- North indicator -->
  <text x="120" y="82" font-family="Georgia, serif" font-size="24" fill="rgba(134,239,172,0.5)">N</text>
  <line x1="132" y1="86" x2="132" y2="105" stroke="rgba(134,239,172,0.5)" stroke-width="1.5"/>
  <polygon points="132,68 126,88 138,88" fill="rgba(134,239,172,0.5)"/>

  <!-- Info panel right -->
  <rect x="488" y="68" width="278" height="350" rx="8" fill="rgba(134,239,172,0.06)" stroke="#86efac" stroke-width="1"/>
  <text x="627" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#86efac" font-weight="bold">India's Location Facts</text>
  <line x1="502" y1="104" x2="752" y2="104" stroke="#86efac" stroke-width="0.5" opacity="0.4"/>

  <!-- Latitude facts -->
  <text x="505" y="126" font-family="Georgia, serif" font-size="12" fill="#facc15" font-weight="bold">Latitudes:</text>
  <text x="505" y="144" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Northernmost: 37°6'N (J&amp;K)</text>
  <text x="505" y="162" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Southernmost: 8°4'N (Kanyakumari)</text>
  <text x="505" y="180" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Extent: 29°2' (N-S span)</text>
  <text x="505" y="198" font-family="Georgia, serif" font-size="10" fill="#facc15">→ Tropic of Cancer (23½°N) bisects India</text>

  <!-- Longitude facts -->
  <text x="505" y="222" font-family="Georgia, serif" font-size="12" fill="#38bdf8" font-weight="bold">Longitudes:</text>
  <text x="505" y="240" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Westernmost: 68°7'E (Rann of Kutch)</text>
  <text x="505" y="258" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Easternmost: 97°25'E (Arunachal)</text>
  <text x="505" y="276" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Extent: 29°18' (E-W span)</text>
  <text x="505" y="294" font-family="Georgia, serif" font-size="10" fill="#38bdf8">→ IST = 82°30'E (Standard Meridian)</text>

  <!-- Hemisphere facts -->
  <text x="505" y="318" font-family="Georgia, serif" font-size="12" fill="#a78bfa" font-weight="bold">Hemispheres:</text>
  <text x="505" y="336" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Entirely in Northern Hemisphere</text>
  <text x="505" y="354" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.8)">• Entirely in Eastern Hemisphere</text>
  <text x="505" y="372" font-family="Georgia, serif" font-size="10" fill="#a78bfa">→ Between Equator and Arctic Circle</text>

  <!-- Time zone note -->
  <rect x="60" y="438" width="680" height="40" rx="5" fill="rgba(250,204,21,0.06)" stroke="#facc15" stroke-width="0.8"/>
  <text x="400" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.75)">IST (Indian Standard Time) = GMT + 5 hrs 30 min | 82°30'E passes through Mirzapur, UP</text>
  <text x="400" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#facc15">Time difference from east to west endpoint = ~2 hours (prevent confusion → uniform IST)</text>
</svg>
