<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1a2e1a"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#86efac" font-weight="bold">Features of Democracy</text>
  <line x1="40" y1="48" x2="760" y2="48" stroke="#86efac" stroke-width="1" opacity="0.4"/>

  <!-- Feature 1 -->
  <rect x="55" y="70" width="335" height="85" rx="7" fill="rgba(250,204,21,0.08)" stroke="#facc15" stroke-width="1.5"/>
  <text x="80" y="100" font-family="Georgia, serif" font-size="13" fill="#facc15" font-weight="bold">① Elected Representatives</text>
  <text x="80" y="120" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Leaders are chosen by citizens through free, fair, periodic elections.</text>
  <text x="80" y="140" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">No single group retains power indefinitely.</text>

  <!-- Feature 2 -->
  <rect x="410" y="70" width="335" height="85" rx="7" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="435" y="100" font-family="Georgia, serif" font-size="13" fill="#38bdf8" font-weight="bold">② Free and Fair Elections</text>
  <text x="435" y="120" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">All adults get equal right to vote (Universal Adult Franchise).</text>
  <text x="435" y="140" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Secret ballot. Independent Election Commission.</text>

  <!-- Feature 3 -->
  <rect x="55" y="170" width="335" height="85" rx="7" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="80" y="200" font-family="Georgia, serif" font-size="13" fill="#a78bfa" font-weight="bold">③ Rule of Law</text>
  <text x="80" y="220" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Laws apply equally to everyone — citizens and government alike.</text>
  <text x="80" y="240" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">No one is above the law. Constitution is supreme.</text>

  <!-- Feature 4 -->
  <rect x="410" y="170" width="335" height="85" rx="7" fill="rgba(249,115,22,0.08)" stroke="#f97316" stroke-width="1.5"/>
  <text x="435" y="200" font-family="Georgia, serif" font-size="13" fill="#f97316" font-weight="bold">④ Protection of Minority</text>
  <text x="435" y="220" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Majority rules, but minority rights are safeguarded by law.</text>
  <text x="435" y="240" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Democracy ≠ majority tyranny.</text>

  <!-- Feature 5 -->
  <rect x="55" y="270" width="335" height="85" rx="7" fill="rgba(74,222,128,0.08)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="80" y="300" font-family="Georgia, serif" font-size="13" fill="#4ade80" font-weight="bold">⑤ Fundamental Rights</text>
  <text x="80" y="320" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Citizens have basic rights: speech, assembly, religion, equality.</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Enforced by an independent judiciary.</text>

  <!-- Feature 6 -->
  <rect x="410" y="270" width="335" height="85" rx="7" fill="rgba(239,68,68,0.08)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="435" y="300" font-family="Georgia, serif" font-size="13" fill="#ef4444" font-weight="bold">⑥ Accountability</text>
  <text x="435" y="320" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Government must justify its decisions to the public.</text>
  <text x="435" y="340" font-family="Georgia, serif" font-size="10" fill="rgba(255,255,255,0.7)">Free media, right to information, transparency.</text>

  <!-- Summary bar -->
  <rect x="55" y="370" width="690" height="100" rx="7" fill="rgba(134,239,172,0.06)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#86efac" font-weight="bold">Summary: The Pillars of Democracy</text>
  <text x="130" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(250,204,21,0.85)">Elections</text>
  <text x="264" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(56,189,248,0.85)">Rule of Law</text>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(167,139,250,0.85)">Rights</text>
  <text x="536" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(249,115,22,0.85)">Equality</text>
  <text x="672" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(74,222,128,0.85)">Accountability</text>
  <!-- Dots -->
  <circle cx="163" cy="440" r="3" fill="rgba(250,204,21,0.6)"/>
  <circle cx="296" cy="440" r="3" fill="rgba(56,189,248,0.6)"/>
  <circle cx="400" cy="440" r="3" fill="rgba(167,139,250,0.6)"/>
  <circle cx="504" cy="440" r="3" fill="rgba(249,115,22,0.6)"/>
  <circle cx="638" cy="440" r="3" fill="rgba(74,222,128,0.6)"/>
</svg>
