<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <radialGradient id="grad-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:0.2" />
    </radialGradient>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .axis { stroke: #94a3b8; stroke-width: 1; opacity: 0.6; }
      .orbital-p { fill: rgba(248, 113, 113, 0.7); stroke: #ef4444; stroke-width: 1; }
      .sub-label { fill: #fcd34d; font-size: 11px; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Shapes of Atomic Orbitals</text>
    
    <!-- s-orbital -->
    <g transform="translate(60, 100)">
      <line x1="-40" y1="0" x2="40" y2="0" class="axis" />
      <line x1="0" y1="-40" x2="0" y2="40" class="axis" />
      <circle cx="0" cy="0" r="30" fill="url(#grad-s)" stroke="#3b82f6" stroke-width="1.5" />
      <text x="0" y="55" class="sub-label">s-orbital (Spherical)</text>
    </g>

    <!-- p-orbital (x) -->
    <g transform="translate(200, 100)">
      <line x1="-50" y1="0" x2="50" y2="0" class="axis" />
      <line x1="0" y1="-40" x2="0" y2="40" class="axis" />
      <path d="M 5,0 Q 25,25 45,0 Q 25,-25 5,0 Z" class="orbital-p" />
      <path d="M -5,0 Q -25,25 -45,0 Q -25,-25 -5,0 Z" class="orbital-p" />
      <text x="0" y="55" class="sub-label">pₓ-orbital (Dumbbell)</text>
    </g>

    <!-- p-orbital (y) -->
    <g transform="translate(330, 100)">
      <line x1="-40" y1="0" x2="40" y2="0" class="axis" />
      <line x1="0" y1="-50" x2="0" y2="50" class="axis" />
      <path d="M 0,5 Q 25,25 0,45 Q -25,25 0,5 Z" class="orbital-p" />
      <path d="M 0,-5 Q 25,-25 0,-45 Q -25,-25 0,-5 Z" class="orbital-p" />
      <text x="0" y="65" class="sub-label">pᵧ-orbital</text>
    </g>

    <!-- d-orbital (xy) snippet -->
    <g transform="translate(200, 220)">
        <text x="0" y="0" text-anchor="middle" fill="#93c5fd" font-size="10">d and f orbitals have more complex angular nodes</text>
    </g>
  </g>
</svg>