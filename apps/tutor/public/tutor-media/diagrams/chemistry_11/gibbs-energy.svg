<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 14px; font-weight: bold; }
      .formula { fill: #fcd34d; font-size: 20px; font-family: 'Courier New', monospace; font-weight: bold; }
      .box { fill: rgba(30, 58, 138, 0.8); stroke: #60a5fa; stroke-width: 1.5; rx: 10; }
      .spont { fill: #4ade80; font-weight: bold; }
      .non-spont { fill: #f87171; font-weight: bold; }
      .concept-desc { fill: #93c5fd; font-size: 10px; font-style: italic; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Gibbs Free Energy & Spontaneity</text>
    
    <!-- Central Formula -->
    <rect x="50" y="50" width="300" height="60" class="box" />
    <text x="200" y="85" text-anchor="middle" class="formula">ΔG = ΔH – TΔS</text>

    <!-- Condition Summary -->
    <g transform="translate(40, 130)">
      <rect x="0" y="0" width="150" height="100" class="box" />
      <text x="75" y="30" text-anchor="middle" class="label">ΔG &lt; 0</text>
      <text x="75" y="60" text-anchor="middle" class="spont" font-size="16">SPONTANEOUS</text>
      <text x="75" y="80" text-anchor="middle" class="concept-desc">Reaction occurs naturally</text>
    </g>

    <g transform="translate(210, 130)">
      <rect x="0" y="0" width="150" height="100" class="box" />
      <text x="75" y="30" text-anchor="middle" class="label">ΔG &gt; 0</text>
      <text x="75" y="60" text-anchor="middle" class="non-spont" font-size="16">NON-SPONTANEOUS</text>
      <text x="75" y="80" text-anchor="middle" class="concept-desc">Requires input of energy</text>
    </g>

    <!-- Equilibrium Note -->
    <text x="200" y="255" text-anchor="middle" fill="#ffffff" font-size="12">If ΔG = 0, system is at <tspan fill="#fcd34d">EQUILIBRIUM</tspan></text>
  </g>
</svg>