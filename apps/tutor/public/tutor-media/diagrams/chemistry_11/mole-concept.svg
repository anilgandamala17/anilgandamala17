<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa" />
    </marker>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .box { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 8; }
      .center-box { fill: #1e293b; stroke: #fcd34d; stroke-width: 2; rx: 12; }
      .arrow { stroke: #60a5fa; stroke-width: 2; marker-end: url(#arrowhead); }
      .constant { fill: #fca5a5; font-size: 11px; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">The Mole Concept Road Map</text>
    
    <!-- Central Mole Box -->
    <rect x="150" y="100" width="100" height="60" class="center-box" />
    <text x="200" y="130" text-anchor="middle" class="label" font-size="16">MOLES (n)</text>
    <text x="200" y="150" text-anchor="middle" fill="#fcd34d" font-size="9">The Bridge Unit</text>

    <!-- Mass Box -->
    <rect x="20" y="100" width="90" height="50" class="box" />
    <text x="65" y="130" text-anchor="middle" class="label">MASS (g)</text>

    <!-- Volume Box -->
    <rect x="290" y="100" width="90" height="50" class="box" />
    <text x="335" y="130" text-anchor="middle" class="label">VOLUME (L)</text>
    <text x="335" y="145" text-anchor="middle" class="constant" font-size="8">at STP</text>

    <!-- Particles Box -->
    <rect x="150" y="200" width="100" height="50" class="box" />
    <text x="200" y="230" text-anchor="middle" class="label">PARTICLES</text>

    <!-- Connectors -->
    <!-- Mass to Mole -->
    <line x1="110" y1="115" x2="145" y2="115" class="arrow" />
    <text x="127" y="110" text-anchor="middle" class="constant">÷ M</text>
    <line x1="145" y1="145" x2="115" y2="145" class="arrow" />
    <text x="127" y="160" text-anchor="middle" class="constant">× M</text>

    <!-- Mole to Volume -->
    <line x1="250" y1="115" x2="285" y2="115" class="arrow" />
    <text x="267" y="110" text-anchor="middle" class="constant">× 22.4</text>
    <line x1="285" y1="145" x2="255" y2="145" class="arrow" />
    <text x="267" y="160" text-anchor="middle" class="constant">÷ 22.4</text>

    <!-- Mole to Particles -->
    <line x1="190" y1="160" x2="190" y2="195" class="arrow" />
    <text x="175" y="185" text-anchor="middle" class="constant">× Nₐ</text>
    <line x1="210" y1="195" x2="210" y2="165" class="arrow" />
    <text x="225" y="185" text-anchor="middle" class="constant">÷ Nₐ</text>
    
    <text x="300" y="230" class="constant" font-size="9">Nₐ = 6.022 × 10²³</text>
  </g>
</svg>