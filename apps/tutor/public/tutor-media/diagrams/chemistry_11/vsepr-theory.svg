<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 11px; font-weight: bold; }
      .atom { fill: #60a5fa; stroke: #2563eb; stroke-width: 1; }
      .atom-center { fill: #f87171; stroke: #ef4444; stroke-width: 1.5; }
      .bond { stroke: #94a3b8; stroke-width: 2; }
      .lone-pair { fill: rgba(252, 211, 77, 0.4); stroke: #fcd34d; stroke-width: 0.5; stroke-dasharray: 2; }
      .sub-label { fill: #4ade80; font-size: 10px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">VSEPR Theory: Molecular Geometries</text>
    
    <!-- Linear AB2 -->
    <g transform="translate(60, 100)">
      <line x1="-30" y1="0" x2="30" y2="0" class="bond" />
      <circle cx="-30" cy="0" r="10" class="atom" />
      <circle cx="30" cy="0" r="10" class="atom" />
      <circle cx="0" cy="0" r="12" class="atom-center" />
      <text x="0" y="50" class="sub-label">Linear (180°)</text>
      <text x="0" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">e.g., BeCl₂</text>
    </g>

    <!-- Trigonal Planar AB3 -->
    <g transform="translate(200, 100)">
      <line x1="0" y1="0" x2="0" y2="-40" class="bond" />
      <line x1="0" y1="0" x2="35" y2="20" class="bond" />
      <line x1="0" y1="0" x2="-35" y2="20" class="bond" />
      <circle cx="0" cy="-40" r="10" class="atom" />
      <circle cx="35" cy="20" r="10" class="atom" />
      <circle cx="-35" cy="20" r="10" class="atom" />
      <circle cx="0" cy="0" r="12" class="atom-center" />
      <text x="0" y="50" class="sub-label">Trigonal Planar (120°)</text>
      <text x="0" y="65" fill="#94a3b8" font-size="8" text-anchor="middle">e.g., BF₃</text>
    </g>

    <!-- Tetrahedral AB4 -->
    <g transform="translate(330, 100)">
      <line x1="0" y1="0" x2="0" y2="-40" class="bond" />
      <line x1="0" y1="0" x2="35" y2="20" class="bond" />
      <line x1="0" y1="0" x2="-20" y2="35" class="bond" />
      <line x1="0" y1="0" x2="-15" y2="5" class="bond" opacity="0.3" /> <!-- Back bond -->
      <circle cx="0" cy="-40" r="10" class="atom" />
      <circle cx="35" cy="20" r="10" class="atom" />
      <circle cx="-20" cy="35" r="10" class="atom" />
      <circle cx="0" cy="0" r="12" class="atom-center" />
      <text x="0" y="60" class="sub-label">Tetrahedral (109.5°)</text>
      <text x="0" y="75" fill="#94a3b8" font-size="8" text-anchor="middle">e.g., CH₄</text>
    </g>

    <text x="200" y="240" text-anchor="middle" fill="#fcd34d" font-size="10">Electron pairs stay as far apart as possible to minimize repulsion</text>
  </g>
</svg>