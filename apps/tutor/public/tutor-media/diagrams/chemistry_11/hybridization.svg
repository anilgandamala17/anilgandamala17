<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .orbital-pure { fill: rgba(96, 165, 250, 0.4); stroke: #3b82f6; stroke-width: 1; }
      .orbital-hybrid { fill: rgba(74, 222, 128, 0.6); stroke: #22c55e; stroke-width: 1.5; }
      .arrow { stroke: #fcd34d; stroke-width: 2; fill: none; }
      .sub-label { fill: #4ade80; font-size: 11px; font-weight: bold; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">sp³ Hybridization: Combining Orbitals</text>
    
    <!-- Pure Orbitals -->
    <g transform="translate(40, 100)">
      <circle cx="0" cy="0" r="15" class="orbital-pure" />
      <text x="0" y="30" class="label" font-size="10" text-anchor="middle">2s</text>
      <text x="25" y="5" class="label">+</text>
    </g>

    <g transform="translate(100, 100)">
      <ellipse cx="0" cy="0" rx="20" ry="10" class="orbital-pure" />
      <ellipse cx="0" cy="0" rx="10" ry="20" class="orbital-pure" />
      <text x="0" y="40" class="label" font-size="10" text-anchor="middle">2pₓ, 2pᵧ, 2pᶻ</text>
    </g>

    <!-- Transition Arrow -->
    <path d="M 160 100 L 200 100" class="arrow" marker-end="url(#arrowhead)" />
    <text x="180" y="85" fill="#fcd34d" font-size="9" text-anchor="middle">Mixing</text>

    <!-- Hybrid Orbitals -->
    <g transform="translate(300, 110)">
      <g transform="rotate(0)">
        <path d="M 2,0 Q 25,15 45,0 Q 25,-15 2,0 Z" class="orbital-hybrid" />
      </g>
      <g transform="rotate(109.5)">
        <path d="M 2,0 Q 25,15 45,0 Q 25,-15 2,0 Z" class="orbital-hybrid" />
      </g>
      <g transform="rotate(219)">
        <path d="M 2,0 Q 25,15 45,0 Q 25,-15 2,0 Z" class="orbital-hybrid" />
      </g>
      <g transform="rotate(328.5)">
        <path d="M 2,0 Q 25,15 45,0 Q 25,-15 2,0 Z" class="orbital-hybrid" />
      </g>
      <circle cx="0" cy="0" r="5" fill="#f87171" />
      <text x="0" y="75" class="sub-label">Four sp³ Orbitals</text>
      <text x="0" y="90" fill="#94a3b8" font-size="8" text-anchor="middle">(Equivalent Energy & Shape)</text>
    </g>

    <text x="200" y="240" text-anchor="middle" fill="#93c5fd" font-size="10">Hybrids are formed to allow for stronger covalent bonding</text>
  </g>
</svg>