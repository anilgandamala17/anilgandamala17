<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .particle-s { fill: #60a5fa; stroke: #2563eb; }
      .particle-l { fill: #4ade80; stroke: #16a34a; }
      .particle-g { fill: #f87171; stroke: #dc2626; }
      .box { fill: none; stroke: #94a3b8; stroke-width: 1; opacity: 0.5; }
      .arrow { stroke: #fcd34d; stroke-width: 2; fill: none; }
      .sub-label { fill: #fcd34d; font-size: 11px; text-anchor: middle; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Entropy (S): Concept of Disorder</text>
    
    <!-- Solid -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="80" height="80" class="box" />
      <g transform="translate(15, 15)">
        <circle cx="0" cy="0" r="4" class="particle-s" /> <circle cx="15" cy="0" r="4" class="particle-s" /> <circle cx="30" cy="0" r="4" class="particle-s" /> <circle cx="45" cy="0" r="4" class="particle-s" />
        <circle cx="0" cy="15" r="4" class="particle-s" /> <circle cx="15" cy="15" r="4" class="particle-s" /> <circle cx="30" cy="15" r="4" class="particle-s" /> <circle cx="45" cy="15" r="4" class="particle-s" />
        <circle cx="0" cy="30" r="4" class="particle-s" /> <circle cx="15" cy="30" r="4" class="particle-s" /> <circle cx="30" cy="30" r="4" class="particle-s" /> <circle cx="45" cy="30" r="4" class="particle-s" />
        <circle cx="0" cy="45" r="4" class="particle-s" /> <circle cx="15" cy="45" r="4" class="particle-s" /> <circle cx="30" cy="45" r="4" class="particle-s" /> <circle cx="45" cy="45" r="4" class="particle-s" />
      </g>
      <text x="40" y="100" class="sub-label">Solid</text>
      <text x="40" y="115" fill="#94a3b8" font-size="8" text-anchor="middle">Low Entropy</text>
    </g>

    <!-- Liquid -->
    <g transform="translate(150, 80)">
      <rect x="0" y="0" width="80" height="80" class="box" />
      <circle cx="20" cy="20" r="4" class="particle-l" /> <circle cx="50" cy="15" r="4" class="particle-l" />
      <circle cx="30" cy="45" r="4" class="particle-l" /> <circle cx="65" cy="55" r="4" class="particle-l" />
      <circle cx="15" cy="65" r="4" class="particle-l" /> <circle cx="45" cy="70" r="4" class="particle-l" />
      <text x="40" y="100" class="sub-label">Liquid</text>
    </g>

    <!-- Gas -->
    <g transform="translate(280, 80)">
      <rect x="0" y="0" width="80" height="80" class="box" />
      <circle cx="10" cy="10" r="4" class="particle-g" /> <circle cx="60" cy="25" r="4" class="particle-g" />
      <circle cx="25" cy="60" r="4" class="particle-g" /> <circle cx="70" cy="70" r="4" class="particle-g" />
      <text x="40" y="100" class="sub-label">Gas</text>
      <text x="40" y="115" fill="#94a3b8" font-size="8" text-anchor="middle">High Entropy</text>
    </g>

    <!-- Increase Arrow -->
    <path d="M 20,200 L 360,200" class="arrow" marker-end="url(#arrowhead)" />
    <text x="190" y="190" fill="#fcd34d" font-size="12" text-anchor="middle">Increasing Entropy (ΔS &gt; 0)</text>
    <text x="190" y="215" fill="#93c5fd" font-size="9" text-anchor="middle">Systems naturally trend toward disorder</text>
  </g>
</svg>