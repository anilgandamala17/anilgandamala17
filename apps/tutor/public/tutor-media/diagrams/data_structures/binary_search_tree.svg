<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Binary Search Tree (BST)</text>
  <!-- Root: 50 -->
  <circle cx="200" cy="50" r="20" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2"/>
  <text x="200" y="55" font-size="12" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">50</text>
  <text x="200" y="38" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">root</text>
  <!-- Level 2: 30, 70 -->
  <line x1="183" y1="65" x2="127" y2="105" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <line x1="217" y1="65" x2="273" y2="105" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="18" fill="rgba(147,197,253,0.2)" stroke="#93c5fd" stroke-width="2"/>
  <text x="110" y="125" font-size="12" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">30</text>
  <circle cx="290" cy="120" r="18" fill="rgba(147,197,253,0.2)" stroke="#93c5fd" stroke-width="2"/>
  <text x="290" y="125" font-size="12" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">70</text>
  <!-- Level 3: 20, 40, 60, 80 -->
  <line x1="95" y1="134" x2="60" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="125" y1="134" x2="160" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="275" y1="134" x2="240" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="305" y1="134" x2="340" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="45" cy="182" r="16" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="1.5"/>
  <text x="45" y="187" font-size="11" fill="#86efac" text-anchor="middle" font-family="monospace">20</text>
  <circle cx="175" cy="182" r="16" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="1.5"/>
  <text x="175" y="187" font-size="11" fill="#86efac" text-anchor="middle" font-family="monospace">40</text>
  <circle cx="225" cy="182" r="16" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="1.5"/>
  <text x="225" y="187" font-size="11" fill="#86efac" text-anchor="middle" font-family="monospace">60</text>
  <circle cx="355" cy="182" r="16" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="1.5"/>
  <text x="355" y="187" font-size="11" fill="#86efac" text-anchor="middle" font-family="monospace">80</text>
  <!-- Level 4 leaves -->
  <line x1="35" y1="196" x2="22" y2="222" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="18" cy="232" r="12" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1"/>
  <text x="18" y="236" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">15</text>
  <line x1="55" y1="196" x2="68" y2="222" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="72" cy="232" r="12" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1"/>
  <text x="72" y="236" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">25</text>
  <!-- BST property label -->
  <rect x="20" y="252" width="360" height="22" rx="3" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="267" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">BST Property: Left subtree &lt; Node &lt; Right subtree</text>
  <!-- Search path highlight -->
  <text x="340" y="60" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Search 60:</text>
  <text x="340" y="72" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">50→70→60</text>
  <text x="340" y="84" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">O(log n)</text>
</svg>
