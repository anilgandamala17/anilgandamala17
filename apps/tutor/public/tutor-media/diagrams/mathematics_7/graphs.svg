<rect x="290" y="500" width="20" height="50" fill="#86efac" opacity="0.7"/>
<rect x="315" y="515" width="20" height="35" fill="#ffd54f" opacity="0.7"/>
<rect x="360" y="495" width="20" height="55" fill="#86efac" opacity="0.7"/>
<rect x="385" y="505" width="20" height="45" fill="#ffd54f" opacity="0.7"/>
<rect x="430" y="505" width="20" height="45" fill="#86efac" opacity="0.7"/>
<rect x="455" y="520" width="20" height="30" fill="#ffd54f" opacity="0.7"/>
<line x1="210" y1="550" x2="540" y2="550" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
<rect x="545" y="498" width="14" height="10" fill="#86efac" opacity="0.8"/>
<text x="563" y="508" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Boys</text>
<rect x="545" y="516" width="14" height="10" fill="#ffd54f" opacity="0.8"/>
<text x="563" y="526" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.9)">Girls</text>
</svg>