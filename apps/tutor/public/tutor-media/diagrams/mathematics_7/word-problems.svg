<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Fractions and Decimals — Word Problems</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="78" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">Strategy: Read → Identify → Set up expression → Solve → Check</text>

<rect x="20" y="90" width="760" height="98" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="112" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Problem 1: Sharing (Fractions)</text>
<text x="400" y="134" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">A pizza is cut into 8 slices. John ate 3/8 and Mary ate 2/8. What fraction is left?</text>
<text x="400" y="155" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Solution: Total eaten = 3/8 + 2/8 = 5/8</text>
<text x="400" y="175" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Left = 1 − 5/8 = 8/8 − 5/8 = 3/8 of the pizza</text>

<rect x="20" y="200" width="760" height="98" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="222" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Problem 2: Shopping (Fractions)</text>
<text x="400" y="244" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">A shirt costs ₹480 and is sold at 1/4 discount. What is the selling price?</text>
<text x="400" y="264" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Discount = 1/4 × ₹480 = ₹120</text>
<text x="400" y="284" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Selling Price = ₹480 − ₹120 = ₹360</text>

<rect x="20" y="310" width="760" height="98" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="332" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Problem 3: Distance (Decimals)</text>
<text x="400" y="354" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">A car travels 4.5 km in 0.5 hours. What is the speed?</text>
<text x="400" y="374" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Speed = Distance ÷ Time = 4.5 ÷ 0.5 = 9 km/h</text>
<text x="400" y="394" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Speed = 9 km/h</text>

<rect x="20" y="420" width="370" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="442" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Key Phrases to Identify</text>
<text x="205" y="464" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">"of" → Multiply (1/4 of 80 = 20)</text>
<text x="205" y="484" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">"shared equally" → Divide</text>
<text x="205" y="504" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">"how much left" → Subtract</text>
<text x="205" y="524" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">"total/combined" → Add</text>

<rect x="410" y="420" width="370" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="442" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Common Mistakes to Avoid</text>
<text x="595" y="464" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f48fb1" text-anchor="middle">Don't add unlike fractions directly</text>
<text x="595" y="484" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Always check units are the same</text>
<text x="595" y="504" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Verify: Is the answer reasonable?</text>
<text x="595" y="524" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Re-read question after solving</text>
</svg>