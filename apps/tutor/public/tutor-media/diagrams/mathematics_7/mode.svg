<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Mode</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="78" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle">Mode = The value that appears MOST FREQUENTLY in the data set</text>
<rect x="150" y="86" width="500" height="38" fill="none" stroke="#ffd54f" stroke-width="1.5" rx="6"/>
<text x="400" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">No formula — count frequencies and find the highest</text>

<rect x="20" y="135" width="370" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="158" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Example 1: Unimodal</text>
<text x="205" y="180" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Data: 3, 5, 7, 5, 2, 5, 8, 3, 5</text>
<text x="205" y="200" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">5 appears 4 times (most frequent)</text>
<text x="205" y="220" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Mode = 5</text>
<text x="205" y="241" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">One mode = Unimodal distribution</text>

<rect x="410" y="135" width="370" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="158" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Example 2: Bimodal</text>
<text x="595" y="180" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Data: 4, 6, 4, 9, 6, 8, 4, 6</text>
<text x="595" y="200" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">4 appears 3×, 6 appears 3×</text>
<text x="595" y="220" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Mode = 4 AND 6</text>
<text x="595" y="241" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Two modes = Bimodal distribution</text>

<line x1="20" y1="263" x2="780" y2="263" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="288" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">Types and Special Cases</text>

<rect x="20" y="300" width="235" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="137" y="322" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">No Mode</text>
<text x="137" y="344" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">All values appear once</text>
<text x="137" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1, 2, 3, 4, 5, 6</text>
<text x="137" y="384" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f48fb1" text-anchor="middle">No mode exists</text>
<text x="137" y="404" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Frequency equally spread</text>
<text x="137" y="420" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">→ uniform distribution</text>

<rect x="283" y="300" width="234" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="322" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Grouped Data Mode</text>
<text x="400" y="344" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Class interval with highest frequency</text>
<text x="400" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">is called Modal Class</text>
<text x="400" y="384" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Modal class: 30-40</text>
<text x="400" y="404" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(highest tally in that class)</text>
<text x="400" y="420" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">→ used in frequency tables</text>

<rect x="545" y="300" width="235" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="662" y="322" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Real Applications</text>
<text x="662" y="344" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Most popular shoe size</text>
<text x="662" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Most common blood group</text>
<text x="662" y="384" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Most watched TV show</text>
<text x="662" y="404" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Most visited webpage</text>
<text x="662" y="420" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Best for categorical data</text>

<line x1="20" y1="443" x2="780" y2="443" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="468" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Comparing Mean, Median and Mode</text>
<text x="400" y="494" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Mean: uses all values, affected by outliers | Median: middle value, not affected by outliers</text>
<text x="400" y="518" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Mode: most frequent, best for categories | All three are measures of central tendency</text>
<text x="400" y="555" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Data: 2,3,3,4,5 → Mean=3.4 | Median=3 | Mode=3</text>
</svg>