<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Fraction ↔ Decimal Conversion</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>

<text x="400" y="78" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Fraction → Decimal</text>

<rect x="20" y="88" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Method: Long Division</text>
<text x="205" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Divide numerator by denominator</text>
<text x="205" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">3/4 = 3 ÷ 4 = 0.75</text>
<text x="205" y="172" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1/3 = 1 ÷ 3 = 0.333... (recurring)</text>
<text x="205" y="193" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Terminate or recur — two possible outcomes</text>

<rect x="410" y="88" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Common Conversions</text>
<text x="595" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1/2 = 0.5  |  1/4 = 0.25  |  3/4 = 0.75</text>
<text x="595" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1/5 = 0.2  |  2/5 = 0.4  |  3/5 = 0.6</text>
<text x="595" y="172" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1/8 = 0.125  |  3/8 = 0.375</text>
<text x="595" y="193" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">1/3 = 0.3̄  |  2/3 = 0.6̄  |  1/7 = 0.142857...</text>

<line x1="20" y1="220" x2="780" y2="220" stroke="#86efac" stroke-width="1"/>
<text x="400" y="244" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Decimal → Fraction</text>

<rect x="20" y="255" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="277" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Terminating Decimal</text>
<text x="205" y="299" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">0.75 = 75/100 = 3/4</text>
<text x="205" y="319" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">0.125 = 125/1000 = 1/8</text>
<text x="205" y="339" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Denominator = 10ⁿ (n decimal places)</text>
<text x="205" y="360" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Simplify the fraction afterwards</text>

<rect x="410" y="255" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="277" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Recurring Decimal</text>
<text x="595" y="299" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Let x = 0.333...</text>
<text x="595" y="319" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">10x = 3.333...</text>
<text x="595" y="339" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">10x − x = 3 → 9x = 3 → x = 1/3</text>
<text x="595" y="360" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Multiply by 10 to shift recurring part</text>

<line x1="20" y1="388" x2="780" y2="388" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="412" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">Types of Decimals</text>

<rect x="20" y="425" width="235" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="137" y="447" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Terminating</text>
<text x="137" y="467" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Finite decimal places</text>
<text x="137" y="487" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">0.5, 0.25, 0.125</text>
<text x="137" y="507" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Denom: only 2s and 5s</text>
<text x="137" y="527" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Rational numbers</text>

<rect x="283" y="425" width="234" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="447" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Recurring</text>
<text x="400" y="467" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Repeating pattern forever</text>
<text x="400" y="487" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">0.333..., 0.142857...</text>
<text x="400" y="507" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Always a ratio p/q</text>
<text x="400" y="527" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Rational numbers</text>

<rect x="545" y="425" width="235" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="662" y="447" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Non-Terminating Non-Recurring</text>
<text x="662" y="467" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">No pattern, infinite digits</text>
<text x="662" y="487" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">π = 3.14159... | √2 = 1.41421...</text>
<text x="662" y="507" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f48fb1" text-anchor="middle">Cannot be written as p/q</text>
<text x="662" y="527" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">Irrational numbers</text>
</svg>