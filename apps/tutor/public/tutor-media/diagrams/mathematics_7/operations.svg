<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Integer Operations</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>

<rect x="20" y="68" width="235" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="137" y="92" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Addition Rules</text>
<text x="137" y="114" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(+) + (+) = Positive</text>
<text x="137" y="133" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−) + (−) = Negative</text>
<text x="137" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(+) + (−) = Difference</text>
<text x="137" y="171" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Keep sign of larger |value|</text>

<rect x="282" y="68" width="235" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="399" y="92" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Subtraction Rule</text>
<text x="399" y="114" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">a − b = a + (−b)</text>
<text x="399" y="133" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">5 − 8 = 5 + (−8) = −3</text>
<text x="399" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Keep → Change → Flip</text>
<text x="399" y="171" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Change subtraction to addition</text>

<rect x="544" y="68" width="235" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="661" y="92" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Sign Rules ×÷</text>
<text x="661" y="114" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">(+) × (+) = +</text>
<text x="661" y="133" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">(−) × (−) = +</text>
<text x="661" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f48fb1" text-anchor="middle">(+) × (−) = −</text>
<text x="661" y="171" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Same signs→+, Different signs→−</text>

<line x1="20" y1="212" x2="780" y2="212" stroke="#86efac" stroke-width="1"/>
<text x="400" y="235" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">Worked Examples</text>

<rect x="20" y="248" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="272" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Addition &amp; Subtraction</text>
<text x="205" y="297" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−7) + (+3) = −4</text>
<text x="205" y="320" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−5) − (−2) = −5 + 2 = −3</text>
<text x="205" y="343" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(+8) + (−11) = −3</text>
<text x="205" y="366" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−4) + (−6) = −10</text>
<text x="205" y="389" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">On number line: + moves right, − moves left</text>

<rect x="410" y="248" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="272" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Multiplication &amp; Division</text>
<text x="595" y="297" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−4) × (−3) = +12</text>
<text x="595" y="320" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(+6) × (−5) = −30</text>
<text x="595" y="343" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−18) ÷ (+3) = −6</text>
<text x="595" y="366" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−24) ÷ (−4) = +6</text>
<text x="595" y="389" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Division follows same sign rules as multiplication</text>

<line x1="20" y1="417" x2="780" y2="417" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="445" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Memory Trick for Signs</text>
<text x="400" y="472" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Good × Good = Good (+×+ = +) | Bad × Bad = Good (−×− = +)</text>
<text x="400" y="498" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Good × Bad = Bad (+×− = −) | Bad × Good = Bad (−×+ = −)</text>
<text x="400" y="540" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">BODMAS applies to integers: Brackets → Orders → Division → Multiplication → Addition → Subtraction</text>
</svg>