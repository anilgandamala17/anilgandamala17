<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<!-- Integers: Negative Numbers -->
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Integers: Negative Numbers</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>

<!-- Number line -->
<line x1="50" y1="190" x2="750" y2="190" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
<polygon points="750,190 740,185 740,195" fill="rgba(255,255,255,0.6)"/>
<polygon points="50,190 60,185 60,195" fill="rgba(255,255,255,0.6)"/>

<!-- Tick marks and labels -->
<line x1="100" y1="183" x2="100" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="100" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle">-5</text>
<line x1="162" y1="183" x2="162" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="162" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle">-4</text>
<line x1="224" y1="183" x2="224" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="224" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle">-3</text>
<line x1="286" y1="183" x2="286" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="286" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle">-2</text>
<line x1="348" y1="183" x2="348" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="348" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle">-1</text>
<line x1="410" y1="178" x2="410" y2="202" stroke="#ffd54f" stroke-width="2.5"/>
<text x="410" y="220" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">0</text>
<line x1="472" y1="183" x2="472" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="472" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">+1</text>
<line x1="534" y1="183" x2="534" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="534" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">+2</text>
<line x1="596" y1="183" x2="596" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="596" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">+3</text>
<line x1="658" y1="183" x2="658" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="658" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">+4</text>
<line x1="720" y1="183" x2="720" y2="197" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
<text x="720" y="215" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">+5</text>

<text x="230" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f48fb1" text-anchor="middle">← Negative numbers</text>
<text x="590" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Positive numbers →</text>
<text x="400" y="245" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Integers: … -3, -2, -1, 0, +1, +2, +3, …</text>

<line x1="20" y1="265" x2="780" y2="265" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

<!-- 3 boxes -->
<rect x="20" y="278" width="240" height="150" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" rx="8"/>
<text x="140" y="302" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Real-World Examples</text>
<text x="140" y="326" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−5°C → Below zero temp</text>
<text x="140" y="348" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−200m → Below sea level</text>
<text x="140" y="370" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−₹500 → Bank overdraft</text>
<text x="140" y="392" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Floor B2 in a building</text>

<rect x="280" y="278" width="240" height="150" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" rx="8"/>
<text x="400" y="302" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Opposite Integers</text>
<text x="400" y="326" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−3 and +3 are opposites</text>
<text x="400" y="348" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(−3) + (+3) = 0</text>
<text x="400" y="370" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Called Zero Pair</text>
<text x="400" y="392" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">|−7| = |+7| = 7</text>

<rect x="540" y="278" width="240" height="150" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" rx="8"/>
<text x="660" y="302" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Ordering Integers</text>
<text x="660" y="326" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−5 &lt; −2 &lt; 0 &lt; 3 &lt; 7</text>
<text x="660" y="348" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Right = greater value</text>
<text x="660" y="370" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Left = smaller value</text>
<text x="660" y="392" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Every negative &lt; 0</text>

<line x1="20" y1="448" x2="780" y2="448" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="475" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Absolute Value |n| = distance from zero (always positive)</text>
<text x="400" y="505" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.6)" text-anchor="middle">Negative numbers were invented to represent quantities below a reference point</text>
<text x="400" y="540" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Set of Integers: ℤ = { …, −3, −2, −1, 0, 1, 2, 3, … }</text>
</svg>