<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:13px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2}
    </style>
    <!-- Fraction style via rect + line not possible, using text/lines -->
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="20" text-anchor="middle" class="title">The Quadratic Formula</text>
  <text x="210" y="32" text-anchor="middle" class="sub">For ax² + bx + c = 0  (a ≠ 0)</text>

  <!-- Big formula display -->
  <rect x="40" y="40" width="340" height="52" rx="8" fill="#1a4030" stroke="#4ade80" stroke-width="2"/>
  <text x="210" y="58" text-anchor="middle" fill="#ffd700" font-size="11">Derivation by Completing the Square:</text>
  <text x="210" y="80" text-anchor="middle" fill="#7fffd4" font-size="20" font-weight="bold">x = −b ± √(b²− 4ac)</text>
  <!-- Fraction bar -->
  <line x1="132" y1="84" x2="288" y2="84" stroke="#7fffd4" stroke-width="2"/>
  <text x="210" y="100" text-anchor="middle" fill="#7fffd4" font-size="18" font-weight="bold">2a</text>

  <!-- Derivation steps (compressed) -->
  <text x="16" y="118" fill="#f0e68c" font-size="10" font-weight="bold">Derivation:</text>
  <text x="16" y="132" fill="#e0ffe0" font-size="10">ax² + bx + c = 0  →  x² + (b/a)x = −c/a</text>
  <text x="16" y="146" fill="#e0ffe0" font-size="10">→ x² + (b/a)x + (b/2a)² = −c/a + (b/2a)²  [Complete the square]</text>
  <text x="16" y="160" fill="#e0ffe0" font-size="10">→ (x + b/2a)² = (b² − 4ac)/(4a²)</text>
  <text x="16" y="174" fill="#7fffd4" font-size="10">→ x + b/2a = ±√(b²−4ac) / 2a  →  x = [−b ± √(b²−4ac)] / 2a</text>

  <!-- Discriminant section -->
  <rect x="10" y="182" width="400" height="60" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="210" y="198" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Discriminant: D = b² − 4ac</text>
  <text x="60" y="214" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">D &gt; 0</text>
  <text x="60" y="226" text-anchor="middle" fill="#e0ffe0" font-size="9">2 distinct real roots</text>
  <text x="60" y="238" text-anchor="middle" fill="#aad4ff" font-size="9">x₁ ≠ x₂</text>
  <line x1="120" y1="188" x2="120" y2="238" stroke="#4ade80" stroke-width="0.5"/>
  <text x="210" y="214" text-anchor="middle" fill="#ffd700" font-size="10" font-weight="bold">D = 0</text>
  <text x="210" y="226" text-anchor="middle" fill="#e0ffe0" font-size="9">2 equal real roots</text>
  <text x="210" y="238" text-anchor="middle" fill="#aad4ff" font-size="9">x = −b/2a</text>
  <line x1="300" y1="188" x2="300" y2="238" stroke="#4ade80" stroke-width="0.5"/>
  <text x="360" y="214" text-anchor="middle" fill="#ff6b6b" font-size="10" font-weight="bold">D &lt; 0</text>
  <text x="360" y="226" text-anchor="middle" fill="#e0ffe0" font-size="9">No real roots</text>
  <text x="360" y="238" text-anchor="middle" fill="#aad4ff" font-size="9">(Complex roots)</text>

  <!-- Worked example -->
  <rect x="10" y="250" width="400" height="44" rx="5" class="box"/>
  <text x="210" y="266" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Example: 2x² − 5x + 3 = 0</text>
  <text x="210" y="280" text-anchor="middle" fill="#e0ffe0" font-size="10">D = 25 − 24 = 1  →  x = (5 ± 1)/4  →  x = 3/2  or  x = 1</text>
  <text x="210" y="292" text-anchor="middle" fill="#ff9f43" font-size="10">Sum = 5/2 = −b/a ✓   Product = 3/2 = c/a ✓</text>
  </g>
</svg>
