<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:12px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="20" text-anchor="middle" class="title">Quadratic Factorization</text>
  <text x="210" y="32" text-anchor="middle" class="sub">ax² + bx + c = a(x − α)(x − β)   where α, β are zeros</text>

  <!-- Main identity -->
  <rect x="10" y="40" width="400" height="26" rx="6" fill="#1a4030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="210" y="57" text-anchor="middle" fill="#7fffd4" font-size="13" font-weight="bold">Find p + q = b/a  and  p × q = c/a  →  Factors: (x+p)(x+q)</text>

  <!-- Step-by-step -->
  <text x="16" y="80" fill="#f0e68c" font-size="11" font-weight="bold">Step-by-Step: Factorize 6x² + 11x − 10</text>
  <!-- Step 1 -->
  <rect x="10" y="86" width="400" height="26" rx="4" fill="#1a2a3a" stroke="#4ade80" stroke-width="0.8"/>
  <text x="18" y="100" fill="#ffd700" font-size="10" font-weight="bold">Step 1:</text>
  <text x="64" y="100" fill="#e0ffe0" font-size="10">Multiply a × c = 6 × (−10) = −60</text>
  <!-- Step 2 -->
  <rect x="10" y="116" width="400" height="26" rx="4" fill="#1a2a3a" stroke="#4ade80" stroke-width="0.8"/>
  <text x="18" y="130" fill="#ffd700" font-size="10" font-weight="bold">Step 2:</text>
  <text x="64" y="130" fill="#e0ffe0" font-size="10">Find two numbers: p + q = 11 (=b) and p × q = −60</text>
  <text x="64" y="138" fill="#7fffd4" font-size="9">→  p = 15, q = −4    (15 + (−4) = 11, 15 × (−4) = −60) ✓</text>
  <!-- Step 3 -->
  <rect x="10" y="146" width="400" height="38" rx="4" fill="#1a2a3a" stroke="#4ade80" stroke-width="0.8"/>
  <text x="18" y="160" fill="#ffd700" font-size="10" font-weight="bold">Step 3:</text>
  <text x="64" y="160" fill="#e0ffe0" font-size="10">Split: 6x² + 15x − 4x − 10</text>
  <text x="64" y="174" fill="#e0ffe0" font-size="10">= 3x(2x + 5) − 2(2x + 5)</text>
  <text x="64" y="178" fill="#ff9f43" font-size="11" font-weight="bold">= (3x − 2)(2x + 5)    Zeros: x = 2/3 and x = −5/2</text>

  <!-- Visual box diagram -->
  <rect x="10" y="196" width="130" height="96" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="75" y="212" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Box Method</text>
  <!-- 2x2 grid -->
  <line x1="10" y1="226" x2="140" y2="226" stroke="#4ade80" stroke-width="0.8"/>
  <line x1="10" y1="256" x2="140" y2="256" stroke="#4ade80" stroke-width="0.8"/>
  <line x1="75" y1="218" x2="75" y2="286" stroke="#4ade80" stroke-width="0.8"/>
  <text x="42" y="244" text-anchor="middle" fill="#7fffd4" font-size="12">6x²</text>
  <text x="108" y="244" text-anchor="middle" fill="#7fffd4" font-size="12">15x</text>
  <text x="42" y="274" text-anchor="middle" fill="#7fffd4" font-size="12">−4x</text>
  <text x="108" y="274" text-anchor="middle" fill="#7fffd4" font-size="12">−10</text>
  <text x="75" y="290" text-anchor="middle" fill="#aad4ff" font-size="9">GCF rows/cols</text>

  <!-- Identity box -->
  <rect x="150" y="196" width="260" height="96" rx="5" class="box"/>
  <text x="280" y="212" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Key Quadratic Identities</text>
  <text x="160" y="228" fill="#e0ffe0" font-size="10">(a+b)² = a² + 2ab + b²</text>
  <text x="160" y="242" fill="#e0ffe0" font-size="10">(a−b)² = a² − 2ab + b²</text>
  <text x="160" y="256" fill="#e0ffe0" font-size="10">(a+b)(a−b) = a² − b²</text>
  <text x="160" y="270" fill="#7fffd4" font-size="10">(x+a)(x+b) = x²+(a+b)x+ab</text>
  <text x="160" y="284" fill="#ff9f43" font-size="10">Perfect sq: b²−4ac = 0</text>
  </g>
</svg>
