<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:13px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2;rx:5}
      .step{fill:#ffd700;font-size:11px;font-weight:bold}
      .red{fill:#ff6b6b;font-size:11px}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="22" text-anchor="middle" class="title">Division Algorithm for Polynomials</text>
  <text x="210" y="35" text-anchor="middle" class="sub">p(x) = g(x) × q(x) + r(x)     where deg r(x) &lt; deg g(x)</text>

  <!-- Formula box -->
  <rect x="50" y="42" width="320" height="26" rx="6" fill="#1a4030" stroke="#4ade80" stroke-width="1.5"/>
  <text x="210" y="60" text-anchor="middle" fill="#7fffd4" font-size="14" font-weight="bold">Dividend = Divisor × Quotient + Remainder</text>

  <!-- Long division example -->
  <text x="20" y="85" fill="#ffd700" font-size="11" font-weight="bold">Example: Divide  x³ − 3x² + 5x − 3  by  x² − x + 1</text>

  <!-- Division layout -->
  <line x1="20" y1="92" x2="300" y2="92" stroke="#4ade80" stroke-width="1"/>
  <!-- Divisor -->
  <text x="22" y="108" fill="#ff9f43" font-size="12">x² − x + 1</text>
  <line x1="95" y1="95" x2="95" y2="260" stroke="#4ade80" stroke-width="1"/>
  <!-- Dividend -->
  <text x="100" y="108" fill="#e0ffe0" font-size="12">x³ − 3x² + 5x − 3</text>

  <!-- Step 1 -->
  <text x="100" y="124" fill="#ffd700" font-size="11">÷ x² → Quotient term: x</text>
  <text x="110" y="140" fill="#aad4ff" font-size="11">x(x²−x+1) = x³ − x² + x</text>
  <line x1="100" y1="144" x2="300" y2="144" stroke="#4ade80" stroke-width="0.8"/>
  <!-- Subtraction -->
  <text x="110" y="158" fill="#e0ffe0" font-size="11">(−) x³ − x² + x</text>
  <line x1="100" y1="162" x2="300" y2="162" stroke="#aad4ff" stroke-width="0.8" stroke-dasharray="3"/>
  <text x="110" y="176" fill="#7fffd4" font-size="11">−2x² + 4x − 3</text>

  <!-- Step 2 -->
  <text x="100" y="192" fill="#ffd700" font-size="11">÷ x² → Quotient term: −2</text>
  <text x="110" y="208" fill="#aad4ff" font-size="11">−2(x²−x+1) = −2x² + 2x − 2</text>
  <line x1="100" y1="212" x2="310" y2="212" stroke="#4ade80" stroke-width="0.8"/>
  <text x="110" y="226" fill="#e0ffe0" font-size="11">(−) −2x² + 2x − 2</text>
  <line x1="100" y1="230" x2="310" y2="230" stroke="#aad4ff" stroke-width="0.8" stroke-dasharray="3"/>
  <text x="110" y="244" fill="#ff9f43" font-size="12" font-weight="bold">Remainder: 2x − 1</text>

  <!-- Summary -->
  <rect x="310" y="48" width="102" height="100" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="361" y="65" text-anchor="middle" fill="#f0e68c" font-size="10" font-weight="bold">RESULT</text>
  <text x="318" y="80" fill="#ffd700" font-size="9">Quotient:</text>
  <text x="318" y="94" fill="#7fffd4" font-size="10">q(x) = x − 2</text>
  <text x="318" y="110" fill="#ffd700" font-size="9">Remainder:</text>
  <text x="318" y="124" fill="#ff9f43" font-size="10">r(x) = 2x − 1</text>
  <text x="318" y="140" fill="#aad4ff" font-size="9">deg r &lt; deg g ✓</text>

  <!-- Verification box -->
  <rect x="20" y="256" width="390" height="36" rx="5" fill="#1a3a20" stroke="#4ade80" stroke-width="1"/>
  <text x="210" y="271" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Verification: g(x)·q(x) + r(x) = p(x)</text>
  <text x="210" y="285" text-anchor="middle" fill="#e0ffe0" font-size="10">(x²−x+1)(x−2) + (2x−1) = x³−3x²+5x−3  ✓</text>
  </g>
</svg>
