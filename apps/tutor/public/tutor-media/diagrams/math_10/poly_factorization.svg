<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:12px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2}
      .step{fill:#ffd700;font-size:11px;font-weight:bold}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="22" text-anchor="middle" class="title">Polynomial Factorization</text>
  <text x="210" y="35" text-anchor="middle" class="sub">Splitting the middle term &amp; using known identities</text>

  <!-- Method 1: Splitting middle term -->
  <rect x="10" y="44" width="195" height="130" rx="5" class="box"/>
  <text x="107" y="60" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Method 1: Split Middle Term</text>
  <text x="20" y="76" fill="#ffd700" font-size="10">Factorize: x² + 5x + 6</text>
  <text x="20" y="90" fill="#e0ffe0" font-size="10">Find a, b: a+b=5, a×b=6</text>
  <text x="20" y="104" fill="#7fffd4" font-size="10">a = 2, b = 3  ✓</text>
  <text x="20" y="118" fill="#e0ffe0" font-size="10">= x² + 2x + 3x + 6</text>
  <text x="20" y="132" fill="#e0ffe0" font-size="10">= x(x+2) + 3(x+2)</text>
  <text x="20" y="148" fill="#ff9f43" font-size="12" font-weight="bold">= (x+2)(x+3)</text>
  <text x="20" y="164" fill="#aad4ff" font-size="9">Zeros: x = −2 and x = −3</text>

  <!-- Method 2: Using identities -->
  <rect x="215" y="44" width="195" height="130" rx="5" class="box"/>
  <text x="312" y="60" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Method 2: Algebraic Identities</text>
  <text x="225" y="76" fill="#ffd700" font-size="10">a²−b² = (a+b)(a−b)</text>
  <text x="225" y="90" fill="#7fffd4" font-size="10">x²−9 = (x+3)(x−3)</text>
  <line x1="225" y1="97" x2="400" y2="97" stroke="#4ade80" stroke-width="0.5"/>
  <text x="225" y="110" fill="#ffd700" font-size="10">(a+b)² = a²+2ab+b²</text>
  <text x="225" y="124" fill="#7fffd4" font-size="10">x²+6x+9 = (x+3)²</text>
  <line x1="225" y1="131" x2="400" y2="131" stroke="#4ade80" stroke-width="0.5"/>
  <text x="225" y="144" fill="#ffd700" font-size="10">(a−b)² = a²−2ab+b²</text>
  <text x="225" y="158" fill="#7fffd4" font-size="10">4x²−12x+9 = (2x−3)²</text>
  <text x="225" y="172" fill="#aad4ff" font-size="9">Perfect square trinomials</text>

  <!-- Factor-Zero connection -->
  <rect x="10" y="182" width="400" height="50" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="210" y="198" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Factor-Zero Theorem</text>
  <text x="210" y="212" text-anchor="middle" fill="#e0ffe0" font-size="10">(x − a) is a factor of p(x)  ⟺  p(a) = 0  (a is a zero)</text>
  <text x="210" y="226" text-anchor="middle" fill="#7fffd4" font-size="10">Check: p(−2) = (−2)²+5(−2)+6 = 4−10+6 = 0  ✓</text>

  <!-- Cubic example -->
  <rect x="10" y="240" width="400" height="52" rx="5" class="box"/>
  <text x="210" y="256" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Cubic: x³ − 6x² + 11x − 6</text>
  <text x="210" y="270" text-anchor="middle" fill="#e0ffe0" font-size="10">p(1)=0, p(2)=0, p(3)=0  →  factors: (x−1)(x−2)(x−3)</text>
  <text x="210" y="284" text-anchor="middle" fill="#ff9f43" font-size="10">Use trial: test x = 1, 2, 3... until p(a) = 0, then divide</text>
  </g>
</svg>
