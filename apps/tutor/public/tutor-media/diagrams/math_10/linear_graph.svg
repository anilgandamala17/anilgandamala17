<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .axis{stroke:#4ade80;stroke-width:1.5;fill:none}
      .l1{stroke:#ff9f43;stroke-width:2;fill:none}
      .l2{stroke:#7fffd4;stroke-width:2;fill:none}
      .l3{stroke:#ff6b6b;stroke-width:2;fill:none;stroke-dasharray:4}
      .hl{fill:#ffd700;font-size:11px;font-weight:bold}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="20" text-anchor="middle" class="title">Graphical Method — Pair of Linear Equations</text>
  <text x="210" y="32" text-anchor="middle" class="sub">Plotting both lines on the same coordinate plane</text>

  <!-- Graph -->
  <!-- Axes -->
  <line x1="50" y1="260" x2="260" y2="260" class="axis"/>
  <line x1="150" y1="50" x2="150" y2="270" class="axis"/>
  <text x="265" y="264" fill="#4ade80" font-size="11">x</text>
  <text x="145" y="46" fill="#4ade80" font-size="11">y</text>

  <!-- Grid dots (light) -->
  <g fill="#2a5a3a" opacity="0.5">
    <circle cx="100" cy="210" r="1.5"/> <circle cx="150" cy="210" r="1.5"/> <circle cx="200" cy="210" r="1.5"/> <circle cx="250" cy="210" r="1.5"/>
    <circle cx="100" cy="160" r="1.5"/> <circle cx="150" cy="160" r="1.5"/> <circle cx="200" cy="160" r="1.5"/> <circle cx="250" cy="160" r="1.5"/>
    <circle cx="100" cy="110" r="1.5"/> <circle cx="150" cy="110" r="1.5"/> <circle cx="200" cy="110" r="1.5"/> <circle cx="250" cy="110" r="1.5"/>
  </g>

  <!-- Axis labels -->
  <text x="100" y="274" text-anchor="middle" fill="#aad4ff" font-size="9">−2</text>
  <text x="150" y="274" text-anchor="middle" fill="#aad4ff" font-size="9">0</text>
  <text x="200" y="274" text-anchor="middle" fill="#aad4ff" font-size="9">2</text>
  <text x="250" y="274" text-anchor="middle" fill="#aad4ff" font-size="9">4</text>
  <text x="136" y="264" fill="#aad4ff" font-size="9">0</text>
  <text x="136" y="214" fill="#aad4ff" font-size="9">2</text>
  <text x="136" y="164" fill="#aad4ff" font-size="9">4</text>
  <text x="136" y="114" fill="#aad4ff" font-size="9">6</text>

  <!-- Line 1: x + y = 4 → y = 4 - x  (when x=0,y=4 → 150,110; x=4,y=0 → 250,260) -->
  <line x1="70" y1="310" x2="280" y2="100" class="l1"/>
  <text x="62" y="135" fill="#ff9f43" font-size="10">x + y = 4</text>

  <!-- Line 2: x - y = 2 → y = x - 2 (when x=0,y=-2 → 150,310; x=4,y=2 → 250,210) -->
  <line x1="100" y1="310" x2="290" y2="170" class="l2"/>
  <text x="252" y="180" fill="#7fffd4" font-size="10">x − y = 2</text>

  <!-- Intersection point (3,1) → x=200+25=225?, y=260-50=235... let me recalculate -->
  <!-- scale: 25px per unit. origin at (150,260) 
       x + y = 4, x - y = 2 → 2x=6, x=3, y=1 
       x_px = 150 + 25*3 = 225, y_px = 260 - 25*1 = 235 -->
  <circle cx="225" cy="235" r="6" fill="#ff6b6b"/>
  <text x="230" y="230" fill="#ff6b6b" font-size="11" font-weight="bold">(3, 1)</text>
  <text x="230" y="244" fill="#ffd700" font-size="9">Solution!</text>

  <!-- Tick marks -->
  <line x1="100" y1="257" x2="100" y2="263" stroke="#4ade80"/>
  <line x1="200" y1="257" x2="200" y2="263" stroke="#4ade80"/>
  <line x1="250" y1="257" x2="250" y2="263" stroke="#4ade80"/>
  <line x1="147" y1="210" x2="153" y2="210" stroke="#4ade80"/>
  <line x1="147" y1="160" x2="153" y2="160" stroke="#4ade80"/>

  <!-- Right panel: 3 cases -->
  <rect x="270" y="44" width="140" height="245" rx="5" fill="#1a3a20" stroke="#4ade80" stroke-width="1.2"/>
  <text x="340" y="62" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">3 Possible Cases</text>

  <!-- Case 1 -->
  <rect x="278" y="70" width="124" height="60" rx="4" fill="#1a4030" stroke="#4ade80" stroke-width="0.8"/>
  <text x="340" y="84" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">1. Intersecting Lines</text>
  <line x1="290" y1="100" x2="370" y2="115" stroke="#ff9f43" stroke-width="1.5"/>
  <line x1="290" y1="115" x2="370" y2="100" stroke="#7fffd4" stroke-width="1.5"/>
  <text x="340" y="123" text-anchor="middle" fill="#ffd700" font-size="9">Unique Solution</text>

  <!-- Case 2 -->
  <rect x="278" y="138" width="124" height="60" rx="4" fill="#1a4030" stroke="#aad4ff" stroke-width="0.8"/>
  <text x="340" y="152" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">2. Parallel Lines</text>
  <line x1="290" y1="168" x2="370" y2="168" stroke="#ff9f43" stroke-width="1.5"/>
  <line x1="290" y1="180" x2="370" y2="180" stroke="#7fffd4" stroke-width="1.5"/>
  <text x="340" y="192" text-anchor="middle" fill="#ff6b6b" font-size="9">No Solution</text>

  <!-- Case 3 -->
  <rect x="278" y="206" width="124" height="60" rx="4" fill="#1a4030" stroke="#ffd700" stroke-width="0.8"/>
  <text x="340" y="220" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold">3. Coincident Lines</text>
  <line x1="290" y1="240" x2="370" y2="240" stroke="#ff9f43" stroke-width="3"/>
  <text x="340" y="255" text-anchor="middle" fill="#7fffd4" font-size="9">Infinite Solutions</text>

  <!-- Ratio condition -->
  <text x="340" y="278" text-anchor="middle" fill="#aad4ff" font-size="8">a₁/a₂ ≠ b₁/b₂ → intersect</text>
  <text x="340" y="288" text-anchor="middle" fill="#aad4ff" font-size="8">a₁/a₂ = b₁/b₂ ≠ c₁/c₂ →∥</text>
  </g>
</svg>
