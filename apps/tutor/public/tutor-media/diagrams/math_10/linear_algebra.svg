<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:12px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2}
      .step{fill:#ffd700;font-size:11px;font-weight:bold}
      .eq{fill:#ff9f43;font-size:12px;font-weight:bold}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="20" text-anchor="middle" class="title">Algebraic Methods — Linear Equations</text>
  <text x="210" y="32" text-anchor="middle" class="sub">Substitution · Elimination · Cross-Multiplication</text>

  <!-- Method 1: Substitution -->
  <rect x="8" y="40" width="190" height="118" rx="5" class="box"/>
  <text x="103" y="56" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Substitution Method</text>
  <text x="16" y="71" fill="#ffd700" font-size="10">System: 2x + y = 8</text>
  <text x="16" y="83" fill="#ffd700" font-size="10">          x − y = 1</text>
  <line x1="16" y1="89" x2="190" y2="89" stroke="#4ade80" stroke-width="0.5"/>
  <text x="16" y="103" fill="#aad4ff" font-size="10">From eq2: x = 1 + y</text>
  <text x="16" y="117" fill="#e0ffe0" font-size="10">Sub: 2(1+y) + y = 8</text>
  <text x="16" y="131" fill="#e0ffe0" font-size="10">→ 2 + 2y + y = 8</text>
  <text x="16" y="145" fill="#7fffd4" font-size="10">→ 3y = 6 → y = 2</text>
  <text x="16" y="153" fill="#ff9f43" font-size="11" font-weight="bold">→ x = 3, y = 2  ✓</text>

  <!-- Method 2: Elimination -->
  <rect x="207" y="40" width="205" height="118" rx="5" class="box"/>
  <text x="309" y="56" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Elimination Method</text>
  <text x="214" y="71" fill="#ffd700" font-size="10">System: 3x + 2y = 12  ···①</text>
  <text x="214" y="83" fill="#ffd700" font-size="10">           2x + 3y = 13  ···②</text>
  <line x1="214" y1="89" x2="405" y2="89" stroke="#4ade80" stroke-width="0.5"/>
  <text x="214" y="103" fill="#aad4ff" font-size="10">①×3: 9x + 6y = 36</text>
  <text x="214" y="117" fill="#aad4ff" font-size="10">②×2: 4x + 6y = 26</text>
  <line x1="214" y1="122" x2="405" y2="122" stroke="#ff9f43" stroke-width="0.8"/>
  <text x="214" y="135" fill="#e0ffe0" font-size="10">Subtract: 5x = 10 → x = 2</text>
  <text x="214" y="149" fill="#7fffd4" font-size="10">Sub: y = (12−6)/2 = 3</text>
  <text x="214" y="153" fill="#ff9f43" font-size="11" font-weight="bold">→ x = 2, y = 3  ✓</text>

  <!-- Consistency check table -->
  <rect x="8" y="166" width="404" height="60" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="210" y="182" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Consistency Condition (a₁x + b₁y + c₁ = 0 and a₂x + b₂y + c₂ = 0)</text>
  <!-- Table header -->
  <text x="70" y="196" text-anchor="middle" fill="#ffd700" font-size="10">Condition</text>
  <text x="210" y="196" text-anchor="middle" fill="#ffd700" font-size="10">Geometric Meaning</text>
  <text x="360" y="196" text-anchor="middle" fill="#ffd700" font-size="10">Solution</text>
  <line x1="8" y1="200" x2="412" y2="200" stroke="#4ade80" stroke-width="0.5"/>
  <text x="70" y="213" text-anchor="middle" fill="#e0ffe0" font-size="9">a₁/a₂ ≠ b₁/b₂</text>
  <text x="210" y="213" text-anchor="middle" fill="#e0ffe0" font-size="9">Intersecting lines</text>
  <text x="360" y="213" text-anchor="middle" fill="#7fffd4" font-size="9">Unique</text>
  <text x="70" y="222" text-anchor="middle" fill="#e0ffe0" font-size="9">a₁/a₂ = b₁/b₂ ≠ c₁/c₂</text>
  <text x="210" y="222" text-anchor="middle" fill="#e0ffe0" font-size="9">Parallel lines</text>
  <text x="360" y="222" text-anchor="middle" fill="#ff6b6b" font-size="9">None</text>

  <!-- Word problem tip -->
  <rect x="8" y="234" width="404" height="58" rx="5" class="box"/>
  <text x="210" y="250" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Formulating Word Problems</text>
  <text x="210" y="264" text-anchor="middle" fill="#e0ffe0" font-size="10">Step 1: Assign variables → Step 2: Form 2 equations → Step 3: Solve</text>
  <text x="210" y="278" text-anchor="middle" fill="#aad4ff" font-size="10">Example: "Sum of two numbers = 20, difference = 4" → x+y=20, x−y=4</text>
  <text x="210" y="290" text-anchor="middle" fill="#7fffd4" font-size="10">→ x = 12, y = 8</text>
  </g>
</svg>
