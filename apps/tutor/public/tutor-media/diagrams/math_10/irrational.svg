<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:12px;font-weight:bold}
      .red{fill:#ff6b6b;font-size:11px}
      .step{fill:#ffd700;font-size:10px;font-weight:bold}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="24" text-anchor="middle" class="title">Proving √2 is Irrational</text>
  <text x="210" y="38" text-anchor="middle" class="sub">Proof by Contradiction</text>

  <!-- Proof steps -->
  <!-- Step 1 -->
  <rect x="15" y="48" width="390" height="28" rx="5" fill="#1a3a20" stroke="#4ade80" stroke-width="1"/>
  <text x="22" y="58" class="step">ASSUME:</text>
  <text x="80" y="58" class="hl">√2 = p/q</text>
  <text x="145" y="58" class="label">(p, q integers, q≠0, HCF(p,q) = 1)</text>
  <text x="22" y="70" class="label">Squaring both sides:</text>
  <text x="145" y="70" class="hl">2 = p²/q²  →  p² = 2q²</text>

  <!-- Step 2 -->
  <rect x="15" y="84" width="390" height="28" rx="5" fill="#1a2a3a" stroke="#4ade80" stroke-width="1"/>
  <text x="22" y="94" class="step">CONCLUDE:</text>
  <text x="85" y="94" class="label">p² is even  →  p is even  →  p = 2k</text>
  <text x="22" y="106" class="label">Substituting:</text>
  <text x="100" y="106" class="hl">(2k)² = 2q²  →  4k² = 2q²  →  q² = 2k²</text>

  <!-- Step 3 -->
  <rect x="15" y="120" width="390" height="24" rx="5" fill="#1a2a3a" stroke="#4ade80" stroke-width="1"/>
  <text x="22" y="130" class="step">THEREFORE:</text>
  <text x="90" y="130" class="label">q² is even  →  q is even</text>
  <text x="22" y="138" class="red">Both p and q are even → HCF(p,q) ≥ 2</text>

  <!-- Contradiction box -->
  <rect x="15" y="150" width="390" height="28" rx="5" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="210" y="160" text-anchor="middle" fill="#ff6b6b" font-size="13" font-weight="bold">⚡ CONTRADICTION! HCF(p,q) = 1 was assumed</text>
  <text x="210" y="173" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">∴ √2 cannot be expressed as p/q  →  √2 is IRRATIONAL</text>

  <!-- Number line -->
  <line x1="20" y1="215" x2="400" y2="215" stroke="#4ade80" stroke-width="2"/>
  <text x="20" y="213" fill="#4ade80" font-size="14">|</text>
  <text x="120" y="213" fill="#4ade80" font-size="14">|</text>
  <text x="210" y="213" fill="#4ade80" font-size="14">|</text>
  <text x="310" y="213" fill="#4ade80" font-size="14">|</text>
  <text x="400" y="213" fill="#4ade80" font-size="14">|</text>
  <text x="20" y="228" text-anchor="middle" class="label">0</text>
  <text x="120" y="228" text-anchor="middle" class="label">1</text>
  <text x="210" y="228" text-anchor="middle" class="label">√2≈1.414</text>
  <text x="310" y="228" text-anchor="middle" class="label">2</text>
  <text x="400" y="228" text-anchor="middle" class="label">3</text>
  <!-- Pointer to sqrt2 -->
  <line x1="210" y1="215" x2="210" y2="205" stroke="#ff9f43" stroke-width="2"/>
  <circle cx="210" cy="215" r="4" fill="#ff9f43"/>
  <text x="210" y="200" text-anchor="middle" fill="#ff9f43" font-size="10">Non-terminating non-repeating</text>

  <!-- Key irrationals -->
  <text x="210" y="255" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="bold">Key Irrationals: √2, √3, √5, √7, π, e</text>
  <text x="210" y="272" text-anchor="middle" fill="#aad4ff" font-size="10">Rational + Irrational = Irrational</text>
  <text x="210" y="287" text-anchor="middle" fill="#aad4ff" font-size="10">Rational × Irrational (≠0) = Irrational</text>
  </g>
</svg>
