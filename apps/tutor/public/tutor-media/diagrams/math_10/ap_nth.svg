<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#0d2818}
      .title{fill:#f0e68c;font-size:14px;font-weight:bold}
      .sub{fill:#aad4ff;font-size:10px}
      .label{fill:#e0ffe0;font-size:11px}
      .hl{fill:#7fffd4;font-size:13px;font-weight:bold}
      .box{fill:#1a3a20;stroke:#4ade80;stroke-width:1.2}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="20" text-anchor="middle" class="title">AP — nth Term Formula</text>
  <text x="210" y="32" text-anchor="middle" class="sub">Arithmetic Progression: each term differs by a constant common difference d</text>

  <!-- AP sequence visualization -->
  <rect x="10" y="40" width="400" height="40" rx="6" fill="#1a4030" stroke="#4ade80" stroke-width="1.5"/>
  <!-- Sequence boxes -->
  <text x="40" y="56" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">a</text>
  <text x="40" y="72" text-anchor="middle" fill="#aad4ff" font-size="9">T₁</text>
  <text x="75" y="58" text-anchor="middle" fill="#4ade80" font-size="11">+d</text>
  <text x="110" y="56" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">a+d</text>
  <text x="110" y="72" text-anchor="middle" fill="#aad4ff" font-size="9">T₂</text>
  <text x="160" y="58" text-anchor="middle" fill="#4ade80" font-size="11">+d</text>
  <text x="205" y="56" text-anchor="middle" fill="#ff9f43" font-size="16" font-weight="bold">a+2d</text>
  <text x="205" y="72" text-anchor="middle" fill="#aad4ff" font-size="9">T₃</text>
  <text x="258" y="58" text-anchor="middle" fill="#4ade80" font-size="11">+d</text>
  <text x="294" y="56" text-anchor="middle" fill="#ff9f43" font-size="14" font-weight="bold">a+3d</text>
  <text x="294" y="72" text-anchor="middle" fill="#aad4ff" font-size="9">T₄</text>
  <text x="338" y="58" text-anchor="middle" fill="#4ade80" font-size="11">···</text>
  <text x="385" y="56" text-anchor="middle" fill="#ffd700" font-size="12" font-weight="bold">Tₙ</text>

  <!-- nth term formula -->
  <rect x="55" y="88" width="310" height="30" rx="6" fill="#1a4030" stroke="#ffd700" stroke-width="1.5"/>
  <text x="210" y="108" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">Tₙ  =  a + (n − 1)d</text>

  <!-- Parameter labels -->
  <rect x="10" y="126" width="400" height="60" rx="5" class="box"/>
  <text x="210" y="142" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Parameters</text>
  <text x="55" y="160" text-anchor="middle" fill="#ff9f43" font-size="20" font-weight="bold">a</text>
  <text x="55" y="178" text-anchor="middle" fill="#e0ffe0" font-size="9">First term</text>
  <text x="160" y="160" text-anchor="middle" fill="#7fffd4" font-size="20" font-weight="bold">d</text>
  <text x="160" y="178" text-anchor="middle" fill="#e0ffe0" font-size="9">Common diff</text>
  <text x="265" y="160" text-anchor="middle" fill="#ffd700" font-size="20" font-weight="bold">n</text>
  <text x="265" y="178" text-anchor="middle" fill="#e0ffe0" font-size="9">Term number</text>
  <text x="370" y="160" text-anchor="middle" fill="#ff9f43" font-size="20" font-weight="bold">Tₙ</text>
  <text x="370" y="178" text-anchor="middle" fill="#e0ffe0" font-size="9">nth term</text>

  <!-- Worked examples -->
  <rect x="10" y="194" width="195" height="100" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="107" y="210" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Example 1</text>
  <text x="18" y="226" fill="#ffd700" font-size="10">AP: 2, 5, 8, 11, ...</text>
  <text x="18" y="240" fill="#e0ffe0" font-size="10">a = 2, d = 3</text>
  <text x="18" y="254" fill="#e0ffe0" font-size="10">T₁₀ = 2 + 9×3 = 29</text>
  <text x="18" y="268" fill="#7fffd4" font-size="10">T₂₀ = 2 + 19×3 = 59</text>
  <text x="18" y="282" fill="#aad4ff" font-size="9">d = T₂ − T₁ = 5 − 2 = 3 ✓</text>

  <rect x="215" y="194" width="195" height="100" rx="5" fill="#1a2a3a" stroke="#aad4ff" stroke-width="1"/>
  <text x="312" y="210" text-anchor="middle" fill="#f0e68c" font-size="11" font-weight="bold">Example 2: Find n</text>
  <text x="222" y="226" fill="#ffd700" font-size="10">AP: 7, 13, 19, ... which term = 205?</text>
  <text x="222" y="240" fill="#e0ffe0" font-size="10">a = 7, d = 6, Tₙ = 205</text>
  <text x="222" y="254" fill="#e0ffe0" font-size="10">205 = 7 + (n−1)×6</text>
  <text x="222" y="268" fill="#e0ffe0" font-size="10">198 = 6(n−1) → n−1 = 33</text>
  <text x="222" y="282" fill="#7fffd4" font-size="10" font-weight="bold">∴ n = 34  (34th term)</text>
  </g>
</svg>
