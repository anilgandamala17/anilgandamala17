<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 16px; font-weight: bold; }
      .circle { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 4; }
      .radius { stroke: #ffffff; stroke-width: 1.5; }
      .vel { stroke: #4ade80; stroke-width: 2.5; marker-end: url(#arr-v); }
      .acc { stroke: #fca5a5; stroke-width: 2.5; marker-end: url(#arr-a); }
      .label { fill: #ffffff; font-size: 11px; }
      .formula { fill: #93c5fd; font-size: 10px; font-family: monospace; }
    </style>
    <marker id="arr-v" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/></marker>
    <marker id="arr-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fca5a5"/></marker>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Uniform Circular Motion</text>
    
    <circle cx="150" y="130" r="80" class="circle" />
    <circle cx="150" y="130" r="3" fill="#ffffff" />
    
    <!-- Radius vector -->
    <line x1="150" y1="130" x2="210" y2="78" class="radius" />
    <text x="175" y="105" class="label">r</text>
    
    <!-- Velocity (tangential) -->
    <line x1="210" y1="78" x2="260" y2="135" class="vel" />
    <text x="240" y="105" class="label" fill="#4ade80">v</text>
    
    <!-- Centripetal Accel (radial) -->
    <line x1="210" y1="78" x2="165" y2="117" class="acc" />
    <text x="160" y="95" class="label" fill="#fca5a5">ac</text>
    
    <!-- Formulas -->
    <g transform="translate(250, 160)">
      <text x="0" y="0" class="formula">v = ωr</text>
      <text x="0" y="20" class="formula">ac = v²/r</text>
      <text x="0" y="40" class="formula">ac = ω²r</text>
    </g>
  </g>
</svg>