<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowAPI" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.90)" />
    </marker>
    <marker id="arrowAPIR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#86efac" />
    </marker>
  </defs>

  <!-- Client box -->
  <rect x="20" y="90" width="90" height="60" rx="4" fill="none"
    stroke="#93c5fd" stroke-width="1.5" />
  <text x="65" y="125" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="bold">CLIENT</text>
  <text x="65" y="138" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(Browser/App)</text>

  <!-- Server box -->
  <rect x="290" y="90" width="90" height="60" rx="4" fill="none"
    stroke="#86efac" stroke-width="1.5" />
  <text x="335" y="125" font-size="10" fill="#86efac" text-anchor="middle" font-weight="bold">SERVER</text>
  <text x="335" y="138" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(REST API)</text>

  <!-- Request arrow -->
  <line x1="110" y1="110" x2="290" y2="110"
    stroke="#fef08a" stroke-width="1.5" marker-end="url(#arrowAPI)" />
  <text x="200" y="105" font-size="9" fill="#fef08a" text-anchor="middle" font-weight="bold">HTTP REQUEST</text>
  <text x="200" y="117" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">GET /api/users  →</text>

  <!-- Response arrow -->
  <line x1="290" y1="135" x2="110" y2="135"
    stroke="#86efac" stroke-width="1.5" marker-end="url(#arrowAPIR)" />
  <text x="200" y="150" font-size="9" fill="#86efac" text-anchor="middle" font-weight="bold">JSON RESPONSE</text>
  <text x="200" y="162" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">← 200 OK  { data: [...] }</text>

  <!-- Auth badge -->
  <rect x="175" y="168" width="50" height="16" rx="3" fill="none"
    stroke="#fca5a5" stroke-width="1" />
  <text x="200" y="180" font-size="7" fill="#fca5a5" text-anchor="middle" font-weight="bold">AUTH TOKEN</text>

  <!-- HTTP methods -->
  <text x="20" y="215" font-size="8" fill="rgba(255,255,255,0.90)" font-weight="bold">HTTP Methods:</text>
  <text x="20" y="228" font-size="8" fill="#86efac">GET</text>
  <text x="20" y="240" font-size="7" fill="rgba(255,255,255,0.30)">Read data</text>
  <text x="90" y="228" font-size="8" fill="#fef08a">POST</text>
  <text x="90" y="240" font-size="7" fill="rgba(255,255,255,0.30)">Create</text>
  <text x="160" y="228" font-size="8" fill="#93c5fd">PUT</text>
  <text x="160" y="240" font-size="7" fill="rgba(255,255,255,0.30)">Update</text>
  <text x="220" y="228" font-size="8" fill="#fca5a5">DELETE</text>
  <text x="220" y="240" font-size="7" fill="rgba(255,255,255,0.30)">Remove</text>

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">REST API Architecture</text>
</svg>
