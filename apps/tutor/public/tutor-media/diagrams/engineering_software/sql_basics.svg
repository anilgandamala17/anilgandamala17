<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- USERS table -->
  <rect x="30" y="50" width="130" height="100" rx="4" fill="none"
    stroke="#93c5fd" stroke-width="1.5" />
  <line x1="30" y1="70" x2="160" y2="70" stroke="#93c5fd" stroke-width="1" />
  <text x="95" y="65" font-size="10" fill="#93c5fd" text-anchor="middle" font-weight="bold">USERS</text>
  <text x="45" y="85" font-size="9" fill="#fef08a">id (PK)</text>
  <text x="45" y="100" font-size="9" fill="rgba(255,255,255,0.90)">name</text>
  <text x="45" y="115" font-size="9" fill="rgba(255,255,255,0.90)">email</text>
  <text x="45" y="130" font-size="9" fill="rgba(255,255,255,0.90)">created_at</text>

  <!-- ORDERS table -->
  <rect x="240" y="50" width="130" height="120" rx="4" fill="none"
    stroke="#86efac" stroke-width="1.5" />
  <line x1="240" y1="70" x2="370" y2="70" stroke="#86efac" stroke-width="1" />
  <text x="305" y="65" font-size="10" fill="#86efac" text-anchor="middle" font-weight="bold">ORDERS</text>
  <text x="255" y="85" font-size="9" fill="#fef08a">id (PK)</text>
  <text x="255" y="100" font-size="9" fill="#fef08a">user_id (FK)</text>
  <text x="255" y="115" font-size="9" fill="rgba(255,255,255,0.90)">total</text>
  <text x="255" y="130" font-size="9" fill="rgba(255,255,255,0.90)">status</text>
  <text x="255" y="145" font-size="9" fill="rgba(255,255,255,0.90)">created_at</text>

  <!-- FK relationship line -->
  <line x1="160" y1="100" x2="240" y2="100"
    stroke="#fef08a" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="200" y="95" font-size="8" fill="#fef08a" text-anchor="middle">FK →</text>
  <text x="200" y="108" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">1 : many</text>

  <!-- SQL query example -->
  <rect x="30" y="175" width="340" height="70" rx="4" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1" />
  <text x="45" y="192" font-size="8" fill="#86efac" font-family="monospace" font-weight="bold">SQL JOIN:</text>
  <text x="45" y="207" font-size="8" fill="rgba(255,255,255,0.90)" font-family="monospace">SELECT users.name, orders.total</text>
  <text x="45" y="220" font-size="8" fill="rgba(255,255,255,0.90)" font-family="monospace">FROM users</text>
  <text x="45" y="233" font-size="8" fill="#fef08a" font-family="monospace">JOIN orders ON users.id = orders.user_id;</text>

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Relational Database Schema</text>
</svg>
