  <text x="200" y="212" font-size="10" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">Bubble Sort Algorithm</text>
  <text x="30" y="228" font-size="9" fill="rgba(255,255,255,0.7)" font-family="monospace">• Compare adjacent elements</text>
  <text x="30" y="242" font-size="9" fill="rgba(255,255,255,0.7)" font-family="monospace">• Swap if left &gt; right</text>
