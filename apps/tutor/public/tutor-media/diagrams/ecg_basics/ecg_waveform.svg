<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">ECG Waveform — Cardiac Cycle</text>
  <!-- Axes -->
  <line x1="30" y1="200" x2="380" y2="200" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="30" y1="40" x2="30" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="30" y1="140" x2="380" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="30" y1="100" x2="380" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Axis labels -->
  <text x="205" y="220" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Time (seconds)</text>
  <text x="15" y="120" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace" transform="rotate(-90 15 120)">mV</text>
  <!-- ECG trace: baseline → P wave → PR segment → QRS → ST → T wave → baseline -->
  <!-- Baseline before P -->
  <polyline points="40,200 80,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- P wave (atrial depolarization) -->
  <path d="M80,200 Q90,175 100,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- PR segment -->
  <polyline points="100,200 120,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- Q dip -->
  <polyline points="120,200 130,210" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- R peak (ventricular depolarization) -->
  <polyline points="130,210 145,80 160,210" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- S wave -->
  <polyline points="160,210 170,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- ST segment -->
  <polyline points="170,200 200,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- T wave (ventricular repolarization) -->
  <path d="M200,200 Q220,155 240,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- Baseline after T -->
  <polyline points="240,200 280,200" fill="none" stroke="#86efac" stroke-width="2.5"/>
  <!-- Second beat (smaller) -->
  <path d="M280,200 Q290,178 300,200" fill="none" stroke="#86efac" stroke-width="2"/>
  <polyline points="300,200 315,200 320,210 330,85 340,210 348,200 365,200" fill="none" stroke="#86efac" stroke-width="2"/>
  <path d="M365,200 Q375,160 385,200" fill="none" stroke="#86efac" stroke-width="2"/>
  <!-- Labels -->
  <text x="90" y="168" font-size="10" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">P</text>
  <text x="90" y="158" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Atrial</text>
  <text x="90" y="148" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">depol.</text>
  <text x="145" y="68" font-size="10" fill="#fca5a5" text-anchor="middle" font-family="monospace" font-weight="bold">R</text>
  <text x="130" y="225" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Q</text>
  <text x="162" y="225" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">S</text>
  <text x="145" y="245" font-size="8" fill="#fca5a5" text-anchor="middle" font-family="monospace">QRS Complex</text>
  <text x="145" y="255" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(Ventricular depol.)</text>
  <text x="220" y="148" font-size="10" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">T</text>
  <text x="220" y="138" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Ventricular</text>
  <text x="220" y="128" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">repol.</text>
  <!-- Interval brackets -->
  <line x1="80" y1="235" x2="170" y2="235" stroke="#fbbf24" stroke-width="1"/>
  <line x1="80" y1="230" x2="80" y2="240" stroke="#fbbf24" stroke-width="1"/>
  <line x1="170" y1="230" x2="170" y2="240" stroke="#fbbf24" stroke-width="1"/>
  <text x="125" y="248" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">PR interval</text>
  <line x1="80" y1="265" x2="240" y2="265" stroke="#86efac" stroke-width="1"/>
  <line x1="80" y1="260" x2="80" y2="270" stroke="#86efac" stroke-width="1"/>
  <line x1="240" y1="260" x2="240" y2="270" stroke="#86efac" stroke-width="1"/>
  <text x="160" y="278" font-size="8" fill="#86efac" text-anchor="middle" font-family="monospace">QT interval (one cardiac cycle)</text>
  <!-- Normal HR note -->
  <text x="340" y="55" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Normal HR:</text>
  <text x="340" y="67" font-size="9" fill="#86efac" text-anchor="middle" font-family="monospace">60-100 bpm</text>
</svg>
