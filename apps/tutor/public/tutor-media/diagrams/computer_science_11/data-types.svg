         <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="24" font-weight="bold">Data Types</text><rect x="150" y="100" width="500" height="400" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2"/><line x1="150" y1="140" x2="650" y2="140" stroke="#FFFFFF" stroke-width="1"/><circle cx="170" cy="120" r="5" fill="#FFFFFF"/><text x="180" y="180" fill="#FFD54F" font-family="monospace" font-size="16">function main() {</text><text x="210" y="205" fill="#FFFFFF" font-family="monospace" font-size="16">  // Data Types</text><text x="210" y="230" fill="#FFFFFF" font-family="monospace" font-size="16">  let x = init();</text><text x="210" y="255" fill="#FFFFFF" font-family="monospace" font-size="16">  if (check(x)) {</text><text x="240" y="280" fill="#FFFFFF" font-family="monospace" font-size="16">    return true;</text><text x="210" y="305" fill="#FFFFFF" font-family="monospace" font-size="16">  }</text><text x="180" y="330" fill="#FFD54F" font-family="monospace" font-size="16">}</text></svg>