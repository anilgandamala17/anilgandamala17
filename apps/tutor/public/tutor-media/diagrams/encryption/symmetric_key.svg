<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <defs>
    <marker id="arrowW" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#ffffff"/></marker>
    <marker id="arrowG" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#86efac"/></marker>
    <marker id="arrowY" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#fbbf24"/></marker>
  </defs>
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Symmetric Key Encryption (AES)</text>
  <!-- Plaintext -->
  <rect x="15" y="100" width="75" height="50" rx="5" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="2"/>
  <text x="52" y="120" font-size="9" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Plaintext</text>
  <text x="52" y="135" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">"Hello"</text>
  <text x="52" y="147" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">01001000...</text>
  <!-- Encryption block -->
  <rect x="120" y="85" width="80" height="80" rx="5" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2"/>
  <text x="160" y="115" font-size="10" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">AES</text>
  <text x="160" y="130" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Encrypt</text>
  <text x="160" y="145" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">128/256-bit</text>
  <text x="160" y="157" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">block cipher</text>
  <!-- Arrows -->
  <line x1="90" y1="125" x2="118" y2="125" stroke="#86efac" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Key input -->
  <rect x="130" y="30" width="60" height="40" rx="4" fill="rgba(252,165,165,0.15)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="160" y="48" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace" font-weight="bold">Secret</text>
  <text x="160" y="62" font-size="9" fill="#fca5a5" text-anchor="middle" font-family="monospace">Key 🔑</text>
  <line x1="160" y1="70" x2="160" y2="83" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowY)"/>
  <!-- Ciphertext -->
  <rect x="230" y="100" width="75" height="50" rx="5" fill="rgba(147,197,253,0.12)" stroke="#93c5fd" stroke-width="2"/>
  <text x="267" y="120" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">Ciphertext</text>
  <text x="267" y="135" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">X7#kP9!</text>
  <text x="267" y="147" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">11001011...</text>
  <line x1="200" y1="125" x2="228" y2="125" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowW)"/>
  <!-- Decryption -->
  <rect x="120" y="185" width="80" height="70" rx="5" fill="rgba(147,197,253,0.08)" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="160" y="208" font-size="10" fill="#93c5fd" text-anchor="middle" font-family="monospace" font-weight="bold">AES</text>
  <text x="160" y="222" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Decrypt</text>
  <text x="160" y="237" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(same key)</text>
  <text x="160" y="249" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">reverses cipher</text>
  <!-- Decrypt arrows -->
  <path d="M267 150 Q267 170 200 205" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowW)"/>
  <path d="M120 220 Q90 220 90 155 Q90 125 90 125" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowG)"/>
  <!-- Same key for decrypt -->
  <line x1="160" y1="70" x2="160" y2="183" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Security note -->
  <rect x="320" y="85" width="70" height="110" rx="4" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="355" y="102" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace" font-weight="bold">Security</text>
  <text x="355" y="116" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">AES-128:</text>
  <text x="355" y="128" font-size="8" fill="#86efac" text-anchor="middle" font-family="monospace">2¹²⁸ keys</text>
  <text x="355" y="142" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">AES-256:</text>
  <text x="355" y="154" font-size="8" fill="#86efac" text-anchor="middle" font-family="monospace">2²⁵⁶ keys</text>
  <text x="355" y="170" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Brute force</text>
  <text x="355" y="181" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">infeasible</text>
  <!-- Title note -->
  <text x="200" y="268" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Same key encrypts &amp; decrypts — key must be shared securely</text>
</svg>
