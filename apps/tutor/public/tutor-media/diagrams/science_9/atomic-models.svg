<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Atomic Models — Historical Development</text>

  <!-- Thomson Plum-pudding -->
  <rect x="10" y="55" width="185" height="240" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="102" y="76" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="Georgia,serif" font-weight="bold">J.J. Thomson (1904)</text>
  <text x="102" y="93" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">"Plum-Pudding" model</text>
  <!-- Pudding circle -->
  <circle cx="102" cy="155" r="55" fill="#3b1e00" stroke="#fbbf24" stroke-width="2"/>
  <!-- Electrons as dots inside -->
  <circle cx="85" cy="140" r="7" fill="#fde68a"/><text x="85" y="143" text-anchor="middle" fill="#0f2a1a" font-size="7">e⁻</text>
  <circle cx="120" cy="140" r="7" fill="#fde68a"/><text x="120" y="143" text-anchor="middle" fill="#0f2a1a" font-size="7">e⁻</text>
  <circle cx="102" cy="165" r="7" fill="#fde68a"/><text x="102" y="168" text-anchor="middle" fill="#0f2a1a" font-size="7">e⁻</text>
  <circle cx="80" cy="170" r="7" fill="#fde68a"/><text x="80" y="173" text-anchor="middle" fill="#0f2a1a" font-size="7">e⁻</text>
  <circle cx="125" cy="168" r="7" fill="#fde68a"/>
  <text x="102" y="225" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">+ Diffuse sphere</text>
  <text x="102" y="241" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">e⁻ embedded in</text>
  <text x="102" y="257" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">positive cloud</text>
  <text x="102" y="275" text-anchor="middle" fill="#ef4444" font-size="10" font-family="Georgia,serif">✗ Disproved by Rutherford</text>
  <text x="102" y="287" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">gold foil experiment</text>

  <!-- Rutherford model -->
  <rect x="207" y="55" width="185" height="240" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="299" y="76" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia,serif" font-weight="bold">Rutherford (1911)</text>
  <text x="299" y="93" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Nuclear model</text>
  <!-- Nucleus -->
  <circle cx="299" cy="150" r="18" fill="#ef4444"/><text x="299" y="154" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">p⁺ n⁰</text>
  <!-- Orbits (random) -->
  <ellipse cx="299" cy="150" rx="50" ry="20" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="299" cy="150" rx="50" ry="20" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3" transform="rotate(60,299,150)"/>
  <ellipse cx="299" cy="150" rx="50" ry="20" fill="none" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3" transform="rotate(120,299,150)"/>
  <circle cx="299" cy="130" r="7" fill="#fde68a"/>
  <text x="299" y="218" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Dense +ve nucleus</text>
  <text x="299" y="234" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Electrons orbit freely</text>
  <text x="299" y="250" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Most atom is empty</text>
  <text x="299" y="270" text-anchor="middle" fill="#ef4444" font-size="10" font-family="Georgia,serif">✗ Cannot explain stability</text>
  <text x="299" y="285" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(spiraling electron)</text>

  <!-- Bohr model -->
  <rect x="404" y="55" width="185" height="240" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="496" y="76" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">Niels Bohr (1913)</text>
  <text x="496" y="93" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Orbit / Shell model</text>
  <!-- Nucleus -->
  <circle cx="496" cy="150" r="14" fill="#ef4444"/>
  <!-- Shells -->
  <circle cx="496" cy="150" r="32" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="496" cy="150" r="52" fill="none" stroke="#a3e635" stroke-width="1.5"/>
  <circle cx="496" cy="150" r="72" fill="none" stroke="#fde68a" stroke-width="1.5"/>
  <!-- e⁻ on shells -->
  <circle cx="496" cy="118" r="6" fill="#fde68a"/>
  <circle cx="528" cy="150" r="6" fill="#fde68a"/><circle cx="464" cy="150" r="6" fill="#fde68a"/>
  <circle cx="496" cy="78" r="6" fill="#86efac"/><circle cx="496" cy="222" r="6" fill="#86efac"/>
  <!-- shell labels -->
  <text x="530" y="120" fill="#38bdf8" font-size="10" font-family="Georgia,serif">K(n=1)</text>
  <text x="552" y="150" fill="#a3e635" font-size="10" font-family="Georgia,serif">L(n=2)</text>
  <text x="572" y="180" fill="#fde68a" font-size="10" font-family="Georgia,serif">M(n=3)</text>
  <text x="496" y="220" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Quantised orbits</text>
  <text x="496" y="236" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Fixed energy levels</text>
  <text x="496" y="252" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Energy emitted on jump</text>
  <text x="496" y="272" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia,serif">✓ Used in Gr 9 syllabus</text>
  <text x="496" y="287" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Explains H spectrum</text>

  <!-- Modern QM -->
  <rect x="601" y="55" width="190" height="240" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="696" y="76" text-anchor="middle" fill="#c4b5fd" font-size="12" font-family="Georgia,serif" font-weight="bold">Quantum Mechanical</text>
  <text x="696" y="93" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Modern model</text>
  <!-- Cloud diagram -->
  <circle cx="696" cy="155" r="70" fill="#a78bfa" fill-opacity="0.08"/>
  <circle cx="696" cy="155" r="50" fill="#a78bfa" fill-opacity="0.12"/>
  <circle cx="696" cy="155" r="30" fill="#a78bfa" fill-opacity="0.20"/>
  <circle cx="696" cy="155" r="15" fill="#ef4444"/>
  <!-- scattered dots -->
  <g fill="#c4b5fd" opacity="0.6">
    <circle cx="660" cy="135" r="3"/><circle cx="730" cy="148" r="3"/><circle cx="695" cy="100" r="3"/>
    <circle cx="750" cy="165" r="3"/><circle cx="645" cy="160" r="3"/><circle cx="700" cy="198" r="3"/>
    <circle cx="660" cy="186" r="3"/><circle cx="714" cy="120" r="3"/>
  </g>
  <text x="696" y="238" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Electron cloud / orbital</text>
  <text x="696" y="254" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Probability-based position</text>
  <text x="696" y="270" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Georgia,serif">s, p, d, f sub-shells</text>
  <text x="696" y="287" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia,serif">Most accurate model</text>

  <!-- Bottom: comparison -->
  <rect x="10" y="308" width="780" height="180" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">Key Comparisons</text>
  <g font-size="11" font-family="Georgia,serif">
    <text x="25" y="356" fill="#fde68a" font-weight="bold">Thomson: </text><text x="25" y="356" fill="#d4d4d8" x="100">— No nucleus  |  Electrons embedded  |  Disproved by Gold Foil</text>
    <text x="100" y="356" fill="#d4d4d8">No nucleus; electrons in +ve medium — Gold Foil disproved it</text>
    <text x="25" y="378" fill="#a3e635" font-weight="bold">Rutherford: </text><text x="105" y="378" fill="#d4d4d8">+ve nucleus; e⁻ orbit freely — Cannot explain stability</text>
    <text x="25" y="400" fill="#fde68a" font-weight="bold">Bohr: </text><text x="65" y="400" fill="#d4d4d8">Fixed energy shells (K, L, M…) — Explains H spectrum, used at school level</text>
    <text x="25" y="422" fill="#c4b5fd" font-weight="bold">Quantum: </text><text x="95" y="422" fill="#d4d4d8">Probability clouds (orbitals) — Most accurate, used in higher studies</text>
    <text x="25" y="448" fill="#86efac" font-weight="bold">For CBSE Class 9: </text><text x="140" y="448" fill="#d4d4d8">Use Bohr's model. Shells are K, L, M, N with capacities 2, 8, 18, 32</text>
  </g>
</svg>
