<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Sub-Atomic Particles</text>

  <!-- Atom diagram centre -->
  <!-- Nucleus -->
  <circle cx="400" cy="265" r="55" fill="#4a1a10" stroke="#ef4444" stroke-width="3"/>
  <!-- Protons and neutrons in nucleus -->
  <circle cx="388" cy="248" r="14" fill="#ef4444"/><text x="388" y="253" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">p⁺</text>
  <circle cx="414" cy="248" r="14" fill="#ef4444"/><text x="414" y="253" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">p⁺</text>
  <circle cx="400" cy="272" r="14" fill="#94a3b8"/><text x="400" y="277" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">n⁰</text>
  <circle cx="382" cy="272" r="10" fill="#94a3b8"/><text x="382" y="276" text-anchor="middle" fill="#fff" font-size="7">n⁰</text>
  <circle cx="418" cy="272" r="10" fill="#94a3b8"/><text x="418" y="276" text-anchor="middle" fill="#fff" font-size="7">n⁰</text>
  <!-- Electron orbits -->
  <ellipse cx="400" cy="265" rx="110" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <ellipse cx="400" cy="265" rx="110" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" transform="rotate(60,400,265)"/>
  <ellipse cx="400" cy="265" rx="110" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" transform="rotate(120,400,265)"/>
  <!-- Electrons -->
  <circle cx="400" cy="225" r="9" fill="#fde68a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="400" y="229" text-anchor="middle" fill="#0f2a1a" font-size="8" font-weight="bold">e⁻</text>
  <circle cx="497" cy="287" r="9" fill="#fde68a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="497" y="291" text-anchor="middle" fill="#0f2a1a" font-size="8" font-weight="bold">e⁻</text>
  <circle cx="304" cy="287" r="9" fill="#fde68a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="304" y="291" text-anchor="middle" fill="#0f2a1a" font-size="8" font-weight="bold">e⁻</text>

  <!-- Labels -->
  <text x="402" y="210" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif">Electron (e⁻)</text>
  <text x="402" y="198" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">Orbit</text>
  <text x="400" y="328" text-anchor="middle" fill="#ef4444" font-size="12" font-family="Georgia,serif" font-weight="bold">NUCLEUS</text>

  <!-- Left info panel: properties -->
  <rect x="15" y="56" width="285" height="415" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="157" y="78" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">Properties</text>
  <!-- Table -->
  <g transform="translate(24,88)">
    <rect x="0" y="0" width="267" height="28" rx="3" fill="#0f2a1a"/>
    <text x="44" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">Particle</text>
    <text x="110" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">Mass</text>
    <text x="175" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">Charge</text>
    <text x="240" y="20" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="bold">Where</text>
    <line x1="0" y1="28" x2="267" y2="28" stroke="#334155"/>
    <line x1="80" y1="0" x2="80" y2="220" stroke="#334155"/>
    <line x1="148" y1="0" x2="148" y2="220" stroke="#334155"/>
    <line x1="210" y1="0" x2="210" y2="220" stroke="#334155"/>
    <g fill="#d4d4d8" font-size="10" font-family="Georgia,serif" text-anchor="middle">
      <!-- Proton row -->
      <text x="44" y="50" fill="#ef4444" font-weight="bold">Proton</text><text x="110" y="50">1 u</text><text x="175" y="50" fill="#a3e635">+1</text><text x="240" y="50">Nucleus</text>
      <line x1="0" y1="58" x2="267" y2="58" stroke="#1a2a1a"/>
      <!-- Neutron row -->
      <text x="44" y="78" fill="#94a3b8" font-weight="bold">Neutron</text><text x="110" y="78">1 u</text><text x="175" y="78">0</text><text x="240" y="78">Nucleus</text>
      <line x1="0" y1="86" x2="267" y2="86" stroke="#1a2a1a"/>
      <!-- Electron row -->
      <text x="44" y="105" fill="#fde68a" font-weight="bold">Electron</text><text x="110" y="105">~0 (1/1840)</text><text x="175" y="105" fill="#ef4444">−1</text><text x="240" y="105">Orbits</text>
    </g>
  </g>
  <!-- Atomic number / mass number -->
  <g transform="translate(24,220)" font-family="Georgia,serif">
    <rect x="0" y="0" width="267" height="55" rx="6" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="133" y="20" text-anchor="middle" fill="#a3e635" font-size="12" font-weight="bold">Atomic Number (Z)</text>
    <text x="133" y="42" text-anchor="middle" fill="#d4d4d8" font-size="11">Z = number of protons</text>
    <text x="133" y="52" text-anchor="middle" fill="#fde68a" font-size="10">= number of electrons (neutral atom)</text>
    <rect x="0" y="62" width="267" height="55" rx="6" fill="#0f2a1a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="133" y="82" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="bold">Mass Number (A)</text>
    <text x="133" y="102" text-anchor="middle" fill="#d4d4d8" font-size="11">A = protons + neutrons</text>
    <text x="133" y="112" text-anchor="middle" fill="#fde68a" font-size="10">Number of neutrons = A − Z</text>
    <rect x="0" y="124" width="267" height="50" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="133" y="144" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold">Isotopes</text>
    <text x="133" y="162" text-anchor="middle" fill="#d4d4d8" font-size="10">Same Z (protons), different A (neutrons)</text>
    <rect x="0" y="181" width="267" height="50" rx="6" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="133" y="200" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="bold">Isobars</text>
    <text x="133" y="218" text-anchor="middle" fill="#d4d4d8" font-size="10">Same A (mass number), different Z</text>
  </g>

  <!-- Right info panel -->
  <rect x="530" y="56" width="255" height="415" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="657" y="78" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Discovery Timeline</text>
  <g transform="translate(540,90)" font-size="11" font-family="Georgia,serif">
    <rect x="0" y="0" width="235" height="50" rx="6" fill="#0f2a1a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="117" y="18" text-anchor="middle" fill="#ef4444" font-weight="bold">Electron — J.J. Thomson (1897)</text>
    <text x="117" y="36" text-anchor="middle" fill="#d4d4d8">Cathode ray experiment</text>
    <text x="117" y="50" text-anchor="middle" fill="#d4d4d8">Measured charge-to-mass ratio</text>

    <rect x="0" y="58" width="235" height="50" rx="6" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="117" y="76" text-anchor="middle" fill="#a3e635" font-weight="bold">Proton — Rutherford (1919)</text>
    <text x="117" y="94" text-anchor="middle" fill="#d4d4d8">Nucleus discovered by</text>
    <text x="117" y="108" text-anchor="middle" fill="#d4d4d8">gold-foil experiment (1911)</text>

    <rect x="0" y="116" width="235" height="50" rx="6" fill="#0f2a1a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="117" y="134" text-anchor="middle" fill="#94a3b8" font-weight="bold">Neutron — James Chadwick (1932)</text>
    <text x="117" y="152" text-anchor="middle" fill="#d4d4d8">Discovered by bombarding</text>
    <text x="117" y="166" text-anchor="middle" fill="#d4d4d8">beryllium with α-particles</text>

    <!-- Example element -->
    <rect x="0" y="184" width="235" height="100" rx="6" fill="#134e4a" stroke="#86efac" stroke-width="2"/>
    <text x="117" y="204" text-anchor="middle" fill="#86efac" font-weight="bold" font-size="13">Carbon-12 Example</text>
    <text x="117" y="224" text-anchor="middle" fill="#fde68a">¹²C₆</text>
    <text x="117" y="244" text-anchor="middle" fill="#d4d4d8">Z = 6 (protons &amp; electrons)</text>
    <text x="117" y="262" text-anchor="middle" fill="#d4d4d8">A = 12 → neutrons = 6</text>
    <text x="117" y="278" text-anchor="middle" fill="#a3e635">Isotope: ¹⁴C (Z=6, A=14, n=8)</text>

    <rect x="0" y="300" width="235" height="80" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="117" y="320" text-anchor="middle" fill="#fde68a" font-weight="bold" font-size="12">Key Point</text>
    <text x="117" y="340" text-anchor="middle" fill="#d4d4d8">In a neutral atom:</text>
    <text x="117" y="358" text-anchor="middle" fill="#a3e635">Protons = Electrons</text>
    <text x="117" y="374" text-anchor="middle" fill="#d4d4d8">Ions have gained/lost electrons</text>
  </g>
</svg>