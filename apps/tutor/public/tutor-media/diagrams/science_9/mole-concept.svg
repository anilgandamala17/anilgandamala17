<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Mole Concept</text>

  <!-- Central mole definition -->
  <rect x="15" y="56" width="770" height="70" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2.5"/>
  <text x="400" y="80" text-anchor="middle" fill="#a3e635" font-size="16" font-family="Georgia,serif" font-weight="bold">1 Mole = 6.022 × 10²³ particles (Avogadro's Number, Nₐ)</text>
  <text x="400" y="105" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">A mole is the SI unit for amount of substance. 1 mol of any element = its atomic mass in grams</text>

  <!-- Three boxes -->
  <rect x="15" y="138" width="240" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="135" y="162" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia,serif" font-weight="bold">Number of Particles</text>
  <text x="135" y="188" text-anchor="middle" fill="#fde68a" font-size="28" font-family="Georgia,serif" font-weight="bold">N</text>
  <text x="135" y="222" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">N = n × Nₐ</text>
  <text x="135" y="248" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">n = moles, Nₐ = 6.022×10²³</text>
  <text x="135" y="272" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">e.g. 2 mol O₂ has</text>
  <text x="135" y="290" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">2 × 6.022×10²³ molecules</text>
  <text x="135" y="316" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif" font-style="italic">And 4 × Nₐ atoms (2 per molecule)</text>

  <rect x="280" y="138" width="240" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="400" y="162" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Molar Mass</text>
  <text x="400" y="188" text-anchor="middle" fill="#fde68a" font-size="28" font-family="Georgia,serif" font-weight="bold">M</text>
  <text x="400" y="222" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">n = mass / Molar mass</text>
  <text x="400" y="244" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">M of H₂O = 2(1) + 16 = 18 g/mol</text>
  <text x="400" y="266" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">M of CO₂ = 12 + 32 = 44 g/mol</text>
  <text x="400" y="292" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">e.g. 36g H₂O = 2 mol</text>
  <text x="400" y="316" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">M = atomic mass in grams</text>

  <rect x="545" y="138" width="240" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="665" y="162" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Molar Volume (Gas)</text>
  <text x="665" y="188" text-anchor="middle" fill="#fde68a" font-size="28" font-family="Georgia,serif" font-weight="bold">V</text>
  <text x="665" y="222" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">1 mol gas at STP = 22.4 L</text>
  <text x="665" y="248" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">n = Volume / 22.4</text>
  <text x="665" y="272" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">e.g. 2 mol CO₂ = 44.8 L</text>
  <text x="665" y="296" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">STP: 0°C, 1 atm pressure</text>
  <text x="665" y="316" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">All gases same volume at STP</text>

  <!-- Triangle relationship diagram -->
  <rect x="15" y="350" width="770" height="140" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="373" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">The Mole Triangle</text>
  <!-- Triangle -->
  <polygon points="400,390 300,460 500,460" fill="#134e4a" stroke="#a3e635" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">n (mol)</text>
  <text x="340" y="475" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="Georgia,serif">Mass (g) / M</text>
  <text x="460" y="475" text-anchor="middle" fill="#a3e635" font-size="11" font-family="Georgia,serif">N / Nₐ</text>
  <!-- Arrows -->
  <text x="160" y="430" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Mass = n × M</text>
  <text x="565" y="430" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">N = n × Nₐ</text>
  <text x="400" y="488" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Volume (STP) = n × 22.4</text>
</svg>
