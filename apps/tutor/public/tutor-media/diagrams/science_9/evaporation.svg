<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Evaporation</text>
  <text x="400" y="58" text-anchor="middle" fill="#d4d4d8" font-size="13" font-family="Georgia,serif">Surface phenomenon — conversion of liquid to vapour at any temperature</text>

  <!-- Left: factors -->
  <rect x="15" y="70" width="360" height="410" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="195" y="92" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia,serif" font-weight="bold">Factors Affecting Evaporation</text>

  <!-- Factor 1 -->
  <rect x="25" y="100" width="340" height="55" rx="8" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="195" y="122" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">① Surface Area</text>
  <text x="195" y="142" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">↑ Surface area → ↑ Evaporation rate</text>
  <text x="195" y="156" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">e.g. wet clothes spread out dry faster</text>

  <rect x="25" y="163" width="340" height="55" rx="8" fill="#0f2a1a" stroke="#fde68a" stroke-width="1.5"/>
  <text x="195" y="185" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">② Temperature</text>
  <text x="195" y="205" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">↑ Temp → ↑ Kinetic energy → ↑ Evaporation</text>
  <text x="195" y="219" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Molecules escape surface more easily</text>

  <rect x="25" y="226" width="340" height="55" rx="8" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
  <text x="195" y="248" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">③ Humidity</text>
  <text x="195" y="268" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">↑ Humidity → ↓ Evaporation</text>
  <text x="195" y="282" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Air already saturated with moisture</text>

  <rect x="25" y="289" width="340" height="55" rx="8" fill="#0f2a1a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="195" y="311" text-anchor="middle" fill="#c4b5fd" font-size="13" font-family="Georgia,serif" font-weight="bold">④ Wind Speed</text>
  <text x="195" y="331" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">↑ Wind → ↑ Evaporation</text>
  <text x="195" y="345" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Carries away vapour, making room for more</text>

  <rect x="25" y="352" width="340" height="55" rx="8" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="195" y="374" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">⑤ Nature of Liquid</text>
  <text x="195" y="394" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Liquids with low boiling point evaporate faster</text>
  <text x="195" y="408" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">e.g. petrol &gt; water &gt; glycerol</text>

  <rect x="25" y="415" width="340" height="50" rx="8" fill="#134e4a" stroke="#86efac" stroke-width="2"/>
  <text x="195" y="437" text-anchor="middle" fill="#86efac" font-size="12" font-family="Georgia,serif" font-weight="bold">Evaporation causes Cooling</text>
  <text x="195" y="457" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Energy taken from surroundings → feel cool</text>

  <!-- Right: diagram + examples -->
  <rect x="390" y="70" width="395" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="587" y="92" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Particle-Level Diagram</text>
  <!-- Cup of water -->
  <rect x="460" y="130" width="120" height="100" rx="6" fill="#1a3a6a" stroke="#38bdf8" stroke-width="2"/>
  <text x="520" y="188" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif">Liquid</text>
  <!-- Particles in liquid -->
  <g fill="#38bdf8">
    <circle cx="480" cy="160" r="7"/><circle cx="510" cy="152" r="7"/><circle cx="540" cy="162" r="7"/>
    <circle cx="495" cy="182" r="7"/><circle cx="525" cy="177" r="7"/><circle cx="558" cy="185" r="7"/>
    <circle cx="480" cy="205" r="7"/><circle cx="515" cy="200" r="7"/><circle cx="548" cy="205" r="7"/>
  </g>
  <!-- Escaping particles -->
  <circle cx="490" cy="118" r="7" fill="#fde68a" opacity="0.8"/>
  <circle cx="530" cy="105" r="7" fill="#fde68a" opacity="0.6"/>
  <circle cx="570" cy="120" r="7" fill="#fde68a" opacity="0.4"/>
  <line x1="490" y1="125" x2="490" y2="132" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="530" y1="112" x2="530" y2="130" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="570" y1="127" x2="570" y2="132" stroke="#fde68a" stroke-width="1.5"/>
  <text x="650" y="140" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">High-energy</text>
  <text x="650" y="158" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">molecules</text>
  <text x="650" y="176" fill="#fde68a" font-size="11" font-family="Georgia,serif">escape surface</text>
  <text x="650" y="192" fill="#fde68a" font-size="11" font-family="Georgia,serif">→ become gas</text>
  <text x="520" y="250" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Remaining liquid cools down</text>

  <!-- Examples -->
  <rect x="390" y="282" width="395" height="238" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="587" y="305" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Real-Life Examples</text>
  <g fill="#d4d4d8" font-size="11" font-family="Georgia,serif">
    <text x="405" y="330">🌡 Sweating cools the body (water evaporates)</text>
    <text x="405" y="354">➡ Wearing cotton in summer (absorbs sweat)</text>
    <text x="405" y="378">🫙 Storing water in earthen pots (seepage + evap)</text>
    <text x="405" y="402">💧 Desert coolers use evaporation to cool air</text>
    <text x="405" y="426">🍾 Acetone/spirit evaporates quickly, feels cold</text>
    <text x="405" y="450">🌡 Perspiration in fever — alcohol sponge works</text>
    <text x="405" y="474">☁ Evaporation from oceans forms clouds (water cycle)</text>
  </g>
</svg>