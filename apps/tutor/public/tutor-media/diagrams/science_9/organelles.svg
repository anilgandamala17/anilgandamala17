<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Cell Organelles and Their Functions</text>

  <!-- 3 columns × 3 rows = 9 organelles -->
  <!-- Row 1 -->
  <rect x="10" y="55" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="135" y="76" text-anchor="middle" fill="#c4b5fd" font-size="13" font-family="Georgia,serif" font-weight="bold">Nucleus</text>
  <circle cx="135" cy="118" r="28" fill="#1a1a5a" stroke="#a78bfa" stroke-width="2"/>
  <circle cx="135" cy="118" r="14" fill="#3b3b8a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="200" y="100" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Control centre</text>
  <text x="200" y="116" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Contains DNA</text>
  <text x="200" y="132" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Heredity &amp; growth</text>
  <text x="135" y="168" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Without nucleus → no mitosis</text>

  <rect x="275" y="55" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="400" y="76" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">Mitochondria</text>
  <!-- Mitochondria shape -->
  <ellipse cx="350" cy="118" rx="38" ry="22" fill="#4a2a00" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 318,110 Q 335,103 352,110 Q 369,117 352,124 Q 335,131 318,124" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="450" y="100" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Powerhouse of cell</text>
  <text x="450" y="116" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Produces ATP energy</text>
  <text x="450" y="132" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Double membrane</text>
  <text x="400" y="168" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Has its own DNA — semi-autonomous</text>

  <rect x="540" y="55" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="665" y="76" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">Chloroplast (Plant)</text>
  <ellipse cx="640" cy="118" rx="38" ry="20" fill="#166534" stroke="#a3e635" stroke-width="2"/>
  <line x1="620" y1="118" x2="660" y2="118" stroke="#86efac" stroke-width="1.5"/>
  <text x="735" y="100" fill="#d4d4d8" font-size="10" font-family="Georgia,serif" text-anchor="middle">Photosynthesis</text>
  <text x="735" y="116" fill="#d4d4d8" font-size="10" font-family="Georgia,serif" text-anchor="middle">Contains chlorophyll</text>
  <text x="735" y="132" fill="#d4d4d8" font-size="10" font-family="Georgia,serif" text-anchor="middle">Green colour</text>
  <text x="665" y="168" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">CO₂ + H₂O → glucose + O₂</text>

  <!-- Row 2 -->
  <rect x="10" y="200" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="135" y="221" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">Endoplasmic Reticulum</text>
  <path d="M 25,265 Q 45,248 65,265 Q 85,282 105,265 Q 125,248 145,265 Q 155,272 165,265" fill="none" stroke="#f472b6" stroke-width="2"/>
  <text x="55" y="295" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">Rough ER (ribosomes)</text>
  <text x="55" y="308" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">Smooth ER (fats/steroids)</text>
  <text x="135" y="322" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Transport within cell</text>

  <rect x="275" y="200" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="221" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Georgia,serif" font-weight="bold">Golgi Body</text>
  <path d="M 285,265 Q 310,252 335,265 Q 360,278 385,265 Q 410,252 435,265" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 290,275 Q 312,263 337,275 Q 362,287 387,275 Q 412,263 435,275" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Packaging &amp; secretion</text>
  <text x="400" y="312" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Modifies proteins</text>
  <text x="400" y="328" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Post office of the cell</text>

  <rect x="540" y="200" width="250" height="130" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="221" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia,serif" font-weight="bold">Ribosome</text>
  <circle cx="620" cy="265" r="10" fill="#86efac"/>
  <circle cx="645" cy="260" r="7" fill="#a3e635"/>
  <circle cx="660" cy="268" r="10" fill="#86efac"/>
  <text x="665" y="292" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Site of protein synthesis</text>
  <text x="665" y="308" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Free or on Rough ER</text>
  <text x="665" y="326" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Reads mRNA → makes protein</text>

  <!-- Row 3 -->
  <rect x="10" y="345" width="250" height="145" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#fde68a" stroke-width="2"/>
  <text x="135" y="366" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">Vacuole</text>
  <rect x="50" y="378" width="100" height="80" rx="8" fill="#1a3a6a" stroke="#38bdf8" stroke-width="2"/>
  <text x="100" y="422" text-anchor="middle" fill="#7dd3fc" font-size="9" font-family="Georgia,serif">Central</text>
  <text x="100" y="436" text-anchor="middle" fill="#7dd3fc" font-size="9" font-family="Georgia,serif">vacuole</text>
  <text x="190" y="396" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Storage of</text>
  <text x="190" y="412" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">water, sap</text>
  <text x="190" y="428" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Gives turgidity</text>
  <text x="190" y="444" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(plant cells)</text>
  <text x="135" y="482" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Largest in plant cells (90% of vol)</text>

  <rect x="275" y="345" width="250" height="145" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="366" text-anchor="middle" fill="#ef4444" font-size="13" font-family="Georgia,serif" font-weight="bold">Lysosome</text>
  <circle cx="360" cy="415" r="32" fill="#3b0f0f" stroke="#ef4444" stroke-width="2"/>
  <text x="360" y="412" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="Georgia,serif">Digestive</text>
  <text x="360" y="426" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="Georgia,serif">enzymes</text>
  <text x="435" y="390" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Suicidal bag</text>
  <text x="435" y="406" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Digests old</text>
  <text x="435" y="422" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">organelles</text>
  <text x="435" y="438" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Defence</text>
  <text x="400" y="478" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Only in animal cells</text>

  <rect x="540" y="345" width="250" height="145" rx="10" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="665" y="366" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia,serif" font-weight="bold">Cell Wall (Plant)</text>
  <!-- Wall cross section -->
  <rect x="548" y="380" width="14" height="90" fill="#4d7c0f" stroke="#86efac" stroke-width="1.5"/>
  <rect x="772" y="380" width="14" height="90" fill="#4d7c0f" stroke="#86efac" stroke-width="1.5"/>
  <rect x="562" y="383" width="210" height="86" rx="2" fill="#1a3a6a" fill-opacity="0.3"/>
  <text x="665" y="403" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Made of cellulose</text>
  <text x="665" y="419" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Provides rigidity &amp; shape</text>
  <text x="665" y="435" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Fully permeable</text>
  <text x="665" y="451" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Outside cell membrane</text>
  <text x="665" y="478" text-anchor="middle" fill="#7dd3fc" font-size="10" font-family="Georgia,serif" font-style="italic">Absent in animal cells</text>
</svg>