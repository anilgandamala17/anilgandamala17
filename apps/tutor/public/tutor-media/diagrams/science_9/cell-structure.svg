<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Cell Structure — Animal vs Plant Cell</text>

  <!-- Animal Cell (left) -->
  <rect x="10" y="55" width="380" height="430" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" fill="#f9a8d4" font-size="14" font-family="Georgia,serif" font-weight="bold">Animal Cell</text>
  <!-- Cell membrane (irregular oval) -->
  <ellipse cx="200" cy="280" rx="170" ry="140" fill="#3b0f1a" fill-opacity="0.5" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Nucleus -->
  <ellipse cx="200" cy="255" rx="52" ry="42" fill="#1a1a5a" stroke="#a78bfa" stroke-width="2"/>
  <ellipse cx="200" cy="255" rx="26" ry="20" fill="#3b3b8a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="200" y="248" text-anchor="middle" fill="#c4b5fd" font-size="8" font-family="Georgia,serif">Nucleolus</text>
  <text x="200" y="268" text-anchor="middle" fill="#e9d5ff" font-size="9" font-family="Georgia,serif">Nucleus</text>
  <!-- Mitochondria -->
  <ellipse cx="290" cy="310" rx="26" ry="14" fill="#4a2a00" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="290" y="330" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif">Mitochondria</text>
  <!-- Ribosomes (dots) -->
  <circle cx="150" cy="290" r="4" fill="#86efac"/><circle cx="160" cy="305" r="4" fill="#86efac"/>
  <circle cx="250" cy="280" r="4" fill="#86efac"/>
  <text x="155" y="325" fill="#86efac" font-size="8" font-family="Georgia,serif">Ribosomes</text>
  <!-- Golgi apparatus -->
  <path d="M 125,350 Q 135,340 145,350 Q 155,360 165,350" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 125,342 Q 135,332 145,342 Q 155,352 165,342" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="145" y="375" text-anchor="middle" fill="#7dd3fc" font-size="8" font-family="Georgia,serif">Golgi body</text>
  <!-- Centriole -->
  <rect x="256" y="350" width="22" height="10" rx="3" fill="#fde68a" stroke="#fbbf24" stroke-width="1"/>
  <text x="267" y="372" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif">Centriole</text>
  <!-- Cell membrane label -->
  <text x="54" y="218" fill="#f9a8d4" font-size="8" font-family="Georgia,serif">Cell membrane</text>
  <!-- Cytoplasm label -->
  <text x="200" y="168" text-anchor="middle" fill="#d4d4d8" font-size="8" font-family="Georgia,serif">Cytoplasm</text>

  <!-- Plant Cell (right) -->
  <rect x="405" y="55" width="385" height="430" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="597" y="78" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Plant Cell</text>
  <!-- Cell wall (rect) -->
  <rect x="440" y="115" width="310" height="330" rx="4" fill="none" stroke="#86efac" stroke-width="4"/>
  <!-- Cell membrane inside wall -->
  <rect x="448" y="122" width="294" height="316" rx="3" fill="#1a380a" fill-opacity="0.4" stroke="#a3e635" stroke-width="1.5"/>
  <!-- Nucleus -->
  <ellipse cx="595" cy="250" rx="52" ry="42" fill="#1a1a5a" stroke="#a78bfa" stroke-width="2"/>
  <ellipse cx="595" cy="250" rx="26" ry="20" fill="#3b3b8a" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="595" y="245" text-anchor="middle" fill="#c4b5fd" font-size="8" font-family="Georgia,serif">Nucleolus</text>
  <text x="595" y="263" text-anchor="middle" fill="#e9d5ff" font-size="9" font-family="Georgia,serif">Nucleus</text>
  <!-- Chloroplast -->
  <ellipse cx="500" cy="330" rx="30" ry="16" fill="#166534" stroke="#a3e635" stroke-width="2"/>
  <text x="500" y="356" text-anchor="middle" fill="#a3e635" font-size="8" font-family="Georgia,serif">Chloroplast</text>
  <!-- Vacuole (large central) -->
  <ellipse cx="680" cy="300" rx="50" ry="64" fill="#1a3a6a" fill-opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
  <text x="680" y="298" text-anchor="middle" fill="#7dd3fc" font-size="8" font-family="Georgia,serif">Central</text>
  <text x="680" y="311" text-anchor="middle" fill="#7dd3fc" font-size="8" font-family="Georgia,serif">Vacuole</text>
  <!-- Mitochondria -->
  <ellipse cx="530" cy="185" rx="22" ry="12" fill="#4a2a00" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="530" y="170" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif">Mitochondria</text>
  <!-- Labels -->
  <text x="430" y="108" fill="#86efac" font-size="9" font-family="Georgia,serif" font-weight="bold">Cell Wall</text>
  <!-- Ribosomes -->
  <circle cx="650" cy="186" r="4" fill="#86efac"/><circle cx="660" cy="200" r="4" fill="#86efac"/>
  <text x="662" y="174" fill="#86efac" font-size="8" font-family="Georgia,serif">Ribosomes</text>

  <!-- Comparison table bottom spans both cells? No room. Use label box -->
  <rect x="10" y="460" width="775" height="32" rx="6" fill="#1a3a2a" fill-opacity="0.5" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="481" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Plant Cell only: Cell Wall, Chloroplasts, Large Central Vacuole  |  Animal Cell only: Centrioles, Lysosomes</text>
</svg>