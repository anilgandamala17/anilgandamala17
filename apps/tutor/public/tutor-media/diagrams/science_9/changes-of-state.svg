<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Changes of State of Matter</text>

  <!-- Central boxes for 3 states -->
  <rect x="60" y="200" width="140" height="60" rx="10" fill="#1a5040" stroke="#86efac" stroke-width="2.5"/>
  <text x="130" y="235" text-anchor="middle" fill="#86efac" font-size="16" font-family="Georgia,serif" font-weight="bold">SOLID</text>

  <rect x="330" y="200" width="140" height="60" rx="10" fill="#1a3a6a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="400" y="235" text-anchor="middle" fill="#38bdf8" font-size="16" font-family="Georgia,serif" font-weight="bold">LIQUID</text>

  <rect x="600" y="200" width="140" height="60" rx="10" fill="#4a3a10" stroke="#fde68a" stroke-width="2.5"/>
  <text x="670" y="235" text-anchor="middle" fill="#fde68a" font-size="16" font-family="Georgia,serif" font-weight="bold">GAS</text>

  <!-- Solid → Liquid (Fusion/Melting) -->
  <line x1="200" y1="230" x2="330" y2="230" stroke="#f472b6" stroke-width="2.5"/>
  <polygon points="326,225 336,230 326,235" fill="#f472b6"/>
  <text x="265" y="218" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia,serif" font-weight="bold">Fusion</text>
  <text x="265" y="234" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(Melting) ↑ Heat</text>

  <!-- Liquid → Solid (Solidification) -->
  <line x1="330" y1="248" x2="200" y2="248" stroke="#5eead4" stroke-width="2"/>
  <polygon points="204,243 194,248 204,253" fill="#5eead4"/>
  <text x="265" y="268" text-anchor="middle" fill="#5eead4" font-size="12" font-family="Georgia,serif" font-weight="bold">Solidification</text>
  <text x="265" y="284" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(Freezing) ↓ Heat</text>

  <!-- Liquid → Gas (Vaporisation) -->
  <line x1="470" y1="230" x2="600" y2="230" stroke="#fbbf24" stroke-width="2.5"/>
  <polygon points="596,225 606,230 596,235" fill="#fbbf24"/>
  <text x="535" y="218" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">Vaporisation</text>
  <text x="535" y="234" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(Boiling) ↑ Heat</text>

  <!-- Gas → Liquid (Condensation) -->
  <line x1="600" y1="248" x2="470" y2="248" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="474,243 464,248 474,253" fill="#a78bfa"/>
  <text x="535" y="268" text-anchor="middle" fill="#c4b5fd" font-size="12" font-family="Georgia,serif" font-weight="bold">Condensation</text>
  <text x="535" y="284" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">↓ Heat</text>

  <!-- Solid → Gas (Sublimation) — arc above -->
  <path d="M 200,200 Q 400,60 600,200" fill="none" stroke="#a3e635" stroke-width="2.5"/>
  <polygon points="596,198 606,202 598,208" fill="#a3e635"/>
  <text x="400" y="90" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Sublimation ↑ Heat</text>
  <text x="400" y="110" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Iodine, Dry ice (CO₂), Camphor, Naphthalene</text>

  <!-- Gas → Solid (Deposition) — arc below -->
  <path d="M 600,260 Q 400,400 200,260" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="8,4"/>
  <polygon points="204,262 194,258 200,268" fill="#f472b6"/>
  <text x="400" y="380" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">Deposition / Desublimation ↓ Heat</text>

  <!-- Info boxes -->
  <rect x="15" y="50" width="145" height="100" rx="8" fill="#0f2a1a" fill-opacity="0.8" stroke="#86efac" stroke-width="1.5"/>
  <text x="87" y="72" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia,serif" font-weight="bold">Latent Heat</text>
  <text x="87" y="88" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">of Fusion: heat at</text>
  <text x="87" y="104" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">melting point</text>
  <text x="87" y="120" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(temp unchanged)</text>
  <text x="87" y="140" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia,serif">Ice → Water: 0°C</text>

  <rect x="640" y="50" width="145" height="100" rx="8" fill="#0f2a1a" fill-opacity="0.8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="712" y="72" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Latent Heat</text>
  <text x="712" y="88" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">of Vaporisation:</text>
  <text x="712" y="104" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">heat at boiling</text>
  <text x="712" y="120" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">point (temp fixed)</text>
  <text x="712" y="140" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia,serif">Water: 100°C</text>

  <text x="400" y="490" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">During a change of state, temperature remains constant while heat energy is absorbed/released</text>
</svg>