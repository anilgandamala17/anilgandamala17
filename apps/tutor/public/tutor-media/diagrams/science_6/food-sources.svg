<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>

<rect x="0" y="0" width="800" height="58" fill="#0d2418" opacity="0.9"/>
<text x="400" y="39" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Food: Where Does It Come From?</text>
<rect x="20" y="68" width="370" height="155" fill="#1e4a30" rx="8"/>
<text x="205" y="92" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🌾 From Plants</text>
<text x="205" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Fruits: Mango, Apple, Banana</text>
<text x="205" y="130" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Vegetables: Spinach, Carrot</text>
<text x="205" y="148" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Grains: Rice, Wheat, Maize</text>
<text x="205" y="166" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Pulses: Dal, Chickpea</text>
<rect x="410" y="68" width="370" height="155" fill="#1e4a30" rx="8"/>
<text x="595" y="92" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🐄 From Animals</text>
<text x="595" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Milk, Butter, Cheese, Paneer</text>
<text x="595" y="130" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Eggs (Hen, Duck)</text>
<text x="595" y="148" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Meat, Fish, Seafood</text>
<text x="595" y="166" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Honey (from bees)</text>
<rect x="20" y="231" width="370" height="155" fill="#1e4a30" rx="8"/>
<text x="205" y="255" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🌱 Producers (Plants)</text>
<text x="205" y="275" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Make food by photosynthesis</text>
<text x="205" y="293" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Use sunlight + water + CO₂</text>
<text x="205" y="311" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Called Autotrophs</text>
<text x="205" y="329" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Base of all food chains</text>
<rect x="410" y="231" width="370" height="155" fill="#1e4a30" rx="8"/>
<text x="595" y="255" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🐅 Consumers (Animals)</text>
<text x="595" y="275" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Cannot make own food</text>
<text x="595" y="293" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Herbivores: eat plants</text>
<text x="595" y="311" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Carnivores: eat animals</text>
<text x="595" y="329" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Omnivores: eat both</text>
<rect x="20" y="394" width="760" height="55" fill="#0d2418" rx="6" opacity="1"/>
<text x="400" y="415" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Food Chain Example</text>
<text x="400" y="438" font-family="'Segoe UI',sans-serif" font-size="15" fill="#81c784" text-anchor="middle" font-weight="normal">Grass → Grasshopper → Frog → Snake → Eagle</text>
<rect x="20" y="457" width="760" height="55" fill="#1e4a30" rx="6" opacity="1"/>
<text x="400" y="478" font-family="'Segoe UI',sans-serif" font-size="14" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Some plants and animals provide more than one food item</text>
<text x="400" y="502" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="normal">e.g. Coconut gives oil, milk, and flesh | Cow gives milk and meat</text>

</svg>