<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Food Habits of Living Beings</text>

<rect x="50" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🌿 Herbivores</text><text x="215" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Eat only plants</text><text x="215" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Cow, Goat, Deer</text><text x="215" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Flat teeth for grinding</text><rect x="400" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🥩 Carnivores</text><text x="565" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Eat only animals</text><text x="565" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Lion, Tiger, Eagle</text><text x="565" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Sharp teeth/claws</text><rect x="50" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🍽️ Omnivores</text><text x="215" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Eat both plants & animals</text><text x="215" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Human, Bear, Crow</text><text x="215" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Both types of teeth</text><rect x="400" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🦟 Parasites</text><text x="565" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Live on host body</text><text x="565" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Mosquito, Leech</text><text x="565" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Take food from host</text>
<text x="400" y="545" font-family="'Segoe UI',sans-serif" font-size="15" fill="#aaa" text-anchor="middle" font-weight="normal">Diet determines body structure and teeth type</text>

</svg>