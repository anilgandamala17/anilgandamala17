<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect x="0" y="0" width="800" height="600" fill="#1a3a2a" rx="6"/><rect x="0" y="0" width="800" height="60" fill="#0d2418" rx="6"/><text x="400" y="39" font-family="Segoe UI,sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="normal">Balanced Diet</text>
<rect x="20" y="68" width="760" height="102" fill="#1e4a30" rx="6"/><text x="400" y="90" font-family="Segoe UI,sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="normal">A Balanced Diet = ALL Nutrients in the RIGHT Proportion</text><text x="400" y="116" font-family="Segoe UI,sans-serif" font-size="13" fill="#81c784" text-anchor="middle" font-weight="normal">Carbohydrates • Proteins • Fats • Vitamins • Minerals • Water • Roughage</text><text x="400" y="142" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Eating variety of food from all food groups every day = Balanced Diet</text><rect x="20" y="182" width="370" height="128" fill="#1e4a30" rx="6"/><text x="205" y="208" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🌾 Cereals & Grains</text><text x="205" y="230" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">50% of plate</text><text x="205" y="249" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Rice, Wheat, Millets</text><text x="205" y="268" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Provides carbohydrates (energy)</text><rect x="410" y="182" width="370" height="128" fill="#1e4a30" rx="6"/><text x="595" y="208" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🥦 Vegetables</text><text x="595" y="230" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">25% of plate — all colours</text><text x="595" y="249" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Green, Red, Orange, Yellow</text><text x="595" y="268" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Vitamins, minerals & fibre</text><rect x="20" y="320" width="370" height="128" fill="#1e4a30" rx="6"/><text x="205" y="346" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🍎 Fruits</text><text x="205" y="368" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Fresh seasonal fruits</text><text x="205" y="387" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Mango, Banana, Papaya, Orange</text><text x="205" y="406" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Vitamins C & A, water, fibre</text><rect x="410" y="320" width="370" height="128" fill="#1e4a30" rx="6"/><text x="595" y="346" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🥛 Dairy & Protein</text><text x="595" y="368" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Milk, Curd, Eggs, Dal, Soybean</text><text x="595" y="387" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Calcium, Proteins</text><text x="595" y="406" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Needed for growth & repair</text><rect x="20" y="458" width="760" height="52" fill="#0d2418" rx="6"/><text x="400" y="479" font-family="Segoe UI,sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Why Balance Matters</text><text x="400" y="501" font-family="Segoe UI,sans-serif" font-size="13" fill="#81c784" text-anchor="middle" font-weight="normal">Too much fat → Obesity | Too little protein → Kwashiorkor</text><rect x="20" y="519" width="760" height="52" fill="#1e4a30" rx="6"/><text x="400" y="540" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Missing vitamins cause Deficiency diseases</text><text x="400" y="562" font-family="Segoe UI,sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="normal">A balanced diet prevents all nutritional diseases!</text>
</svg>