<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Spinning: Fibre to Yarn</text>

<rect x="50" y="80" width="700" height="60" fill="#1e4a30" rx="8" opacity="0.9"/>
<text x="400" y="118" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Process: Cotton Bolls → Ginning → Fibres → Spinning → Yarn</text>
<rect x="50" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Step 1: Ginning</text><text x="215" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Remove seeds from cotton</text><text x="215" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Done by hand or machine</text><text x="215" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Gives clean cotton fibres</text><rect x="400" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Step 2: Combing</text><text x="565" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Align fibres in one direction</text><text x="565" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Remove impurities</text><text x="565" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Creates smooth fibre bundle</text><rect x="50" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Step 3: Spinning</text><text x="215" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Twist fibres together</text><text x="215" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Makes yarn/thread</text><text x="215" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Done on charkha or machines</text><rect x="400" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">Traditional Tool</text><text x="565" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Charkha (spinning wheel)</text><text x="565" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Used by Mahatma Gandhi</text><text x="565" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Symbol of self-reliance</text>
<text x="400" y="545" font-family="'Segoe UI',sans-serif" font-size="15" fill="#aaa" text-anchor="middle" font-weight="normal">Spinning twists fibres into long, strong yarn</text>

</svg>