<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .node { fill: #334155; stroke: #94a3b8; stroke-width: 2; rx: 20; ry: 20; }
      .central { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 3; rx: 30; ry: 30; }
      .link { stroke: #64748b; stroke-width: 1.5; }
      .label { font-size: 10px; font-weight: bold; text-anchor: middle; fill: #fff; }
      .role { font-size: 8px; text-anchor: middle; fill: #cbd5e1; }
    </style>
  </defs>
  
  <rect width="400" height="300" fill="#1a3a2a" />
  <text x="20" y="30" class="title">CHARACTER RELATIONSHIP WEB</text>

  <g transform="translate(200, 150)">
    <!-- Links -->
    <line x1="0" y1="0" x2="0" y2="-80" class="link" />
    <line x1="0" y1="0" x2="100" y2="50" class="link" />
    <line x1="0" y1="0" x2="-100" y2="50" class="link" />
    <line x1="-100" y1="50" x2="100" y2="50" class="link" stroke-dasharray="4"/> <!-- Conflict link -->

    <!-- Central Character (Protagonist) -->
    <rect x="-60" y="-30" width="120" height="60" class="central" />
    <text x="0" y="0" class="label" fontSize="12">PROTAGONIST</text>
    <text x="0" y="15" class="role">Hero / Main Character</text>

    <!-- Antagonist -->
    <g transform="translate(100, 50)">
        <rect x="-50" y="-20" width="100" height="40" class="node" stroke="#ef4444" />
        <text x="0" y="0" class="label">ANTAGONIST</text>
        <text x="0" y="12" class="role">Villain / Rival</text>
    </g>

    <!-- Support Character -->
    <g transform="translate(-100, 50)">
        <rect x="-50" y="-20" width="100" height="40" class="node" stroke="#3b82f6" />
        <text x="0" y="0" class="label">SUPPORT</text>
        <text x="0" y="12" class="role">Friend / Mentor</text>
    </g>

    <!-- Conflict/Theme -->
    <g transform="translate(0, -80)">
        <rect x="-50" y="-20" width="100" height="40" class="node" stroke="#fbbf24" stroke-dasharray="2" fill="none" />
        <text x="0" y="5" class="label">MAIN CONFLICT</text>
    </g>
  </g>
</svg>
