<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Reactivity &amp; Chemical Properties</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">How metals react with oxygen, water, acids, and other metals</text>

<rect x="25" y="85" width="370" height="230" fill="none" stroke="#ffd54f" stroke-width="2" rx="10"/>
<text x="210" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Displacement Reaction</text>
<text x="210" y="140" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">A more reactive metal displaces a</text>
<text x="210" y="160" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">less reactive metal from its salt solution.</text>

<rect x="50" y="180" width="320" height="60" fill="rgba(255,213,79,0.1)" stroke="#ffd54f" stroke-width="1" rx="5"/>
<text x="210" y="215" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">CuSO₄ + Zn → ZnSO₄ + Cu</text>
<text x="210" y="260" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle">Blue solution turns colorless (Red copper deposits)</text>
<text x="210" y="295" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f48fb1" text-anchor="middle">Zn is MORE reactive than Copper</text>

<rect x="405" y="85" width="370" height="230" fill="none" stroke="#86efac" stroke-width="2" rx="10"/>
<text x="590" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Reactivity with Acids / Bases</text>
<text x="430" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="start">Metals + Dilute Acids → H₂ (gas) + Salt</text>
<text x="590" y="170" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">"Pop" sound test for Hydrogen gas</text>

<text x="430" y="210" font-family="'Segoe UI',sans-serif" font-size="13" fill="#fb923c" text-anchor="start">Non-metals generally do not react with acids</text>

<text x="430" y="250" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="start">Metals + Sodium Hydroxide → H₂ (gas)</text>
<text x="430" y="275" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="start">Only reactive metals like Al, Zn react with bases</text>

<line x1="20" y1="335" x2="780" y2="335" stroke="#86efac" stroke-width="1"/>

<rect x="25" y="350" width="750" height="230" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="375" font-family="'Segoe UI',sans-serif" font-size="16" fill="#86efac" text-anchor="middle" font-weight="bold">Reactivity Series (The Hierarchy)</text>

<text x="400" y="415" font-family="'Segoe UI',sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Potassium (K) &gt; Sodium (Na) &gt; Calcium (Ca)</text>
<text x="400" y="445" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Magnesium (Mg) &gt; Aluminium (Al) &gt; Zinc (Zn)</text>
<text x="400" y="475" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Iron (Fe) &gt; Lead (Pb) &gt; </text>
<text x="400" y="505" font-family="'Segoe UI',sans-serif" font-size="15" fill="#f48fb1" text-anchor="middle" font-weight="bold">Copper (Cu) &gt; Mercury (Hg) &gt; Silver (Ag) &gt; Gold (Au)</text>

<path d="M100,410 L100,520" fill="none" stroke="#f48fb1" stroke-width="2" marker-end="url(#arrowdn)"/>
<text x="120" y="470" font-family="'Segoe UI',sans-serif" font-size="11" fill="#f48fb1" transform="rotate(90, 120, 470)">Decreasing Reactivity</text>

<text x="400" y="555" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Storage: Na and K are very reactive to air/water → stored in kerosene</text>

<defs>
  <marker id="arrowdn" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
    <path d="M0,0 L5,10 L10,0 Z" fill="#f48fb1" />
  </marker>
</defs>
</svg>
