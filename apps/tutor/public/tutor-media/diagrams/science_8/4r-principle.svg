<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Environmental Impact &amp; 4R Principle</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Plastics take several hundred years to decompose | Major threat to environment</text>

<rect x="25" y="90" width="370" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="210" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#f48fb1" text-anchor="middle" font-weight="bold">Environmental Hazards</text>
<text x="210" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Non-biodegradable nature</text>
<text x="210" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Landfills overflow with plastic waste</text>
<text x="210" y="185" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Chokes respiratory system of animals</text>
<text x="210" y="205" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Burning releases poisonous fumes / CO₂</text>
<text x="210" y="225" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Clogs drains causing urban flooding</text>
<text x="210" y="260" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Harmful to all life forms on Earth</text>

<rect x="405" y="90" width="370" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="590" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">The 4R Principle</text>

<circle cx="500" cy="170" r="30" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2"/>
<text x="500" y="175" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">REDUCE</text>

<circle cx="680" cy="170" r="30" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2"/>
<text x="680" y="175" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">REUSE</text>

<circle cx="500" cy="250" r="30" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2"/>
<text x="500" y="255" font-family="'Segoe UI',sans-serif" font-size="10" fill="#fff" text-anchor="middle">RECYCLE</text>

<circle cx="680" cy="250" r="30" fill="rgba(134,239,172,0.1)" stroke="#86efac" stroke-width="2"/>
<text x="680" y="255" font-family="'Segoe UI',sans-serif" font-size="10" fill="#fff" text-anchor="middle">RECOVER</text>

<text x="590" y="140" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Habits for an Eco-friendly Citizen</text>

<line x1="20" y1="310" x2="780" y2="310" stroke="#86efac" stroke-width="1"/>

<rect x="25" y="325" width="750" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="355" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Solutions for Plastic Pollution</text>
<text x="100" y="390" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">1. Use Cotton or Jute bags instead of plastic</text>
<text x="100" y="420" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">2. Carry own water bottle / steel containers</text>
<text x="100" y="450" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">3. Segregate dry and wet waste at source</text>
<text x="100" y="480" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">4. Do not throw wrappers / bottles on the road</text>

<text x="400" y="540" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Biodegradable (Natural Decay) vs Non-biodegradable (No Decay)</text>
<text x="400" y="565" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Paper (2-4 weeks) vs Tin/Aluminium (100-500 yrs) vs Plastic bags (Millions of yrs)</text>
</svg>