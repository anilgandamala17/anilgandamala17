<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Harvesting &amp; Storage</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Final steps of crop production to ensure food security</text>

<rect x="20" y="90" width="370" height="220" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Harvesting Process</text>
<text x="205" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">1. Cutting &amp; Gathering</text>
<text x="205" y="165" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Manual (Sickle) or Machine (Harvester)</text>
<text x="205" y="195" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">2. Threshing</text>
<text x="205" y="215" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Separating grain from stalks</text>
<text x="205" y="245" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">3. Winnowing</text>
<text x="205" y="265" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Separating grain from chaff using wind</text>
<text x="205" y="295" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Combine: Performs both harvesting &amp; threshing</text>

<rect x="410" y="90" width="370" height="220" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="115" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Storage (Protection)</text>
<text x="595" y="145" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Moisture &amp; Pests</text>
<text x="595" y="165" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Grains must be dried before storage</text>
<text x="595" y="195" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Silos &amp; Granaries</text>
<text x="595" y="215" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Large scale metal or concrete storage</text>
<text x="595" y="245" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Domestic Methods</text>
<text x="595" y="265" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Neem leaves/insecticides to prevent rot</text>
<text x="595" y="295" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">FCI: Buffer stock for food security</text>

<rect x="20" y="330" width="760" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="355" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Harvest Festivals in India</text>
<text x="100" y="390" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Pongal (Tamil Nadu)</text>
<text x="100" y="420" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Baisakhi (Punjab)</text>
<text x="100" y="450" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Bihu (Assam)</text>
<text x="450" y="390" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Makar Sankranti (Pan-India)</text>
<text x="450" y="420" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Lohri (North India)</text>
<text x="450" y="450" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Nabanna (West Bengal)</text>

<text x="400" y="500" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Animal Husbandry: Rearing animals for food on large scale</text>
<text x="400" y="525" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Example: Cod liver oil is rich in Vitamin D (from fish)</text>
</svg>