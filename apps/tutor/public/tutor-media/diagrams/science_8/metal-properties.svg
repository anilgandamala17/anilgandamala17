<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Metals and Non-metals</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Elements classified based on physical and chemical properties</text>

<rect x="25" y="85" width="370" height="230" fill="none" stroke="#ffd54f" stroke-width="2" rx="10"/>
<text x="210" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Physical Properties: Metals</text>
<text x="50" y="140" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">1. Malleable: Can be beaten into sheets</text>
<text x="50" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">2. Ductile: Can be drawn into wires</text>
<text x="50" y="190" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">3. Lustrous: Have a shiny appearance</text>
<text x="50" y="215" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">4. Sonorous: Produce ringing sound</text>
<text x="50" y="240" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">5. Good conductors of heat / electricity</text>
<text x="210" y="280" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle">Ex: Iron, Gold, Silver, Copper, Aluminium</text>
<text x="210" y="300" font-family="'Segoe UI',sans-serif" font-size="11" fill="#f48fb1" text-anchor="middle">Exceptions: Mercury (liquid), Sodium/Potassium (soft)</text>

<rect x="405" y="85" width="370" height="230" fill="none" stroke="#86efac" stroke-width="2" rx="10"/>
<text x="590" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Physical Properties: Non-metals</text>
<text x="430" y="140" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">1. Brittle: Break into pieces on hammering</text>
<text x="430" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">2. Non-ductile / Non-malleable</text>
<text x="430" y="190" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">3. Dull appearance (Non-lustrous)</text>
<text x="430" y="215" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">4. Poor conductors of heat / electricity</text>
<text x="430" y="240" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">5. Not sonorous</text>
<text x="590" y="280" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Ex: Sulphur, Carbon, Oxygen, Phosphorus</text>
<text x="590" y="300" font-family="'Segoe UI',sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Exception: Graphite / Iodine (lustrous)</text>

<line x1="20" y1="335" x2="780" y2="335" stroke="#fb923c" stroke-width="1"/>

<rect x="25" y="350" width="750" height="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="10"/>
<text x="400" y="375" font-family="'Segoe UI',sans-serif" font-size="16" fill="#fb923c" text-anchor="middle" font-weight="bold">Uses of Metals &amp; Non-metals</text>

<rect x="50" y="390" width="340" height="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
<text x="220" y="415" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Metals</text>
<text x="220" y="440" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">Electrical wires, Cooking utensils,</text>
<text x="220" y="460" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">Machinery, Bridges, Jewelry</text>

<rect x="410" y="390" width="340" height="90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="8"/>
<text x="580" y="415" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Non-metals</text>
<text x="580" y="440" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">O₂ for life, N / P in fertilizers,</text>
<text x="580" y="460" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="middle">Cl for water disinfection, I in antiseptic</text>

<text x="400" y="540" font-family="'Segoe UI',sans-serif" font-size="13" fill="#fb923c" text-anchor="middle" font-weight="bold">Oxide Nature: Metal Oxides = Basic | Non-metal Oxides = Acidic</text>
<text x="400" y="565" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">Copper + Moist Air → Greenish coat (Copper Hydroxide + Carbonate) | Iron + O₂ + H₂O → Reddish rust</text>
</svg>
