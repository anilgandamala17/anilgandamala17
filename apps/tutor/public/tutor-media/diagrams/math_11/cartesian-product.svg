<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 12px; font-weight: bold; }
      .grid-line { stroke: #94a3b8; stroke-width: 0.5; stroke-dasharray: 2; }
      .axis { stroke: #ffffff; stroke-width: 1.5; }
      .point { fill: #fcd34d; stroke: #fbbf24; stroke-width: 1; }
      .desc { fill: #93c5fd; font-size: 10px; font-style: italic; }
      .formula { fill: #4ade80; font-size: 14px; font-weight: bold; font-family: 'Courier New', monospace; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Cartesian Product: A × B</text>
    
    <text x="200" y="55" text-anchor="middle" class="formula">A = {1, 2}, B = {3, 4, 5}</text>
    
    <!-- Coordinate Grid -->
    <g transform="translate(140, 70)">
      <!-- Axes -->
      <line x1="0" y1="120" x2="150" y2="120" class="axis" marker-end="url(#arrowhead)" />
      <line x1="0" y1="120" x2="0" y2="0" class="axis" marker-end="url(#arrowhead)" />
      
      <!-- Labels -->
      <text x="140" y="135" class="label" font-size="10">Set A</text>
      <text x="-35" y="10" class="label" font-size="10" transform="rotate(-90, -35, 10)">Set B</text>

      <!-- Grid and Points -->
      <!-- x=40 (1), x=80 (2) -->
      <!-- y=90 (3), y=60 (4), y=30 (5) -->
      
      <line x1="40" y1="120" x2="40" y2="0" class="grid-line" />
      <line x1="80" y1="120" x2="80" y2="0" class="grid-line" />
      
      <line x1="0" y1="90" x2="150" y2="90" class="grid-line" />
      <line x1="0" y1="60" x2="150" y2="60" class="grid-line" />
      <line x1="0" y1="30" x2="150" y2="30" class="grid-line" />

      <!-- Ordered Pairs -->
      <circle cx="40" cy="90" r="4" class="point" /> <text x="45" y="85" fill="#fcd34d" font-size="8">(1,3)</text>
      <circle cx="40" cy="60" r="4" class="point" /> <text x="45" y="55" fill="#fcd34d" font-size="8">(1,4)</text>
      <circle cx="40" cy="30" r="4" class="point" /> <text x="45" y="25" fill="#fcd34d" font-size="8">(1,5)</text>
      
      <circle cx="80" cy="90" r="4" class="point" /> <text x="85" y="85" fill="#fcd34d" font-size="8">(2,3)</text>
      <circle cx="80" cy="60" r="4" class="point" /> <text x="85" y="55" fill="#fcd34d" font-size="8">(2,4)</text>
      <circle cx="80" cy="30" r="4" class="point" /> <text x="85" y="25" fill="#fcd34d" font-size="8">(2,5)</text>

      <!-- Axis Ticks -->
      <text x="40" y="135" text-anchor="middle" class="label" font-size="9">1</text>
      <text x="80" y="135" text-anchor="middle" class="label" font-size="9">2</text>
      <text x="-15" y="95" text-anchor="end" class="label" font-size="9">3</text>
      <text x="-15" y="65" text-anchor="end" class="label" font-size="9">4</text>
      <text x="-15" y="35" text-anchor="end" class="label" font-size="9">5</text>
    </g>

    <text x="200" y="240" text-anchor="middle" fill="#fcd34d" font-size="11">A × B = {(a, b) : a ∈ A and b ∈ B}</text>
  </g>
</svg>
