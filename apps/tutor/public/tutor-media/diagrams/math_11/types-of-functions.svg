<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 11px; font-weight: bold; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; opacity: 0.6; }
      .graph { stroke: #4ade80; stroke-width: 2; fill: none; }
      .graph-identity { stroke: #60a5fa; stroke-width: 2; fill: none; }
      .graph-const { stroke: #f87171; stroke-width: 2; fill: none; }
      .sub-label { fill: #fcd34d; font-size: 9px; text-anchor: middle; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Standard Function Graphs</text>
    
    <!-- Identity Function -->
    <g transform="translate(60, 100)">
      <line x1="-40" y1="0" x2="40" y2="0" class="axis" />
      <line x1="0" y1="-40" x2="0" y2="40" class="axis" />
      <line x1="-30" y1="30" x2="30" y2="-30" class="graph-identity" />
      <text x="0" y="55" class="sub-label">Identity: f(x) = x</text>
    </g>

    <!-- Constant Function -->
    <g transform="translate(200, 100)">
      <line x1="-40" y1="0" x2="40" y2="0" class="axis" />
      <line x1="0" y1="-40" x2="0" y2="40" class="axis" />
      <line x1="-40" y1="-20" x2="40" y2="-20" class="graph-const" />
      <text x="0" y="55" class="sub-label">Constant: f(x) = c</text>
    </g>

    <!-- Modulus Function -->
    <g transform="translate(340, 100)">
      <line x1="-40" y1="0" x2="40" y2="0" class="axis" />
      <line x1="0" y1="-40" x2="0" y2="40" class="axis" />
      <path d="M -30,-30 L 0,0 L 30,-30" class="graph" />
      <text x="0" y="55" class="sub-label">Modulus: f(x) = |x|</text>
    </g>

    <!-- Signum/Polynomial Note -->
    <g transform="translate(200, 200)">
        <text x="0" y="10" text-anchor="middle" fill="#94a3b8" font-size="10">Functions are the bedrock of Calculus</text>
        <text x="0" y="25" text-anchor="middle" fill="#93c5fd" font-size="9" font-style="italic">Domain: Inputs (x) | Range: Outputs (y)</text>
    </g>
  </g>
</svg>
