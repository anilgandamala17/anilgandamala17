<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 11px; font-weight: bold; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; }
      .grid { stroke: #334155; stroke-width: 0.5; stroke-dasharray: 2; }
      .vector { stroke: #fbbf24; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .point { fill: #4ade80; stroke: #22c55e; stroke-width: 1; }
      .dimension { stroke: #fcd34d; stroke-width: 1; stroke-dasharray: 3; }
      .sub-label { fill: #fcd34d; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">The Argand Plane (z = a + bi)</text>
    
    <g transform="translate(140, 140)">
      <!-- Grid -->
      <line x1="-100" y1="0" x2="100" y2="0" class="axis" marker-end="url(#arrowhead)" />
      <line x1="0" y1="80" x2="0" y2="-80" class="axis" marker-end="url(#arrowhead)" />
      
      <!-- Labels -->
      <text x="105" y="15" class="label">Real Axis</text>
      <text x="5" y="-85" class="label">Imaginary Axis</text>

      <!-- Plotting a point z = 70 + 50i -->
      <line x1="0" y1="0" x2="70" y2="-50" class="vector" />
      <circle cx="70" cy="-50" r="5" class="point" />
      
      <text x="75" y="-60" class="label" fill="#4ade80">z = a + bi</text>
      <text x="80" y="-45" class="sub-label" fill="#fcd34d">(a, b)</text>

      <!-- Components -->
      <line x1="0" y1="0" x2="70" y2="0" class="dimension" stroke="#4ade80" />
      <text x="35" y="15" text-anchor="middle" class="sub-label" fill="#4ade80">a (Real)</text>
      
      <line x1="70" y1="0" x2="70" y2="-50" class="dimension" stroke="#60a5fa" />
      <text x="85" y="-25" class="sub-label" fill="#60a5fa" transform="rotate(-90, 85, -25)">b (Imag)</text>

      <!-- Modulus & Argument -->
      <text x="20" y="-30" fill="#fbbf24" font-size="9" transform="rotate(-35, 20, -30)">|z|</text>
      <path d="M 20,0 A 20,20 0 0 0 16,-12" fill="none" stroke="#fbbf24" />
      <text x="30" y="-10" fill="#fcd34d" font-size="9">θ</text>
    </g>

    <text x="200" y="250" text-anchor="middle" fill="#93c5fd" font-size="10">|z| = √(a² + b²)  |  tan θ = b/a</text>
  </g>
</svg>
