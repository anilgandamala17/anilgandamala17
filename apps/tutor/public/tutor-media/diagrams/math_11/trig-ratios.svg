<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 12px; font-weight: bold; }
      .circle { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .axis { stroke: #94a3b8; stroke-width: 1; opacity: 0.6; }
      .radius { stroke: #fbbf24; stroke-width: 2; }
      .trig-line { stroke: #f87171; stroke-width: 2; }
      .formula { fill: #fcd34d; font-size: 14px; font-weight: bold; font-family: 'Courier New', monospace; }
      .sub-label { fill: #4ade80; font-size: 10px; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Trigonometric Ratios: Unit Circle</text>
    
    <!-- Unit Circle -->
    <g transform="translate(120, 130)">
      <circle cx="0" cy="0" r="70" class="circle" />
      <line x1="-90" y1="0" x2="90" y2="0" class="axis" />
      <line x1="0" y1="-90" x2="0" y2="90" class="axis" />
      
      <!-- Radius R at angle theta -->
      <line x1="0" y1="0" x2="49.5" y2="-49.5" class="radius" /> <!-- 45 degrees -->
      <circle cx="49.5" cy="-49.5" r="4" fill="#fbbf24" />
      
      <!-- Projection Lines -->
      <line x1="49.5" y1="0" x2="49.5" y2="-49.5" class="trig-line" stroke="#60a5fa" stroke-dasharray="3" /> <!-- Sine -->
      <line x1="0" y1="0" x2="49.5" y2="0" class="trig-line" stroke="#4ade80" /> <!-- Cosine -->
      
      <text x="55" y="-55" class="label" fill="#fcd34d">(cos θ, sin θ)</text>
      <path d="M 20,0 A 20,20 0 0 0 14,-14" fill="none" stroke="#fcd34d" stroke-width="1" />
      <text x="25" y="-10" fill="#fcd34d" font-size="10">θ</text>
      
      <text x="25" y="15" class="sub-label">cos θ</text>
      <text x="55" y="-25" class="sub-label" fill="#60a5fa" transform="rotate(-90, 55, -25)">sin θ</text>
    </g>

    <!-- Formula Box -->
    <g transform="translate(250, 80)">
      <text x="0" y="0" class="formula">sin θ = opp / hyp</text>
      <text x="0" y="30" class="formula">cos θ = adj / hyp</text>
      <text x="0" y="60" class="formula">tan θ = sin θ / cos θ</text>
      <text x="0" y="100" fill="#93c5fd" font-size="10" font-style="italic">Radius = 1 (Unit Circle)</text>
    </g>
  </g>
</svg>
