<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .title { fill: #fef08a; font-size: 18px; font-weight: bold; }
      .label { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .universal { fill: none; stroke: #94a3b8; stroke-width: 1.5; }
      .set-a { fill: rgba(96, 165, 250, 0.4); stroke: #3b82f6; stroke-width: 2; }
      .set-b { fill: rgba(248, 113, 113, 0.4); stroke: #ef4444; stroke-width: 2; }
      .intersection { fill: #c084fc; stroke: #a855f7; stroke-width: 1; }
      .u-label { fill: #94a3b8; font-size: 12px; font-weight: bold; }
    </style>
  </defs>
  <g transform="translate(75, 10) scale(1.55)">
    <text x="200" y="25" text-anchor="middle" class="title">Venn Diagrams: Visualizing Relationships</text>
    
    <!-- Universal Set frame -->
    <rect x="20" y="45" width="360" height="200" class="universal" />
    <text x="365" y="60" class="u-label">U</text>

    <!-- Two Overlapping Sets -->
    <g transform="translate(100, 140)">
      <!-- Circle A -->
      <circle cx="0" cy="0" r="50" class="set-a" />
      <!-- Circle B -->
      <circle cx="50" cy="0" r="50" class="set-b" />
      
      <!-- Manually shading the intersection area as a placeholder for visual clarity -->
      <path d="M 25, -43.3 A 50,50 0 0 1 25, 43.3 A 50,50 0 0 1 25, -43.3" class="intersection" opacity="0.6" />
      
      <text x="-25" y="0" text-anchor="middle" class="label">A</text>
      <text x="75" y="0" text-anchor="middle" class="label">B</text>
      <text x="25" y="0" text-anchor="middle" fill="#ffffff" font-size="8" font-weight="bold">A∩B</text>
    </g>

    <text x="200" y="270" text-anchor="middle" fill="#fcd34d" font-size="11">Venn diagrams help solve problems using n(A∪B) = n(A)+n(B)−n(A∩B)</text>
  </g>
</svg>
