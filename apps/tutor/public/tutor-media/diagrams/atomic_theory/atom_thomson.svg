<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <!-- Thomson Plum Pudding Model -->
  <text x="200" y="30" font-size="14" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Thomson's Model (1904)</text>
  <!-- Positive sphere (pudding) -->
  <circle cx="200" cy="135" r="85" fill="rgba(252,165,165,0.12)" stroke="#fca5a5" stroke-width="2"/>
  <!-- Positive charge label -->
  <text x="200" y="80" font-size="10" fill="#fca5a5" text-anchor="middle" font-family="monospace">+ + + + +</text>
  <text x="200" y="95" font-size="10" fill="#fca5a5" text-anchor="middle" font-family="monospace">Positive charge</text>
  <text x="200" y="108" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(diffuse cloud)</text>
  <!-- Electrons (plums) -->
  <circle cx="160" cy="130" r="8" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="160" y="134" font-size="9" fill="#1a3a2a" text-anchor="middle" font-family="monospace" font-weight="bold">e⁻</text>
  <circle cx="200" cy="115" r="8" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="200" y="119" font-size="9" fill="#1a3a2a" text-anchor="middle" font-family="monospace" font-weight="bold">e⁻</text>
  <circle cx="240" cy="130" r="8" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="240" y="134" font-size="9" fill="#1a3a2a" text-anchor="middle" font-family="monospace" font-weight="bold">e⁻</text>
  <circle cx="175" cy="155" r="8" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="175" y="159" font-size="9" fill="#1a3a2a" text-anchor="middle" font-family="monospace" font-weight="bold">e⁻</text>
  <circle cx="225" cy="155" r="8" fill="#93c5fd" stroke="#ffffff" stroke-width="1.5"/>
  <text x="225" y="159" font-size="9" fill="#1a3a2a" text-anchor="middle" font-family="monospace" font-weight="bold">e⁻</text>
  <!-- Legend -->
  <circle cx="60" cy="220" r="7" fill="#93c5fd" stroke="#ffffff" stroke-width="1"/>
  <text x="75" y="225" font-size="10" fill="#93c5fd" font-family="monospace">Electron (e⁻)</text>
  <circle cx="60" cy="245" r="7" fill="rgba(252,165,165,0.3)" stroke="#fca5a5" stroke-width="1"/>
  <text x="75" y="250" font-size="10" fill="#fca5a5" font-family="monospace">Positive sphere</text>
  <text x="200" y="270" font-size="9" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Atom is electrically neutral overall</text>
</svg>
