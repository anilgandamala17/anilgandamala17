<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <!-- Dalton Model: solid indivisible sphere -->
  <circle cx="200" cy="130" r="80" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="200" cy="130" r="78" fill="rgba(255,255,255,0.06)"/>
  <!-- Hatching to show solid sphere -->
  <line x1="140" y1="80" x2="260" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="125" y1="100" x2="275" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="120" y1="120" x2="280" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="120" y1="140" x2="280" y2="140" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="122" y1="160" x2="278" y2="160" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="135" y1="180" x2="265" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Center dot -->
  <circle cx="200" cy="130" r="4" fill="#ffffff"/>
  <!-- Labels -->
  <text x="200" y="40" font-size="14" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Dalton's Atomic Model (1803)</text>
  <text x="200" y="240" font-size="11" fill="#ffffff" text-anchor="middle" font-family="monospace">Solid, indivisible sphere</text>
  <text x="200" y="258" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">All atoms of same element are identical</text>
  <!-- Arrow pointing to sphere -->
  <line x1="310" y1="130" x2="285" y2="130" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="340" y="125" font-size="10" fill="#93c5fd" text-anchor="middle" font-family="monospace">Atom</text>
  <text x="340" y="138" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">(solid ball)</text>
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#93c5fd"/>
    </marker>
  </defs>
</svg>
