<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .label { font-size: 10px; fill: #94a3b8; }
      .metal-box { fill: #334155; stroke: #475569; rx: 4; }
    </style>
    <linearGradient id="reactivityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">REACTIVITY SERIES OF METALS</text>
  
  <!-- Arrow Gradient -->
  <polygon points="60,60 80,60 80,240 60,240 70,260" fill="url(#reactivityGrad)" />
  <text x="40" y="70" class="label" transform="rotate(-90 40,70)">MOST REACTIVE</text>
  <text x="40" y="230" class="label" transform="rotate(-90 40,230)">LEAST REACTIVE</text>

  <!-- Metals List -->
  <g transform="translate(120, 60)">
    <rect x="0" y="0" width="100" height="20" class="metal-box" />
    <text x="10" y="14" fontSize="11" fontWeight="bold">K (Potassium)</text>
    
    <rect x="0" y="25" width="100" height="20" class="metal-box" />
    <text x="10" y="39" fontSize="11" fontWeight="bold">Na (Sodium)</text>
    
    <rect x="0" y="50" width="100" height="20" class="metal-box" />
    <text x="10" y="64" fontSize="11">Ca (Calcium)</text>
    
    <rect x="0" y="75" width="100" height="20" class="metal-box" />
    <text x="10" y="89" fontSize="11">Mg (Magnesium)</text>
    
    <rect x="0" y="100" width="100" height="20" class="metal-box" />
    <text x="10" y="114" fontSize="11">Al (Aluminum)</text>
    
    <rect x="0" y="125" width="100" height="20" class="metal-box" />
    <text x="10" y="139" fontSize="11">Zn (Zinc)</text>
    
    <rect x="0" y="150" width="100" height="20" class="metal-box" />
    <text x="10" y="164" fontSize="11">Fe (Iron)</text>
    
    <rect x="0" y="175" width="100" height="20" class="metal-box" />
    <text x="10" y="189" fontSize="11">Cu (Copper)</text>
    
    <rect x="0" y="200" width="100" height="20" class="metal-box" />
    <text x="10" y="214" fontSize="11" fill="#fbbf24">Ag (Silver)</text>
    
    <rect x="0" y="225" width="100" height="20" class="metal-box" />
    <text x="10" y="239" fontSize="11" fill="#fbbf24">Au (Gold)</text>
  </g>
  
  <!-- Info Box -->
  <g transform="translate(240, 100)">
    <text x="0" y="0" fontSize="10" class="label">Reactions:</text>
    <text x="0" y="20" fontSize="10" fill="#ef4444">- Explodes with water</text>
    <text x="0" y="35" fontSize="10" fill="#f97316">- Reacts with acid</text>
    <text x="0" y="50" fontSize="10" fill="#3b82f6">- No reaction</text>
  </g>
</svg>
