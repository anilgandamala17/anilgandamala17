<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">RESOURCE CONSERVATION</text>
  
  <text x="200" y="100" text-anchor="middle" font-size="14" font-style="italic" fill="#fff">"There is enough for everybody's need..."</text>
  <text x="200" y="130" text-anchor="middle" font-size="14" font-style="italic" fill="#ef4444">"...not for any body's greed."</text>
  <text x="200" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">- Mahatma Gandhi</text>
  
  <g transform="translate(100, 200)">
    <circle cx="20" cy="20" r="15" fill="#4ade80" /> <text x="20" y="25" text-anchor="middle" fill="#000" font-weight="bold">R</text>
    <text x="20" y="50" text-anchor="middle" font-size="10">Reduce</text>
    
    <circle cx="100" cy="20" r="15" fill="#4ade80" /> <text x="100" y="25" text-anchor="middle" fill="#000" font-weight="bold">R</text>
    <text x="100" y="50" text-anchor="middle" font-size="10">Reuse</text>

    <circle cx="180" cy="20" r="15" fill="#4ade80" /> <text x="180" y="25" text-anchor="middle" fill="#000" font-weight="bold">R</text>
    <text x="180" y="50" text-anchor="middle" font-size="10">Recycle</text>
  </g>
</svg>
