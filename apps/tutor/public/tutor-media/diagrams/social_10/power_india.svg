<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">POWER SHARING IN INDIA</text>
  
  <g transform="translate(100, 80)">
    <!-- Linguistic -->
    <rect x="0" y="0" width="200" height="40" fill="#334155" rx="4" />
    <text x="100" y="25" text-anchor="middle" fill="#fff">Linguistic States</text>
    <text x="220" y="25" text-anchor="start" font-size="10" fill="#94a3b8">(Tamil Nadu, etc)</text>

    <!-- Reservation -->
    <rect x="0" y="60" width="200" height="40" fill="#334155" rx="4" />
    <text x="100" y="85" text-anchor="middle" fill="#fff">Reserved Constituencies</text>
    <text x="220" y="85" text-anchor="start" font-size="10" fill="#94a3b8">(SC/ST)</text>

    <!-- Coalition -->
    <rect x="0" y="120" width="200" height="40" fill="#334155" rx="4" />
    <text x="100" y="145" text-anchor="middle" fill="#fff">Coalition Govt</text>
    <text x="220" y="145" text-anchor="start" font-size="10" fill="#94a3b8">(Alliance)</text>
  </g>
  
  <text x="200" y="230" text-anchor="middle" font-size="12">Unity in Diversity</text>
</svg>
