<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">DEVELOPMENT INDICATORS</text>
  
  <rect x="40" y="60" width="320" height="150" fill="#1e293b" rx="4" />
  
  <text x="60" y="90" fill="#60a5fa" font-weight="bold">PCI (Per Capita Income)</text>
  <text x="80" y="110" font-size="12">= Total Income / Total Population</text>

  <text x="60" y="140" fill="#4ade80" font-weight="bold">GDP (Gross Domestic Product)</text>
  <text x="80" y="160" font-size="12">Total value of goods &amp; services</text>

  <text x="60" y="190" fill="#f472b6" font-weight="bold">Limitations of Average</text>
  <text x="80" y="210" font-size="12">Hides disparities (Rich vs Poor)</text>
</svg>
