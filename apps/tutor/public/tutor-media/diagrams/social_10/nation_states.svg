<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">RISE OF NATION STATES</text>
  
  <g transform="translate(100, 80)">
    <!-- Fragmented Map -->
    <path d="M 0 0 L 50 10 L 40 60 L 0 50 Z" fill="#334155" stroke="#94a3b8" />
    <path d="M 60 10 L 110 0 L 120 50 L 70 60 Z" fill="#334155" stroke="#94a3b8" />
    <path d="M 10 70 L 60 80 L 50 130 L 0 120 Z" fill="#334155" stroke="#94a3b8" />
    
    <text x="60" y="-10" text-anchor="middle" font-size="10" fill="#94a3b8">Kingdoms (Pre-1848)</text>
    
    <!-- Arrow -->
    <path d="M 140 60 L 180 60" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Unified Map -->
    <rect x="200" y="20" width="100" height="100" fill="#1e40af" stroke="#60a5fa" rx="4" />
    <text x="250" y="70" text-anchor="middle" font-weight="bold">NATION STATE</text>
    <text x="250" y="140" text-anchor="middle" font-size="10" fill="#94a3b8">Common Identity</text>
  </g>
  
  <text x="200" y="220" text-anchor="middle" font-size="12">Language + Culture + History = Nation</text>
</svg>
