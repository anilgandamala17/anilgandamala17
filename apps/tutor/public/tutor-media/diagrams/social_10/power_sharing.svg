<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">FORMS OF POWER SHARING</text>
  
  <!-- Horizontal -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="320" height="60" fill="#1e293b" rx="4" />
    <text x="160" y="20" text-anchor="middle" fill="#fbbf24">Horizontal Distribution (Checks &amp; Balances)</text>
    
    <rect x="20" y="30" width="80" height="20" fill="#334155" /> <text x="60" y="45" text-anchor="middle" font-size="10">Legislature</text>
    <line x1="100" y1="40" x2="120" y2="40" stroke="#94a3b8" />
    <rect x="120" y="30" width="80" height="20" fill="#334155" /> <text x="160" y="45" text-anchor="middle" font-size="10">Executive</text>
    <line x1="200" y1="40" x2="220" y2="40" stroke="#94a3b8" />
    <rect x="220" y="30" width="80" height="20" fill="#334155" /> <text x="260" y="45" text-anchor="middle" font-size="10">Judiciary</text>
  </g>

  <!-- Vertical -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="320" height="100" fill="#1e293b" rx="4" />
    <text x="160" y="20" text-anchor="middle" fill="#60a5fa">Vertical Distribution (Federalism)</text>
    
    <rect x="110" y="30" width="100" height="20" fill="#334155" /> <text x="160" y="45" text-anchor="middle" font-size="10">Central Govt</text>
    <line x1="160" y1="50" x2="160" y2="60" stroke="#94a3b8" marker-end="url(#arrow)" />
    <rect x="120" y="60" width="80" height="15" fill="#334155" /> <text x="160" y="70" text-anchor="middle" font-size="8">State Govt</text>
     <line x1="160" y1="75" x2="160" y2="85" stroke="#94a3b8" marker-end="url(#arrow)" />
    <rect x="130" y="85" width="60" height="10" fill="#334155" /> <text x="160" y="93" text-anchor="middle" font-size="8">Local</text>
  </g>
</svg>
