<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Adaptation &amp; Speciation</text>

  <!-- ── LEFT PANEL: Adaptive Radiation ── -->
  <text x="185" y="68" text-anchor="middle" fill="#fde68a" font-size="15" font-family="Georgia, serif" font-weight="bold">Adaptive Radiation (Darwin's Finches)</text>

  <!-- Ancestral finch in centre -->
  <circle cx="185" cy="165" r="30" fill="#a3e635" fill-opacity="0.25" stroke="#a3e635" stroke-width="2.5"/>
  <text x="185" y="161" text-anchor="middle" fill="#d9f99d" font-size="11" font-family="Georgia, serif" font-weight="bold">Ancestral</text>
  <text x="185" y="175" text-anchor="middle" fill="#d9f99d" font-size="11" font-family="Georgia, serif">Finch</text>

  <!-- 5 radiation arrows to adaptive forms -->
  <!-- Top-left: seed cracker -->
  <line x1="162" y1="140" x2="100" y2="88" stroke="#a3e635" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="50" width="82" height="40" rx="8" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="61" y="68" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Seed Cracker</text>
  <text x="61" y="82" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia, serif">stout beak</text>

  <!-- Top-right: insectivore -->
  <line x1="208" y1="140" x2="272" y2="88" stroke="#a3e635" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="258" y="50" width="90" height="40" rx="8" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="303" y="68" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Insect Eater</text>
  <text x="303" y="82" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia, serif">thin probe beak</text>

  <!-- Left: cactus finch -->
  <line x1="155" y1="165" x2="68" y2="165" stroke="#a3e635" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="0" y="148" width="70" height="40" rx="8" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="35" y="166" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Cactus</text>
  <text x="35" y="180" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia, serif">long curved</text>

  <!-- Bottom-left: warbler finch -->
  <line x1="162" y1="191" x2="100" y2="238" stroke="#a3e635" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="20" y="228" width="82" height="40" rx="8" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="61" y="246" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Warbler</text>
  <text x="61" y="260" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia, serif">slim pointed</text>

  <!-- Bottom-right: wood borer -->
  <line x1="208" y1="191" x2="272" y2="238" stroke="#a3e635" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="258" y="228" width="90" height="40" rx="8" fill="#134e4a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="303" y="246" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Wood Borer</text>
  <text x="303" y="260" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia, serif">chisel beak</text>

  <text x="185" y="296" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia, serif" font-style="italic">One ancestor → many ecological niches</text>

  <!-- Dividing line -->
  <line x1="390" y1="50" x2="390" y2="320" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ── RIGHT PANEL: Speciation Types ── -->
  <text x="592" y="68" text-anchor="middle" fill="#f9a8d4" font-size="15" font-family="Georgia, serif" font-weight="bold">Types of Speciation</text>

  <!-- Allopatric -->
  <rect x="406" y="80" width="375" height="100" rx="12" fill="#1a2e3a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="594" y="102" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia, serif" font-weight="bold">Allopatric Speciation</text>
  <!-- Population A and B separated by barrier -->
  <ellipse cx="458" cy="140" rx="36" ry="18" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="458" y="144" text-anchor="middle" fill="#e0f2fe" font-size="11" font-family="Georgia, serif">Pop A</text>
  <!-- Barrier -->
  <rect x="500" y="118" width="16" height="44" rx="4" fill="#71717a" fill-opacity="0.7"/>
  <text x="508" y="147" text-anchor="middle" fill="#a1a1aa" font-size="9" font-family="Georgia, serif" transform="rotate(-90,508,143)">Mountain</text>
  <!-- Population B -->
  <ellipse cx="554" cy="140" rx="36" ry="18" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6" stroke-width="1.5"/>
  <text x="554" y="144" text-anchor="middle" fill="#fce7f3" font-size="11" font-family="Georgia, serif">Pop B</text>
  <line x1="592" y1="140" x2="635" y2="140" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <ellipse cx="680" cy="140" rx="36" ry="18" fill="#86efac" fill-opacity="0.2" stroke="#86efac" stroke-width="2"/>
  <text x="680" y="136" text-anchor="middle" fill="#d9f99d" font-size="11" font-family="Georgia, serif">New Sp.</text>
  <text x="680" y="150" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif">(reproductively</text>

  <!-- Sympatric -->
  <rect x="406" y="194" width="375" height="100" rx="12" fill="#1a2e3a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="594" y="216" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia, serif" font-weight="bold">Sympatric Speciation</text>
  <!-- Single population, polyploidy or selection -->
  <ellipse cx="468" cy="252" rx="52" ry="24" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="468" y="256" text-anchor="middle" fill="#e9d5ff" font-size="11" font-family="Georgia, serif">Same population</text>
  <line x1="520" y1="252" x2="560" y2="252" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="570" y="244" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Genetic/</text>
  <text x="570" y="258" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Behavioral</text>
  <text x="570" y="272" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">isolation</text>
  <line x1="608" y1="252" x2="644" y2="252" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <ellipse cx="694" cy="244" rx="36" ry="14" fill="#86efac" fill-opacity="0.15" stroke="#86efac" stroke-width="1.5"/>
  <text x="694" y="248" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Sp. 1</text>
  <ellipse cx="694" cy="272" rx="36" ry="14" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-width="1.5"/>
  <text x="694" y="276" text-anchor="middle" fill="#fce7f3" font-size="10" font-family="Georgia, serif">Sp. 2</text>

  <!-- ── BOTTOM: Isolating Mechanisms ── -->
  <rect x="0" y="330" width="800" height="150" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="354" text-anchor="middle" fill="#86efac" font-size="16" font-family="Georgia, serif" font-weight="bold">Reproductive Isolating Mechanisms</text>

  <!-- Pre-zygotic -->
  <text x="200" y="380" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia, serif" font-weight="bold">Pre-zygotic</text>
  <text x="200" y="400" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Habitat isolation</text>
  <text x="200" y="416" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Temporal isolation</text>
  <text x="200" y="432" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Behavioral isolation</text>
  <text x="200" y="448" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Mechanical isolation</text>
  <text x="200" y="464" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Gametic isolation</text>

  <line x1="400" y1="368" x2="400" y2="475" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Post-zygotic -->
  <text x="600" y="380" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia, serif" font-weight="bold">Post-zygotic</text>
  <text x="600" y="400" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Hybrid inviability</text>
  <text x="600" y="416" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Hybrid sterility</text>
  <text x="600" y="432" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Hybrid breakdown</text>
  <text x="600" y="448" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">(eg. Mule = sterile hybrid)</text>
</svg>