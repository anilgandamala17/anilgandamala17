<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Darwinism — Theory of Evolution</text>

  <!-- ── LEFT: Darwin's 4 Pillars ── -->
  <rect x="15" y="55" width="300" height="420" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="165" y="78" text-anchor="middle" fill="#d9f99d" font-size="15" font-family="Georgia, serif" font-weight="bold">Darwin's Four Postulates</text>

  <!-- 1 -->
  <rect x="28" y="90" width="274" height="72" rx="8" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="165" y="110" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia, serif" font-weight="bold">① Variation</text>
  <text x="165" y="128" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Individuals in a population differ</text>
  <text x="165" y="144" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">in heritable traits</text>

  <!-- 2 -->
  <rect x="28" y="170" width="274" height="72" rx="8" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="165" y="190" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia, serif" font-weight="bold">② Overproduction</text>
  <text x="165" y="208" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Organisms produce more offspring</text>
  <text x="165" y="224" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">than can survive ("Struggle for Existence")</text>

  <!-- 3 -->
  <rect x="28" y="250" width="274" height="72" rx="8" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
  <text x="165" y="270" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia, serif" font-weight="bold">③ Natural Selection</text>
  <text x="165" y="288" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Individuals with favourable traits</text>
  <text x="165" y="304" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">survive and reproduce ("Survival of Fittest")</text>

  <!-- 4 -->
  <rect x="28" y="330" width="274" height="72" rx="8" fill="#0f2a1a" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="165" y="350" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Georgia, serif" font-weight="bold">④ Inheritance</text>
  <text x="165" y="368" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Favourable traits are passed to</text>
  <text x="165" y="384" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">offspring (differential reproduction)</text>

  <!-- Outcome -->
  <rect x="28" y="412" width="274" height="48" rx="8" fill="#134e4a" stroke="#86efac" stroke-width="2"/>
  <text x="165" y="432" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia, serif" font-weight="bold">→ Gradual accumulation of</text>
  <text x="165" y="450" text-anchor="middle" fill="#d9f99d" font-size="13" font-family="Georgia, serif">adaptive traits = NEW SPECIES</text>

  <!-- ── RIGHT: Peppered Moth Example ── -->
  <rect x="325" y="55" width="460" height="220" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="555" y="78" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia, serif" font-weight="bold">Classic Example: Peppered Moth</text>
  <text x="555" y="96" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">(Biston betularia) — Industrial Melanism</text>

  <!-- PRE-industrial -->
  <rect x="335" y="108" width="190" height="152" rx="8" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
  <text x="430" y="126" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia, serif" font-weight="bold">Pre-Industrial</text>
  <!-- Light birch tree trunk -->
  <rect x="378" y="133" width="48" height="112" rx="8" fill="#d9f99d" fill-opacity="0.2" stroke="#a3e635" stroke-width="1.5"/>
  <!-- Light moth visible -->
  <ellipse cx="402" cy="165" rx="20" ry="8" fill="#d9f99d" fill-opacity="0.8" stroke="#a3e635" stroke-width="1" transform="rotate(-20,402,165)"/>
  <text x="402" y="148" text-anchor="middle" fill="#d9f99d" font-size="9" font-family="Georgia, serif">Light moth</text>
  <text x="402" y="158" text-anchor="middle" fill="#d9f99d" font-size="8" font-family="Georgia, serif">camouflaged</text>
  <!-- Dark moth visible (stands out) -->
  <ellipse cx="404" cy="210" rx="18" ry="7" fill="#1e1e1e" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" transform="rotate(-20,404,210)"/>
  <text x="404" y="230" text-anchor="middle" fill="#ef4444" font-size="9" font-family="Georgia, serif">Dark moth</text>
  <text x="404" y="242" text-anchor="middle" fill="#ef4444" font-size="8" font-family="Georgia, serif">stands out → eaten</text>

  <!-- POST-industrial -->
  <rect x="535" y="108" width="238" height="152" rx="8" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="654" y="126" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia, serif" font-weight="bold">Post-Industrial</text>
  <!-- Dark sooty trunk -->
  <rect x="612" y="133" width="48" height="112" rx="8" fill="#71717a" fill-opacity="0.5" stroke="#a1a1aa" stroke-width="1.5"/>
  <!-- Dark moth camouflaged -->
  <ellipse cx="636" cy="168" rx="20" ry="8" fill="#374151" fill-opacity="0.9" stroke="#fbbf24" stroke-width="1" transform="rotate(-20,636,168)"/>
  <text x="636" y="150" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia, serif">Dark moth</text>
  <text x="636" y="160" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia, serif">camouflaged</text>
  <!-- Light moth stands out -->
  <ellipse cx="634" cy="214" rx="18" ry="7" fill="#d9f99d" fill-opacity="0.8" stroke="#ef4444" stroke-width="1.5" transform="rotate(-20,634,214)"/>
  <text x="634" y="232" text-anchor="middle" fill="#ef4444" font-size="9" font-family="Georgia, serif">Light moth</text>
  <text x="634" y="244" text-anchor="middle" fill="#ef4444" font-size="8" font-family="Georgia, serif">stands out → eaten</text>

  <!-- ── Neo-Darwinism / Modern Synthesis ── -->
  <rect x="325" y="285" width="460" height="90" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#818cf8" stroke-width="2"/>
  <text x="555" y="308" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia, serif" font-weight="bold">Neo-Darwinism (Modern Synthesis)</text>
  <text x="555" y="328" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Darwin + Mendelian genetics + Population genetics</text>
  <text x="555" y="346" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Mutation → Variation → Natural Selection → Speciation</text>
  <text x="555" y="364" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="Georgia, serif" font-style="italic">Hardy-Weinberg Principle governs allele frequency in populations</text>

  <!-- ── Hardy-Weinberg Equation ── -->
  <rect x="325" y="385" width="460" height="90" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="555" y="408" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia, serif" font-weight="bold">Hardy-Weinberg Equation</text>
  <text x="555" y="432" text-anchor="middle" fill="#d9f99d" font-size="16" font-family="Georgia, serif" font-weight="bold">p² + 2pq + q² = 1</text>
  <text x="440" y="454" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">p = freq(A)  q = freq(a)</text>
  <text x="628" y="454" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">p + q = 1</text>
  <text x="555" y="466" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif" font-style="italic">Allele frequencies stay constant without: mutation, gene flow, drift, non-random mating, selection</text>
</svg>