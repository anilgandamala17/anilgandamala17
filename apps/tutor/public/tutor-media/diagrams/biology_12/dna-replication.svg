<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">DNA Replication Fork</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Replication Fork -->
  <g transform="translate(100, 100)">
    <!-- Unwound Template Strands -->
    <path d="M 0 200 L 200 200 Q 300 200 400 100" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.6"/>
    <path d="M 0 300 L 200 300 Q 300 300 400 400" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.6"/>
    
    <!-- Helicase Enzyme -->
    <polygon points="200,200 250,250 200,300" fill="#f87171" stroke="#f8fafc" stroke-width="2"/>
    <text x="180" y="260" fill="#f87171" font-weight="bold">Helicase</text>
    
    <!-- Leading Strand -->
    <path d="M 400 120 L 250 120" fill="none" stroke="#86efac" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="410" y="125" fill="#86efac">Leading Strand (5'→3')</text>
    
    <!-- Lagging Strand (Okazaki Fragments) -->
    <path d="M 270 380 L 320 380" fill="none" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M 340 380 L 390 380" fill="none" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="400" y="385" fill="#fef08a">Lagging (Okazaki fragments)</text>
    
    <!-- DNA Polymerase -->
    <rect x="230" y="100" width="40" height="40" rx="5" fill="#60a5fa" stroke="#f8fafc"/>
    <text x="250" y="90" fill="#60a5fa" text-anchor="middle" font-size="12">DNA Pol III</text>
  </g>

  <rect x="150" y="500" width="500" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="535" fill="#f8fafc" text-anchor="middle">Semi-conservative: One old strand, one new strand.</text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Biology Grade 12</text>
</svg>
