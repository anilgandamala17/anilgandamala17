<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Ecological Pyramids (Energy Flow)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- The Pyramid -->
  <g transform="translate(200, 150)">
    <!-- T4: Tertiary Consumers -->
    <path d="M 150 0 L 250 0 L 275 50 L 125 50 Z" fill="rgba(248,113,113,0.3)" stroke="#f87171" stroke-width="2"/>
    <text x="200" y="30" fill="#f8fafc" text-anchor="middle" font-size="14" font-weight="bold">Tertiary (T4)</text>
    <text x="300" y="30" fill="#fef08a" font-size="12">10 J</text>

    <!-- T3: Secondary Consumers -->
    <path d="M 125 50 L 275 50 L 300 110 L 100 110 Z" fill="rgba(96,165,250,0.3)" stroke="#60a5fa" stroke-width="2"/>
    <text x="200" y="85" fill="#f8fafc" text-anchor="middle" font-size="14" font-weight="bold">Secondary (T3)</text>
    <text x="320" y="85" fill="#fef08a" font-size="12">100 J</text>

    <!-- T2: Primary Consumers -->
    <path d="M 100 110 L 300 110 L 325 180 L 75 180 Z" fill="rgba(254,240,138,0.2)" stroke="#fef08a" stroke-width="2"/>
    <text x="200" y="150" fill="#f8fafc" text-anchor="middle" font-size="14" font-weight="bold">Herbivores (T2)</text>
    <text x="350" y="150" fill="#fef08a" font-size="12">1,000 J</text>

    <!-- T1: Producers -->
    <path d="M 75 180 L 325 180 L 350 280 L 50 280 Z" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="2"/>
    <text x="200" y="240" fill="#f8fafc" text-anchor="middle" font-size="16" font-weight="bold">PRODUCERS (T1)</text>
    <text x="380" y="240" fill="#fef08a" font-weight="bold">10,000 J</text>
    
    <!-- Energy Flow Arrow -->
    <line x1="-50" y1="280" x2="-50" y2="20" stroke="#fef08a" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="-65" y="150" fill="#fef08a" transform="rotate(-90 -65 150)" text-anchor="middle" font-weight="bold">UNIDIRECTIONAL ENERGY FLOW</text>
  </g>

  <!-- 10% Law -->
  <rect x="150" y="470" width="550" height="80" rx="15" fill="rgba(134,239,172,0.05)" stroke="#86efac" stroke-width="1.5"/>
  <text x="425" y="505" fill="#86efac" text-anchor="middle" font-size="24" font-weight="bold">Lindeman's 10% Law</text>
  <text x="425" y="530" fill="#f8fafc" text-anchor="middle">Only 10% of energy is transferred to the next trophic level.</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Biology Grade 12</text>
</svg>
