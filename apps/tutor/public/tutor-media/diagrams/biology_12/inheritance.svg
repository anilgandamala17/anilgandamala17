<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Patterns of Inheritance</text>

  <!-- ── SECTION 1: Dominance types ── -->
  <rect x="15" y="55" width="235" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="132" y="78" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia, serif" font-weight="bold">Complete Dominance</text>
  <text x="132" y="96" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Dominant allele fully masks recessive</text>
  <!-- Cross visual -->
  <text x="60" y="120" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia, serif" font-weight="bold">AA</text>
  <text x="100" y="120" text-anchor="middle" fill="#d4d4d8" font-size="14" font-family="Georgia, serif">×</text>
  <text x="140" y="120" text-anchor="middle" fill="#f472b6" font-size="14" font-family="Georgia, serif" font-weight="bold">aa</text>
  <line x1="95" y1="128" x2="95" y2="145" stroke="#86efac" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="95" y="162" text-anchor="middle" fill="#38bdf8" font-size="14" font-family="Georgia, serif" font-weight="bold">Aa</text>
  <text x="95" y="178" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia, serif">(all dominant)</text>
  <text x="95" y="198" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Ratio: 3 dominant : 1 recessive</text>
  <text x="95" y="214" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">in F₂ generation</text>
  <text x="95" y="232" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">Example: Tall (T) over Dwarf (t)</text>

  <rect x="258" y="55" width="260" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="388" y="78" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia, serif" font-weight="bold">Incomplete Dominance</text>
  <text x="388" y="96" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Intermediate phenotype in F₁</text>
  <text x="290" y="120" text-anchor="middle" fill="#ef4444" font-size="14" font-family="Georgia, serif" font-weight="bold">R₁R₁</text>
  <text x="350" y="120" text-anchor="middle" fill="#d4d4d8" font-size="14" font-family="Georgia, serif">×</text>
  <text x="415" y="120" text-anchor="middle" fill="#f0fdf4" font-size="14" font-family="Georgia, serif" font-weight="bold">R₂R₂</text>
  <text x="286" y="108" text-anchor="middle" fill="#ef4444" font-size="9" font-family="Georgia, serif">(Red)</text>
  <text x="418" y="108" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia, serif">(White)</text>
  <line x1="352" y1="128" x2="352" y2="145" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="352" y="162" text-anchor="middle" fill="#fca5a5" font-size="14" font-family="Georgia, serif" font-weight="bold">R₁R₂</text>
  <text x="352" y="178" text-anchor="middle" fill="#fed7aa" font-size="10" font-family="Georgia, serif">Pink (intermediate)</text>
  <text x="352" y="196" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">F₂ Ratio: 1 Red : 2 Pink : 1 White</text>
  <text x="352" y="214" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">Example: Mirabilis jalapa (4 o'clock plant)</text>
  <text x="352" y="232" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Phenotypic = Genotypic ratio (1:2:1)</text>

  <rect x="526" y="55" width="258" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a78bfa" stroke-width="2"/>
  <text x="655" y="78" text-anchor="middle" fill="#c4b5fd" font-size="13" font-family="Georgia, serif" font-weight="bold">Codominance</text>
  <text x="655" y="96" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Both alleles equally expressed</text>
  <text x="570" y="120" text-anchor="middle" fill="#ef4444" font-size="14" font-family="Georgia, serif" font-weight="bold">Iᴬ</text>
  <text x="618" y="120" text-anchor="middle" fill="#d4d4d8" font-size="14" font-family="Georgia, serif">×</text>
  <text x="665" y="120" text-anchor="middle" fill="#fbbf24" font-size="14" font-family="Georgia, serif" font-weight="bold">Iᴮ</text>
  <line x1="618" y1="128" x2="618" y2="145" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="618" y="162" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia, serif" font-weight="bold">IᴬIᴮ</text>
  <text x="618" y="178" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="Georgia, serif">Blood Group AB</text>
  <text x="618" y="194" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Both A &amp; B antigens present</text>
  <text x="618" y="210" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">Example: ABO Blood Groups</text>
  <text x="618" y="228" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Iᴬ = A; Iᴮ = B; i = O</text>

  <!-- ── SECTION 2: Sex-linked inheritance ── -->
  <rect x="15" y="265" width="380" height="210" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="205" y="288" text-anchor="middle" fill="#f9a8d4" font-size="14" font-family="Georgia, serif" font-weight="bold">Sex-Linked Inheritance (X-linked Recessive)</text>
  <text x="205" y="306" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Example: Colour blindness (X-linked)</text>
  <!-- Cross -->
  <text x="80" y="335" text-anchor="middle" fill="#f9a8d4" font-size="13" font-family="Georgia, serif" font-weight="bold">Xᴺ Xⁿ</text>
  <text x="80" y="350" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Carrier Female)</text>
  <text x="148" y="338" text-anchor="middle" fill="#d4d4d8" font-size="16" font-family="Georgia, serif">×</text>
  <text x="210" y="335" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Georgia, serif" font-weight="bold">Xᴺ Y</text>
  <text x="210" y="350" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Normal Male)</text>
  <!-- Offspring -->
  <text x="70" y="390" text-anchor="middle" fill="#a3e635" font-size="11" font-family="Georgia, serif" font-weight="bold">Xᴺ Xᴺ</text>
  <text x="70" y="404" text-anchor="middle" fill="#d9f99d" font-size="9" font-family="Georgia, serif">Normal ♀</text>
  <text x="145" y="390" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Georgia, serif" font-weight="bold">Xᴺ Xⁿ</text>
  <text x="145" y="404" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia, serif">Carrier ♀</text>
  <text x="225" y="390" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia, serif" font-weight="bold">Xᴺ Y</text>
  <text x="225" y="404" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia, serif">Normal ♂</text>
  <text x="305" y="390" text-anchor="middle" fill="#ef4444" font-size="11" font-family="Georgia, serif" font-weight="bold">Xⁿ Y</text>
  <text x="305" y="404" text-anchor="middle" fill="#fca5a5" font-size="9" font-family="Georgia, serif">Colour-blind ♂</text>
  <text x="205" y="432" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia, serif" font-weight="bold">Sons: 50% normal, 50% colour-blind</text>
  <text x="205" y="450" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Daughters: 50% normal, 50% carrier</text>
  <text x="205" y="468" text-anchor="middle" fill="#f9a8d4" font-size="10" font-family="Georgia, serif">Males more affected (only one X)</text>

  <!-- ── SECTION 3: Epistasis ── -->
  <rect x="403" y="265" width="381" height="210" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="593" y="288" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia, serif" font-weight="bold">Epistasis — Gene Interaction</text>
  <text x="593" y="306" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">One gene masks expression of another</text>
  <!-- Table -->
  <rect x="415" y="315" width="355" height="150" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1"/>
  <text x="475" y="336" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif" font-weight="bold">Type</text>
  <text x="593" y="336" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif" font-weight="bold">F₂ Ratio</text>
  <text x="730" y="336" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif" font-weight="bold">Example</text>
  <line x1="415" y1="342" x2="770" y2="342" stroke="#334155" stroke-width="1"/>
  <text x="475" y="360" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Dominant Epistasis</text>
  <text x="593" y="360" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif">12:3:1</text>
  <text x="730" y="360" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Summer squash</text>
  <line x1="415" y1="368" x2="770" y2="368" stroke="#334155" stroke-width="1"/>
  <text x="475" y="386" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Recessive Epistasis</text>
  <text x="593" y="386" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif">9:3:4</text>
  <text x="730" y="386" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Labrador coat</text>
  <line x1="415" y1="394" x2="770" y2="394" stroke="#334155" stroke-width="1"/>
  <text x="475" y="412" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Duplicate Dominance</text>
  <text x="593" y="412" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif">15:1</text>
  <text x="730" y="412" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Shepherd's purse</text>
  <line x1="415" y1="420" x2="770" y2="420" stroke="#334155" stroke-width="1"/>
  <text x="475" y="438" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Complementary</text>
  <text x="593" y="438" text-anchor="middle" fill="#a3e635" font-size="10" font-family="Georgia, serif">9:7</text>
  <text x="730" y="438" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Sweet pea flower</text>
  <text x="593" y="468" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Georgia, serif" font-style="italic">All ratios are modifications of the 9:3:3:1 dihybrid ratio</text>
</svg>