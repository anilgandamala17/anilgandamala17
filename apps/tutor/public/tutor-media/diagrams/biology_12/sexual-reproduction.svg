<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
  </defs>

  <g id="sr-part-overview" data-mito-part="overview" class="mito-layer">
    <text x="400" y="38" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Sexual Reproduction in Flowering Plants</text>
  </g>

  <g id="sr-part-male" data-mito-part="male" class="mito-layer">
    <text x="170" y="78" text-anchor="middle" fill="#fde68a" font-size="15" font-family="Georgia, serif" font-weight="bold">Stamen (♂)</text>
    <rect x="162" y="90" width="16" height="120" rx="4" fill="#a3e635" fill-opacity="0.25" stroke="#a3e635" stroke-width="1.5"/>
    <text x="150" y="165" text-anchor="end" fill="#d4d4d8" font-size="12" font-family="Georgia, serif">Filament</text>
    <ellipse cx="170" cy="88" rx="24" ry="14" fill="#fbbf24" fill-opacity="0.4" stroke="#fbbf24" stroke-width="2"/>
    <text x="170" y="92" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia, serif" font-weight="bold">Anther</text>
    <circle cx="148" cy="68" r="7" fill="#fbbf24" fill-opacity="0.7" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="165" cy="58" r="7" fill="#fbbf24" fill-opacity="0.7" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="184" cy="63" r="7" fill="#fbbf24" fill-opacity="0.7" stroke="#fde68a" stroke-width="1.5"/>
    <text x="170" y="48" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif">Pollen Grains</text>
    <text x="98" y="96" fill="#86efac" font-size="11" font-family="Georgia, serif">Haploid (n)</text>
  </g>

  <g id="sr-part-pollination" data-mito-part="pollination" class="mito-layer">
    <line x1="220" y1="75" x2="390" y2="110" stroke="#86efac" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
    <text x="305" y="88" text-anchor="middle" fill="#86efac" font-size="12" font-family="Georgia, serif" font-style="italic">Pollination</text>
  </g>

  <g id="sr-part-female" data-mito-part="female" class="mito-layer">
    <text x="580" y="78" text-anchor="middle" fill="#f9a8d4" font-size="15" font-family="Georgia, serif" font-weight="bold">Pistil (♀)</text>
    <rect x="573" y="90" width="14" height="100" rx="5" fill="#f472b6" fill-opacity="0.25" stroke="#f472b6" stroke-width="1.5"/>
    <text x="640" y="135" text-anchor="start" fill="#d4d4d8" font-size="12" font-family="Georgia, serif">Style</text>
    <ellipse cx="580" cy="92" rx="22" ry="9" fill="#f472b6" fill-opacity="0.5" stroke="#f472b6" stroke-width="2"/>
    <text x="580" y="96" text-anchor="middle" fill="#fce7f3" font-size="12" font-family="Georgia, serif" font-weight="bold">Stigma</text>
    <ellipse cx="580" cy="200" rx="34" ry="22" fill="#f472b6" fill-opacity="0.2" stroke="#f472b6" stroke-width="2"/>
    <text x="580" y="204" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia, serif" font-weight="bold">Ovary</text>
    <circle cx="580" cy="218" r="8" fill="#fce7f3" fill-opacity="0.5" stroke="#f9a8d4" stroke-width="1.5"/>
    <text x="580" y="243" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Ovule</text>
    <text x="640" y="222" text-anchor="start" fill="#86efac" font-size="11" font-family="Georgia, serif">Haploid (n)</text>
  </g>

  <g id="sr-part-tube" data-mito-part="tube" class="mito-layer">
    <line x1="580" y1="101" x2="580" y2="175" stroke="#fde68a" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="632" y="145" text-anchor="start" fill="#fde68a" font-size="11" font-family="Georgia, serif">Pollen tube</text>
    <circle cx="580" cy="165" r="5" fill="#fbbf24" fill-opacity="0.8"/>
  </g>

  <g id="sr-part-double" data-mito-part="double" class="mito-layer">
    <rect x="220" y="290" width="360" height="160" rx="16" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
    <text x="400" y="316" text-anchor="middle" fill="#86efac" font-size="16" font-family="Georgia, serif" font-weight="bold">Double Fertilisation</text>
    <circle cx="330" cy="360" r="22" fill="#f472b6" fill-opacity="0.3" stroke="#f472b6" stroke-width="2"/>
    <text x="330" y="355" text-anchor="middle" fill="#fce7f3" font-size="12" font-family="Georgia, serif">Egg</text>
    <text x="330" y="370" text-anchor="middle" fill="#fce7f3" font-size="11" font-family="Georgia, serif">(n)</text>
    <circle cx="390" cy="360" r="16" fill="#fbbf24" fill-opacity="0.4" stroke="#fde68a" stroke-width="1.5"/>
    <text x="390" y="355" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif">Sperm₁</text>
    <text x="390" y="370" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif">(n)</text>
    <line x1="353" y1="360" x2="373" y2="360" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
    <ellipse cx="310" cy="420" rx="38" ry="17" fill="#86efac" fill-opacity="0.25" stroke="#86efac" stroke-width="2"/>
    <text x="310" y="424" text-anchor="middle" fill="#f0fdf4" font-size="13" font-family="Georgia, serif" font-weight="bold">Zygote (2n)</text>
    <circle cx="480" cy="355" r="22" fill="#818cf8" fill-opacity="0.3" stroke="#818cf8" stroke-width="2"/>
    <text x="480" y="350" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="Georgia, serif">Polar</text>
    <text x="480" y="364" text-anchor="middle" fill="#c7d2fe" font-size="11" font-family="Georgia, serif">Nuclei(2n)</text>
    <circle cx="530" cy="355" r="16" fill="#fbbf24" fill-opacity="0.4" stroke="#fde68a" stroke-width="1.5"/>
    <text x="530" y="350" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif">Sperm₂</text>
    <text x="530" y="364" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia, serif">(n)</text>
    <line x1="444" y1="355" x2="514" y2="355" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
    <ellipse cx="485" cy="420" rx="42" ry="17" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="2"/>
    <text x="485" y="424" text-anchor="middle" fill="#c7d2fe" font-size="13" font-family="Georgia, serif" font-weight="bold">Endosperm (3n)</text>
    <text x="400" y="468" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia, serif" font-style="italic">→ Embryo + Seed development</text>
  </g>
</svg>
