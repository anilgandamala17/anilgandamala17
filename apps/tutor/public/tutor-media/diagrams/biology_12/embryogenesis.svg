<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
  </defs>

  <g id="emb-part-overview" data-mito-part="overview" class="mito-layer">
    <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Embryogenesis — Early Human Development</text>
  </g>

  <g id="emb-part-zygote" data-mito-part="zygote" class="mito-layer">
    <circle cx="70" cy="170" r="38" fill="#86efac" fill-opacity="0.15" stroke="#86efac" stroke-width="2.5"/>
    <circle cx="70" cy="170" r="16" fill="#86efac" fill-opacity="0.35" stroke="#a3e635" stroke-width="1.5"/>
    <text x="70" y="220" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia, serif" font-weight="bold">Zygote</text>
    <text x="70" y="236" text-anchor="middle" fill="#a3e635" font-size="11" font-family="Georgia, serif">(2n, Day 0)</text>
  </g>

  <line x1="112" y1="170" x2="148" y2="170" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="158" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">cleavage</text>

  <g id="emb-part-cleavage" data-mito-part="cleavage" class="mito-layer">
    <circle cx="185" cy="162" r="22" fill="#7dd3fc" fill-opacity="0.1" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="185" cy="178" r="22" fill="#7dd3fc" fill-opacity="0.1" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="163" y1="170" x2="207" y2="170" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="185" y="222" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="Georgia, serif" font-weight="bold">2-cell</text>
    <text x="185" y="236" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Day 1)</text>
  </g>

  <line x1="230" y1="170" x2="260" y2="170" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="245" y="158" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">division</text>

  <g id="emb-part-morula" data-mito-part="morula" class="mito-layer">
    <g transform="translate(298,170)">
      <circle cx="-14" cy="-14" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="14" cy="-14" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="-14" cy="14" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="10" fill="#fbbf24" fill-opacity="0.3" stroke="#fde68a" stroke-width="1.5"/>
    </g>
    <text x="298" y="222" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia, serif" font-weight="bold">Morula</text>
    <text x="298" y="236" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Day 3–4)</text>
  </g>

  <line x1="340" y1="170" x2="372" y2="170" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="356" y="158" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">cavitation</text>

  <g id="emb-part-blastocyst" data-mito-part="blastocyst" class="mito-layer">
    <circle cx="418" cy="170" r="46" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="426" cy="168" r="30" fill="#f472b6" fill-opacity="0.05" stroke="#f9a8d4" stroke-width="1" stroke-dasharray="5,3"/>
    <text x="426" y="172" text-anchor="middle" fill="#f9a8d4" font-size="9" font-family="Georgia, serif">Blastocoel</text>
    <ellipse cx="383" cy="158" rx="14" ry="10" fill="#a78bfa" fill-opacity="0.5" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="370" y="142" fill="#c4b5fd" font-size="9" font-family="Georgia, serif">ICM</text>
    <text x="418" y="232" text-anchor="middle" fill="#f472b6" font-size="12" font-family="Georgia, serif" font-weight="bold">Blastocyst</text>
    <text x="418" y="246" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Day 5–6)</text>
  </g>

  <line x1="468" y1="170" x2="500" y2="170" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="484" y="158" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">gastrulation</text>

  <g id="emb-part-gastrula" data-mito-part="gastrula" class="mito-layer">
    <circle cx="548" cy="170" r="46" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-width="2.5"/>
    <ellipse cx="548" cy="145" rx="40" ry="10" fill="#a3e635" fill-opacity="0.3" stroke="#a3e635" stroke-width="1.5"/>
    <text x="548" y="149" text-anchor="middle" fill="#d9f99d" font-size="9" font-family="Georgia, serif">Ectoderm</text>
    <ellipse cx="548" cy="170" rx="40" ry="10" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="548" y="174" text-anchor="middle" fill="#e0f2fe" font-size="9" font-family="Georgia, serif">Mesoderm</text>
    <ellipse cx="548" cy="195" rx="40" ry="10" fill="#f97316" fill-opacity="0.3" stroke="#fb923c" stroke-width="1.5"/>
    <text x="548" y="199" text-anchor="middle" fill="#fed7aa" font-size="9" font-family="Georgia, serif">Endoderm</text>
    <text x="548" y="232" text-anchor="middle" fill="#818cf8" font-size="12" font-family="Georgia, serif" font-weight="bold">Gastrula</text>
    <text x="548" y="246" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Day 14–16)</text>
  </g>

  <line x1="598" y1="170" x2="630" y2="170" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="614" y="158" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">organogenesis</text>

  <g id="emb-part-embryo" data-mito-part="embryo" class="mito-layer">
    <circle cx="700" cy="170" r="52" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="2.5"/>
    <ellipse cx="700" cy="158" rx="30" ry="22" fill="#fbbf24" fill-opacity="0.2" stroke="#fde68a" stroke-width="1.5"/>
    <ellipse cx="674" cy="175" rx="10" ry="7" fill="#fbbf24" fill-opacity="0.3" stroke="#fde68a" stroke-width="1.2"/>
    <ellipse cx="726" cy="175" rx="10" ry="7" fill="#fbbf24" fill-opacity="0.3" stroke="#fde68a" stroke-width="1.2"/>
    <ellipse cx="698" cy="192" rx="12" ry="7" fill="#fbbf24" fill-opacity="0.3" stroke="#fde68a" stroke-width="1.2"/>
    <circle cx="700" cy="136" r="16" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1.5"/>
    <text x="700" y="232" text-anchor="middle" fill="#fbbf24" font-size="12" font-family="Georgia, serif" font-weight="bold">Embryo</text>
    <text x="700" y="246" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(Week 4–8)</text>
  </g>

  <g id="emb-part-germlayers" data-mito-part="germlayers" class="mito-layer">
    <rect x="30" y="280" width="740" height="190" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="1.5"/>
    <text x="400" y="304" text-anchor="middle" fill="#86efac" font-size="15" font-family="Georgia, serif" font-weight="bold">Germ Layer Derivatives</text>
    <line x1="30" y1="312" x2="770" y2="312" stroke="#86efac" stroke-width="1"/>
    <rect x="50" y="320" width="200" height="130" rx="8" fill="#a3e635" fill-opacity="0.1" stroke="#a3e635" stroke-width="1.5"/>
    <text x="150" y="342" text-anchor="middle" fill="#d9f99d" font-size="13" font-family="Georgia, serif" font-weight="bold">Ectoderm</text>
    <text x="150" y="362" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Skin &amp; nails</text>
    <text x="150" y="380" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Brain &amp; spinal cord</text>
    <text x="150" y="398" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Eyes &amp; ears</text>
    <text x="150" y="416" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Tooth enamel</text>
    <rect x="300" y="320" width="200" height="130" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="400" y="342" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Georgia, serif" font-weight="bold">Mesoderm</text>
    <text x="400" y="362" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Muscles &amp; bones</text>
    <text x="400" y="380" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Heart &amp; blood</text>
    <text x="400" y="398" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Kidneys</text>
    <text x="400" y="416" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Gonads</text>
    <rect x="550" y="320" width="200" height="130" rx="8" fill="#f97316" fill-opacity="0.1" stroke="#fb923c" stroke-width="1.5"/>
    <text x="650" y="342" text-anchor="middle" fill="#fed7aa" font-size="13" font-family="Georgia, serif" font-weight="bold">Endoderm</text>
    <text x="650" y="362" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Gut lining</text>
    <text x="650" y="380" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Lungs &amp; liver</text>
    <text x="650" y="398" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Pancreas</text>
    <text x="650" y="416" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">• Thyroid</text>
  </g>
</svg>
