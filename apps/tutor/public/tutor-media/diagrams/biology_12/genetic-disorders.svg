<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Genetic Pedigree Analysis</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Pedigree Chart (Autosomal Recessive Pattern) -->
  <g transform="translate(200, 150)">
    <!-- Generation I -->
    <rect x="100" y="0" width="40" height="40" fill="transparent" stroke="#f8fafc" stroke-width="2"/> <!-- Male unaffected -->
    <line x1="140" y1="20" x2="200" y2="20" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="220" cy="20" r="20" fill="#f472b6" opacity="0.5" stroke="#f8fafc" stroke-width="2"/> <!-- Female carrier -->
    <text x="150" y="-10" fill="#f8fafc" text-anchor="middle" font-size="12">Generation I</text>
    
    <!-- Link to Gen II -->
    <line x1="170" y1="20" x2="170" y2="70" stroke="#f8fafc" stroke-width="2"/>
    <line x1="50" y1="70" x2="300" y2="70" stroke="#f8fafc" stroke-width="2"/>
    
    <!-- Generation II -->
    <g transform="translate(50, 90)">
      <circle cx="0" cy="20" r="20" fill="transparent" stroke="#f8fafc" stroke-width="2"/> <!-- Female unaffected -->
      <rect x="80" y="0" width="40" height="40" fill="#60a5fa" stroke="#f8fafc" stroke-width="2"/> <!-- Male AFFECTED -->
      <circle cx="180" cy="20" r="20" fill="#f472b6" opacity="0.5" stroke="#f8fafc" stroke-width="2"/> <!-- Female carrier -->
      <rect x="250" y="0" width="40" height="40" fill="transparent" stroke="#f8fafc" stroke-width="2"/> <!-- Male unaffected -->
      <text x="140" y="-10" fill="#f8fafc" text-anchor="middle" font-size="12">Generation II</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 420)" font-family="Arial, sans-serif" font-size="16" fill="#f8fafc">
    <rect x="0" y="0" width="20" height="20" fill="transparent" stroke="#f8fafc"/> <text x="30" y="15">Male (Unaffected)</text>
    <circle cx="200" cy="10" r="10" fill="transparent" stroke="#f8fafc"/> <text x="220" y="15">Female (Unaffected)</text>
    <rect x="0" y="40" width="20" height="20" fill="#60a5fa"/> <text x="30" y="55">Affected Male</text>
    <circle cx="200" cy="50" r="10" fill="#f472b6" opacity="0.5" stroke="#f8fafc"/> <text x="220" y="55">Carrier Female</text>
  </g>

  <rect x="150" y="500" width="500" height="70" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="535" fill="#fef08a" text-anchor="middle" font-weight="bold">Mendelian Disorders: Color Blindness, Sickle Cell Anaemia.</text>
  <text x="400" y="555" fill="#f8fafc" text-anchor="middle" font-size="12">Chromosomal Disorders: Down's Syndrome, Turner's Syndrome.</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Biology Grade 12</text>
</svg>
