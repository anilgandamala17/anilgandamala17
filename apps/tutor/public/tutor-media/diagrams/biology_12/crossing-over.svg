<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fef08a" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Crossing Over &amp; Recombination</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Chromosomes -->
  <g transform="translate(150, 200)">
    <!-- Homologous Pair 1 (Blue) -->
    <rect x="50" y="0" width="30" height="200" rx="15" fill="#60a5fa" opacity="0.8" stroke="#f8fafc"/>
    <rect x="90" y="0" width="30" height="200" rx="15" fill="#60a5fa" opacity="0.8" stroke="#f8fafc"/>
    
    <!-- Homologous Pair 2 (Pink) -->
    <rect x="180" y="0" width="30" height="200" rx="15" fill="#f472b6" opacity="0.8" stroke="#f8fafc"/>
    <rect x="220" y="0" width="30" height="200" rx="15" fill="#f472b6" opacity="0.8" stroke="#f8fafc"/>
    
    <!-- Crossing Point (Chiasma) -->
    <line x1="120" y1="150" x2="180" y2="150" stroke="#fef08a" stroke-width="4" stroke-dasharray="2,2"/>
    <circle cx="150" cy="150" r="15" fill="rgba(254,240,138,0.2)" stroke="#fef08a" stroke-width="2"/>
    <text x="150" y="130" fill="#fef08a" text-anchor="middle" font-weight="bold">Chiasma</text>
  </g>

  <!-- Resulting Recombinants -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="30" height="200" rx="15" fill="#60a5fa" stroke="#f8fafc"/>
    <!-- Recombinant 1 -->
    <g>
      <rect x="40" y="0" width="30" height="150" rx="5" fill="#60a5fa" stroke="#f8fafc"/>
      <rect x="40" y="150" width="30" height="50" rx="5" fill="#f472b6" stroke="#f8fafc"/>
    </g>
    <!-- Recombinant 2 -->
    <g>
      <rect x="80" y="0" width="30" height="150" rx="5" fill="#f472b6" stroke="#f8fafc"/>
      <rect x="80" y="150" width="30" height="50" rx="5" fill="#60a5fa" stroke="#f8fafc"/>
    </g>
    <rect x="120" y="0" width="30" height="200" rx="15" fill="#f472b6" stroke="#f8fafc"/>
    <text x="75" y="230" fill="#86efac" text-anchor="middle">Genetic Variation</text>
  </g>

  <rect x="150" y="480" width="500" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="520" fill="#fef08a" text-anchor="middle" font-size="20">Occurs in Pachytene (Prophase I, Meiosis)</text>
  <text x="400" y="545" fill="#f8fafc" text-anchor="middle" font-size="14">Exchange of genetic material between non-sister chromatids.</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Biology Grade 12</text>
</svg>
