<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#86efac"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,0 L0,4 L8,2 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia, serif" font-weight="bold">Recombinant DNA — Gene Cloning</text>

  <!-- ── STEP 1: Target Gene ── -->
  <rect x="20" y="80" width="148" height="60" rx="10" fill="#134e4a" stroke="#86efac" stroke-width="2"/>
  <text x="94" y="106" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia, serif" font-weight="bold">① Target Gene</text>
  <!-- DNA double helix hint -->
  <path d="M40,120 Q60,110 80,120 Q100,130 120,120 Q140,110 160,120" stroke="#a3e635" stroke-width="2" fill="none"/>
  <path d="M40,126 Q60,116 80,126 Q100,136 120,126 Q140,116 160,126" stroke="#a3e635" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <text x="94" y="140" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">(from donor organism)</text>

  <line x1="168" y1="110" x2="204" y2="110" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="186" y="100" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">REase</text>

  <!-- ── STEP 2: Restriction digest ── -->
  <!-- Gene fragment with sticky ends -->
  <rect x="210" y="88" width="130" height="44" rx="6" fill="#1a3a2a" stroke="#fbbf24" stroke-width="2"/>
  <!-- Sticky ends -->
  <rect x="200" y="88" width="14" height="20" rx="2" fill="#fbbf24" fill-opacity="0.5" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="340" y="112" width="14" height="20" rx="2" fill="#fbbf24" fill-opacity="0.5" stroke="#fde68a" stroke-width="1.5"/>
  <text x="275" y="114" text-anchor="middle" fill="#f0fdf4" font-size="12" font-family="Georgia, serif" font-weight="bold">Gene</text>
  <text x="275" y="128" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Fragment</text>
  <text x="275" y="150" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">← sticky ends →</text>

  <!-- ── STEP 3: Plasmid Vector ── -->
  <!-- Circular plasmid icon -->
  <circle cx="500" cy="110" r="52" fill="#1a3a2a" fill-opacity="0.85" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Linear plasmid representation inside -->
  <text x="500" y="105" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia, serif" font-weight="bold">Plasmid</text>
  <text x="500" y="121" text-anchor="middle" fill="#f9a8d4" font-size="10" font-family="Georgia, serif">Vector</text>
  <!-- Cut site markers on plasmid -->
  <line x1="470" y1="60" x2="470" y2="78" stroke="#fbbf24" stroke-width="2"/>
  <rect x="462" y="55" width="14" height="12" rx="2" fill="#fbbf24" fill-opacity="0.6"/>
  <text x="452" y="52" text-anchor="end" fill="#fde68a" font-size="9" font-family="Georgia, serif">Cut by REase</text>
  <!-- antibiotic resistance label -->
  <text x="500" y="148" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="Georgia, serif">Antibiotic-R gene</text>

  <!-- Arrow from gene to plasmid -->
  <line x1="356" y1="110" x2="442" y2="110" stroke="#fbbf24" stroke-width="2" marker-end="url(#arro)"/>
  <text x="399" y="100" text-anchor="middle" fill="#fde68a" font-size="10" font-family="Georgia, serif">Insert + Ligate</text>

  <!-- ── STEP 4: Recombinant Plasmid ── -->
  <circle cx="650" cy="110" r="52" fill="#1a3a2a" fill-opacity="0.85" stroke="#86efac" stroke-width="2.5"/>
  <!-- Gene insert highlighted on plasmid ring -->
  <path d="M 620,62 A52,52 0 0,1 680,62" stroke="#fde68a" stroke-width="6" fill="none"/>
  <text x="650" y="90" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia, serif">Inserted gene</text>
  <text x="650" y="108" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia, serif" font-weight="bold">r-DNA</text>
  <text x="650" y="124" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Plasmid</text>
  <!-- line 508-596 -->
  <line x1="556" y1="110" x2="594" y2="110" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="575" y="100" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia, serif">Ligation</text>

  <!-- ── STEP 5: Transformation ── -->
  <rect x="20" y="240" width="280" height="120" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#7dd3fc" stroke-width="2"/>
  <text x="160" y="264" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia, serif" font-weight="bold">② Transformation</text>
  <!-- E. coli cell -->
  <ellipse cx="100" cy="320" rx="60" ry="28" fill="#134e4a" stroke="#a3e635" stroke-width="2"/>
  <text x="100" y="324" text-anchor="middle" fill="#d9f99d" font-size="12" font-family="Georgia, serif">E. coli cell</text>
  <!-- mini plasmid inside -->
  <circle cx="140" cy="308" r="12" fill="none" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="134" y1="300" x2="138" y2="304" stroke="#fde68a" stroke-width="1.5"/>
  <text x="160" y="350" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">r-DNA plasmid introduced</text>

  <!-- Arrow down from plasmid -->
  <line x1="650" y1="165" x2="650" y2="230" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>
  <text x="664" y="202" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">transform</text>

  <!-- ── STEP 6: Selection ── -->
  <rect x="310" y="240" width="236" height="120" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="428" y="264" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia, serif" font-weight="bold">③ Selection</text>
  <!-- Petri dish hint -->
  <ellipse cx="380" cy="330" rx="56" ry="22" fill="#064e3b" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="364" cy="325" r="8" fill="#a3e635" fill-opacity="0.6"/>
  <circle cx="388" cy="322" r="6" fill="#a3e635" fill-opacity="0.4"/>
  <circle cx="400" cy="332" r="9" fill="#a3e635" fill-opacity="0.6"/>
  <text x="380" y="356" text-anchor="middle" fill="#d9f99d" font-size="10" font-family="Georgia, serif">Antibiotic plate</text>
  <text x="470" y="300" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">Only transformed</text>
  <text x="470" y="314" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">cells survive</text>

  <!-- Arrow -->
  <line x1="300" y1="300" x2="306" y2="300" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── STEP 7: Expression ── -->
  <rect x="555" y="240" width="220" height="120" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="665" y="264" text-anchor="middle" fill="#f9a8d4" font-size="14" font-family="Georgia, serif" font-weight="bold">④ Expression</text>
  <!-- Protein product -->
  <ellipse cx="665" cy="318" rx="56" ry="22" fill="#f472b6" fill-opacity="0.15" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="665" y="322" text-anchor="middle" fill="#fce7f3" font-size="12" font-family="Georgia, serif">Protein Product</text>
  <text x="665" y="348" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia, serif">(insulin, GH, etc.)</text>

  <!-- Arrow -->
  <line x1="548" y1="300" x2="553" y2="300" stroke="#86efac" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── KEY ENZYMES ── -->
  <rect x="20" y="375" width="750" height="100" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#818cf8" stroke-width="2"/>
  <text x="395" y="398" text-anchor="middle" fill="#c4b5fd" font-size="14" font-family="Georgia, serif" font-weight="bold">Key Enzymes in Recombinant DNA Technology</text>
  <text x="130" y="422" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia, serif" font-weight="bold">Restriction Endonuclease</text>
  <text x="130" y="438" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Cuts DNA at specific</text>
  <text x="130" y="452" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">recognition sequences</text>
  <text x="395" y="422" text-anchor="middle" fill="#86efac" font-size="12" font-family="Georgia, serif" font-weight="bold">DNA Ligase</text>
  <text x="395" y="438" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">Joins sticky ends</text>
  <text x="395" y="452" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">of DNA fragments</text>
  <text x="640" y="422" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia, serif" font-weight="bold">Reverse Transcriptase</text>
  <text x="640" y="438" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">mRNA → cDNA</text>
  <text x="640" y="452" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia, serif">(complementary DNA)</text>
</svg>