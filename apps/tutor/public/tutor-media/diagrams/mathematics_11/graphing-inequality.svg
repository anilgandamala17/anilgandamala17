<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:sans-serif;fill:#e2e8f0}.t{font-size:14px;font-weight:bold;fill:#fbbf24}.h{font-size:11px;font-weight:bold;fill:#22c55e}</style></defs>
  <text x="200" y="24" class="t" text-anchor="middle">Graphing Inequality</text>
  <rect x="30" y="40" width="340" height="220" fill="none" stroke="#38bdf8" stroke-opacity=".5" rx="6"/><text x="200" y="60" text-anchor="middle" font-size="11" fill="#38bdf8"># Graphing Inequality</text><text x="45" y="80" font-size="11" fill="#fbbf24" font-family="monospace">def graphing_inequality():</text><text x="45" y="106" font-size="11" fill="#e2e8f0" font-family="monospace">    # Graphing Inequality</text><text x="45" y="132" font-size="11" fill="#e2e8f0" font-family="monospace">    data = initialize()</text><text x="45" y="158" font-size="11" fill="#e2e8f0" font-family="monospace">    for item in data:</text><text x="45" y="184" font-size="11" fill="#e2e8f0" font-family="monospace">        if check(item):</text><text x="45" y="210" font-size="11" fill="#e2e8f0" font-family="monospace">            process(item)</text><text x="45" y="236" font-size="11" fill="#e2e8f0" font-family="monospace">    return result</text>
