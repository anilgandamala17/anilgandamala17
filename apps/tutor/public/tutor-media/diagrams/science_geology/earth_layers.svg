<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Cross section wedge -->
  <path d="M 200 40 L 350 200 Q 200 240, 50 200 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Layers -->
  <path d="M 50 200 Q 200 240, 350 200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Inner Core -->
  <circle cx="200" cy="200" r="30" fill="#fef08a" opacity="0.8" />
  <text x="200" y="205" font-size="8" fill="#000" text-anchor="middle" font-weight="bold">Inner Core</text>

  <!-- Outer Core -->
  <path d="M 140 200 A 60 60 0 0 1 260 200" fill="none" stroke="#fca5a5" stroke-width="20" opacity="0.6" />
  <text x="200" y="175" font-size="8" fill="#fca5a5" text-anchor="middle">Outer Core</text>

  <!-- Mantle -->
  <path d="M 100 200 A 100 100 0 0 1 300 200" fill="none" stroke="#93c5fd" stroke-width="40" opacity="0.4" />
  <text x="200" y="130" font-size="8" fill="#93c5fd" text-anchor="middle">Mantle</text>

  <!-- Crust -->
  <path d="M 50 200 A 150 150 0 0 1 350 200" fill="none" stroke="#86efac" stroke-width="5" />
  <text x="200" y="55" font-size="8" fill="#86efac" text-anchor="middle">Crust (Lithosphere)</text>

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Interior Layers of the Earth</text>
</svg>
