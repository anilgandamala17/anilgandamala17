<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
<defs><style>text{font-family:sans-serif;fill:#e2e8f0}.t{font-size:13px;font-weight:bold;fill:#fbbf24}.h{font-size:11px;fill:#22c55e}.s{font-size:10px;fill:#94a3b8}</style></defs>
<text x="200" y="22" text-anchor="middle" class="t" font-size="12">EUCLID'S DIVISION LEMMA</text><text x="200" y="50" text-anchor="middle" class="h" font-size="12">a = bq + r,   0 ≤ r &lt; b</text><line x1="30" y1="62" x2="370" y2="62" stroke="#fff" stroke-opacity=".2"/><text x="200" y="85" text-anchor="middle" class="s" font-size="12">Example:  455 ÷ 42</text><rect x="50" y="105" width="300" height="30" fill="none" stroke="#fff" stroke-opacity=".4" rx="4"/><text x="200" y="125" text-anchor="middle"  font-size="12">455 = 42 × 10 + 35</text><rect x="50" y="145" width="300" height="30" fill="none" stroke="#fff" stroke-opacity=".4" rx="4"/><text x="200" y="165" text-anchor="middle"  font-size="12">42 = 35 × 1 + 7</text><rect x="50" y="185" width="300" height="30" fill="none" stroke="#fff" stroke-opacity=".4" rx="4"/><text x="200" y="205" text-anchor="middle"  font-size="12">35 = 7 × 5 + 0</text><rect x="90" y="225" width="220" height="35" fill="none" stroke="#fff" stroke-opacity=".4" rx="4"/><text x="200" y="247" text-anchor="middle" class="h" font-size="13">HCF(455, 42) = 7</text><text x="200" y="274" text-anchor="middle" class="s" font-size="12">Stop when remainder = 0</text>
</svg>