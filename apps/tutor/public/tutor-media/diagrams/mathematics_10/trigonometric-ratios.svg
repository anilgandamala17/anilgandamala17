<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
<defs><style>text{font-family:sans-serif;fill:#e2e8f0}.t{font-size:13px;font-weight:bold;fill:#fbbf24}.h{font-size:11px;fill:#22c55e}.s{font-size:10px;fill:#94a3b8}</style></defs>
<text x="200" y="22" text-anchor="middle" class="t" font-size="12">TRIGONOMETRIC RATIOS</text><path d="M50,240 L350,240 L350,80 Z" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="335" y="225" width="15" height="15" fill="none" stroke="#fff" stroke-opacity=".5"/><text x="50" y="255" text-anchor="middle" class="s" font-size="12">A (θ)</text><text x="355" y="255" text-anchor="middle" class="s" font-size="12">B</text><text x="360" y="78" text-anchor="middle" class="s" font-size="12">C</text><path d="M70 240 A25 25 0 0 1 88 228" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="95" y="225" text-anchor="middle" class="s" font-size="12">θ</text><text x="200" y="258" text-anchor="middle" class="s" font-size="12">BC (Opp)</text><text x="375" y="165" text-anchor="middle" class="s" font-size="12">AC (Adj)</text><text x="185" y="155" text-anchor="middle" class="s" font-size="12">AB (Hyp)</text><text x="200" y="46" text-anchor="middle" class="h" font-size="12">sin θ = Opp/Hyp</text><text x="200" y="62" text-anchor="middle" class="h" font-size="12">cos θ = Adj/Hyp</text><text x="200" y="78" text-anchor="middle" class="h" font-size="12">tan θ = Opp/Adj</text>
</svg>