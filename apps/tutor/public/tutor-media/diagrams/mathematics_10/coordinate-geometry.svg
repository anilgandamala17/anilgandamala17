<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
<defs><style>text{font-family:sans-serif;fill:#e2e8f0}.t{font-size:13px;font-weight:bold;fill:#fbbf24}.h{font-size:11px;fill:#22c55e}.s{font-size:10px;fill:#94a3b8}</style></defs>
<text x="200" y="22" text-anchor="middle" class="t" font-size="12">COORDINATE GEOMETRY</text><line x1="30" y1="145" x2="370" y2="145" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><line x1="200" y1="30" x2="200" y2="260" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><circle cx="270" cy="90" r="6" fill="#fbbf24"/><text x="285" y="85" text-anchor="middle" class="s" font-size="12">A(x₁,y₁)</text><circle cx="130" cy="190" r="6" fill="#22c55e"/><text x="115" y="185" text-anchor="middle" class="s" font-size="12">B(x₂,y₂)</text><line x1="270" y1="90" x2="130" y2="190" stroke="#38bdf8" stroke-width="2"/><text x="200" y="240" text-anchor="middle" class="h" font-size="12">d = √[(x₂-x₁)²+(y₂-y₁)²]</text><text x="200" y="258" text-anchor="middle" class="s" font-size="12">Section: (mx₂+nx₁)/(m+n)</text>
