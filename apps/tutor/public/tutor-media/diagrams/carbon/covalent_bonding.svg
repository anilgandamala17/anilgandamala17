<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .label { font-size: 10px; fill: #94a3b8; }
      .electron-path { fill: none; stroke: #94a3b8; stroke-dasharray: 4,4; }
      .electron { fill: #fbbf24; }
      .shared-electron { fill: #ef4444; }
    </style>
  </defs>
  
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">COVALENT BONDING: METHANE (CH₄)</text>

  <g transform="translate(200, 160)">
    <!-- Carbon Atom Center -->
    <circle cx="0" cy="0" r="15" fill="#334155" stroke="#fff" />
    <text x="0" y="5" text-anchor="middle" fontSize="12" fontWeight="bold" fill="white">C</text>
    
    <!-- Carbon Valence Shell -->
    <circle cx="0" cy="0" r="40" class="electron-path" />

    <!-- Hydrogen Atoms (4 around) -->
    <!-- Top -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="10" fill="#cbd5e1" stroke="#fff" />
      <text x="0" y="4" text-anchor="middle" fontSize="10" fill="black">H</text>
      <circle cx="0" cy="0" r="20" class="electron-path" />
      <!-- Shared Pair -->
      <circle cx="-5" cy="20" r="3" class="shared-electron" />
      <circle cx="5" cy="20" r="3" class="electron" />
    </g>

    <!-- Bottom -->
    <g transform="translate(0, 60)">
      <circle cx="0" cy="0" r="10" fill="#cbd5e1" stroke="#fff" />
      <text x="0" y="4" text-anchor="middle" fontSize="10" fill="black">H</text>
      <circle cx="0" cy="0" r="20" class="electron-path" />
       <!-- Shared Pair -->
      <circle cx="-5" cy="-20" r="3" class="shared-electron" />
      <circle cx="5" cy="-20" r="3" class="electron" />
    </g>

    <!-- Left -->
    <g transform="translate(-60, 0)">
      <circle cx="0" cy="0" r="10" fill="#cbd5e1" stroke="#fff" />
      <text x="0" y="4" text-anchor="middle" fontSize="10" fill="black">H</text>
      <circle cx="0" cy="0" r="20" class="electron-path" />
       <!-- Shared Pair -->
      <circle cx="20" cy="-5" r="3" class="shared-electron" />
      <circle cx="20" cy="5" r="3" class="electron" />
    </g>

    <!-- Right -->
    <g transform="translate(60, 0)">
      <circle cx="0" cy="0" r="10" fill="#cbd5e1" stroke="#fff" />
      <text x="0" y="4" text-anchor="middle" fontSize="10" fill="black">H</text>
      <circle cx="0" cy="0" r="20" class="electron-path" />
       <!-- Shared Pair -->
      <circle cx="-20" cy="-5" r="3" class="shared-electron" />
      <circle cx="-20" cy="5" r="3" class="electron" />
    </g>
  </g>
  
  <text x="20" y="260" class="label" fill="#fbbf24">Single Bond: 1 pair of electrons shared</text>
</svg>
