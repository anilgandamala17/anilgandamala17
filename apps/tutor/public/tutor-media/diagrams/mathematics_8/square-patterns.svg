<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Square Number Patterns</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>

<rect x="20" y="70" width="370" height="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="95" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Sum of Odd Numbers</text>
<text x="205" y="125" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">1 = 1²</text>
<text x="205" y="145" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">1 + 3 = 4 = 2²</text>
<text x="205" y="165" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">1 + 3 + 5 = 9 = 3²</text>
<text x="205" y="185" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">1 + 3 + 5 + 7 = 16 = 4²</text>
<text x="205" y="210" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Sum of first n odd numbers = n²</text>

<rect x="410" y="70" width="370" height="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="95" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Numbers Between Squares</text>
<text x="595" y="125" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Between n² and (n+1)²</text>
<text x="595" y="150" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle">There are 2n non-square numbers</text>
<text x="595" y="180" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">Example: n=3 (3²=9) and n=4 (4²=16)</text>
<text x="595" y="200" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="middle">2 × 3 = 6 numbers: 10,11,12,13,14,15</text>

<line x1="20" y1="235" x2="780" y2="235" stroke="#86efac" stroke-width="1"/>
<text x="400" y="260" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Pythagorean Triplets</text>
<text x="400" y="285" font-family="'Segoe UI',sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Three numbers a, b, c such that a² + b² = c²</text>

<rect x="230" y="300" width="340" height="120" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="325" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">General Form for any m &gt; 1</text>
<text x="400" y="360" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">(2m), (m² − 1), (m² + 1)</text>
<text x="400" y="390" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Example: m=3 → (6, 8, 10)</text>
<text x="400" y="410" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Check: 6² + 8² = 36 + 64 = 100 = 10² ✓</text>

<rect x="20" y="440" width="760" height="110" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="465" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Observing Unit Digits</text>
<text x="400" y="495" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Number ends in 1 or 9 → Square ends in 1</text>
<text x="400" y="515" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Number ends in 4 or 6 → Square ends in 6</text>
<text x="400" y="535" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Number ends in 5 → Square ends in 5</text>
</svg>
