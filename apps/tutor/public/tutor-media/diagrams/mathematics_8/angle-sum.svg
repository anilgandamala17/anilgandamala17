<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Angle Sum Property &amp; Polygons</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>

<!-- Triangle -->
<polygon points="100,160 150,80 200,160" fill="none" stroke="#ffd54f" stroke-width="2"/>
<text x="150" y="180" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Triangle (n=3)</text>
<text x="150" y="195" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sum = 180°</text>

<!-- Quadrilateral -->
<rect x="250" y="80" width="80" height="80" fill="none" stroke="#86efac" stroke-width="2"/>
<line x1="250" y1="80" x2="330" y2="160" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-dasharray="4,2"/>
<text x="290" y="180" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle">Quadrilateral (n=4)</text>
<text x="290" y="195" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sum = 2 × 180° = 360°</text>

<!-- Pentagon -->
<polygon points="400,80 450,115 430,165 370,165 350,115" fill="none" stroke="#f48fb1" stroke-width="2"/>
<text x="400" y="180" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f48fb1" text-anchor="middle">Pentagon (n=5)</text>
<text x="400" y="195" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sum = 3 × 180° = 540°</text>

<!-- Hexagon -->
<polygon points="530,85 570,85 590,120 570,155 530,155 510,120" fill="none" stroke="#c084fc" stroke-width="2"/>
<text x="550" y="180" font-family="'Segoe UI',sans-serif" font-size="12" fill="#c084fc" text-anchor="middle">Hexagon (n=6)</text>
<text x="550" y="195" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sum = 4 × 180° = 720°</text>

<rect x="20" y="215" width="760" height="150" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="240" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">General Formulas for Polygons</text>
<text x="150" y="275" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Interior Angle Sum = (n − 2) × 180°</text>
<text x="150" y="305" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="start">Exterior Angle Sum = 360° (Always!)</text>
<text x="150" y="335" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="start">For Regular Polygon (n sides):</text>
<text x="480" y="335" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">Each Ext. Angle = 360° / n</text>
<text x="150" y="355" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="start">Each Int. Angle = 180° − (360° / n)</text>

<rect x="20" y="380" width="370" height="180" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="405" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Solve for x</text>
<polygon points="100,520 150,440 250,440 300,520" fill="none" stroke="#86efac" stroke-width="1.5"/>
<text x="115" y="515" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="start">50°</text>
<text x="160" y="455" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="start">130°</text>
<text x="220" y="455" font-family="'Segoe UI',sans-serif" font-size="12" fill="#fff" text-anchor="start">120°</text>
<text x="270" y="515" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="start">x?</text>
<text x="205" y="545" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">50 + 130 + 120 + x = 360</text>
<text x="205" y="565" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">300 + x = 360 → x = 60°</text>

<rect x="410" y="380" width="370" height="180" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="405" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Regular Polygons</text>
<text x="430" y="435" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="start">Equilateral Triangle: n=3, Each = 60°</text>
<text x="430" y="460" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="start">Square: n=4, Each = 90°</text>
<text x="430" y="485" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="start">Regular Pentagon: n=5, Each = 108°</text>
<text x="430" y="510" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="start">Regular Hexagon: n=6, Each = 120°</text>
<text x="430" y="550" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="start">n=7: Heptagon | n=8: Octagon | n=10: Decagon</text>
</svg>