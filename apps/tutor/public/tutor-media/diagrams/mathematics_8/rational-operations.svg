<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Operations on Rational Numbers</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>

<rect x="20" y="67" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="90" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Addition and Subtraction</text>
<text x="205" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Same denominator:</text>
<text x="205" y="130" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">a/c ± b/c = (a ± b)/c</text>
<text x="205" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Different denominators:</text>
<text x="205" y="170" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">a/b ± c/d = (ad ± bc) / bd</text>
<text x="205" y="192" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Step 1: Find LCM of denominators</text>
<text x="205" y="212" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Step 2: Convert to equivalent fractions</text>

<rect x="410" y="67" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="90" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Multiplication and Division</text>
<text x="595" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Multiplication:</text>
<text x="595" y="130" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">a/b × c/d = ac/bd</text>
<text x="595" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Division (multiply by reciprocal):</text>
<text x="595" y="170" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">a/b ÷ c/d = a/b × d/c = ad/bc</text>
<text x="595" y="192" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">KCF: Keep, Change, Flip method</text>
<text x="595" y="212" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Simplify using HCF before multiplying</text>

<line x1="20" y1="235" x2="780" y2="235" stroke="#86efac" stroke-width="1"/>
<text x="400" y="258" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Worked Examples</text>

<rect x="20" y="270" width="230" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" rx="8"/>
<text x="135" y="292" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Addition</text>
<text x="135" y="314" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">3/4 + 2/3</text>
<text x="135" y="334" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">LCM(4,3) = 12</text>
<text x="135" y="354" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">= 9/12 + 8/12</text>
<text x="135" y="374" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">= 17/12</text>
<text x="135" y="454" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Mixed: 1 5/12</text>

<rect x="262" y="270" width="257" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" rx="8"/>
<text x="390" y="292" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Multiplication</text>
<text x="390" y="314" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">−5/6 × 3/10</text>
<text x="390" y="334" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">= −(5×3)/(6×10)</text>
<text x="390" y="354" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">= −15/60</text>
<text x="390" y="374" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Simplify ÷ HCF(15) = </text>
<text x="390" y="394" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">= −1/4</text>

<rect x="531" y="270" width="249" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" rx="8"/>
<text x="655" y="292" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Division</text>
<text x="655" y="314" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">3/7 ÷ (−9/14)</text>
<text x="655" y="334" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle">= 3/7 × 14/(−9)</text>
<text x="655" y="354" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">= 42/(−63)</text>
<text x="655" y="374" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Simplify ÷ HCF(21) = </text>
<text x="655" y="394" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">= −2/3</text>

<line x1="20" y1="483" x2="780" y2="483" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="507" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Sign Rules</text>
<text x="400" y="530" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">(+) × (+) = (+)  |  (−) × (−) = (+)  |  (+) × (−) = (−)  |  (−) × (+) = (−)</text>
<text x="400" y="558" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Negative rational: either numerator OR denominator is negative (not both) | −(p/q) = (−p)/q = p/(−q)</text>
</svg>
