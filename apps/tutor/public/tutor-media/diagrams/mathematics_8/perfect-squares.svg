<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Squares and Square Roots</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Perfect Square: n² | Square Root: √(n²) = n | Inverse operations of each other</text>

<!-- Visual square pattern: 3x3 -->
<rect x="25" y="82" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="57" y="82" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="89" y="82" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="25" y="114" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="57" y="114" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="89" y="114" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="25" y="146" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="57" y="146" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<rect x="89" y="146" width="30" height="30" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
<text x="72" y="196" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">3² = 9</text>

<rect x="20" y="82" width="265" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>

<rect x="150" y="87" width="130" height="117" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" rx="4"/>
<text x="215" y="109" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Perfect Squares</text>
<text x="215" y="127" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">1²=1, 2²=4, 3²=9</text>
<text x="215" y="145" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">4²=16, 5²=25</text>
<text x="215" y="163" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">6²=36, 7²=49</text>
<text x="215" y="181" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">8²=64, 9²=81</text>
<text x="215" y="199" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">10²=100, 12²=144</text>

<rect x="295" y="82" width="220" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="405" y="103" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Properties of Perfect Squares</text>
<text x="405" y="123" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Ends in 0,1,4,5,6,9 (never 2,3,7,8)</text>
<text x="405" y="141" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Odd sq → odd result | Even sq → even</text>
<text x="405" y="159" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">• n² = n + (n−1)² − (n−1) pattern</text>
<text x="405" y="177" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">• Pythagorean triplet: (3,4,5), (5,12,13)</text>
<text x="405" y="197" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">• Number of zeros: always even count</text>

<rect x="530" y="82" width="250" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="655" y="103" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Interesting Patterns</text>
<text x="655" y="123" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Sum of first n odd numbers = n²</text>
<text x="655" y="141" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">1+3 = 4=2² | 1+3+5 = 9=3²</text>
<text x="655" y="159" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">1+3+5+7 = 16 = 4²</text>
<text x="655" y="179" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">111² = 12321 | 1111² = 1234321</text>
<text x="655" y="199" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Square of 5-ending: ab5² = ab(ab+1)25</text>

<line x1="20" y1="225" x2="780" y2="225" stroke="#86efac" stroke-width="1"/>
<text x="400" y="248" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Finding Square Roots</text>

<rect x="20" y="260" width="370" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="283" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Prime Factorisation Method</text>
<text x="205" y="305" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Find √324</text>
<text x="205" y="325" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">324 = 2×2 × 3×3 × 3×3</text>
<text x="205" y="345" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">√324 = 2 × 3 × 3 = 18</text>
<text x="205" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Rule: Pair up prime factors</text>
<text x="205" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Take one from each pair</text>
<text x="205" y="408" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Multiply to get square root</text>
<text x="205" y="440" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle">If any prime is unpaired → not a perfect sq</text>
<text x="205" y="455" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">√0.09 = 0.3 | √(p/q) = √p / √q</text>

<rect x="410" y="260" width="370" height="200" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="283" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Long Division Method</text>
<text x="595" y="305" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Find √529</text>
<text x="595" y="325" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Step 1: Group from right in pairs: 5 | 29</text>
<text x="595" y="345" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Step 2: Find largest sq ≤ 5: 2² = 4</text>
<text x="595" y="365" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Step 3: Remainder = 1, bring down 29: 129</text>
<text x="595" y="385" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Step 4: New divisor: 2×2 = 4_, try 43×3=129</text>
<text x="595" y="406" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">√529 = 23</text>
<text x="595" y="430" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Works for decimal square roots too</text>
<text x="595" y="450" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="middle">Group decimals from decimal point outward</text>

<text x="400" y="505" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">√ab = √a × √b | √(a/b) = √a / √b | (√a)² = a | √(a²) = |a| = a (for positive a)</text>
<text x="400" y="535" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Estimate √50: between √49=7 and √64=8, closer to 7 → ≈7.07</text>
</svg>