<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="38" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Applications of Linear Equations</text>
<line x1="20" y1="52" x2="780" y2="52" stroke="#86efac" stroke-width="1"/>
<text x="400" y="70" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Real-world use of linear equations in one variable</text>

<rect x="20" y="82" width="240" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="140" y="104" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Speed, Distance, Time</text>
<text x="140" y="124" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Distance = Speed × Time</text>
<text x="140" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Two trains approach each other</text>
<text x="140" y="162" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">at 60 &amp; 40 km/h, 200 km apart</text>
<text x="140" y="180" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">60t + 40t = 200 → t = 2h</text>
<text x="140" y="200" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Meet after 2 hours</text>
<text x="140" y="220" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Speed = D/T | Time = D/S</text>

<rect x="275" y="82" width="250" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="104" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Mixtures &amp; Percentages</text>
<text x="400" y="124" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">If 30% of a number = 90</text>
<text x="400" y="142" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">30/100 × x = 90</text>
<text x="400" y="160" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">x = 300</text>
<text x="400" y="182" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Profit% = (Profit/CP) × 100</text>
<text x="400" y="200" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Loss% = (Loss/CP) × 100</text>
<text x="400" y="220" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">SP = CP(1 + P%/100)</text>

<rect x="540" y="82" width="240" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="660" y="104" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Simple Interest</text>
<text x="660" y="124" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">SI = P × R × T / 100</text>
<text x="660" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">P principal, R rate, T time (yr)</text>
<text x="660" y="164" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Amount = P + SI</text>
<text x="660" y="186" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">SI = ₹450, R = 5%, T = 3yr</text>
<text x="660" y="204" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">450 = P×5×3/100 → P = ₹3000</text>
<text x="660" y="222" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Always forms a linear equation!</text>

<line x1="20" y1="238" x2="780" y2="238" stroke="#86efac" stroke-width="1"/>
<text x="400" y="259" font-family="'Segoe UI',sans-serif" font-size="15" fill="#ffd54f" text-anchor="middle" font-weight="bold">Digit &amp; Share Problems</text>

<rect x="20" y="272" width="370" height="165" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="294" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Two-Digit Number</text>
<text x="205" y="314" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Digits sum = 9; reversed exceeds by 27</text>
<text x="205" y="334" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Let unit digit = x → tens = 9−x</text>
<text x="205" y="354" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Original = 10(9−x) + x = 90 − 9x</text>
<text x="205" y="374" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Reversed = 10x + (9−x) = 9x + 9</text>
<text x="205" y="394" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">9x+9 − (90−9x) = 27 → 18x = 108 → x = 6</text>
<text x="205" y="426" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Original number = 36</text>

<rect x="410" y="272" width="370" height="165" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="294" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle" font-weight="bold">Sharing / Ratio Problem</text>
<text x="595" y="314" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">₹3500 shared between A and B</text>
<text x="595" y="334" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">A gets ₹500 more than B</text>
<text x="595" y="354" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Let B = x → A = x + 500</text>
<text x="595" y="374" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">x + x + 500 = 3500</text>
<text x="595" y="394" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">2x = 3000 → x = 1500</text>
<text x="595" y="426" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">A = ₹2000, B = ₹1500</text>

<text x="400" y="480" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Pipe &amp; Tank: 1/a + 1/b = 1/t | Work: combined rate = sum of individual rates</text>
<text x="400" y="506" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Diagonal cross-multiplication: a/b = c/d ⟹ ad = bc (proportional equations)</text>
<text x="400" y="540" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Equations arise in ALL real situations: time, money, geometry, rates, mixtures, shares</text>
</svg>
