<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <defs>
    <marker id="arrowW" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#ffffff"/></marker>
  </defs>
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Neuron Anatomy</text>
  <!-- Dendrites (left) -->
  <line x1="20" y1="100" x2="80" y2="135" stroke="#93c5fd" stroke-width="2"/>
  <line x1="20" y1="130" x2="80" y2="138" stroke="#93c5fd" stroke-width="2"/>
  <line x1="20" y1="160" x2="80" y2="142" stroke="#93c5fd" stroke-width="2"/>
  <line x1="30" y1="85" x2="80" y2="130" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="30" y1="175" x2="80" y2="148" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Dendrite tips -->
  <circle cx="20" cy="100" r="4" fill="#93c5fd"/>
  <circle cx="20" cy="130" r="4" fill="#93c5fd"/>
  <circle cx="20" cy="160" r="4" fill="#93c5fd"/>
  <circle cx="30" cy="85" r="3" fill="#93c5fd"/>
  <circle cx="30" cy="175" r="3" fill="#93c5fd"/>
  <text x="25" y="200" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Dendrites</text>
  <!-- Cell body (soma) -->
  <ellipse cx="115" cy="138" rx="35" ry="30" fill="rgba(134,239,172,0.15)" stroke="#86efac" stroke-width="2"/>
  <!-- Nucleus inside soma -->
  <circle cx="115" cy="138" r="12" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="115" y="142" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">Nu</text>
  <text x="115" y="180" font-size="9" fill="#86efac" text-anchor="middle" font-family="monospace">Soma</text>
  <text x="115" y="192" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(Cell body)</text>
  <!-- Axon hillock -->
  <path d="M148 138 L170 138" stroke="#ffffff" stroke-width="2.5"/>
  <text x="159" y="128" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">Axon</text>
  <text x="159" y="118" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle" font-family="monospace">Hillock</text>
  <!-- Axon -->
  <line x1="170" y1="138" x2="310" y2="138" stroke="#ffffff" stroke-width="3"/>
  <text x="240" y="125" font-size="10" fill="#ffffff" text-anchor="middle" font-family="monospace">Axon</text>
  <!-- Myelin sheaths -->
  <ellipse cx="200" cy="138" rx="14" ry="10" fill="rgba(252,165,165,0.2)" stroke="#fca5a5" stroke-width="1.5"/>
  <ellipse cx="230" cy="138" rx="14" ry="10" fill="rgba(252,165,165,0.2)" stroke="#fca5a5" stroke-width="1.5"/>
  <ellipse cx="260" cy="138" rx="14" ry="10" fill="rgba(252,165,165,0.2)" stroke="#fca5a5" stroke-width="1.5"/>
  <ellipse cx="290" cy="138" rx="14" ry="10" fill="rgba(252,165,165,0.2)" stroke="#fca5a5" stroke-width="1.5"/>
  <!-- Nodes of Ranvier -->
  <line x1="215" y1="130" x2="215" y2="146" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="245" y1="130" x2="245" y2="146" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="275" y1="130" x2="275" y2="146" stroke="#ffffff" stroke-width="1.5"/>
  <text x="215" y="160" font-size="8" fill="#fca5a5" text-anchor="middle" font-family="monospace">Myelin</text>
  <text x="215" y="170" font-size="8" fill="#fca5a5" text-anchor="middle" font-family="monospace">Sheath</text>
  <text x="245" y="160" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Node of</text>
  <text x="245" y="170" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Ranvier</text>
  <!-- Axon terminals -->
  <line x1="310" y1="138" x2="340" y2="115" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="310" y1="138" x2="345" y2="135" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="310" y1="138" x2="340" y2="158" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="342" cy="113" r="5" fill="#fbbf24"/>
  <circle cx="347" cy="135" r="5" fill="#fbbf24"/>
  <circle cx="342" cy="160" r="5" fill="#fbbf24"/>
  <text x="370" y="138" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Axon</text>
  <text x="370" y="150" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Terminals</text>
  <!-- Signal direction -->
  <path d="M80 220 L320 220" stroke="rgba(255,255,255,0.3)" stroke-width="1" marker-end="url(#arrowW)"/>
  <text x="200" y="235" font-size="9" fill="rgba(255,255,255,0.5)" text-anchor="middle" font-family="monospace">Signal direction →</text>
  <text x="200" y="268" font-size="9" fill="rgba(255,255,255,0.35)" text-anchor="middle" font-family="monospace">Saltatory conduction: signal jumps node to node</text>
</svg>
