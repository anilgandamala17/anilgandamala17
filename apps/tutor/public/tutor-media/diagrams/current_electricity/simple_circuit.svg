<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .wire { fill: none; stroke: #fbbf24; stroke-width: 3; }
      .component { fill: none; stroke: #fff; stroke-width: 2; }
      .bulb-glass { fill: rgba(251, 191, 36, 0.2); stroke: #fff; }
      .battery-pos { stroke: #ef4444; stroke-width: 4; }
      .battery-neg { stroke: #fff; stroke-width: 4; }
    </style>
  </defs>
  
  <rect width="400" height="300" fill="#1a3a2a" />
  <text x="20" y="30" class="title">SIMPLE ELECTRIC CIRCUIT</text>

  <g transform="translate(50, 50)">
    <!-- Wires forming a rectangle -->
    <polyline points="0,100 0,0 300,0 300,100" class="wire" />
    <polyline points="300,100 300,200 0,200 0,100" class="wire" />
    
    <!-- Battery (Left side) -->
    <g transform="translate(0, 100)">
        <rect x="-10" y="-20" width="20" height="40" fill="#1a3a2a" stroke="none"/> <!-- Mask wire -->
        <line x1="-15" y1="-10" x2="15" y2="-10" class="battery-pos" /> <!-- Long bar (+) -->
        <line x1="-8" y1="10" x2="8" y2="10" class="battery-neg" /> <!-- Short bar (-) -->
        <text x="-30" y="-5" fontSize="16" fill="#ef4444" fontWeight="bold">+</text>
        <text x="-30" y="15" fontSize="16" fill="#fff" fontWeight="bold">-</text>
    </g>

    <!-- Bulb (Top side) -->
    <g transform="translate(150, 0)">
        <circle cx="0" cy="0" r="20" class="bulb-glass" />
        <path d="M -10 0 L 0 -10 L 10 0" class="component" /> <!-- Filament -->
        <text x="0" y="-30" text-anchor="middle" fontSize="10">Bulb / Load</text>
    </g>

    <!-- Switch (Bottom side) -->
    <g transform="translate(150, 200)">
        <rect x="-20" y="-10" width="40" height="20" fill="#1a3a2a" stroke="none"/> <!-- Mask wire -->
        <circle cx="-20" cy="0" r="3" fill="#fff"/>
        <circle cx="20" cy="0" r="3" fill="#fff"/>
        <line x1="-20" y1="0" x2="15" y2="-10" class="component" /> <!-- Open switch arm -->
        <text x="0" y="20" text-anchor="middle" fontSize="10">Key (Open)</text>
    </g>

    <!-- Current Direction Arrows -->
    <path d="M 20 0 L 30 0" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path d="M 20 200 L 10 200" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowhead)"/>
    
     <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#ef4444" />
    </marker>
  </defs>

  </g>
</svg>
