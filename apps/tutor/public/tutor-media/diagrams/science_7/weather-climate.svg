<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Weather, Climate and Adaptations</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">Weather = Daily conditions | Climate = Long-term average (30 years+) of a region</text>

<rect x="20" y="86" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="109" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Weather vs Climate</text>
<text x="205" y="131" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Weather: short term, changes daily</text>
<text x="205" y="151" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Climate: long term, defines region</text>
<text x="205" y="171" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">Climate = average weather over 30+ years</text>
<text x="205" y="195" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Determined by: latitude, altitude, distance from sea</text>

<rect x="410" y="86" width="370" height="118" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="109" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Climate Zones</text>
<text x="595" y="131" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Tropical: hot and rainy (near equator)</text>
<text x="595" y="151" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Temperate: mild, 4 seasons (mid latitudes)</text>
<text x="595" y="171" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Polar/Arctic: extremely cold (poles)</text>
<text x="595" y="195" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Desert: hot &amp; dry | Tundra: very cold &amp; dry</text>

<line x1="20" y1="218" x2="780" y2="218" stroke="#86efac" stroke-width="1"/>
<text x="400" y="242" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">Animal Adaptations to Climate</text>

<rect x="20" y="254" width="370" height="148" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="277" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Polar Regions (Very Cold)</text>
<text x="205" y="299" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Polar bear: thick fur &amp; blubber layer</text>
<text x="205" y="319" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">White colour: camouflage in snow</text>
<text x="205" y="339" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Penguin: huddled for warmth</text>
<text x="205" y="359" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Streamlined body for swimming</text>
<text x="205" y="379" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ffd54f" text-anchor="middle">Migration and hibernation in winter</text>
<text x="205" y="394" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Small ears reduce heat loss</text>

<rect x="410" y="254" width="370" height="148" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="277" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Tropical / Hot Climates</text>
<text x="595" y="299" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Camel: hump stores fat (not water)</text>
<text x="595" y="319" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Nostrils close to prevent sand entry</text>
<text x="595" y="339" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Long legs: away from hot ground</text>
<text x="595" y="359" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Broad padded feet on sand</text>
<text x="595" y="379" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ffd54f" text-anchor="middle">Can survive days without water</text>
<text x="595" y="394" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Thick eyelashes protect from dust</text>

<line x1="20" y1="416" x2="780" y2="416" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="440" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Elements of Weather</text>

<rect x="20" y="452" width="760" height="95" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="474" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Temperature: measured by thermometer | Humidity: amount of water vapour in air (0–100%)</text>
<text x="400" y="496" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Rainfall: measured by rain gauge | Wind: measured by anemometer (speed) + wind vane (direction)</text>
<text x="400" y="518" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Sunshine: measured by sunshine recorder | Air pressure: measured by barometer</text>
<text x="400" y="534" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Meteorology = science of weather | Meteorologist = weather scientist</text>

<text x="400" y="572" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Monsoon = seasonal wind that brings heavy rainfall — India's agriculture depends on monsoon</text>
</svg>
