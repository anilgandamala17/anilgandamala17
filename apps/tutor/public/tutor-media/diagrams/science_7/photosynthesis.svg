<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Photosynthesis</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<rect x="50" y="62" width="700" height="48" fill="none" stroke="#ffd54f" stroke-width="1.5" rx="8"/>
<text x="400" y="82" font-family="'Segoe UI',sans-serif" font-size="18" fill="#ffd54f" text-anchor="middle" font-weight="bold">6CO₂ + 6H₂O + Light Energy → C₆H₁₂O₆ + 6O₂</text>
<text x="400" y="104" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle">Carbon dioxide + Water + Sunlight → Glucose + Oxygen</text>

<!-- Leaf diagram -->
<ellipse cx="400" cy="215" rx="130" ry="85" fill="none" stroke="#86efac" stroke-width="2"/>
<line x1="400" y1="130" x2="400" y2="300" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4"/>
<line x1="340" y1="185" x2="460" y2="185" stroke="#86efac" stroke-width="1" stroke-dasharray="3"/>
<line x1="320" y1="215" x2="480" y2="215" stroke="#86efac" stroke-width="1" stroke-dasharray="3"/>
<line x1="340" y1="245" x2="460" y2="245" stroke="#86efac" stroke-width="1" stroke-dasharray="3"/>
<text x="400" y="220" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">LEAF</text>
<text x="400" y="238" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Chloroplasts</text>

<!-- Inputs/Outputs -->
<text x="195" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="#80d8ff" text-anchor="end">CO₂ in →</text>
<text x="195" y="260" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.8)" text-anchor="end">H₂O from roots ↑</text>
<text x="605" y="165" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac">← O₂ out</text>
<text x="605" y="260" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f">← Glucose stored</text>
<text x="400" y="128" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle">☀ Sunlight</text>

<line x1="20" y1="312" x2="780" y2="312" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

<rect x="20" y="324" width="235" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="137" y="346" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Raw Materials</text>
<text x="137" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Carbon dioxide (CO₂)</text>
<text x="137" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Water (H₂O) from roots</text>
<text x="137" y="408" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Sunlight (energy)</text>
<text x="137" y="428" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Chlorophyll (green pigment)</text>
<text x="137" y="460" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Enters through stomata &amp; roots</text>

<rect x="283" y="324" width="234" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="400" y="346" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Products</text>
<text x="400" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Glucose (C₆H₁₂O₆)</text>
<text x="400" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Stored as starch in plant</text>
<text x="400" y="408" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Oxygen (O₂) released</text>
<text x="400" y="428" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Energy stored in bonds</text>
<text x="400" y="460" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">O₂ released through stomata</text>

<rect x="545" y="324" width="235" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="662" y="346" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Where it Happens</text>
<text x="662" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">In leaves mainly</text>
<text x="662" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Chloroplasts (organelle)</text>
<text x="662" y="408" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Green parts of plant</text>
<text x="662" y="428" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Mesophyll cells</text>
<text x="662" y="460" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Also in stem if green</text>

<text x="400" y="496" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Chlorophyll = green pigment that captures light energy</text>
<text x="400" y="520" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Plants are AUTOTROPHS — they make their own food</text>
<text x="400" y="555" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Stomata (tiny pores on leaf) open for CO₂ in during day | Close at night to prevent water loss</text>
</svg>