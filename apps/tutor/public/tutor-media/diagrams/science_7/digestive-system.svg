<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Human Digestive System</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">Mouth → Oesophagus → Stomach → Small Intestine → Large Intestine → Anus</text>

<!-- Left: organ list with arrows -->
<text x="150" y="105" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Mouth</text>
<text x="150" y="122" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Teeth chew | Saliva (amylase)</text>
<line x1="150" y1="128" x2="150" y2="145" stroke="#86efac" stroke-width="1.5"/>
<polygon points="150,148 146,141 154,141" fill="#86efac"/>
<text x="150" y="168" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Oesophagus</text>
<text x="150" y="185" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Food pipe | peristalsis moves food</text>
<line x1="150" y1="191" x2="150" y2="208" stroke="#86efac" stroke-width="1.5"/>
<polygon points="150,211 146,204 154,204" fill="#86efac"/>
<text x="150" y="231" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Stomach</text>
<text x="150" y="248" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">HCl + pepsin | protein digestion</text>
<line x1="150" y1="254" x2="150" y2="271" stroke="#86efac" stroke-width="1.5"/>
<polygon points="150,274 146,267 154,267" fill="#86efac"/>
<text x="150" y="294" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Small Intestine</text>
<text x="150" y="311" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">7m | bile + enzymes | absorption</text>
<line x1="150" y1="317" x2="150" y2="334" stroke="#86efac" stroke-width="1.5"/>
<polygon points="150,337 146,330 154,330" fill="#86efac"/>
<text x="150" y="357" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Large Intestine</text>
<text x="150" y="374" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">1.5m | absorbs water from waste</text>
<line x1="150" y1="380" x2="150" y2="397" stroke="#86efac" stroke-width="1.5"/>
<polygon points="150,400 146,393 154,393" fill="#86efac"/>
<text x="150" y="420" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Anus</text>
<text x="150" y="437" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Egestion of faeces</text>

<line x1="295" y1="65" x2="295" y2="460" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4"/>

<!-- Right: accessory glands and details -->
<rect x="310" y="68" width="470" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="545" y="91" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Accessory Glands and Organs</text>
<text x="545" y="112" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Salivary glands: saliva (amylase breaks starch)</text>
<text x="545" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Liver: produces bile (emulsifies fats)</text>
<text x="545" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Pancreas: lipase, amylase, protease (all-in-one)</text>
<text x="545" y="172" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Gall bladder: stores bile | releases into duodenum</text>

<rect x="310" y="196" width="470" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="545" y="219" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Small Intestine — Main Absorption Site</text>
<text x="545" y="241" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Duodenum: receives bile + pancreatic juice</text>
<text x="545" y="261" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Jejunum + Ileum: absorption into blood</text>
<text x="545" y="281" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Villi &amp; microvilli increase surface area</text>
<text x="545" y="301" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">90% of nutrients absorbed here</text>

<rect x="310" y="324" width="470" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="545" y="347" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Key Terms</text>
<text x="545" y="369" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Chyme: semi-liquid food leaving stomach</text>
<text x="545" y="389" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Peristalsis: wave-like muscle contractions</text>
<text x="545" y="409" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Assimilation: absorbed nutrients used by cells</text>
<text x="545" y="429" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Egestion: removal of undigested food as faeces</text>

<line x1="20" y1="462" x2="780" y2="462" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="488" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Digestion types: Mechanical (chewing, churning) + Chemical (enzymes break molecules)</text>
<text x="400" y="512" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Starch → Glucose | Proteins → Amino acids | Fats → Fatty acids + Glycerol</text>
<text x="400" y="548" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Total length of digestive tract including small + large intestine ≈ 9 metres</text>
</svg>