<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Soil — Our Lifeline</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">Soil = thin layer of earth on which all life on land depends</text>

<!-- Soil Profile cross-section -->
<rect x="30" y="88" width="200" height="350" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" rx="4"/>
<rect x="30" y="88" width="200" height="70" fill="rgba(139,90,43,0.4)" rx="4 4 0 0"/>
<text x="130" y="115" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">O Horizon</text>
<text x="130" y="133" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Dead leaves, humus</text>
<text x="130" y="149" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Organic layer</text>
<rect x="30" y="158" width="200" height="70" fill="rgba(92,64,26,0.5)"/>
<text x="130" y="185" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">A Horizon (Topsoil)</text>
<text x="130" y="203" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Rich in nutrients, humus</text>
<text x="130" y="219" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Supports plant growth</text>
<rect x="30" y="228" width="200" height="70" fill="rgba(139,115,60,0.45)"/>
<text x="130" y="253" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">B Horizon (Subsoil)</text>
<text x="130" y="271" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Minerals, less humus</text>
<text x="130" y="287" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Clay minerals accumulate</text>
<rect x="30" y="298" width="200" height="70" fill="rgba(160,130,80,0.4)"/>
<text x="130" y="323" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">C Horizon (Regolith)</text>
<text x="130" y="341" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Partly weathered rock</text>
<text x="130" y="357" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Parent material</text>
<rect x="30" y="368" width="200" height="70" fill="rgba(120,120,120,0.4)" rx="0 0 4 4"/>
<text x="130" y="393" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Bedrock</text>
<text x="130" y="411" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Unweathered solid rock</text>
<text x="130" y="427" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Source of all minerals</text>

<!-- Right panels -->
<rect x="250" y="88" width="530" height="115" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="515" y="111" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Composition of Soil</text>
<text x="515" y="133" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Minerals: 45% | Water: 25% | Air: 25% | Organic matter: 5%</text>
<text x="515" y="153" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Humus: decayed organic material that enriches soil fertility</text>
<text x="515" y="173" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">pH affects which nutrients are available to plants</text>
<text x="515" y="193" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ffd54f" text-anchor="middle">Sand: large particles | Silt: medium | Clay: tiny (holds water most)</text>

<rect x="250" y="215" width="260" height="222" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="380" y="238" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Types of Soil</text>
<text x="380" y="260" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Sandy Soil</text>
<text x="380" y="278" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Gritty, drains fast, poor fertility</text>
<text x="380" y="296" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Good for desert plants</text>
<text x="380" y="318" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Clayey Soil</text>
<text x="380" y="336" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Smooth, holds water, heavy</text>
<text x="380" y="354" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Good for pottery, paddy</text>
<text x="380" y="376" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="bold">Loamy Soil (BEST)</text>
<text x="380" y="394" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Sand + Clay + Silt mixture</text>
<text x="380" y="412" font-family="'Segoe UI',sans-serif" font-size="12" fill="#86efac" text-anchor="middle">Best for most crop farming!</text>
<text x="380" y="428" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Good drainage + water retention</text>

<rect x="528" y="215" width="252" height="222" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="654" y="238" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Soil Conservation</text>
<text x="654" y="260" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Soil erosion: loss of topsoil</text>
<text x="654" y="279" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Caused by: wind, water, deforestation</text>
<text x="654" y="299" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Prevention methods:</text>
<text x="654" y="319" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Planting trees (afforestation)</text>
<text x="654" y="339" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Terrace farming on slopes</text>
<text x="654" y="359" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Contour ploughing</text>
<text x="654" y="379" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Check dams and bunding</text>
<text x="654" y="399" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Crop rotation</text>
<text x="654" y="419" font-family="'Segoe UI',sans-serif" font-size="11" fill="#86efac" text-anchor="middle">Soil = non-renewable resource!</text>
<text x="654" y="429" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Takes 1000 yrs to form 1 inch</text>

<text x="400" y="465" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Soil formation (weathering): physical, chemical, biological breakdown of rocks over millions of years</text>
<text x="400" y="490" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Living organisms in soil: earthworms, bacteria, fungi, nematodes, beetles (decomposers)</text>
<text x="400" y="530" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Earthworms: "Nature's ploughs" — mix and aerate soil | Their castings (vermicompost) enrich soil</text>
</svg>
