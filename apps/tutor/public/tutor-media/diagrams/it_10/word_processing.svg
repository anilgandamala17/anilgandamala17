<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">WORD PROCESSING INTERFACE</text>
  
  <rect x="50" y="60" width="300" height="180" fill="#f8fafc" rx="2" />
  
  <!-- Toolbar -->
  <rect x="50" y="60" width="300" height="30" fill="#1e40af" rx="2" />
  <rect x="60" y="65" width="20" height="20" fill="#60a5fa" rx="2" />
  <rect x="90" y="65" width="20" height="20" fill="#60a5fa" rx="2" />
  <rect x="120" y="65" width="20" height="20" fill="#60a5fa" rx="2" />
  
  <!-- Content -->
  <rect x="70" y="100" width="200" height="10" fill="#cbd5e1" />
  <rect x="70" y="120" width="260" height="10" fill="#cbd5e1" />
  <rect x="70" y="140" width="240" height="10" fill="#cbd5e1" />
  <rect x="70" y="160" width="260" height="10" fill="#cbd5e1" />
  
  <!-- Cursor -->
  <line x1="335" y1="160" x2="335" y2="170" stroke="#000" stroke-width="2" />
  
  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#94a3b8">WYSIWYG Editor</text>
</svg>
