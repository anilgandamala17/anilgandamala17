<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">DBMS CONCEPTS</text>
  
  <!-- Database Icon -->
  <g transform="translate(160, 80)">
    <ellipse cx="40" cy="10" rx="40" ry="10" fill="#334155" stroke="#94a3b8" />
    <path d="M 0 10 L 0 50 A 40 10 0 0 0 80 50 L 80 10" fill="#334155" stroke="#94a3b8" />
    <path d="M 0 50 L 0 90 A 40 10 0 0 0 80 90 L 80 50" fill="#334155" stroke="#94a3b8" />
    <ellipse cx="40" cy="90" rx="40" ry="10" fill="#334155" stroke="#94a3b8" />
    
    <text x="40" y="50" text-anchor="middle" font-weight="bold">Data</text>
  </g>

  <!-- arrows -->
  <line x1="120" y1="120" x2="80" y2="160" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="280" y1="120" x2="320" y2="160" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" />
  
  <rect x="30" y="160" width="100" height="40" fill="#1e293b" rx="4" />
  <text x="80" y="185" text-anchor="middle" font-size="10">Organized</text>

  <rect x="270" y="160" width="100" height="40" fill="#1e293b" rx="4" />
  <text x="320" y="185" text-anchor="middle" font-size="10">Efficient Access</text>
</svg>
