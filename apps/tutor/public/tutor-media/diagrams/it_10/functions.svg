<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .btn { fill: #334155; stroke: #64748b; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">COMMON FUNCTIONS</text>
  
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="140" height="40" class="btn" rx="4" />
    <text x="70" y="25" text-anchor="middle" font-weight="bold">SUM()</text>
    <text x="160" y="25" font-size="10" fill="#94a3b8">Adds values</text>
    
    <rect x="0" y="50" width="140" height="40" class="btn" rx="4" />
    <text x="70" y="75" text-anchor="middle" font-weight="bold">AVERAGE()</text>
    <text x="160" y="75" font-size="10" fill="#94a3b8">Mean value</text>

    <rect x="0" y="100" width="140" height="40" class="btn" rx="4" />
    <text x="70" y="125" text-anchor="middle" font-weight="bold">IF()</text>
    <text x="160" y="125" font-size="10" fill="#94a3b8">Logical test</text>

    <rect x="0" y="150" width="140" height="40" class="btn" rx="4" />
    <text x="70" y="175" text-anchor="middle" font-weight="bold">COUNT()</text>
    <text x="160" y="175" font-size="10" fill="#94a3b8">Counts numbers</text>
  </g>
</svg>
