<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">DATA ANALYSIS: CHARTS</text>
  
  <rect x="50" y="50" width="300" height="200" fill="#334155" rx="4" />
  
  <!-- Y Axis -->
  <line x1="80" y1="220" x2="80" y2="80" stroke="#94a3b8" />
  <!-- X Axis -->
  <line x1="80" y1="220" x2="320" y2="220" stroke="#94a3b8" />
  
  <!-- Bars -->
  <rect x="90" y="150" width="30" height="70" fill="#60a5fa" />
  <rect x="140" y="100" width="30" height="120" fill="#34d399" />
  <rect x="190" y="170" width="30" height="50" fill="#fbbf24" />
  <rect x="240" y="130" width="30" height="90" fill="#f472b6" />
  
  <!-- Trend Line -->
  <polyline points="105,150 155,100 205,170 255,130" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4" />
  
  <text x="200" y="240" text-anchor="middle" font-size="10">Categories</text>
  <text x="60" y="150" text-anchor="middle" font-size="10" transform="rotate(-90 60 150)">Values</text>
</svg>
