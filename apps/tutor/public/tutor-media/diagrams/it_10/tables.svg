<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .cell { fill: #1e293b; stroke: #475569; }
      .header { fill: #334155; stroke: #475569; font-weight: bold; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">RDBMS: TABLES</text>
  
  <g transform="translate(40, 60)">
    <!-- Headers -->
    <rect x="0" y="0" width="80" height="30" class="header" /> <text x="40" y="20" text-anchor="middle">ID (PK)</text>
    <rect x="80" y="0" width="120" height="30" class="header" /> <text x="140" y="20" text-anchor="middle">Name</text>
    <rect x="200" y="0" width="100" height="30" class="header" /> <text x="250" y="20" text-anchor="middle">Role</text>
    
    <!-- Row 1 -->
    <rect x="0" y="30" width="80" height="30" class="cell" /> <text x="40" y="50" text-anchor="middle">001</text>
    <rect x="80" y="30" width="120" height="30" class="cell" /> <text x="140" y="50" text-anchor="middle">Alice</text>
    <rect x="200" y="30" width="100" height="30" class="cell" /> <text x="250" y="50" text-anchor="middle">Admin</text>

    <!-- Row 2 -->
    <rect x="0" y="60" width="80" height="30" class="cell" /> <text x="40" y="80" text-anchor="middle">002</text>
    <rect x="80" y="60" width="120" height="30" class="cell" /> <text x="140" y="80" text-anchor="middle">Bob</text>
    <rect x="200" y="60" width="100" height="30" class="cell" /> <text x="250" y="80" text-anchor="middle">User</text>
    
    <!-- Highlight PK -->
    <rect x="0" y="0" width="80" height="90" fill="none" stroke="#fbbf24" stroke-width="2" rx="4" />
    <text x="40" y="110" text-anchor="middle" fill="#fbbf24" font-size="10">Primary Key</text>
  </g>
  
  <rect x="40" y="60" width="300" height="30" fill="none" stroke="#60a5fa" stroke-width="2" rx="4" />
  <text x="360" y="80" font-size="10" fill="#60a5fa">Fields</text>
  
  <rect x="40" y="90" width="300" height="60" fill="none" stroke="#34d399" stroke-width="2" rx="4" />
  <text x="360" y="120" font-size="10" fill="#34d399">Records</text>
</svg>
