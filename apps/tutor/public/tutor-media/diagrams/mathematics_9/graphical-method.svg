<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Graphical Method — Linear Equations in 2 Variables</text>
  <!-- Axes -->
  <line x1="70" y1="260" x2="740" y2="260" stroke="#86efac" stroke-width="2"/>
  <line x1="400" y1="50" x2="400" y2="470" stroke="#86efac" stroke-width="2"/>
  <polygon points="740,256 750,260 740,264" fill="#86efac"/>
  <polygon points="400,46 396,56 404,56" fill="#86efac"/>
  <text x="754" y="264" fill="#86efac" font-size="13">x</text>
  <text x="403" y="43" fill="#86efac" font-size="13">y</text>
  <!-- Light grid -->
  <g stroke="#1e3a2a" stroke-width="0.7">
    <line x1="300" y1="55" x2="300" y2="465"/><line x1="200" y1="55" x2="200" y2="465"/>
    <line x1="100" y1="55" x2="100" y2="465"/><line x1="500" y1="55" x2="500" y2="465"/>
    <line x1="600" y1="55" x2="600" y2="465"/><line x1="700" y1="55" x2="700" y2="465"/>
    <line x1="70" y1="160" x2="740" y2="160"/><line x1="70" y1="360" x2="740" y2="360"/>
    <line x1="70" y1="460" x2="740" y2="460"/>
  </g>
  <g fill="#d4d4d8" font-size="10" font-family="Georgia,serif" text-anchor="middle">
    <text x="300" y="274">-1</text><text x="200" y="274">-2</text><text x="100" y="274">-3</text>
    <text x="500" y="274">1</text><text x="600" y="274">2</text><text x="700" y="274">3</text>
    <text x="388" y="164">2</text><text x="385" y="364">-2</text><text x="388" y="264">0</text>
  </g>

  <!-- Line 1: x + y = 4   i.e. y = 4-x, passes (0,4)(4,0) → map: (400,60) for (0,4), (800,260) for (4,0) — use visible range -->
  <!-- y=4-x: at x=-3(100):y=7(off), x=-2(200):y=6(off), x=-1(300):y=5(off), x=0(400):y=4→y_svg=60, x=1(500):y=3→y_svg=160, x=2(600):y=2→y_svg=260... wait let me recalc. x-axis 100px/unit centred at (400,260). y-axis 100px/unit, y=4→260-4*100=260-400=-140 (off screen). Too big. Use 50px per unit. y=4→260-4*50=60; x=4→400+4*50=600,y=0→260. -->
  <!-- Line 1 y=4-x: (400,60) to (600,260) and beyond: (100,410) (x=-3,y=7→off)... let me just connect visible points -->
  <!-- x=0→(400, 260-4*50=60); x=4→(600,260); x=−1→(350,310); x=5→(650,210); extrapolate -->
  <line x1="100" y1="410" x2="700" y2="110" stroke="#a3e635" stroke-width="2.5"/>
  <text x="710" y="106" fill="#a3e635" font-size="12" font-family="Georgia,serif" font-weight="bold">x+y=4</text>

  <!-- Line 2: x - y = 2  i.e. y = x-2. x=0→y=-2→(400,360); x=2→y=0→(500,260); x=-1→y=-3→skip; x=5→y=3→(650,110) -->
  <line x1="100" y1="510" x2="700" y2="110" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Actually for x-y=2, y=x-2: at x=-3→y=-5(off); x=0→y=-2→(400,360); x=2→y=0→(500,260); x=5→y=3→(650,110); x=-1→y=-3→(350,410) -->
  <line x1="350" y1="410" x2="700" y2="60" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="0"/>
  <text x="710" y="56" fill="#38bdf8" font-size="12" font-family="Georgia,serif" font-weight="bold">x−y=2</text>

  <!-- Intersection: x+y=4 and x-y=2 → 2x=6 → x=3,y=1 → (550,210) -->
  <circle cx="550" cy="210" r="8" fill="#fde68a" stroke="#fbbf24" stroke-width="2"/>
  <text x="565" y="196" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">P(3, 1)</text>
  <text x="565" y="214" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Solution!</text>

  <!-- Case box -->
  <rect x="15" y="55" width="75" height="425" rx="10" fill="#1a3a2a" fill-opacity="0.85" stroke="#86efac" stroke-width="1.5"/>
  <text x="52" y="78" text-anchor="middle" fill="#86efac" font-size="9" font-family="Georgia,serif" font-weight="bold">3 Cases</text>
  <text x="52" y="100" text-anchor="middle" fill="#a3e635" font-size="8" font-family="Georgia,serif" font-weight="bold">Intersect</text>
  <text x="52" y="114" text-anchor="middle" fill="#a3e635" font-size="8" font-family="Georgia,serif">→ Unique</text>
  <text x="52" y="128" text-anchor="middle" fill="#a3e635" font-size="8" font-family="Georgia,serif">solution</text>
  <text x="52" y="158" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif" font-weight="bold">Parallel</text>
  <text x="52" y="172" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif">→ No</text>
  <text x="52" y="186" text-anchor="middle" fill="#fde68a" font-size="8" font-family="Georgia,serif">solution</text>
  <text x="52" y="216" text-anchor="middle" fill="#f9a8d4" font-size="8" font-family="Georgia,serif" font-weight="bold">Coincide</text>
  <text x="52" y="230" text-anchor="middle" fill="#f9a8d4" font-size="8" font-family="Georgia,serif">→ Infinite</text>
  <text x="52" y="244" text-anchor="middle" fill="#f9a8d4" font-size="8" font-family="Georgia,serif">solutions</text>

  <!-- Bottom summary -->
  <text x="400" y="487" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif">Intersection point of two lines is the solution to the simultaneous equation pair</text>
</svg>