<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Types of Polynomials</text>

  <!-- By degree -->
  <rect x="15" y="55" width="380" height="295" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="205" y="78" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">By Degree</text>
  <!-- table -->
  <rect x="25" y="88" width="360" height="250" rx="6" fill="#0f2a1a" stroke="#334155" stroke-width="1"/>
  <line x1="25" y1="112" x2="385" y2="112" stroke="#334155" stroke-width="1.5"/>
  <line x1="115" y1="88" x2="115" y2="338" stroke="#334155" stroke-width="1"/>
  <line x1="260" y1="88" x2="260" y2="338" stroke="#334155" stroke-width="1"/>
  <text x="70" y="106" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Name</text>
  <text x="187" y="106" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Degree</text>
  <text x="322" y="106" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Example</text>
  <!-- rows -->
  <text x="70" y="132" text-anchor="middle" fill="#a3e635" font-size="11" font-family="Georgia,serif">Constant</text>
  <text x="187" y="132" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">0</text>
  <text x="322" y="132" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">7, -3, π</text>
  <line x1="25" y1="140" x2="385" y2="140" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="160" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="Georgia,serif">Linear</text>
  <text x="187" y="160" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">1</text>
  <text x="322" y="160" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">2x + 5</text>
  <line x1="25" y1="168" x2="385" y2="168" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="188" text-anchor="middle" fill="#f472b6" font-size="11" font-family="Georgia,serif">Quadratic</text>
  <text x="187" y="188" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">2</text>
  <text x="322" y="188" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">x² + 3x − 4</text>
  <line x1="25" y1="196" x2="385" y2="196" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="216" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif">Cubic</text>
  <text x="187" y="216" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">3</text>
  <text x="322" y="216" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">x³ − 2x² + x</text>
  <line x1="25" y1="224" x2="385" y2="224" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="244" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="Georgia,serif">Biquadratic</text>
  <text x="187" y="244" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">4</text>
  <text x="322" y="244" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">x⁴ + 2x² + 1</text>
  <line x1="25" y1="252" x2="385" y2="252" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="272" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia,serif">nth-degree</text>
  <text x="187" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">n</text>
  <text x="322" y="272" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">aₙxⁿ + … + a₀</text>
  <line x1="25" y1="280" x2="385" y2="280" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="300" text-anchor="middle" fill="#ef4444" font-size="11" font-family="Georgia,serif">Zero polynomial</text>
  <text x="187" y="300" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">undefined</text>
  <text x="322" y="300" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">p(x) = 0</text>
  <line x1="25" y1="308" x2="385" y2="308" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="328" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="Georgia,serif">Monomial</text>
  <text x="187" y="328" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">any</text>
  <text x="322" y="328" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">1 term: 5x³</text>

  <!-- By terms -->
  <rect x="15" y="360" width="380" height="120" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="205" y="383" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">By Number of Terms</text>
  <text x="205" y="404" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Monomial: 1 term   |   Binomial: 2 terms   |   Trinomial: 3 terms</text>
  <text x="205" y="426" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia,serif">e.g.  4x²    |   3x − 5    |   x² + 7x − 2</text>
  <text x="205" y="448" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Polynomial: 4+ terms also valid (generic term)</text>
  <text x="205" y="468" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">Note: exponents must be whole numbers, coefficients ∈ ℝ</text>

  <!-- Right: parabola graph -->
  <rect x="408" y="55" width="375" height="425" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#f472b6" stroke-width="2"/>
  <text x="595" y="78" text-anchor="middle" fill="#f9a8d4" font-size="14" font-family="Georgia,serif" font-weight="bold">Graph of Quadratic: y = x²−3x−4</text>
  <!-- Axes -->
  <line x1="430" y1="370" x2="775" y2="370" stroke="#86efac" stroke-width="2"/>
  <line x1="595" y1="85" x2="595" y2="465" stroke="#86efac" stroke-width="2"/>
  <text x="778" y="374" fill="#86efac" font-size="11" font-family="Georgia,serif">x</text>
  <text x="597" y="82" fill="#86efac" font-size="11" font-family="Georgia,serif">y</text>
  <!-- Parabola points for x²-3x-4 opening upward, roots at x=-1 and x=4, vertex at x=1.5 -->
  <polyline points="432,188 450,258 470,310 490,346 510,372 530,390 550,398 570,398 590,390 610,374 630,350 650,316 670,276 690,226 710,168 730,104" fill="none" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Roots -->
  <circle cx="510" cy="370" r="6" fill="#fde68a" stroke="#fde68a"/>
  <text x="510" y="388" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif">−1</text>
  <circle cx="670" cy="370" r="6" fill="#fde68a" stroke="#fde68a"/>
  <text x="670" y="388" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif">4</text>
  <!-- Vertex -->
  <circle cx="590" cy="393" r="6" fill="#a3e635" stroke="#a3e635"/>
  <text x="590" y="420" text-anchor="middle" fill="#a3e635" font-size="11" font-family="Georgia,serif">vertex (1.5, −6.25)</text>
  <text x="718" y="300" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Opens upward</text>
  <text x="718" y="318" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">(a = 1 &gt; 0)</text>
  <!-- axis of symmetry -->
  <line x1="590" y1="86" x2="590" y2="450" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="590" y="458" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="Georgia,serif">x = 1.5</text>
</svg>
