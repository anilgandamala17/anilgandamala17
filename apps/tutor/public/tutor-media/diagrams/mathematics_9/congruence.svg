<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Congruence of Triangles</text>
  <text x="400" y="58" text-anchor="middle" fill="#d4d4d8" font-size="13" font-family="Georgia,serif">Two triangles are congruent if one can be superimposed on the other → same size and shape</text>

  <!-- Triangle pair 1 (congruent) -->
  <rect x="15" y="70" width="370" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="200" y="92" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">△ABC ≅ △PQR</text>
  <text x="200" y="110" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Corresponding parts are equal</text>
  <!-- Triangle left -->
  <polygon points="60,220 150,90 240,220" fill="none" stroke="#a3e635" stroke-width="2.5"/>
  <text x="55" y="234" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">A</text>
  <text x="145" y="80" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">B</text>
  <text x="238" y="234" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">C</text>
  <!-- Right triangle -->
  <polygon points="290,220 320,120 360,220" fill="none" stroke="#a3e635" stroke-width="2.5"/>
  <text x="283" y="234" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">P</text>
  <text x="316" y="112" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">Q</text>
  <text x="356" y="234" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">R</text>
  <!-- tick marks showing correspondence -->
  <text x="100" y="175" fill="#fde68a" font-size="11" font-family="Georgia,serif">|</text>
  <text x="300" y="175" fill="#fde68a" font-size="11" font-family="Georgia,serif">|</text>
  <!-- angle arcs -->
  <path d="M 68,213 A 14,14 0 0,1 75,200" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 294,213 A 14,14 0 0,1 300,200" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="200" y="248" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">∠A=∠P, ∠B=∠Q, ∠C=∠R  |  AB=PQ, BC=QR, AC=PR</text>

  <!-- Congruence criteria -->
  <rect x="15" y="278" width="370" height="210" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="300" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia,serif" font-weight="bold">Congruence Criteria</text>
  <!-- table -->
  <g transform="translate(25,312)">
    <rect x="0" y="0" width="348" height="30" rx="3" fill="#0f2a1a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="22" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold" font-family="Georgia,serif">Rule</text>
    <text x="200" y="22" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="bold" font-family="Georgia,serif">What Must Match</text>
    <line x1="0" y1="30" x2="348" y2="30" stroke="#334155"/>
    <line x1="80" y1="0" x2="80" y2="160" stroke="#334155"/>
    <g fill="#d4d4d8" font-size="11" font-family="Georgia,serif">
      <text x="40" y="52" text-anchor="middle" fill="#a3e635" font-weight="bold">SSS</text>
      <text x="200" y="52" text-anchor="middle">All 3 sides equal</text>
      <line x1="0" y1="58" x2="348" y2="58" stroke="#1a2a1a"/><text x="40" y="80" text-anchor="middle" fill="#38bdf8" font-weight="bold">SAS</text>
      <text x="200" y="80" text-anchor="middle">2 sides + included angle</text>
      <line x1="0" y1="86" x2="348" y2="86" stroke="#1a2a1a"/><text x="40" y="108" text-anchor="middle" fill="#f472b6" font-weight="bold">ASA</text>
      <text x="200" y="108" text-anchor="middle">2 angles + included side</text>
      <line x1="0" y1="114" x2="348" y2="114" stroke="#1a2a1a"/><text x="40" y="136" text-anchor="middle" fill="#fde68a" font-weight="bold">AAS</text>
      <text x="200" y="136" text-anchor="middle">2 angles + non-incl. side</text>
      <line x1="0" y1="142" x2="348" y2="142" stroke="#1a2a1a"/><text x="40" y="162" text-anchor="middle" fill="#a78bfa" font-weight="bold">RHS</text>
      <text x="200" y="162" text-anchor="middle">Right angle, Hyp, 1 side</text>
    </g>
  </g>

  <!-- Right: symbol + CPCT -->
  <rect x="398" y="70" width="385" height="420" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="590" y="92" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">CPCT — Corresponding Parts</text>
  <text x="590" y="112" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">of Congruent Triangles</text>
  <text x="590" y="138" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Once congruence is proven using a criterion,</text>
  <text x="590" y="158" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">ALL corresponding parts are equal (CPCT)</text>

  <!-- Symbol ≅ explanation -->
  <rect x="415" y="170" width="350" height="50" rx="8" fill="#0f2a1a" stroke="#a3e635" stroke-width="2"/>
  <text x="590" y="192" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif">The symbol  ≅  means congruent to</text>
  <text x="590" y="212" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Order of vertices matters! △ABC ≅ △PQR</text>

  <!-- Why SSA and AAA are NOT criteria -->
  <rect x="415" y="232" width="350" height="115" rx="8" fill="#3b0f0f" fill-opacity="0.7" stroke="#ef4444" stroke-width="1.5"/>
  <text x="590" y="254" text-anchor="middle" fill="#ef4444" font-size="13" font-family="Georgia,serif" font-weight="bold">⚠ NOT valid criteria:</text>
  <text x="590" y="278" text-anchor="middle" fill="#fca5a5" font-size="13" font-family="Georgia,serif" font-weight="bold">AAA  —  only ensures similarity</text>
  <text x="590" y="298" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">(angles match, but sides can scale)</text>
  <text x="590" y="322" text-anchor="middle" fill="#fca5a5" font-size="13" font-family="Georgia,serif" font-weight="bold">SSA  —  ambiguous case</text>
  <text x="590" y="342" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">(two different triangles can be drawn)</text>

  <!-- Practical tip -->
  <rect x="415" y="360" width="350" height="110" rx="8" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="590" y="382" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">Practical Tip</text>
  <text x="590" y="402" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">To prove △ABC ≅ △PQR:</text>
  <text x="590" y="420" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">① Identify which criterion applies</text>
  <text x="590" y="438" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">② List the 3 equal parts with reasons</text>
  <text x="590" y="458" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia,serif" font-weight="bold">③ Conclude: △ABC ≅ △PQR (by SSS/SAS…)</text>
</svg>