<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Factorization of Polynomials</text>

  <!-- Left: Algebraic Identities -->
  <rect x="15" y="55" width="360" height="425" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="195" y="78" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Key Algebraic Identities</text>
  <text x="195" y="98" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Use these to factorise efficiently</text>

  <g transform="translate(25,108)">
    <rect x="0" y="0" width="340" height="44" rx="6" fill="#0f2a1a" stroke="#86efac" stroke-width="1.5"/>
    <text x="170" y="18" text-anchor="middle" fill="#86efac" font-size="12" font-family="Georgia,serif" font-weight="bold">(a+b)² = a² + 2ab + b²</text>
    <text x="170" y="36" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Perfect square trinomial</text>

    <rect x="0" y="52" width="340" height="44" rx="6" fill="#0f2a1a" stroke="#fde68a" stroke-width="1.5"/>
    <text x="170" y="70" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif" font-weight="bold">(a−b)² = a² − 2ab + b²</text>
    <text x="170" y="88" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Perfect square trinomial (−)</text>

    <rect x="0" y="104" width="340" height="44" rx="6" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="170" y="122" text-anchor="middle" fill="#f9a8d4" font-size="12" font-family="Georgia,serif" font-weight="bold">(a+b)(a−b) = a² − b²</text>
    <text x="170" y="140" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Difference of two squares</text>

    <rect x="0" y="156" width="340" height="54" rx="6" fill="#0f2a1a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="174" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="Georgia,serif" font-weight="bold">(a+b)³ = a³+3a²b+3ab²+b³</text>
    <text x="170" y="192" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Cubic expansion</text>
    <text x="170" y="204" text-anchor="middle" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">(a−b)³ = a³−3a²b+3ab²−b³</text>

    <rect x="0" y="220" width="340" height="44" rx="6" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="170" y="238" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">a³+b³ = (a+b)(a²−ab+b²)</text>
    <text x="170" y="256" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">a³−b³ = (a−b)(a²+ab+b²)</text>

    <rect x="0" y="272" width="340" height="44" rx="6" fill="#0f2a1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="170" y="290" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="Georgia,serif" font-weight="bold">a³+b³+c³−3abc = </text>
    <text x="170" y="308" text-anchor="middle" fill="#c4b5fd" font-size="11" font-family="Georgia,serif">(a+b+c)(a²+b²+c²−ab−bc−ca)</text>
  </g>

  <!-- Right: Factor theorem + method -->
  <rect x="390" y="55" width="395" height="200" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="587" y="78" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Factor Theorem</text>
  <text x="587" y="100" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">If p(a) = 0, then (x − a) is a factor of p(x)</text>
  <text x="587" y="122" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">If (x − a) is a factor, then p(a) = 0</text>
  <text x="587" y="152" text-anchor="middle" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">Example: p(x) = x³−6x²+11x−6</text>
  <text x="587" y="174" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">p(1)=0, p(2)=0, p(3)=0</text>
  <text x="587" y="196" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">⟹ (x−1)(x−2)(x−3)</text>
  <text x="587" y="216" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">Try small integers ±1,±2… until p(a)=0</text>

  <!-- Splitting middle term -->
  <rect x="390" y="265" width="395" height="215" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="587" y="288" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia,serif" font-weight="bold">Splitting the Middle Term (Quadratic)</text>
  <text x="587" y="310" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Factorise:  x² + 7x + 12</text>
  <text x="400" y="334" fill="#fde68a" font-size="12" font-family="Georgia,serif">Step 1:  Find two nos. with product=12, sum=7</text>
  <text x="400" y="358" fill="#fde68a" font-size="12" font-family="Georgia,serif">Step 2:  3 × 4 = 12  and  3 + 4 = 7  ✓</text>
  <text x="400" y="382" fill="#a3e635" font-size="12" font-family="Georgia,serif">Step 3:  x² + 3x + 4x + 12</text>
  <text x="400" y="406" fill="#a3e635" font-size="12" font-family="Georgia,serif">Step 4:  x(x+3) + 4(x+3)</text>
  <rect x="400" y="415" width="370" height="36" rx="6" fill="#134e4a" stroke="#86efac" stroke-width="1.5"/>
  <text x="585" y="439" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">= (x+3)(x+4)  ✓</text>
</svg>