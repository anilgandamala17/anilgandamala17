<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Cartesian System</text>
  <!-- Main axes -->
  <line x1="60" y1="250" x2="740" y2="250" stroke="#86efac" stroke-width="2.5"/>
  <line x1="400" y1="50" x2="400" y2="470" stroke="#86efac" stroke-width="2.5"/>
  <polygon points="740,246 750,250 740,254" fill="#86efac"/>
  <polygon points="400,46 396,56 404,56" fill="#86efac"/>
  <text x="755" y="254" fill="#86efac" font-size="15" font-family="Georgia,serif" font-weight="bold">x</text>
  <text x="403" y="42" fill="#86efac" font-size="15" font-family="Georgia,serif" font-weight="bold">y</text>
  <!-- Grid lines (light) -->
  <g stroke="#1e3a2a" stroke-width="1">
    <line x1="300" y1="60" x2="300" y2="460"/><line x1="200" y1="60" x2="200" y2="460"/>
    <line x1="100" y1="60" x2="100" y2="460"/><line x1="500" y1="60" x2="500" y2="460"/>
    <line x1="600" y1="60" x2="600" y2="460"/><line x1="700" y1="60" x2="700" y2="460"/>
    <line x1="60" y1="150" x2="740" y2="150"/><line x1="60" y1="350" x2="740" y2="350"/>
    <line x1="60" y1="450" x2="740" y2="450"/>
  </g>
  <!-- Tick marks and numbers -->
  <g fill="#d4d4d8" font-size="11" font-family="Georgia,serif" text-anchor="middle">
    <line x1="300" y1="246" x2="300" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="300" y="270">-1</text>
    <line x1="200" y1="246" x2="200" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="200" y="270">-2</text>
    <line x1="100" y1="246" x2="100" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="100" y="270">-3</text>
    <line x1="500" y1="246" x2="500" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="500" y="270">1</text>
    <line x1="600" y1="246" x2="600" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="600" y="270">2</text>
    <line x1="700" y1="246" x2="700" y2="256" stroke="#86efac" stroke-width="1.5"/><text x="700" y="270">3</text>
    <line x1="396" y1="150" x2="406" y2="150" stroke="#86efac" stroke-width="1.5"/><text x="383" y="154">2</text>
    <line x1="396" y1="350" x2="406" y2="350" stroke="#86efac" stroke-width="1.5"/><text x="384" y="354">-2</text>
    <text x="386" y="254">O</text>
  </g>
  <!-- Quadrant labels -->
  <text x="580" y="140" text-anchor="middle" fill="#a3e635" font-size="18" font-family="Georgia,serif" font-weight="bold">Q-I</text>
  <text x="580" y="162" text-anchor="middle" fill="#a3e635" font-size="12" font-family="Georgia,serif">(+x, +y)</text>
  <text x="220" y="140" text-anchor="middle" fill="#fde68a" font-size="18" font-family="Georgia,serif" font-weight="bold">Q-II</text>
  <text x="220" y="162" text-anchor="middle" fill="#fde68a" font-size="12" font-family="Georgia,serif">(−x, +y)</text>
  <text x="220" y="355" text-anchor="middle" fill="#f472b6" font-size="18" font-family="Georgia,serif" font-weight="bold">Q-III</text>
  <text x="220" y="377" text-anchor="middle" fill="#f472b6" font-size="12" font-family="Georgia,serif">(−x, −y)</text>
  <text x="580" y="355" text-anchor="middle" fill="#7dd3fc" font-size="18" font-family="Georgia,serif" font-weight="bold">Q-IV</text>
  <text x="580" y="377" text-anchor="middle" fill="#7dd3fc" font-size="12" font-family="Georgia,serif">(+x, −y)</text>
  <!-- Sample point P(2,1) -->
  <circle cx="600" cy="150" r="6" fill="#fbbf24" stroke="#fde68a" stroke-width="2"/>
  <text x="615" y="145" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">P(2, 2)</text>
  <line x1="600" y1="150" x2="600" y2="250" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="150" x2="600" y2="150" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Sample point Q(-1,-2) -->
  <circle cx="300" cy="450" r="6" fill="#f472b6" stroke="#f9a8d4" stroke-width="2"/>
  <text x="260" y="468" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">Q(−1,−2)</text>
  <!-- Origin -->
  <circle cx="400" cy="250" r="5" fill="#ffffff"/>
  <!-- Bottom label -->
  <text x="400" y="490" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Abscissa (x) → horizontal distance from y-axis. Ordinate (y) → vertical from x-axis</text>
</svg>