<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Solutions of Linear Equations in Two Variables</text>

  <!-- Left: What is a solution -->
  <rect x="15" y="55" width="370" height="175" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#86efac" stroke-width="2"/>
  <text x="200" y="78" text-anchor="middle" fill="#86efac" font-size="14" font-family="Georgia,serif" font-weight="bold">What is a Solution?</text>
  <text x="200" y="100" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">A pair (x, y) that satisfies  ax + by + c = 0</text>
  <text x="200" y="122" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">A linear eq. has infinitely many solutions</text>
  <text x="200" y="148" text-anchor="middle" fill="#d4d4d8" font-size="12" font-family="Georgia,serif">Example:  2x + y = 5</text>
  <text x="200" y="172" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Solutions: (0,5), (1,3), (2,1), (3,−1), (−1,7) …</text>
  <text x="200" y="192" text-anchor="middle" fill="#7dd3fc" font-size="11" font-family="Georgia,serif" font-style="italic">All lie on a single straight line</text>

  <!-- Solutions table -->
  <rect x="15" y="240" width="370" height="240" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="200" y="263" text-anchor="middle" fill="#a3e635" font-size="14" font-family="Georgia,serif" font-weight="bold">Solutions of  2x + y = 5</text>
  <!-- Table header -->
  <rect x="25" y="272" width="350" height="30" rx="4" fill="#0f2a1a" stroke="#334155" stroke-width="1"/>
  <text x="100" y="293" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">x</text>
  <text x="200" y="293" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">y = 5 − 2x</text>
  <text x="330" y="293" text-anchor="middle" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">Point</text>
  <g fill="#d4d4d8" font-size="12" font-family="Georgia,serif" text-anchor="middle">
    <text x="100" y="322">−1</text><text x="200" y="322">7</text><text x="330" y="322">(−1, 7)</text>
    <text x="100" y="346">0</text><text x="200" y="346">5</text><text x="330" y="346">(0, 5)</text>
    <text x="100" y="370">1</text><text x="200" y="370">3</text><text x="330" y="370">(1, 3)</text>
    <text x="100" y="394">2</text><text x="200" y="394">1</text><text x="330" y="394">(2, 1)</text>
    <text x="100" y="418">3</text><text x="200" y="418">−1</text><text x="330" y="418">(3, −1)</text>
    <text x="100" y="442">4</text><text x="200" y="442">−3</text><text x="330" y="442">(4, −3)</text>
  </g>
  <line x1="25" y1="304" x2="375" y2="304" stroke="#334155" stroke-width="1"/>
  <line x1="25" y1="328" x2="375" y2="328" stroke="#1a2a1a" stroke-width="1"/>
  <line x1="25" y1="352" x2="375" y2="352" stroke="#1a2a1a" stroke-width="1"/>
  <line x1="25" y1="376" x2="375" y2="376" stroke="#1a2a1a" stroke-width="1"/>
  <line x1="25" y1="400" x2="375" y2="400" stroke="#1a2a1a" stroke-width="1"/>
  <line x1="25" y1="424" x2="375" y2="424" stroke="#1a2a1a" stroke-width="1"/>
  <line x1="150" y1="272" x2="150" y2="455" stroke="#334155" stroke-width="1"/>
  <line x1="265" y1="272" x2="265" y2="455" stroke="#334155" stroke-width="1"/>

  <!-- Right: Graph -->
  <rect x="398" y="55" width="385" height="425" rx="12" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" fill="#fde68a" font-size="14" font-family="Georgia,serif" font-weight="bold">Graph of 2x + y = 5</text>
  <!-- Axes inside right rect -->
  <line x1="418" y1="380" x2="775" y2="380" stroke="#86efac" stroke-width="2"/>
  <line x1="590" y1="88" x2="590" y2="458" stroke="#86efac" stroke-width="2"/>
  <text x="778" y="384" fill="#86efac" font-size="11">x</text>
  <text x="593" y="85" fill="#86efac" font-size="11">y</text>
  <!-- Line: 2x+y=5 → y=5-2x. At x=0→y=5; at x=2.5→y=0. Scale 60px/unit -->
  <!-- x=-1→x_svg=530,y=7→y_svg=380-7*45=380-315=65; x=0→590,y=5→380-225=155; x=2.5→740,y=0→380 -->
  <line x1="460" y1="65" x2="775" y2="440" stroke="#f472b6" stroke-width="2.5"/>
  <!-- Points -->
  <circle cx="530" cy="65" r="5" fill="#a3e635"/>
  <text x="535" y="60" fill="#a3e635" font-size="10" font-family="Georgia,serif">(−1,7)</text>
  <circle cx="590" cy="155" r="5" fill="#38bdf8"/>
  <text x="597" y="151" fill="#38bdf8" font-size="10" font-family="Georgia,serif">(0,5)</text>
  <circle cx="650" cy="245" r="5" fill="#fde68a"/>
  <text x="657" y="241" fill="#fde68a" font-size="10" font-family="Georgia,serif">(1,3)</text>
  <circle cx="727" cy="380" r="5" fill="#f472b6"/>
  <text x="730" y="374" fill="#f472b6" font-size="10" font-family="Georgia,serif">(2.5,0)</text>
  <!-- Axis ticks -->
  <line x1="590" y1="376" x2="590" y2="386" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="396" text-anchor="middle" fill="#86efac" font-size="10">0</text>
  <line x1="650" y1="376" x2="650" y2="386" stroke="#86efac" stroke-width="1.5"/>
  <text x="650" y="396" text-anchor="middle" fill="#86efac" font-size="10">1</text>
  <line x1="710" y1="376" x2="710" y2="386" stroke="#86efac" stroke-width="1.5"/>
  <text x="710" y="396" text-anchor="middle" fill="#86efac" font-size="10">2</text>
  <line x1="530" y1="376" x2="530" y2="386" stroke="#86efac" stroke-width="1.5"/>
  <text x="530" y="396" text-anchor="middle" fill="#86efac" font-size="10">-1</text>

  <text x="590" y="445" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif" font-style="italic">Every point on this line is a solution</text>
</svg>
