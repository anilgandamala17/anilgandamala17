<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Irrational Numbers</text>

  <!-- Left: definition + examples -->
  <rect x="15" y="55" width="340" height="410" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="2"/>
  <text x="185" y="80" text-anchor="middle" fill="#fde68a" font-size="15" font-family="Georgia,serif" font-weight="bold">Definition</text>
  <text x="185" y="102" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Cannot be written as p/q (q≠0)</text>
  <text x="185" y="118" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Non-terminating, non-repeating decimals</text>

  <!-- Examples -->
  <g transform="translate(28,135)">
    <!-- √2 -->
    <rect x="0" y="0" width="310" height="50" rx="8" fill="#0f2a1a" stroke="#a3e635" stroke-width="1.5"/>
    <text x="12" y="20" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">√2 = 1.41421356…</text>
    <text x="12" y="40" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Diagonal of unit square</text>
    <!-- √3 -->
    <rect x="0" y="58" width="310" height="50" rx="8" fill="#0f2a1a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="78" fill="#38bdf8" font-size="13" font-family="Georgia,serif" font-weight="bold">√3 = 1.73205080…</text>
    <text x="12" y="98" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Height of equilateral triangle (side = 2)</text>
    <!-- π -->
    <rect x="0" y="116" width="310" height="50" rx="8" fill="#0f2a1a" stroke="#f472b6" stroke-width="1.5"/>
    <text x="12" y="136" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">π = 3.14159265358979…</text>
    <text x="12" y="156" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Circumference ÷ Diameter</text>
    <!-- e -->
    <rect x="0" y="174" width="310" height="50" rx="8" fill="#0f2a1a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="12" y="194" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">e = 2.71828182845…</text>
    <text x="12" y="214" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Euler's number (compound growth)</text>
    <!-- √5 -->
    <rect x="0" y="232" width="310" height="50" rx="8" fill="#0f2a1a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="12" y="252" fill="#c4b5fd" font-size="13" font-family="Georgia,serif" font-weight="bold">√5 = 2.2360679…</text>
    <text x="12" y="272" fill="#d4d4d8" font-size="10" font-family="Georgia,serif">Diagonal of rectangle 1×2</text>
  </g>

  <!-- Right: Proof that √2 is irrational -->
  <rect x="365" y="55" width="420" height="240" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#a3e635" stroke-width="2"/>
  <text x="575" y="80" text-anchor="middle" fill="#a3e635" font-size="15" font-family="Georgia,serif" font-weight="bold">Proof:  √2  is Irrational</text>
  <text x="575" y="98" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">(Proof by Contradiction)</text>

  <text x="380" y="122" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Step 1:</text>
  <text x="435" y="122" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">Assume √2 = p/q (lowest terms, q≠0)</text>
  <text x="380" y="144" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Step 2:</text>
  <text x="435" y="144" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">⟹ 2 = p²/q²  ⟹  p² = 2q²</text>
  <text x="380" y="166" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Step 3:</text>
  <text x="435" y="166" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">p² is even  ⟹  p is even ⟹  p = 2k</text>
  <text x="380" y="188" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Step 4:</text>
  <text x="435" y="188" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">(2k)² = 2q²  ⟹  4k² = 2q² ⟹ q² = 2k²</text>
  <text x="380" y="210" fill="#fde68a" font-size="11" font-family="Georgia,serif" font-weight="bold">Step 5:</text>
  <text x="435" y="210" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">q is also even — CONTRADICTS lowest terms!</text>
  <rect x="374" y="222" width="400" height="30" rx="6" fill="#134e4a" stroke="#86efac" stroke-width="1.5"/>
  <text x="574" y="243" text-anchor="middle" fill="#86efac" font-size="13" font-family="Georgia,serif" font-weight="bold">∴ √2 is irrational  ∎</text>

  <!-- Right bottom: Geometric construction -->
  <rect x="365" y="308" width="420" height="157" rx="14" fill="#1a3a2a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="2"/>
  <text x="575" y="330" text-anchor="middle" fill="#7dd3fc" font-size="14" font-family="Georgia,serif" font-weight="bold">Geometric Representation of √2</text>
  <!-- unit square -->
  <rect x="390" y="345" width="80" height="80" fill="none" stroke="#a3e635" stroke-width="2"/>
  <text x="430" y="342" text-anchor="middle" fill="#a3e635" font-size="11">1</text>
  <text x="478" y="388" fill="#a3e635" font-size="11">1</text>
  <!-- diagonal = √2 -->
  <line x1="390" y1="425" x2="470" y2="345" stroke="#fde68a" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="408" y="398" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">√2</text>
  <!-- Number line -->
  <line x1="490" y1="425" x2="760" y2="425" stroke="#86efac" stroke-width="2"/>
  <line x1="490" y1="420" x2="490" y2="432" stroke="#86efac" stroke-width="2"/><text x="490" y="446" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia,serif">0</text>
  <line x1="570" y1="420" x2="570" y2="432" stroke="#86efac" stroke-width="2"/><text x="570" y="446" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia,serif">1</text>
  <circle cx="583" cy="425" r="5" fill="#fde68a" stroke="#fde68a"/>
  <text x="583" y="460" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Georgia,serif">√2</text>
  <line x1="650" y1="420" x2="650" y2="432" stroke="#86efac" stroke-width="2"/><text x="650" y="446" text-anchor="middle" fill="#86efac" font-size="11" font-family="Georgia,serif">2</text>
</svg>