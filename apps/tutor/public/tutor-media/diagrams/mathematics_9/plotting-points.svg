<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="none"/>
  <text x="400" y="36" text-anchor="middle" fill="#f0fdf4" font-size="22" font-family="Georgia,serif" font-weight="bold">Plotting Points on the Cartesian Plane</text>
  <!-- Axes -->
  <line x1="60" y1="260" x2="740" y2="260" stroke="#86efac" stroke-width="2.5"/>
  <line x1="400" y1="50" x2="400" y2="480" stroke="#86efac" stroke-width="2.5"/>
  <polygon points="740,256 750,260 740,264" fill="#86efac"/>
  <polygon points="400,46 396,56 404,56" fill="#86efac"/>
  <text x="755" y="264" fill="#86efac" font-size="14">x</text>
  <text x="403" y="43" fill="#86efac" font-size="14">y</text>
  <!-- Light grid -->
  <g stroke="#1e3a2a" stroke-width="0.7">
    <line x1="300" y1="60" x2="300" y2="470"/><line x1="200" y1="60" x2="200" y2="470"/>
    <line x1="100" y1="60" x2="100" y2="470"/><line x1="500" y1="60" x2="500" y2="470"/>
    <line x1="600" y1="60" x2="600" y2="470"/><line x1="700" y1="60" x2="700" y2="470"/>
    <line x1="60" y1="160" x2="740" y2="160"/><line x1="60" y1="360" x2="740" y2="360"/>
    <line x1="60" y1="460" x2="740" y2="460"/>
  </g>
  <!-- Ticks + numbers -->
  <g fill="#d4d4d8" font-size="11" font-family="Georgia,serif" text-anchor="middle">
    <text x="300" y="278">-1</text><text x="200" y="278">-2</text><text x="100" y="278">-3</text>
    <text x="500" y="278"> 1</text><text x="600" y="278"> 2</text><text x="700" y="278"> 3</text>
    <text x="385" y="164"> 2</text><text x="385" y="264"> 0</text><text x="380" y="364">-2</text>
  </g>

  <!-- Points to plot -->
  <!-- A(3,2) -->
  <circle cx="700" cy="160" r="7" fill="#a3e635" stroke="#86efac" stroke-width="2"/>
  <line x1="700" y1="160" x2="700" y2="260" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="160" x2="700" y2="160" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="716" y="155" fill="#a3e635" font-size="13" font-family="Georgia,serif" font-weight="bold">A(3, 2)</text>

  <!-- B(-2, 1) -->
  <circle cx="200" cy="160" r="7" fill="#fde68a" stroke="#fbbf24" stroke-width="2"/>
  <line x1="200" y1="160" x2="200" y2="260" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="200" y1="160" x2="400" y2="160" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="155" y="155" fill="#fde68a" font-size="13" font-family="Georgia,serif" font-weight="bold">B(−2, 2)</text>

  <!-- C(-3,-2) -->
  <circle cx="100" cy="460" r="7" fill="#f472b6" stroke="#f9a8d4" stroke-width="2"/>
  <line x1="100" y1="460" x2="100" y2="260" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="100" y1="460" x2="400" y2="460" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="50" y="456" fill="#f9a8d4" font-size="13" font-family="Georgia,serif" font-weight="bold">C(−3,−2)</text>

  <!-- D(2,-2) -->
  <circle cx="600" cy="460" r="7" fill="#7dd3fc" stroke="#38bdf8" stroke-width="2"/>
  <line x1="600" y1="460" x2="600" y2="260" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="400" y1="460" x2="600" y2="460" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="606" y="475" fill="#7dd3fc" font-size="13" font-family="Georgia,serif" font-weight="bold">D(2,−2)</text>

  <!-- Steps panel -->
  <rect x="15" y="60" width="65" height="310" rx="10" fill="#1a3a2a" fill-opacity="0.85" stroke="#86efac" stroke-width="1.5"/>
  <text x="47" y="80" text-anchor="middle" fill="#86efac" font-size="10" font-family="Georgia,serif" font-weight="bold">Steps</text>
  <text x="47" y="100" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">① Start</text>
  <text x="47" y="114" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">at O(0,0)</text>
  <text x="47" y="138" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">② Move</text>
  <text x="47" y="152" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">x-axis</text>
  <text x="47" y="166" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">(+right</text>
  <text x="47" y="180" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">−left)</text>
  <text x="47" y="204" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">③ Move</text>
  <text x="47" y="218" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">y-axis</text>
  <text x="47" y="232" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">(+up</text>
  <text x="47" y="246" text-anchor="middle" fill="#d4d4d8" font-size="9" font-family="Georgia,serif">−down)</text>
  <text x="47" y="270" text-anchor="middle" fill="#a3e635" font-size="9" font-family="Georgia,serif" font-weight="bold">④ Mark</text>
  <text x="47" y="284" text-anchor="middle" fill="#a3e635" font-size="9" font-family="Georgia,serif" font-weight="bold">the point</text>
  <text x="47" y="308" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia,serif">Order</text>
  <text x="47" y="322" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia,serif">matters!</text>
  <text x="47" y="338" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia,serif">(3,2)≠</text>
  <text x="47" y="352" text-anchor="middle" fill="#fde68a" font-size="9" font-family="Georgia,serif">(2,3)</text>

  <text x="400" y="495" text-anchor="middle" fill="#d4d4d8" font-size="11" font-family="Georgia,serif">For point (x, y): abscissa = x (horizontal), ordinate = y (vertical)</text>
</svg>