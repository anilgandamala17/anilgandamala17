<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Limits &amp; Continuity</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Continuity Graph -->
  <g transform="translate(150, 300)">
    <!-- Axes -->
    <line x1="-50" y1="0" x2="400" y2="0" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="150" x2="0" y2="-150" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Discontinuous Function -->
    <path d="M 0 50 Q 100 50 150 100" fill="none" stroke="#86efac" stroke-width="4"/>
    <circle cx="150" cy="100" r="8" fill="transparent" stroke="#86efac" stroke-width="3"/> <!-- Hole -->
    
    <path d="M 150 -50 Q 250 -50 350 -100" fill="none" stroke="#f87171" stroke-width="4"/>
    <circle cx="150" cy="-50" r="8" fill="#f87171"/> <!-- Defined point -->
    
    <!-- Labels -->
    <line x1="150" y1="0" x2="150" y2="10" stroke="#fef08a" stroke-width="2"/>
    <text x="150" y="30" fill="#fef08a" text-anchor="middle">x = c</text>
    
    <text x="180" y="120" fill="#86efac">LHL (Left)</text>
    <text x="180" y="-80" fill="#f87171">RHL (Right)</text>
    <text x="250" y="50" fill="#fef08a" font-weight="bold">Jump Discontinuity</text>
  </g>

  <!-- Condition for Continuity -->
  <rect x="150" y="470" width="500" height="100" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="2"/>
  <text x="400" y="510" fill="#86efac" text-anchor="middle" font-weight="bold" font-size="20">A function is continuous at x = c if:</text>
  <text x="400" y="550" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">
    lim_{x→c⁻} f(x) = lim_{x→c⁺} f(x) = f(c)
  </text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
