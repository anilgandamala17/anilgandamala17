<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86efac" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Composition of Functions (g ∘ f)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Sequence Diagram -->
  <g transform="translate(100, 200)">
    <!-- Sets -->
    <ellipse cx="0" cy="100" rx="40" ry="100" fill="rgba(255,255,255,0.05)" stroke="#f8fafc" stroke-width="2"/>
    <text x="0" y="230" fill="#f8fafc" text-anchor="middle">Set A</text>
    <text x="0" y="105" fill="#fef08a" text-anchor="middle" font-weight="bold">x</text>
    
    <ellipse cx="250" cy="100" rx="40" ry="100" fill="rgba(255,255,255,0.05)" stroke="#f8fafc" stroke-width="2"/>
    <text x="250" y="230" fill="#f8fafc" text-anchor="middle">Set B</text>
    <text x="250" y="105" fill="#86efac" text-anchor="middle" font-weight="bold">f(x)</text>
    
    <ellipse cx="500" cy="100" rx="40" ry="100" fill="rgba(255,255,255,0.05)" stroke="#f8fafc" stroke-width="2"/>
    <text x="500" y="230" fill="#f8fafc" text-anchor="middle">Set C</text>
    <text x="500" y="105" fill="#60a5fa" text-anchor="middle" font-weight="bold">g(f(x))</text>
    
    <!-- Mappings -->
    <path d="M 45 80 Q 125 40 205 80" fill="none" stroke="#86efac" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="125" y="45" fill="#86efac" text-anchor="middle" font-style="italic">f</text>
    
    <path d="M 295 80 Q 375 40 455 80" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="375" y="45" fill="#60a5fa" text-anchor="middle" font-style="italic">g</text>
    
    <!-- Direct Composition -->
    <path d="M 0 50 Q 250 -100 500 50" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
    <text x="250" y="-40" fill="#fef08a" text-anchor="middle" font-weight="bold">g ∘ f</text>
  </g>

  <!-- Definition -->
  <rect x="150" y="480" width="500" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="525" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">
    (g ∘ f)(x) = g(f(x))
  </text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>