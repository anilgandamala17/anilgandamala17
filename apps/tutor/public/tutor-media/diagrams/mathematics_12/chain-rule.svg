<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Chain Rule &amp; Trig Derivatives</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Chain Rule Sequence -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="150" rx="10" fill="rgba(134,239,172,0.05)" stroke="#86efac" stroke-width="2"/>
    <text x="20" y="40" fill="#86efac" font-weight="bold">The Chain Rule (Composite Functions)</text>
    
    <g transform="translate(300, 90)" text-anchor="middle" font-family="'Times New Roman', serif" font-size="42" font-style="italic">
       <text x="0" y="0" fill="#fef08a">dy/dx = (dy/du) · (du/dx)</text>
    </g>
    <text x="300" y="130" fill="#f8fafc" opacity="0.6" text-anchor="middle">"Derivative of Outside × Derivative of Inside"</text>
  </g>

  <!-- Trig Derivatives Table -->
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="600" height="220" rx="10" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="1.5"/>
    <g transform="translate(30, 40)" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="20" font-style="italic">
       <text x="0" y="0">d/dx (sin x) = cos x</text>
       <text x="300" y="0">d/dx (cos x) = -sin x</text>
       
       <text x="0" y="50">d/dx (tan x) = sec² x</text>
       <text x="300" y="50">d/dx (cot x) = -cosec² x</text>
       
       <text x="0" y="100">d/dx (sec x) = sec x tan x</text>
       <text x="300" y="100">d/dx (cosec x) = -cosec x cot x</text>
       
       <!-- Tip -->
       <text x="0" y="160" fill="#f87171" font-style="normal" font-weight="bold" font-size="16">Tip: Derivatives of 'co-' functions are always negative.</text>
    </g>
  </g>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>