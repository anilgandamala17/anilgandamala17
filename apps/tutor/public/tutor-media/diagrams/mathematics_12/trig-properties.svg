<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Inverse Trig Properties</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Identity Clusters -->
  <g transform="translate(80, 120)">
    <!-- Set 1: Reciprocal Interconversion -->
    <rect x="0" y="0" width="300" height="180" rx="10" fill="rgba(134, 239, 172, 0.05)" stroke="#86efac" stroke-width="1.5"/>
    <text x="20" y="40" fill="#86efac" font-weight="bold">Reciprocal Property</text>
    <g fill="#f8fafc" font-size="20" font-family="'Times New Roman', serif" font-style="italic">
      <text x="40" y="90">sin⁻¹(1/x) = cosec⁻¹x</text>
      <text x="40" y="130">cos⁻¹(1/x) = sec⁻¹x</text>
      <text x="40" y="170">tan⁻¹(1/x) = cot⁻¹x</text>
    </g>

    <!-- Set 2: Complementary Angles -->
    <rect x="350" y="0" width="300" height="180" rx="10" fill="rgba(96, 165, 250, 0.05)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="370" y="40" fill="#60a5fa" font-weight="bold">Complementary Sum</text>
    <g fill="#f8fafc" font-size="20" font-family="'Times New Roman', serif" font-style="italic">
      <text x="390" y="90">sin⁻¹x + cos⁻¹x = π/2</text>
      <text x="390" y="130">tan⁻¹x + cot⁻¹x = π/2</text>
      <text x="390" y="170">cosec⁻¹x + sec⁻¹x = π/2</text>
    </g>

    <!-- Set 3: Conversion Formulae -->
    <rect x="0" y="220" width="650" height="180" rx="10" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="1.5"/>
    <text x="20" y="260" fill="#fef08a" font-weight="bold">Sum/Difference Identities</text>
    <g fill="#f8fafc" font-size="22" font-family="'Times New Roman', serif" font-style="italic">
      <text x="40" y="300">tan⁻¹x + tan⁻¹y = tan⁻¹[(x+y) / (1-xy)]</text>
      <text x="40" y="340">2 tan⁻¹x = sin⁻¹[2x / (1+x²)] = cos⁻¹[(1-x²) / (1+x²)]</text>
    </g>
  </g>

  <!-- Visual Aid: Triangle Substitution -->
  <g transform="translate(150, 480)">
    <polygon points="0,60 100,60 100,0" fill="rgba(248, 250, 252, 0.05)" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="110" y="35" fill="#fef08a" font-size="14">x</text>
    <text x="50" y="75" fill="#f8fafc" font-size="14">√(1 - x²)</text>
    <text x="30" y="30" fill="#86efac" font-size="14">1</text>
    <text x="250" y="40" fill="#86efac" font-style="italic">Use Pythagoras for interdomain conversions.</text>
  </g>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>