<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Principal Value Branches</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Branch Table Visual -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="600" height="300" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="2"/>
    
    <!-- Table Headers -->
    <g font-weight="bold" fill="#86efac" font-size="20">
      <text x="40" y="40">Function</text>
      <text x="200" y="40">Domain</text>
      <text x="400" y="40">Principal Range</text>
    </g>
    <line x1="20" y1="55" x2="580" y2="55" stroke="#86efac" stroke-width="1"/>
    
    <!-- Rows -->
    <g fill="#f8fafc" font-size="18">
      <text x="40" y="90">sin⁻¹x</text>
      <text x="200" y="90">[-1, 1]</text>
      <text x="400" y="90" fill="#fef08a">[-π/2, π/2]</text>
      
      <text x="40" y="130">cos⁻¹x</text>
      <text x="200" y="130">[-1, 1]</text>
      <text x="400" y="130" fill="#fef08a">[0, π]</text>
      
      <text x="40" y="170">tan⁻¹x</text>
      <text x="200" y="170">R</text>
      <text x="400" y="170" fill="#fef08a">(-π/2, π/2)</text>
      
      <text x="40" y="210">cosec⁻¹x</text>
      <text x="200" y="210">R - (-1,1)</text>
      <text x="400" y="210" fill="#fef08a">[-π/2, π/2] - {0}</text>
      
      <text x="40" y="250">sec⁻¹x</text>
      <text x="200" y="250">R - (-1,1)</text>
      <text x="400" y="250" fill="#fef08a">[0, π] - {π/2}</text>
    </g>
  </g>

  <!-- Illustration: Sine Branch -->
  <g transform="translate(150, 480)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#f8fafc" stroke-width="1" opacity="0.3"/>
    <text x="250" y="40" fill="#fef08a" text-anchor="middle" font-style="italic">"Principal Values ensure Inverse Trig functions are well-defined."</text>
  </g>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>