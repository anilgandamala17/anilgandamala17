<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Mean Value Theorem (MVT)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Geometric Illustration -->
  <g transform="translate(150, 350)">
    <!-- Axes -->
    <line x1="-50" y1="0" x2="450" y2="0" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="80" x2="0" y2="-250" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Function Curve -->
    <path d="M 50 -50 Q 200 -250 350 -100" fill="none" stroke="#86efac" stroke-width="4"/>
    
    <!-- Secant Line (f(b)-f(a))/(b-a) -->
    <line x1="50" y1="-50" x2="350" y2="-100" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8,4"/>
    <circle cx="50" cy="-50" r="5" fill="#fef08a"/> <text x="30" y="-30" fill="#fef08a">(a, f(a))</text>
    <circle cx="350" cy="-100" r="5" fill="#fef08a"/> <text x="330" y="-120" fill="#fef08a">(b, f(b))</text>
    
    <!-- Tangent Line @ c -->
    <line x1="100" y1="-190" x2="300" y2="-223" stroke="#fef08a" stroke-width="3"/>
    <circle cx="200" cy="-206" r="6" fill="#fef08a"/>
    <text x="210" y="-220" fill="#fef08a" font-weight="bold">f'(c)</text>
    
    <!-- Mapping down to c -->
    <line x1="200" y1="-206" x2="200" y2="0" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="200" y="25" fill="#fef08a" text-anchor="middle">c</text>
  </g>

  <!-- Formula -->
  <rect x="150" y="470" width="500" height="90" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="520" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">
    f'(c) = <tspan dy="-10">f(b) - f(a)</tspan><tspan x="400" dy="25">———————</tspan><tspan x="400" dy="30">b - a</tspan>
  </text>
  <text x="400" y="550" fill="#86efac" text-anchor="middle" font-size="14">"Tangent is parallel to the Secant"</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
