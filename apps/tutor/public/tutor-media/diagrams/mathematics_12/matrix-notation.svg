<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Matrix Order &amp; Notation</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Matrix Brackets -->
  <g transform="translate(250, 150)">
    <!-- Main Matrix Structure -->
    <path d="M 20 0 L 0 0 L 0 250 L 20 250" fill="none" stroke="#f8fafc" stroke-width="4"/>
    <path d="M 280 0 L 300 0 L 300 250 L 280 250" fill="none" stroke="#f8fafc" stroke-width="4"/>
    
    <!-- Elements -->
    <g font-family="'Times New Roman', serif" font-size="24" fill="#86efac" font-style="italic">
      <text x="50" y="60">a₁₁</text>
      <text x="130" y="60">a₁₂</text>
      <text x="210" y="60">a₁₃</text>
      
      <text x="50" y="130">a₂₁</text>
      <text x="130" y="130">a₂₂</text>
      <text x="210" y="130">a₂₃</text>
      
      <text x="50" y="200">a₃₁</text>
      <text x="130" y="200">a₃₂</text>
      <text x="210" y="200">a₃₃</text>
    </g>
    
    <!-- Row/Col Indicators -->
    <line x1="-50" y1="50" x2="-20" y2="50" stroke="#fef08a" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-130" y="55" fill="#fef08a" font-size="16">Row 1 (i=1)</text>
    
    <line x1="65" y1="-50" x2="65" y2="-20" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="65" y="-60" fill="#60a5fa" font-size="16" text-anchor="middle">Col 1 (j=1)</text>
    
    <!-- Order Label -->
    <text x="320" y="270" fill="#fef08a" font-weight="bold" font-size="28">3 × 3</text>
    <text x="320" y="295" fill="#fef08a" font-size="14">(m × n)</text>
  </g>

  <!-- Key Concept -->
  <rect x="150" y="480" width="500" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="525" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="32" font-style="italic">
    A = [ a_ij ]_{m × n}
  </text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
