<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Adjoint &amp; Inverse of a Matrix</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Adjoint Concept -->
  <g transform="translate(100, 150)">
    <text x="125" y="-15" fill="#86efac" font-weight="bold" text-anchor="middle">Adjoint (adj A)</text>
    <rect x="0" y="0" width="250" height="200" rx="10" fill="rgba(134,239,172,0.05)" stroke="#86efac" stroke-width="1.5"/>
    
    <g transform="translate(30, 60)" font-family="'Times New Roman', serif" font-size="22" font-style="italic" fill="#fef08a">
      <text x="0" y="0">adj A = [ C_ij ]ᵀ</text>
      <text x="0" y="60" fill="#f8fafc" font-size="16" font-style="normal">Transpose of the</text>
      <text x="0" y="85" fill="#f8fafc" font-size="16" font-style="normal">Cofactor Matrix</text>
    </g>
    
    <text x="125" y="170" fill="#86efac" text-anchor="middle" font-weight="bold" font-size="18">A (adj A) = |A| I</text>
  </g>

  <!-- Inverse Concept -->
  <g transform="translate(450, 150)">
    <text x="125" y="-15" fill="#fef08a" font-weight="bold" text-anchor="middle">Inverse (A⁻¹)</text>
    <rect x="0" y="0" width="250" height="200" rx="10" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="2"/>
    
    <g transform="translate(40, 90)">
      <text x="85" y="0" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="48" font-style="italic">
        A⁻¹ = <tspan dy="-15">adj A</tspan><tspan x="85" dy="30">————</tspan><tspan x="85" dy="35">|A|</tspan>
      </text>
    </g>
    
    <text x="125" y="180" fill="#f87171" text-anchor="middle" font-size="14" font-weight="bold">Exist iff |A| ≠ 0</text>
  </g>

  <!-- Properties -->
  <rect x="150" y="470" width="500" height="80" rx="15" fill="rgba(96, 165, 250, 0.05)" stroke="#60a5fa" stroke-width="1"/>
  <text x="200" y="510" fill="#f8fafc" font-size="18">1. (A⁻¹)⁻¹ = A</text>
  <text x="400" y="510" fill="#f8fafc" font-size="18">2. (AB)⁻¹ = B⁻¹A⁻¹</text>
  <text x="400" y="540" fill="#86efac" font-size="14" text-anchor="middle">"Reversal Law of Inverse"</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
