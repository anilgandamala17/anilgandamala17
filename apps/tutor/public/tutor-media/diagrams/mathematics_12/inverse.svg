<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86efac" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Inverse Functions</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Mapping Swap -->
  <g transform="translate(150, 200)">
    <!-- Set X -->
    <ellipse cx="0" cy="100" rx="50" ry="120" fill="rgba(255,255,255,0.05)" stroke="#f8fafc" stroke-width="2"/>
    <text x="0" y="250" fill="#f8fafc" text-anchor="middle" font-weight="bold">X (Domain of f)</text>
    <circle cx="0" cy="100" r="10" fill="#fef08a"/>
    <text x="0" y="90" fill="#fef08a" text-anchor="middle">x</text>
    
    <!-- Set Y -->
    <ellipse cx="400" cy="100" rx="50" ry="120" fill="rgba(255,255,255,0.05)" stroke="#f8fafc" stroke-width="2"/>
    <text x="400" y="250" fill="#f8fafc" text-anchor="middle" font-weight="bold">Y (Range of f)</text>
    <circle cx="400" cy="100" r="10" fill="#86efac"/>
    <text x="400" y="90" fill="#86efac" text-anchor="middle">y = f(x)</text>
    
    <!-- Forward f -->
    <path d="M 60 80 Q 200 20 340 80" fill="none" stroke="#86efac" stroke-width="3" marker-end="url(#arrowhead)"/>
    <text x="200" y="35" fill="#86efac" text-anchor="middle" font-style="italic" font-weight="bold">f</text>
    
    <!-- Inverse f^-1 -->
    <path d="M 340 120 Q 200 180 60 120" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="6,2" marker-end="url(#arrowhead)"/>
    <text x="200" y="195" fill="#fef08a" text-anchor="middle" font-style="italic" font-weight="bold">f⁻¹</text>
  </g>

  <!-- Properties -->
  <rect x="150" y="480" width="500" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="400" y="515" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-style="italic">
    f⁻¹(y) = x  ⇔  f(x) = y
  </text>
  <text x="400" y="545" fill="#86efac" text-anchor="middle" font-size="14">Condition: f must be a bijection.</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>