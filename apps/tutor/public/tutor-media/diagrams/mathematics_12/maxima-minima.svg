<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Maxima &amp; Minima</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Curve with Extrema -->
  <g transform="translate(150, 250)">
    <line x1="-50" y1="150" x2="450" y2="150" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="0" y1="200" x2="0" y2="-100" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <path d="M 50 100 Q 150 -150 250 100 T 450 100" fill="none" stroke="#fef08a" stroke-width="4"/>
    
    <!-- Maxima -->
    <circle cx="150" cy="-25" r="8" fill="#86efac"/>
    <line x1="100" y1="-25" x2="200" y2="-25" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="150" y="-45" fill="#86efac" text-anchor="middle" font-weight="bold">Local Max</text>
    <text x="150" y="-65" fill="#f8fafc" text-anchor="middle" font-size="12">f'(x)=0, f''(x)&lt;0</text>
    
    <!-- Minima -->
    <circle cx="350" cy="100" r="8" fill="#f87171"/>
    <line x1="300" y1="100" x2="400" y2="100" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="350" y="130" fill="#f87171" text-anchor="middle" font-weight="bold">Local Min</text>
    <text x="350" y="150" fill="#f8fafc" text-anchor="middle" font-size="12">f'(x)=0, f''(x)&gt;0</text>
  </g>

  <!-- Derivative Tests Table -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="600" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(20, 30)" fill="#f8fafc" font-size="18">
       <text x="0" y="0">Step 1: Set f'(x) = 0 to find critical points.</text>
       <text x="0" y="35">Step 2: Check f''(x) sign at each point for nature.</text>
    </g>
  </g>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
