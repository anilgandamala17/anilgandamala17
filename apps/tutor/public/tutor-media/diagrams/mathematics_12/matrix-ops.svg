<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#86efac" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Matrix Operations</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Addition -->
  <g transform="translate(50, 120)">
    <text x="150" y="-15" fill="#86efac" font-weight="bold" text-anchor="middle">1. Addition (Element-wise)</text>
    <rect x="0" y="0" width="300" height="150" rx="10" fill="rgba(134,239,172,0.05)" stroke="#86efac" stroke-width="1"/>
    
    <g transform="translate(20, 40)" fill="#fef08a" font-family="'Times New Roman', serif" font-size="20">
      <text x="0" y="0">[ a b ] + [ e f ] = [ a+e  b+f ]</text>
      <text x="0" y="40">[ c d ]   [ g h ]   [ c+g  d+h ]</text>
    </g>
    <text x="150" y="130" fill="#f8fafc" text-anchor="middle" font-size="14">Condition: Same Order (m × n)</text>
  </g>

  <!-- Multiplication -->
  <g transform="translate(400, 120)">
    <text x="175" y="-15" fill="#fef08a" font-weight="bold" text-anchor="middle">2. Multiplication (Row × Col)</text>
    <rect x="0" y="0" width="350" height="250" rx="10" fill="rgba(254,240,138,0.05)" stroke="#fef08a" stroke-width="1"/>
    
    <!-- Rule Visual -->
    <g transform="translate(20, 40)">
      <path d="M 10 0 L 0 0 L 0 60 L 10 60" fill="none" stroke="#f8fafc" stroke-width="2"/>
      <path d="M 80 0 L 90 0 L 90 60 L 80 60" fill="none" stroke="#f8fafc" stroke-width="2"/>
      <line x1="10" y1="30" x2="80" y2="30" stroke="#86efac" stroke-width="4" opacity="0.6"/>
      <text x="45" y="25" fill="#86efac" text-anchor="middle" font-size="12">Row i</text>
      
      <text x="110" y="35" fill="#f8fafc" font-size="24">×</text>
      
      <g transform="translate(140, 0)">
        <path d="M 10 0 L 0 0 L 0 60 L 10 60" fill="none" stroke="#f8fafc" stroke-width="2"/>
        <path d="M 60 0 L 70 0 L 70 60 L 60 60" fill="none" stroke="#f8fafc" stroke-width="2"/>
        <line x1="35" y1="10" x2="35" y2="50" stroke="#60a5fa" stroke-width="4" opacity="0.6"/>
        <text x="35" y="-10" fill="#60a5fa" text-anchor="middle" font-size="12">Col j</text>
      </g>
      
      <text x="230" y="35" fill="#f8fafc" font-size="24">=</text>
      <text x="280" y="35" fill="#fef08a" font-size="24">c_ij</text>
    </g>
    
    <text x="175" y="160" fill="#f8fafc" text-anchor="middle" font-size="14" font-family="'Times New Roman', serif" font-style="italic">
      c_ij = Σ (a_ik · b_kj)
    </text>
    
    <text x="175" y="220" fill="#fef08a" text-anchor="middle" font-size="16" font-weight="bold">(m × n) · (n × p) = (m × p)</text>
  </g>

  <rect x="200" y="450" width="400" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="495" fill="#fef08a" text-anchor="middle" font-size="20">Matrix multiplication is NOT commutative:</text>
  <text x="400" y="525" fill="#fef08a" text-anchor="middle" font-weight="bold" font-size="22">AB ≠ BA</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Math Grade 12</text>
</svg>
