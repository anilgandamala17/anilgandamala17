<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect x="0" y="0" width="800" height="600" fill="#1a3a2a" rx="6"/><rect x="0" y="0" width="800" height="60" fill="#0d2418" rx="6"/><text x="400" y="39" font-family="Segoe UI,sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="normal">Unity in Diversity: India</text>
<rect x="20" y="68" width="760" height="82" fill="#1e4a30" rx="6"/><text x="400" y="94" font-family="Segoe UI,sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="normal">"Diversity is not a weakness — it is India's greatest strength"</text><text x="400" y="122" font-family="Segoe UI,sans-serif" font-size="14" fill="#81c784" text-anchor="middle" font-weight="normal">Many states, languages, religions — but ONE nation, ONE Constitution</text><rect x="20" y="162" width="370" height="130" fill="#1e4a30" rx="6"/><text x="205" y="188" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">National Symbols</text><text x="205" y="210" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Flag: Tiranga (3 colours)</text><text x="205" y="229" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Emblem: Ashoka Pillar (4 lions)</text><text x="205" y="248" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Anthem: Jana Gana Mana</text><rect x="410" y="162" width="370" height="130" fill="#1e4a30" rx="6"/><text x="595" y="188" font-family="Segoe UI,sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">The Constitution</text><text x="595" y="210" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Common laws for all citizens</text><text x="595" y="229" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Fundamental Rights & Duties</text><text x="595" y="248" font-family="Segoe UI,sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Secular, Democratic Republic</text><rect x="20" y="302" width="370" height="130" fill="#1e4a30" rx="6"/><text x="205" y="328" font-family="Segoe UI,sans-serif" 