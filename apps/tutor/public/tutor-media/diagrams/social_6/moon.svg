<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>
<rect x="0" y="0" width="800" height="60" fill="#0d2418" opacity="0.8"/>
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">The Moon: Earth's Natural Satellite</text>

<rect x="50" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🌕 The Moon</text><text x="215" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Natural satellite of Earth</text><text x="215" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Distance: ~3.84 lakh km</text><text x="215" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">No atmosphere or water</text><rect x="400" y="80" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="108" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🌓 Phases of Moon</text><text x="565" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">New Moon → Crescent</text><text x="565" y="154" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Half Moon → Gibbous</text><text x="565" y="176" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Full Moon (28-day cycle)</text><rect x="50" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="215" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🌊 Tides</text><text x="215" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Moon's gravity pulls oceans</text><text x="215" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">High tide & Low tide</text><text x="215" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Twice per day</text><rect x="400" y="290" width="330" height="194" fill="#1e4a30" rx="8" opacity="0.9"/><text x="565" y="318" font-family="'Segoe UI',sans-serif" font-size="17" fill="#81c784" text-anchor="middle" font-weight="bold">🌑 Eclipses</text><text x="565" y="342" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Solar eclipse: Moon covers Sun</text><text x="565" y="364" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Lunar eclipse: Earth's shadow</text><text x="565" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Occurs on specific orbits</text>
<text x="400" y="490" font-family="'Segoe UI',sans-serif" font-size="15" fill="#aaa" text-anchor="middle" font-weight="normal">The Moon takes ~27.3 days to orbit Earth</text>
<text x="400" y="520" font-family="'Segoe UI',sans-serif" font-size="15" fill="#aaa" text-anchor="middle" font-weight="normal">Same side of Moon always faces Earth</text>

</svg>