<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<rect width="800" height="600" fill="#1a3a2a"/>

<rect x="0" y="0" width="800" height="58" fill="#0d2418" opacity="0.9"/>
<text x="400" y="39" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">The Solar System: Eight Planets</text>
<rect x="20" y="65" width="760" height="45" fill="#0d2418" rx="6" opacity="1"/>
<text x="400" y="83" font-family="'Segoe UI',sans-serif" font-size="14" fill="#81c784" text-anchor="middle" font-weight="normal">Planets orbit the Sun. They have no light of their own — reflect sunlight.</text>
<text x="400" y="104" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="normal">Order: Mercury | Venus | Earth | Mars | Jupiter | Saturn | Uranus | Neptune</text>
<rect x="14" y="117" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="134" y="141" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">☿ Mercury & ♀ Venus</text>
<text x="134" y="161" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Mercury: smallest, closest to Sun</text>
<text x="134" y="179" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Venus: hottest, brightest</text>
<text x="134" y="197" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Both have no moons</text>
<rect x="272" y="117" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="392" y="141" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">🌍 Earth & ♂ Mars</text>
<text x="392" y="161" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Earth: only planet with life</text>
<text x="392" y="179" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Mars: Red Planet, 2 moons</text>
<text x="392" y="197" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Both in habitable region</text>
<rect x="530" y="117" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="650" y="141" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">♃ Jupiter & ♄ Saturn</text>
<text x="650" y="161" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Jupiter: largest (79+ moons)</text>
<text x="650" y="179" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Saturn: has beautiful rings</text>
<text x="650" y="197" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Gas giants</text>
<rect x="14" y="245" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="134" y="269" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">⛢ Uranus & ♆ Neptune</text>
<text x="134" y="289" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Ice giants (far from Sun)</text>
<text x="134" y="307" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Uranus: rotates on its side</text>
<text x="134" y="325" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Neptune: strongest winds</text>
<rect x="272" y="245" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="392" y="269" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">The Sun ☀️</text>
<text x="392" y="289" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Star at centre of Solar System</text>
<text x="392" y="307" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Provides heat and light</text>
<text x="392" y="325" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">All planets orbit the Sun</text>
<rect x="530" y="245" width="240" height="120" fill="#1e4a30" rx="8"/>
<text x="650" y="269" font-family="'Segoe UI',sans-serif" font-size="16" fill="#81c784" text-anchor="middle" font-weight="bold">Asteroids & Comets</text>
<text x="650" y="289" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Asteroid belt: between Mars-Jupiter</text>
<text x="650" y="307" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Comets: tail of ice & dust</text>
<text x="650" y="325" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle">Dwarf planet: Pluto</text>
<rect x="20" y="373" width="760" height="50" fill="#0d2418" rx="6" opacity="1"/>
<text x="400" y="393" font-family="'Segoe UI',sans-serif" font-size="14" fill="#ffd54f" text-anchor="middle" font-weight="bold">Memory Aid: My Very Efficient Mother Just Served Us Noodles</text>
<text x="400" y="415" font-family="'Segoe UI',sans-serif" font-size="13" fill="#81c784" text-anchor="middle" font-weight="normal">(Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune)</text>
<rect x="20" y="430" width="760" height="55" fill="#1e4a30" rx="6" opacity="1"/>
<text x="400" y="452" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Inner planets: Mercury, Venus, Earth, Mars (rocky, smaller)</text>
<text x="400" y="475" font-family="'Segoe UI',sans-serif" font-size="13" fill="#e8f5e9" text-anchor="middle" font-weight="normal">Outer planets: Jupiter, Saturn, Uranus, Neptune (large, gaseous)</text>
<text x="400" y="500" font-family="'Segoe UI',sans-serif" font-size="13" fill="#ffd54f" text-anchor="middle" font-weight="normal">The Sun is so large that about 1.3 million Earths can fit inside it</text>

</svg>