<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .chalk { font-family: 'Segoe UI', sans-serif; }
      .title { font-size: 26px; font-weight: bold; fill: #a5d6a7; }
      .label { font-size: 17px; fill: #c8e6c9; }
      .num { font-size: 18px; fill: #fff9c4; font-weight: bold; }
      .muted { font-size: 14px; fill: #81c784; }
      .highlight { fill: rgba(102,187,106,0.12); stroke: #66bb6a; stroke-width: 1.5; }
      .yellow { fill: rgba(255,245,157,0.12); stroke: #fff176; stroke-width: 1.5; }
      .orange { fill: rgba(255,183,77,0.12); stroke: #ffb74d; stroke-width: 1.5; }
    </style>
  </defs>
  <text x="400" y="44" text-anchor="middle" class="chalk title">Historical Sources – How Do We Know the Past?</text>
  <line x1="60" y1="56" x2="740" y2="56" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Categories of sources -->
  <!-- Archaeological Sources -->
  <g transform="translate(60,75)">
    <rect x="0" y="0" width="310" height="200" class="highlight" rx="12"/>
    <text x="155" y="26" text-anchor="middle" class="chalk label" style="fill:#a5d6a7">Archaeological Sources</text>
    <line x1="10" y1="34" x2="300" y2="34" stroke="#66bb6a" stroke-width="0.8"/>
    <!-- Coin icon -->
    <circle cx="50" cy="80" r="24" fill="rgba(255,245,157,0.15)" stroke="#fff176" stroke-width="2"/>
    <text x="50" y="87" text-anchor="middle" class="chalk num" style="font-size:20px">🏛</text>
    <text x="100" y="62" class="chalk muted">Coins &amp; Currency</text>
    <text x="100" y="80" class="chalk muted">Inscriptions &amp; Pillars</text>
    <text x="100" y="98" class="chalk muted">Monuments &amp; Ruins</text>
    <text x="100" y="116" class="chalk muted">Tools &amp; Weapons</text>
    <text x="100" y="134" class="chalk muted">Pottery &amp; Artefacts</text>
    <text x="155" y="168" text-anchor="middle" class="chalk muted" style="fill:#fff176">Examples: Harappa seals,</text>
    <text x="155" y="186" text-anchor="middle" class="chalk muted" style="fill:#fff176">Ashoka pillars, coins</text>
  </g>

  <!-- Literary Sources -->
  <g transform="translate(390,75)">
    <rect x="0" y="0" width="350" height="200" class="yellow" rx="12"/>
    <text x="175" y="26" text-anchor="middle" class="chalk label" style="fill:#fff9c4">Literary / Written Sources</text>
    <line x1="10" y1="34" x2="340" y2="34" stroke="#fff176" stroke-width="0.8"/>
    <text x="14" y="60" class="chalk muted">Religious Texts:</text>
    <text x="180" y="60" class="chalk muted" style="fill:#fff176">Vedas, Upanishads, Quran</text>
    <text x="14" y="84" class="chalk muted">Travel Accounts:</text>
    <text x="180" y="84" class="chalk muted" style="fill:#fff176">Megasthenes, Fa Hien</text>
    <text x="14" y="108" class="chalk muted">Biographies:</text>
    <text x="180" y="108" class="chalk muted" style="fill:#fff176">Harshacharita</text>
    <text x="14" y="132" class="chalk muted">Chronicles:</text>
    <text x="180" y="132" class="chalk muted" style="fill:#fff176">Rajatarangini</text>
    <text x="14" y="156" class="chalk muted">Poetry &amp; Drama:</text>
    <text x="180" y="156" class="chalk muted" style="fill:#fff176">Arthashastra, Natya Shastra</text>
    <text x="175" y="188" text-anchor="middle" class="chalk muted">Oral traditions &amp; folk songs</text>
  </g>

  <!-- Timeline of Indian History -->
  <g transform="translate(60,295)">
    <text x="340" y="0" text-anchor="middle" class="chalk label">Types of Sources at a Glance</text>
    <rect x="0" y="10" width="680" height="170" class="orange" rx="12"/>

    <!-- Source type grid -->
    <text x="20" y="36" class="chalk muted" style="fill:#ffb74d;font-weight:bold">Primary Sources</text>
    <text x="20" y="56" class="chalk muted">Created at the time of event</text>
    <text x="20" y="74" class="chalk muted">e.g., original documents, artefacts</text>
    <text x="20" y="94" class="chalk muted" style="fill:#ffb74d">First-hand evidence</text>
    
    <line x1="340" y1="18" x2="340" y2="172" stroke="#ffb74d" stroke-width="0.8"/>

    <text x="360" y="36" class="chalk muted" style="fill:#ffb74d;font-weight:bold">Secondary Sources</text>
    <text x="360" y="56" class="chalk muted">Written AFTER the event</text>
    <text x="360" y="74" class="chalk muted">e.g., textbooks, biographies</text>
    <text x="360" y="94" class="chalk muted" style="fill:#ffb74d">Based on primary sources</text>

    <line x1="10" y1="110" x2="670" y2="110" stroke="#ffb74d" stroke-width="0.8"/>
    <text x="340" y="134" text-anchor="middle" class="chalk num" style="font-size:16px">Archaeologists study material remains</text>
    <text x="340" y="156" text-anchor="middle" class="chalk muted">Historians analyse written records</text>
  </g>
</svg>
