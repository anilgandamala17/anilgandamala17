<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Timeline axis -->
  <line x1="40" y1="140" x2="360" y2="140" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <polygon points="360,135 375,140 360,145" fill="rgba(255,255,255,0.3)" />

  <!-- Eras -->
  <rect x="40" y="100" width="80" height="80" rx="4" fill="none" stroke="#93c5fd" stroke-width="1.5" />
  <text x="80" y="90" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="bold">Ancient</text>
  <text x="80" y="145" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">to 476 AD</text>

  <rect x="140" y="100" width="100" height="80" rx="4" fill="none" stroke="#fef08a" stroke-width="1.5" />
  <text x="190" y="90" font-size="9" fill="#fef08a" text-anchor="middle" font-weight="bold">Medieval</text>
  <text x="190" y="145" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">476 – 1450 AD</text>

  <rect x="260" y="100" width="100" height="80" rx="4" fill="none" stroke="#86efac" stroke-width="1.5" />
  <text x="310" y="90" font-size="9" fill="#86efac" text-anchor="middle" font-weight="bold">Modern</text>
  <text x="310" y="145" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">1450 – Present</text>

  <!-- Key points -->
  <circle cx="260" cy="140" r="4" fill="#fca5a5" />
  <text x="260" y="195" font-size="8" fill="#fca5a5" text-anchor="middle">Renaissance</text>

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Historical Timeline — Periodic Eras</text>
</svg>
