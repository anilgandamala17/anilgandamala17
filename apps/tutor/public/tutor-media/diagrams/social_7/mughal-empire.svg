<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">The Mughal Empire</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">Mughal Empire: 1526–1857 | Founded by Babur after 1st Battle of Panipat (1526)</text>

<rect x="20" y="87" width="119" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="79" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Babur</text>
<text x="79" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1526–1530</text>
<text x="79" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Founded empire</text>
<text x="79" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Used gunpowder</text>
<text x="79" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Wrote: Baburnama</text>
<text x="79" y="197" font-family="'Segoe UI',sans-serif" font-size="10" fill="#86efac" text-anchor="middle">from Central Asia</text>
<text x="79" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Timur +</text>
<text x="79" y="276" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Genghis Khan</text>

<rect x="148" y="87" width="119" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="207" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Humayun</text>
<text x="207" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1530–1556</text>
<text x="207" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Lost &amp; regained throne</text>
<text x="207" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sher Shah Suri</text>
<text x="207" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">defeated him (1540)</text>
<text x="207" y="197" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Din Panah library</text>
<text x="207" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Humayun's Tomb</text>
<text x="207" y="276" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">UNESCO site</text>

<rect x="276" y="87" width="119" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="335" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Akbar</text>
<text x="335" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1556–1605</text>
<text x="335" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Greatest Mughal ruler</text>
<text x="335" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Din-i-Ilahi religion</text>
<text x="335" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Mansabdari system</text>
<text x="335" y="197" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Navratnas at court</text>
<text x="335" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Fatehpur Sikri</text>

<rect x="404" y="87" width="119" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="463" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Jahangir</text>
<text x="463" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1605–1627</text>
<text x="463" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Patron of painting</text>
<text x="463" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Nur Jahan (wife)</text>
<text x="463" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">justice chain</text>
<text x="463" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Mughal painting</text>
<text x="463" y="276" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">flourished</text>

<rect x="532" y="87" width="119" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="591" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Shah Jahan</text>
<text x="591" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1627–1658</text>
<text x="591" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Taj Mahal builder</text>
<text x="591" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Red Fort, Jama Masjid</text>
<text x="591" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Golden age of architecture</text>
<text x="591" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Imprisoned by son</text>
<text x="591" y="276" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Aurangzeb</text>

<rect x="660" y="87" width="120" height="185" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="6"/>
<text x="720" y="108" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle" font-weight="bold">Aurangzeb</text>
<text x="720" y="124" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">1658–1707</text>
<text x="720" y="143" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Empire at peak size</text>
<text x="720" y="161" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Intolerant policies</text>
<text x="720" y="179" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Deccan wars costly</text>
<text x="720" y="197" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Maratha resistance</text>
<text x="720" y="264" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Bibi Ka Maqbara</text>
<text x="720" y="276" font-family="'Segoe UI',sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">Deccan conquests</text>

<line x1="20" y1="296" x2="780" y2="296" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="320" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Mughal Administration and Culture</text>

<rect x="20" y="332" width="370" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="354" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Administration</text>
<text x="205" y="376" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Mansabdari System: ranking military officers</text>
<text x="205" y="396" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Zabti system: land measurement for tax</text>
<text x="205" y="416" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Todar Mal: revenue minister under Akbar</text>
<text x="205" y="436" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Revenue: 1/3 of produce as land tax</text>
<text x="205" y="454" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Subas (provinces) → Sarkars → Parganas</text>

<rect x="410" y="332" width="370" height="130" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="354" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Cultural Legacy</text>
<text x="595" y="376" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Architecture: Taj Mahal, Red Fort, Agra Fort</text>
<text x="595" y="396" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Literature: Persian, Urdu flourished</text>
<text x="595" y="416" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Painting: Mughal miniature school</text>
<text x="595" y="436" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Music: Tansen — Akbar's court</text>
<text x="595" y="454" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Biryani, Mughal cuisine influenced cuisine</text>

<text x="400" y="500" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Decline: After Aurangzeb, weak successors → Marathas, British, and Nadir Shah invaded</text>
<text x="400" y="535" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Nadir Shah looted Delhi 1739 | Mughal Empire formally ended 1857 — Bahadur Shah Zafar exiled</text>
</svg>
