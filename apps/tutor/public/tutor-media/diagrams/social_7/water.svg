<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="26" fill="#ffd54f" text-anchor="middle" font-weight="bold">Water — A Precious Resource</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="13" fill="#86efac" text-anchor="middle">97% of Earth's water = Salty (oceans) | 3% fresh water | Less than 1% accessible to humans</text>

<rect x="20" y="87" width="370" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="109" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Water Cycle (Hydrological Cycle)</text>
<text x="205" y="131" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">1. Evaporation: water from ocean/lakes to vapour</text>
<text x="205" y="151" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">2. Condensation: vapour forms clouds</text>
<text x="205" y="171" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">3. Precipitation: rain, snow, hail falls</text>
<text x="205" y="191" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">4. Surface run-off + infiltration to ground</text>
<text x="205" y="211" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Transpiration by plants also adds water vapour</text>
<text x="205" y="224" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Sun is the energy source for water cycle</text>

<rect x="410" y="87" width="370" height="145" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="109" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Sources of Freshwater</text>
<text x="595" y="131" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Surface water: rivers, lakes, ponds</text>
<text x="595" y="151" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Groundwater: wells, springs, aquifers</text>
<text x="595" y="171" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Glaciers and ice caps (large but inaccessible)</text>
<text x="595" y="191" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Rainwater harvesting: traditional method</text>
<text x="595" y="211" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Aquifer = underground layer of water-bearing rock</text>
<text x="595" y="224" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Bore wells pump from aquifers</text>

<line x1="20" y1="246" x2="780" y2="246" stroke="#86efac" stroke-width="1"/>
<text x="400" y="270" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">Water Scarcity and Conservation</text>

<rect x="20" y="282" width="370" height="140" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="304" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle" font-weight="bold">Causes of Water Scarcity</text>
<text x="205" y="326" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Population growth → more demand</text>
<text x="205" y="346" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Over-extraction of groundwater</text>
<text x="205" y="366" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Pollution of rivers and lakes</text>
<text x="205" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Deforestation reduces rainfall</text>
<text x="205" y="406" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Climate change alters rainfall patterns</text>
<text x="205" y="416" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Unequal distribution — geographical</text>

<rect x="410" y="282" width="370" height="140" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="304" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Conservation Methods</text>
<text x="595" y="326" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Rainwater harvesting (rooftop systems)</text>
<text x="595" y="346" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Drip irrigation: saves 50% water</text>
<text x="595" y="366" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Check dams: slow runoff, recharge ground</text>
<text x="595" y="386" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Reduce pollution: sewage treatment</text>
<text x="595" y="406" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Afforestation increases groundwater</text>
<text x="595" y="416" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Traditional: stepwells (baoli), tanks, kunds</text>

<line x1="20" y1="436" x2="780" y2="436" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="460" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Water Distribution and Uses</text>
<text x="400" y="484" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Agriculture: 70% of global freshwater use (irrigation) | Industry: 20% | Domestic: 10%</text>
<text x="400" y="507" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Oceans regulate climate: store heat, generate rainfall, support marine life</text>
<text x="400" y="530" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">UN SDG 6: Clean water and sanitation for all by 2030</text>
<text x="400" y="565" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">India: water stress — many rivers polluted | Ganga Action Plan | Namami Gange Programme</text>
</svg>
