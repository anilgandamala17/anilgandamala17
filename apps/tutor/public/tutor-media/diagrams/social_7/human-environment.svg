<svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
<text x="400" y="40" font-family="'Segoe UI',sans-serif" font-size="24" fill="#ffd54f" text-anchor="middle" font-weight="bold">Human-Environment Interaction</text>
<line x1="20" y1="55" x2="780" y2="55" stroke="#86efac" stroke-width="1"/>
<text x="400" y="76" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle">Humans and environment constantly affect each other — Integrated relationship</text>

<rect x="20" y="87" width="370" height="148" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Life in Tropical Rainforests</text>
<text x="205" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Amazon: world's largest rainforest (Brazil)</text>
<text x="205" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Hot and wet all year (> 200 cm rainfall)</text>
<text x="205" y="172" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Dense canopy blocks sunlight</text>
<text x="205" y="192" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Toucans, spider monkeys, sloths, anaconda</text>
<text x="205" y="212" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Mahogany, rosewood, rubber trees</text>
<text x="205" y="227" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Tribal peoples: Boros tribe (Amazon)</text>

<rect x="410" y="87" width="370" height="148" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="110" font-family="'Segoe UI',sans-serif" font-size="15" fill="#86efac" text-anchor="middle" font-weight="bold">Life in the Amazon River Basin</text>
<text x="595" y="132" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">2nd longest river (6400 km)</text>
<text x="595" y="152" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Carries 20% of all river water on Earth</text>
<text x="595" y="172" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Piranha, crocodile, electric eel</text>
<text x="595" y="192" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Amazon river dolphins (pink)</text>
<text x="595" y="212" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Lungs of the Earth — absorbs CO₂</text>
<text x="595" y="227" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Deforestation threatens Amazon ecosystem</text>

<line x1="20" y1="248" x2="780" y2="248" stroke="#86efac" stroke-width="1"/>
<text x="400" y="272" font-family="'Segoe UI',sans-serif" font-size="17" fill="#ffd54f" text-anchor="middle" font-weight="bold">Human Impact on Environment</text>

<rect x="20" y="284" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="205" y="306" font-family="'Segoe UI',sans-serif" font-size="14" fill="#f48fb1" text-anchor="middle" font-weight="bold">Negative Impacts</text>
<text x="205" y="328" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Deforestation: habitat loss, soil erosion</text>
<text x="205" y="348" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Pollution: air, water, soil contamination</text>
<text x="205" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Overgrazing: land degradation</text>
<text x="205" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Greenhouse gases → climate change</text>
<text x="205" y="408" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Mining: landscape destruction</text>
<text x="205" y="430" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Rapid urbanization → wetland destruction</text>

<rect x="410" y="284" width="370" height="155" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" rx="8"/>
<text x="595" y="306" font-family="'Segoe UI',sans-serif" font-size="14" fill="#86efac" text-anchor="middle" font-weight="bold">Positive Adaptations</text>
<text x="595" y="328" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Terrace farming on steep slopes</text>
<text x="595" y="348" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Irrigation in dry areas</text>
<text x="595" y="368" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Solar/wind energy to reduce pollution</text>
<text x="595" y="388" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Afforestation and reforestation</text>
<text x="595" y="408" font-family="'Segoe UI',sans-serif" font-size="12" fill="#ffd54f" text-anchor="middle">Protected areas: national parks, reserves</text>
<text x="595" y="430" font-family="'Segoe UI',sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">International agreements: Paris Accord, Kyoto</text>

<line x1="20" y1="453" x2="780" y2="453" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
<text x="400" y="477" font-family="'Segoe UI',sans-serif" font-size="16" fill="#ffd54f" text-anchor="middle" font-weight="bold">Grasslands and Deserts</text>
<text x="400" y="500" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Tropical Grasslands (Savanna): Africa | Animals: Lion, elephant, giraffe, zebra, wildebeest</text>
<text x="400" y="522" font-family="'Segoe UI',sans-serif" font-size="13" fill="rgba(255,255,255,0.9)" text-anchor="middle">Temperate Grasslands: Prairies (America), Steppes (Eurasia), Pampas (S. America), Veld (S. Africa)</text>
<text x="400" y="560" font-family="'Segoe UI',sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" text-anchor="middle">Hot Desert: Sahara, Thar | Cold Desert: Gobi, Ladakh | Camel: ship of the desert (adapted to extreme heat)</text>
</svg>
