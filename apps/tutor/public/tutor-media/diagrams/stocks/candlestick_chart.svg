<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Candlestick Chart — Stock Market</text>
  <!-- Axes -->
  <line x1="50" y1="240" x2="380" y2="240" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <line x1="50" y1="30" x2="50" y2="245" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Price grid lines -->
  <line x1="50" y1="60" x2="380" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="50" y1="100" x2="380" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="50" y1="140" x2="380" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="50" y1="180" x2="380" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="50" y1="220" x2="380" y2="220" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Price labels -->
  <text x="42" y="64" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="end" font-family="monospace">150</text>
  <text x="42" y="104" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="end" font-family="monospace">140</text>
  <text x="42" y="144" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="end" font-family="monospace">130</text>
  <text x="42" y="184" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="end" font-family="monospace">120</text>
  <text x="42" y="224" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="end" font-family="monospace">110</text>
  <!-- Candle 1: Bullish (green) -->
  <line x1="90" y1="80" x2="90" y2="220" stroke="#86efac" stroke-width="1.5"/>
  <rect x="78" y="120" width="24" height="60" rx="1" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1.5"/>
  <text x="90" y="252" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Mon</text>
  <!-- Candle 2: Bearish (red) -->
  <line x1="145" y1="70" x2="145" y2="200" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="133" y="100" width="24" height="70" rx="1" fill="rgba(252,165,165,0.3)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="145" y="252" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Tue</text>
  <!-- Candle 3: Bullish -->
  <line x1="200" y1="90" x2="200" y2="195" stroke="#86efac" stroke-width="1.5"/>
  <rect x="188" y="130" width="24" height="50" rx="1" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1.5"/>
  <text x="200" y="252" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Wed</text>
  <!-- Candle 4: Bearish -->
  <line x1="255" y1="75" x2="255" y2="185" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="243" y="95" width="24" height="65" rx="1" fill="rgba(252,165,165,0.3)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="255" y="252" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Thu</text>
  <!-- Candle 5: Bullish -->
  <line x1="310" y1="65" x2="310" y2="175" stroke="#86efac" stroke-width="1.5"/>
  <rect x="298" y="100" width="24" height="55" rx="1" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1.5"/>
  <text x="310" y="252" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Fri</text>
  <!-- Candle anatomy label -->
  <rect x="330" y="60" width="60" height="120" rx="3" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="360" y1="65" x2="360" y2="175" stroke="#86efac" stroke-width="1.5"/>
  <rect x="348" y="90" width="24" height="55" rx="1" fill="rgba(134,239,172,0.2)" stroke="#86efac" stroke-width="1.5"/>
  <!-- Anatomy labels -->
  <line x1="372" y1="68" x2="385" y2="68" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="387" y="72" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace">High</text>
  <line x1="372" y1="90" x2="385" y2="90" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="387" y="94" font-size="7" fill="#86efac" font-family="monospace">Open</text>
  <line x1="372" y1="145" x2="385" y2="145" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="387" y="149" font-size="7" fill="#86efac" font-family="monospace">Close</text>
  <line x1="372" y1="172" x2="385" y2="172" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <text x="387" y="176" font-size="7" fill="rgba(255,255,255,0.6)" font-family="monospace">Low</text>
  <!-- Legend -->
  <rect x="60" y="262" width="12" height="10" rx="1" fill="rgba(134,239,172,0.3)" stroke="#86efac" stroke-width="1"/>
  <text x="78" y="271" font-size="9" fill="#86efac" font-family="monospace">Bullish (Close &gt; Open)</text>
  <rect x="200" y="262" width="12" height="10" rx="1" fill="rgba(252,165,165,0.3)" stroke="#fca5a5" stroke-width="1"/>
  <text x="218" y="271" font-size="9" fill="#fca5a5" font-family="monospace">Bearish (Close &lt; Open)</text>
</svg>
