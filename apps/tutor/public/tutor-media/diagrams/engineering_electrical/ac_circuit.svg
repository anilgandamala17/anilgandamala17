<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Sine wave -->
  <path d="M 30 140 Q 60 80, 90 140 T 150 140 T 210 140 T 270 140 T 330 140 T 390 140"
    fill="none" stroke="#fef08a" stroke-width="2" />

  <!-- Axes -->
  <line x1="20" y1="140" x2="395" y2="140" stroke="rgba(255,255,255,0.30)" stroke-width="1" />
  <line x1="30" y1="60" x2="30" y2="220" stroke="rgba(255,255,255,0.30)" stroke-width="1" />

  <!-- Axis labels -->
  <text x="200" y="235" font-size="9" fill="rgba(255,255,255,0.30)" text-anchor="middle">Time (t) →</text>
  <text x="15" y="100" font-size="9" fill="rgba(255,255,255,0.30)" text-anchor="middle" transform="rotate(-90,15,140)">Voltage (V)</text>

  <!-- Key points -->
  <circle cx="90" cy="80" r="4" fill="none" stroke="#86efac" stroke-width="1.5" />
  <text x="90" y="72" font-size="8" fill="#86efac" text-anchor="middle" font-weight="bold">Peak (+V)</text>

  <circle cx="210" cy="200" r="4" fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <text x="210" y="215" font-size="8" fill="#fca5a5" text-anchor="middle" font-weight="bold">Trough (-V)</text>

  <!-- Period marker -->
  <line x1="30" y1="55" x2="150" y2="55" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,2" />
  <text x="90" y="50" font-size="8" fill="#93c5fd" text-anchor="middle">Period (T = 1/f)</text>

  <!-- Frequency label -->
  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">AC Sine Wave — f = 60 Hz</text>
</svg>
