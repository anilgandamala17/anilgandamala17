<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">HUMAN RESPIRATION</text>
  
  <g transform="translate(100, 60)">
    <!-- Trachea -->
    <rect x="90" y="0" width="20" height="60" fill="#f472b6" rx="4" />
    <line x1="90" y1="10" x2="110" y2="10" stroke="#fff" opacity="0.3" />
    <line x1="90" y1="20" x2="110" y2="20" stroke="#fff" opacity="0.3" />
    <line x1="90" y1="30" x2="110" y2="30" stroke="#fff" opacity="0.3" />
    <line x1="90" y1="40" x2="110" y2="40" stroke="#fff" opacity="0.3" />
    <line x1="90" y1="50" x2="110" y2="50" stroke="#fff" opacity="0.3" />
    
    <!-- Lungs -->
    <path d="M 90 60 Q 50 80 40 120 Q 30 160 60 180 Q 100 160 100 120" fill="#f472b6" opacity="0.8" />
    <path d="M 110 60 Q 150 80 160 120 Q 170 160 140 180 Q 100 160 100 120" fill="#f472b6" opacity="0.8" />
    
    <!-- Alveoli Zoom -->
    <circle cx="160" cy="180" r="30" fill="#1e293b" stroke="#fff" />
    <circle cx="160" cy="180" r="25" fill="none" stroke="#fbbf24" stroke-dasharray="2" />
    <text x="160" y="185" text-anchor="middle" font-size="8">O₂ ↔ CO₂</text>
  </g>
  
  <text x="50" y="100" text-anchor="end" font-size="10">Right Lung</text> <line x1="55" y1="95" x2="70" y2="100" stroke="#94a3b8" />
  <text x="250" y="100" text-anchor="start" font-size="10">Left Lung</text> <line x1="245" y1="95" x2="180" y2="100" stroke="#94a3b8" />
  
  <text x="200" y="240" text-anchor="middle" font-size="12">Gas Exchange in Alveoli</text>
</svg>
