<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">SALTS FORMATION FAMILY</text>
  
  <g transform="translate(150, 60)">
    <rect x="0" y="0" width="100" height="40" fill="#fff" opacity="0.1" rx="4" />
    <text x="50" y="25" text-anchor="middle" fill="#fbbf24">NaCl Family</text>
    
    <line x1="50" y1="40" x2="0" y2="80" stroke="#94a3b8" />
    <line x1="50" y1="40" x2="100" y2="80" stroke="#94a3b8" />
    
    <rect x="-40" y="80" width="80" height="30" fill="#334155" />
    <text x="0" y="100" text-anchor="middle" font-size="10">Common Salt (NaCl)</text>

    <rect x="60" y="80" width="100" height="30" fill="#334155" />
    <text x="110" y="100" text-anchor="middle" font-size="10">Sodium Hydroxide</text>
  </g>
  
  <g transform="translate(50, 150)">
    <text x="0" y="20" fill="#f472b6">Bleaching Powder</text> <text x="150" y="20">CaOCl₂</text>
    <text x="0" y="50" fill="#f472b6">Baking Soda</text> <text x="150" y="50">NaHCO₃</text>
    <text x="0" y="80" fill="#f472b6">Washing Soda</text> <text x="150" y="80">Na₂CO₃·10H₂O</text>
    <text x="0" y="110" fill="#f472b6">Plaster of Paris</text> <text x="150" y="110">CaSO₄·½H₂O</text>
  </g>
</svg>
