<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <!-- Bg Removed -->
  <text x="20" y="30" class="title">REACTIVITY SERIES &amp; OCCURRENCE</text>
  
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="100" height="60" fill="#ef4444" opacity="0.8" />
    <text x="50" y="35" text-anchor="middle" fill="#fff" font-weight="bold">High (K, Na)</text>
    <text x="150" y="35" font-size="10">Electrolysis</text>
    
    <rect x="0" y="60" width="100" height="60" fill="#fbbf24" opacity="0.8" />
    <text x="50" y="95" text-anchor="middle" fill="#000" font-weight="bold">Med (Zn, Fe)</text>
    <text x="150" y="95" font-size="10">Reduction (C)</text>

    <rect x="0" y="120" width="100" height="60" fill="#3b82f6" opacity="0.8" />
    <text x="50" y="155" text-anchor="middle" fill="#fff" font-weight="bold">Low (Ag, Au)</text>
    <text x="150" y="155" font-size="10">Native State</text>
  </g>
  
  <path d="M 80 180 L 80 0" stroke="#fff" marker-end="url(#arrow)" />
  <text x="60" y="190" font-size="10" transform="rotate(-90 60 190)">Reactivity decreases</text>
</svg>
