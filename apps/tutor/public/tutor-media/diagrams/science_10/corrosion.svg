<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">CORROSION EXAMPLES</text>
  
  <g transform="translate(50, 80)">
    <text x="50" y="-10" text-anchor="middle" fill="#fbbf24">Silver (Ag)</text>
    <circle cx="50" cy="30" r="25" fill="#e2e8f0" />
    <circle cx="50" cy="30" r="10" fill="#000" opacity="0.6" />
    <text x="50" y="70" text-anchor="middle" font-size="10">Black Coating</text>
    <text x="50" y="85" text-anchor="middle" font-size="10">(Ag₂S)</text>
  </g>

  <g transform="translate(180, 80)">
    <text x="50" y="-10" text-anchor="middle" fill="#fbbf24">Copper (Cu)</text>
    <rect x="25" y="10" width="50" height="40" fill="#b45309" />
    <rect x="25" y="10" width="50" height="40" fill="#22c55e" opacity="0.5" />
    <text x="50" y="70" text-anchor="middle" font-size="10">Green Coating</text>
    <text x="50" y="85" text-anchor="middle" font-size="10">(CuCO₃)</text>
  </g>

  <g transform="translate(310, 80)">
    <text x="50" y="-10" text-anchor="middle" fill="#fbbf24">Iron (Fe)</text>
    <rect x="25" y="10" width="50" height="40" fill="#94a3b8" />
    <path d="M 25 10 L 75 10 L 75 20 L 25 20 Z" fill="#7f1d1d" opacity="0.8" />
    <text x="50" y="70" text-anchor="middle" font-size="10">Reddish Brown</text>
    <text x="50" y="85" text-anchor="middle" font-size="10">(Fe₂O₃·xH₂O)</text>
  </g>
</svg>
