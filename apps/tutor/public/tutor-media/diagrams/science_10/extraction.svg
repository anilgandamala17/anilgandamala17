<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <rect width="400" height="280" fill="#1a3a2a" />
  <text x="20" y="30" class="title">METALLURGY: EXTRACTION</text>
  
  <rect x="50" y="60" width="300" height="150" fill="#334155" rx="4" />
  
  <text x="70" y="90" font-weight="bold" fill="#f472b6">1. Concentration</text> <text x="200" y="90">Remove Gangue</text>
  
  <text x="70" y="120" font-weight="bold" fill="#fbbf24">2. Reduction</text>
  <text x="90" y="140" font-size="10">- Roasting (Sulphide Ores)</text>
  <text x="90" y="160" font-size="10">- Calcination (Carbonate Ores)</text>
  
  <text x="70" y="190" font-weight="bold" fill="#60a5fa">3. Refining</text> <text x="200" y="190">Electrolysis</text>

  <rect x="150" y="240" width="100" height="20" fill="#fbbf24" stroke="#e2e8f0" />
  <text x="200" y="255" text-anchor="middle" fill="#000" font-weight="bold">PURE METAL</text>
</svg>
