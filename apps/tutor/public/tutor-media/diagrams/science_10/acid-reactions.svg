<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
    </style>
  </defs>
  <!-- Bg Removed -->
  <text x="20" y="30" class="title">REACTIONS OF ACIDS</text>
  
  <!-- Metal -->
  <g transform="translate(40, 60)">
    <circle cx="20" cy="20" r="15" fill="#ef4444" opacity="0.8" /> <text x="20" y="25" text-anchor="middle" fill="#fff">A</text>
    <text x="45" y="25">+</text>
    <rect x="60" y="10" width="20" height="20" fill="#94a3b8" /> <text x="70" y="25" text-anchor="middle">M</text>
    <text x="95" y="25">→</text>
    <text x="110" y="25" fill="#fbbf24">Salt + H₂↑</text>
    <text x="70" y="55" font-size="10">Pop Sound</text>
  </g>

  <!-- Carbonate -->
  <g transform="translate(40, 130)">
    <circle cx="20" cy="20" r="15" fill="#ef4444" opacity="0.8" />
    <text x="45" y="25">+</text>
    <path d="M 60 30 L 70 10 L 80 30 Z" fill="#fff" />
    <text x="95" y="25">→</text>
    <text x="110" y="25" fill="#fbbf24">Salt + H₂O + CO₂↑</text>
    <text x="110" y="50" font-size="10">Turns lime water milky</text>
  </g>

  <!-- Base -->
  <g transform="translate(40, 200)">
    <circle cx="20" cy="20" r="15" fill="#ef4444" opacity="0.8" />
    <text x="45" y="25">+</text>
    <circle cx="70" cy="20" r="15" fill="#3b82f6" opacity="0.8" />
    <text x="95" y="25">→</text>
    <text x="110" y="25" fill="#fbbf24">Salt + Water</text>
    <text x="110" y="50" font-size="10">Neutralization</text>
  </g>
</svg>
