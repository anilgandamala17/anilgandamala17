<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Roboto Mono', monospace; fill: #e2e8f0; }
      .title { font-size: 14px; font-weight: bold; fill: #fbbf24; }
      .label { font-size: 10px; fill: #94a3b8; }
      .header { font-size: 12px; font-weight: bold; fill: #22c55e; }
    </style>
  </defs>

  <text x="200" y="30" class="title" text-anchor="middle">EFFECTS OF OXIDATION</text>

  <!-- Left: Corrosion -->
  <g transform="translate(40, 60)">
    <text x="60" y="0" class="header" text-anchor="middle">1. CORROSION</text>

    <!-- Iron Rusting -->
    <g transform="translate(10, 20)">
      <rect x="0" y="0" width="100" height="60" fill="none" stroke="#ffffff" stroke-opacity="0.2" rx="4"/>
      <text x="50" y="15" text-anchor="middle" font-size="10" fill="#fbbf24">Iron (Rusting)</text>
      <path d="M 20 25 L 80 25 L 80 35 L 20 35 Z" fill="#7f1d1d" opacity="0.8"/>
      <text x="50" y="50" text-anchor="middle" font-size="9">Fe2O3 xH2O (Rust)</text>
    </g>

    <!-- Silver/Copper -->
    <g transform="translate(10, 95)">
      <text x="50" y="10" text-anchor="middle" font-size="10">Silver - Black (Ag2S)</text>
      <text x="50" y="25" text-anchor="middle" font-size="10">Copper - Green (CuCO3)</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="200" y1="60" x2="200" y2="260" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="4"/>

  <!-- Right: Rancidity -->
  <g transform="translate(240, 60)">
    <text x="60" y="0" class="header" text-anchor="middle">2. RANCIDITY</text>

    <g transform="translate(10, 20)">
      <text x="50" y="15" text-anchor="middle" font-size="10" fill="#fbbf24">Oxidation of Fats/Oils</text>

      <!-- Chips Bag outline -->
      <path d="M 30 30 L 70 30 L 80 80 L 20 80 Z" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="50" y="60" text-anchor="middle" font-size="10">Chips</text>

      <text x="50" y="100" text-anchor="middle" font-size="9" fill="#38bdf8">Flushed with N2 Gas</text>
      <text x="50" y="115" text-anchor="middle" font-size="9" fill="#38bdf8">Antioxidants Added</text>
      <text x="50" y="135" text-anchor="middle" font-size="10">Prevents smell/taste</text>
      <text x="50" y="150" text-anchor="middle" font-size="10">changes in food</text>
    </g>
  </g>
</svg>