<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Photosynthesis — Chloroplast</text>
  <!-- Chloroplast outer membrane -->
  <ellipse cx="200" cy="148" rx="175" ry="110" fill="rgba(134,239,172,0.06)" stroke="#86efac" stroke-width="2"/>
  <!-- Inner membrane -->
  <ellipse cx="200" cy="148" rx="165" ry="100" fill="none" stroke="#86efac" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Stroma label -->
  <text x="55" y="148" font-size="9" fill="rgba(134,239,172,0.7)" text-anchor="middle" font-family="monospace">Stroma</text>
  <!-- Thylakoid stack (granum) -->
  <rect x="130" y="110" width="80" height="14" rx="7" fill="rgba(134,239,172,0.25)" stroke="#86efac" stroke-width="1.5"/>
  <rect x="128" y="126" width="84" height="14" rx="7" fill="rgba(134,239,172,0.25)" stroke="#86efac" stroke-width="1.5"/>
  <rect x="130" y="142" width="80" height="14" rx="7" fill="rgba(134,239,172,0.25)" stroke="#86efac" stroke-width="1.5"/>
  <rect x="132" y="158" width="76" height="14" rx="7" fill="rgba(134,239,172,0.25)" stroke="#86efac" stroke-width="1.5"/>
  <text x="170" y="188" font-size="9" fill="#86efac" text-anchor="middle" font-family="monospace">Granum</text>
  <text x="170" y="200" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(thylakoid stack)</text>
  <!-- Light reactions label -->
  <text x="170" y="108" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Light Reactions</text>
  <text x="170" y="98" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(in thylakoid membrane)</text>
  <!-- Sun arrow -->
  <line x1="30" y1="50" x2="130" y2="115" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="22" cy="42" r="12" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="22" y="46" font-size="10" fill="#fbbf24" text-anchor="middle" font-family="monospace">☀</text>
  <text x="70" y="75" font-size="9" fill="#fbbf24" text-anchor="middle" font-family="monospace">Light</text>
  <!-- H2O input -->
  <text x="30" y="165" font-size="10" fill="#93c5fd" font-family="monospace">H₂O</text>
  <line x1="55" y1="162" x2="130" y2="148" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- O2 output -->
  <text x="30" y="200" font-size="10" fill="#86efac" font-family="monospace">O₂ ↑</text>
  <line x1="55" y1="196" x2="130" y2="160" stroke="#86efac" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- ATP/NADPH arrow to Calvin -->
  <line x1="215" y1="148" x2="280" y2="148" stroke="#fbbf24" stroke-width="2"/>
  <text x="248" y="140" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">ATP</text>
  <text x="248" y="162" font-size="8" fill="#fbbf24" text-anchor="middle" font-family="monospace">NADPH</text>
  <!-- Calvin cycle circle -->
  <circle cx="320" cy="148" rx="40" ry="40" r="38" fill="rgba(147,197,253,0.1)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="142" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Calvin</text>
  <text x="320" y="154" font-size="9" fill="#93c5fd" text-anchor="middle" font-family="monospace">Cycle</text>
  <text x="320" y="166" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">(stroma)</text>
  <!-- CO2 input to Calvin -->
  <text x="360" y="100" font-size="10" fill="#fca5a5" font-family="monospace">CO₂</text>
  <line x1="355" y1="105" x2="340" y2="118" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Glucose output -->
  <text x="360" y="200" font-size="9" fill="#fbbf24" font-family="monospace">Glucose</text>
  <line x1="355" y1="195" x2="340" y2="178" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Overall equation -->
  <rect x="60" y="250" width="280" height="22" rx="3" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="265" font-size="9" fill="#ffffff" text-anchor="middle" font-family="monospace">6CO₂ + 6H₂O + Light → C₆H₁₂O₆ + 6O₂</text>
</svg>
