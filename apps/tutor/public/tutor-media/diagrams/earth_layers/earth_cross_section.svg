<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg" style="background:#1a3a2a">
  <text x="200" y="18" font-size="13" fill="#86efac" text-anchor="middle" font-family="monospace" font-weight="bold">Earth's Internal Layers</text>
  <!-- Earth cross-section (half circle) -->
  <!-- Inner core -->
  <path d="M200 260 A60 60 0 0 1 200 140" fill="rgba(252,165,165,0.35)" stroke="#fca5a5" stroke-width="2"/>
  <path d="M200 260 A60 60 0 0 0 200 140" fill="rgba(252,165,165,0.35)" stroke="#fca5a5" stroke-width="2"/>
  <!-- Outer core -->
  <path d="M200 260 A100 100 0 0 1 200 60" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2"/>
  <path d="M200 260 A100 100 0 0 0 200 60" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="2"/>
  <!-- Mantle -->
  <path d="M200 260 A145 145 0 0 1 200 -30" fill="rgba(134,239,172,0.12)" stroke="#86efac" stroke-width="2"/>
  <path d="M200 260 A145 145 0 0 0 200 -30" fill="rgba(134,239,172,0.12)" stroke="#86efac" stroke-width="2"/>
  <!-- Crust (thin) -->
  <path d="M200 260 A150 150 0 0 1 200 -40" fill="rgba(147,197,253,0.15)" stroke="#93c5fd" stroke-width="3"/>
  <path d="M200 260 A150 150 0 0 0 200 -40" fill="rgba(147,197,253,0.15)" stroke="#93c5fd" stroke-width="3"/>
  <!-- Center line -->
  <line x1="200" y1="260" x2="200" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Labels with lines -->
  <!-- Inner core -->
  <line x1="200" y1="200" x2="310" y2="175" stroke="#fca5a5" stroke-width="1"/>
  <text x="318" y="170" font-size="10" fill="#fca5a5" font-family="monospace" font-weight="bold">Inner Core</text>
  <text x="318" y="182" font-size="8" fill="rgba(255,255,255,0.5)" font-family="monospace">Solid iron-nickel</text>
  <text x="318" y="193" font-size="8" fill="rgba(255,255,255,0.4)" font-family="monospace">r ≈ 1,220 km</text>
  <text x="318" y="204" font-size="8" fill="rgba(255,255,255,0.4)" font-family="monospace">~5,400°C</text>
  <!-- Outer core -->
  <line x1="200" y1="155" x2="310" y2="130" stroke="#fbbf24" stroke-width="1"/>
  <text x="318" y="125" font-size="10" fill="#fbbf24" font-family="monospace" font-weight="bold">Outer Core</text>
  <text x="318" y="137" font-size="8" fill="rgba(255,255,255,0.5)" font-family="monospace">Liquid iron-nickel</text>
  <text x="318" y="148" font-size="8" fill="rgba(255,255,255,0.4)" font-family="monospace">2,220–3,400 km</text>
  <!-- Mantle -->
  <line x1="200" y1="110" x2="310" y2="85" stroke="#86efac" stroke-width="1"/>
  <text x="318" y="80" font-size="10" fill="#86efac" font-family="monospace" font-weight="bold">Mantle</text>
  <text x="318" y="92" font-size="8" fill="rgba(255,255,255,0.5)" font-family="monospace">Semi-solid silicate</text>
  <text x="318" y="103" font-size="8" fill="rgba(255,255,255,0.4)" font-family="monospace">2,900 km thick</text>
  <!-- Crust -->
  <line x1="200" y1="65" x2="310" y2="45" stroke="#93c5fd" stroke-width="1"/>
  <text x="318" y="40" font-size="10" fill="#93c5fd" font-family="monospace" font-weight="bold">Crust</text>
  <text x="318" y="52" font-size="8" fill="rgba(255,255,255,0.5)" font-family="monospace">5–70 km thick</text>
  <!-- Left side depth scale -->
  <text x="55" y="200" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">0 km</text>
  <text x="55" y="160" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">2,900</text>
  <text x="55" y="120" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">5,100</text>
  <text x="55" y="80" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">6,371</text>
  <text x="55" y="68" font-size="7" fill="rgba(255,255,255,0.3)" text-anchor="middle" font-family="monospace">km</text>
  <!-- Surface label -->
  <text x="200" y="258" font-size="8" fill="rgba(255,255,255,0.4)" text-anchor="middle" font-family="monospace">Surface</text>
</svg>
