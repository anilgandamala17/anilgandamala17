<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Nernst Equation (Electrode Potential)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Concept Visualization -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="300" height="250" rx="10" fill="rgba(134, 239, 172, 0.05)" stroke="#86efac" stroke-width="2"/>
    <text x="150" y="40" fill="#86efac" text-anchor="middle" font-weight="bold">Concentration Effect</text>
    
    <circle cx="150" cy="130" r="60" fill="rgba(254, 240, 138, 0.1)" stroke="#fef08a" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="150" y="135" fill="#fef08a" text-anchor="middle" font-size="20">[Mⁿ⁺]</text>
    
    <line x1="150" y1="130" x2="250" y2="130" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="210" y="120" fill="#f8fafc" font-size="14">Potential Change</text>
    
    <text x="150" y="220" fill="#f8fafc" text-anchor="middle" font-size="16">Relates E to [Concentration]</text>
  </g>

  <!-- The Equation (Central Focus) -->
  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="300" height="250" rx="15" fill="rgba(255,255,255,0.03)" stroke="#fef08a" stroke-width="2"/>
    <text x="150" y="50" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="42" font-style="italic">E = E° - <tspan dy="-10">RT</tspan><tspan x="150" dy="25">————</tspan><tspan x="150" dy="30">nF</tspan> · ln Q</text>
    
    <text x="150" y="160" fill="#86efac" text-anchor="middle">At 298 K (Simplified):</text>
    <text x="150" y="210" fill="#86efac" text-anchor="middle" font-family="'Times New Roman', serif" font-size="28" font-style="italic">E = E° - <tspan dy="-5">0.0591</tspan><tspan x="150" dy="20">————</tspan><tspan x="150" dy="25">n</tspan> · log Q</text>
  </g>

  <rect x="150" y="450" width="500" height="80" rx="10" fill="rgba(254, 240, 138, 0.05)" stroke="#fef08a" stroke-width="1"/>
  <text x="400" y="495" fill="#f8fafc" text-anchor="middle" font-size="20">Q is the reaction quotient (Prod/React)</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>