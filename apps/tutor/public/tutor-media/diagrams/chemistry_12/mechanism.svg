<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Reaction Mechanism &amp; Collision Theory</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Energy Profile -->
  <g transform="translate(100, 150)">
    <line x1="50" y1="250" x2="350" y2="250" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="200" y="270" fill="#f8fafc" text-anchor="middle">Reaction Coordinate</text>
    
    <path d="M 50 200 L 100 200 Q 200 20 300 150 L 350 150" fill="none" stroke="#fef08a" stroke-width="3"/>
    
    <text x="75" y="190" fill="#86efac">Reactants</text>
    <text x="200" y="30" fill="#f87171" font-weight="bold">Transition State</text>
    <text x="320" y="140" fill="#60a5fa">Products</text>
    
    <!-- E_a arrow -->
    <line x1="200" y1="200" x2="200" y2="40" stroke="#86efac" stroke-width="2" marker-end="url(#arrowhead)" marker-start="url(#arrowhead)"/>
    <text x="210" y="120" fill="#86efac">Activation Energy (E_a)</text>
  </g>

  <!-- Collision Orientation -->
  <g transform="translate(500, 150)">
    <text x="100" y="-20" fill="#86efac" font-weight="bold" text-anchor="middle">Effective Orientation</text>
    
    <!-- Molecule 1 -->
    <circle cx="50" cy="50" r="15" fill="#fef08a"/>
    <circle cx="70" cy="50" r="15" fill="#f8fafc" stroke="#fef08a"/>
    
    <!-- Molecule 2 -->
    <circle cx="150" cy="50" r="15" fill="#fef08a"/>
    <circle cx="130" cy="50" r="15" fill="#f8fafc" stroke="#fef08a"/>
    
    <!-- Impact -->
    <path d="M 90 40 L 110 60 M 110 40 L 90 60" stroke="#f87171" stroke-width="3"/>
    <text x="100" y="100" fill="#fef08a" text-anchor="middle" font-size="14">Requires Energy + Orientation</text>
  </g>

  <!-- Arrhenius Equation -->
  <rect x="250" y="470" width="300" height="80" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="525" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="42" font-style="italic">
    k = A · e^{(-E_a / RT)}
  </text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>