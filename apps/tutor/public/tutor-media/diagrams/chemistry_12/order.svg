<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Order of Reaction (Kinetics)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Comparison Graphs -->
  <g transform="translate(100, 150)">
    <!-- Zero Order -->
    <g transform="translate(0, 0)">
       <line x1="20" y1="150" x2="160" y2="150" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="150" x2="20" y2="20" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="40" x2="150" y2="150" stroke="#86efac" stroke-width="2"/>
       <text x="90" y="180" fill="#86efac" text-anchor="middle">Zero (0)</text>
       <text x="90" y="200" fill="#f8fafc" text-anchor="middle" font-size="12">[A] vs t (Linear)</text>
    </g>

    <!-- First Order -->
    <g transform="translate(200, 0)">
       <line x1="20" y1="150" x2="160" y2="150" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="150" x2="20" y2="20" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="40" x2="150" y2="150" stroke="#fef08a" stroke-width="2"/>
       <text x="90" y="180" fill="#fef08a" text-anchor="middle">First (1st)</text>
       <text x="90" y="200" fill="#f8fafc" text-anchor="middle" font-size="12">ln[A] vs t (Linear)</text>
    </g>

    <!-- Second Order -->
    <g transform="translate(400, 0)">
       <line x1="20" y1="150" x2="160" y2="150" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="150" x2="20" y2="20" stroke="#f8fafc" stroke-width="1.5"/>
       <line x1="20" y1="150" x2="150" y2="40" stroke="#60a5fa" stroke-width="2"/>
       <text x="90" y="180" fill="#60a5fa" text-anchor="middle">Second (2nd)</text>
       <text x="90" y="200" fill="#f8fafc" text-anchor="middle" font-size="12">1/[A] vs t (Linear)</text>
    </g>
  </g>

  <!-- Half-Life Formulae -->
  <rect x="150" y="450" width="500" height="100" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="250" y="490" fill="#fef08a" font-size="18">0 Order: t_{1/2} = [A]₀/2k</text>
  <text x="250" y="520" fill="#fef08a" font-size="22" font-weight="bold">1st Order: t_{1/2} = 0.693 / k</text>
  <text x="250" y="540" fill="#f8fafc" font-size="12" opacity="0.5">(Independent of initial concentration)</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>