<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f8fafc" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Raoult's Law (Ideal Solutions)</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Vapour Pressure Graph -->
  <g transform="translate(150, 120)">
    <!-- Axes -->
    <line x1="0" y1="300" x2="500" y2="300" stroke="#f8fafc" stroke-width="2"/> <!-- x-axis -->
    <line x1="0" y1="300" x2="0" y2="0" stroke="#f8fafc" stroke-width="2"/> <!-- y-axis 1 -->
    <line x1="500" y1="300" x2="500" y2="0" stroke="#f8fafc" stroke-width="2"/> <!-- y-axis 2 -->
    
    <text x="-60" y="150" fill="#f8fafc" transform="rotate(-90 -60 150)" text-anchor="middle">Vapour Pressure (P)</text>
    
    <!-- Ideal Lines -->
    <line x1="0" y1="200" x2="500" y2="300" stroke="#86efac" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="20" y="190" fill="#86efac" font-size="14">P₁°</text>
    
    <line x1="0" y1="300" x2="500" y2="100" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="480" y="90" fill="#60a5fa" font-size="14">P₂°</text>
    
    <!-- Total Pressure -->
    <line x1="0" y1="200" x2="500" y2="100" stroke="#fef08a" stroke-width="4"/>
    <text x="250" y="140" fill="#fef08a" font-weight="bold">P_total = P₁ + P₂</text>
    
    <!-- Mole Fraction Scale -->
    <text x="0" y="330" fill="#f8fafc" text-anchor="middle">χ₁=1, χ₂=0</text>
    <text x="500" y="330" fill="#f8fafc" text-anchor="middle">χ₁=0, χ₂=1</text>
  </g>

  <!-- Key Formula -->
  <rect x="250" y="480" width="300" height="80" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1.5"/>
  <text x="400" y="530" fill="#fef08a" text-anchor="middle" font-family="'Times New Roman', serif" font-size="40" font-style="italic">P_i = P_i° · χ_i</text>
  
  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>