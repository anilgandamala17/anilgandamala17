<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Electrical Properties of Solids</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Energy Band Diagrams -->
  <g transform="translate(100, 150)">
    <!-- Conductor -->
    <g transform="translate(0, 0)">
      <text x="75" y="-20" fill="#86efac" text-anchor="middle" font-weight="bold">Conductors</text>
      <rect x="0" y="0" width="150" height="100" fill="rgba(134, 239, 172, 0.4)" stroke="#86efac"/>
      <rect x="0" y="50" width="150" height="100" fill="rgba(134, 239, 172, 0.4)" stroke="#86efac" opacity="0.6"/>
      <text x="75" y="180" fill="#f8fafc" text-anchor="middle">Overlapping Bands</text>
    </g>

    <!-- Semiconductor -->
    <g transform="translate(250, 0)">
      <text x="75" y="-20" fill="#fef08a" text-anchor="middle" font-weight="bold">Semiconductors</text>
      <rect x="0" y="0" width="150" height="80" fill="rgba(254, 240, 138, 0.2)" stroke="#fef08a"/>
      <rect x="0" y="120" width="150" height="80" fill="rgba(254, 240, 138, 0.4)" stroke="#fef08a"/>
      <line x1="75" y1="120" x2="75" y2="80" stroke="#f8fafc" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.5"/>
      <text x="75" y="110" fill="#f8fafc" text-anchor="middle" font-size="12">Small Gap</text>
      <text x="75" y="230" fill="#f8fafc" text-anchor="middle">Limited e- jump</text>
    </g>

    <!-- Insulator -->
    <g transform="translate(500, 0)">
      <text x="75" y="-20" fill="#f87171" text-anchor="middle" font-weight="bold">Insulators</text>
      <rect x="0" y="-20" width="150" height="60" fill="rgba(248, 113, 113, 0.2)" stroke="#f87171"/>
      <rect x="0" y="160" width="150" height="60" fill="rgba(248, 113, 113, 0.4)" stroke="#f87171"/>
      <text x="75" y="100" fill="#f87171" text-anchor="middle" font-weight="bold">LARGE BAND GAP</text>
      <text x="75" y="250" fill="#f8fafc" text-anchor="middle">No e- flow</text>
    </g>
  </g>

  <rect x="150" y="480" width="500" height="60" rx="10" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="1"/>
  <text x="400" y="520" fill="#86efac" text-anchor="middle" font-size="20">Conductivity Range: 10^{-20} to 10^{7} ohm^{-1}m^{-1}</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>