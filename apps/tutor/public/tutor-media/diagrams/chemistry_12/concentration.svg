<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Header -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="36" fill="#fef08a" text-anchor="middle" font-weight="bold">Solution Concentration Units</text>
  <line x1="150" y1="70" x2="650" y2="70" stroke="#fef08a" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>

  <!-- Visual Representation -->
  <g transform="translate(150, 150)">
    <!-- Beaker -->
    <path d="M 0 0 L 0 250 Q 0 270 20 270 L 180 270 Q 200 270 200 250 L 200 0" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M 0 100 Q 100 80 200 100 L 200 250 Q 200 270 180 270 L 20 270 Q 0 270 0 250 Z" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Dissolved Solute Particles -->
    <circle cx="50" cy="150" r="6" fill="#fef08a"/>
    <circle cx="120" cy="120" r="6" fill="#fef08a"/>
    <circle cx="160" cy="200" r="6" fill="#fef08a"/>
    <circle cx="80" cy="230" r="6" fill="#fef08a"/>
    
    <text x="100" y="300" fill="#f8fafc" text-anchor="middle" font-weight="bold">Solute + Solvent = Solution</text>
  </g>

  <!-- Formulae -->
  <g transform="translate(450, 150)">
    <rect x="0" y="0" width="300" height="250" rx="15" fill="rgba(255,255,255,0.03)" stroke="#86efac" stroke-width="2"/>
    
    <text x="150" y="40" fill="#86efac" text-anchor="middle" font-size="20" font-weight="bold">Standard Units</text>
    
    <text x="20" y="80" fill="#fef08a" font-size="18">Molarity (M) = mol Solute / L Soln</text>
    <text x="20" y="120" fill="#fef08a" font-size="18">Molality (m) = mol Solute / kg Solv</text>
    <text x="20" y="160" fill="#fef08a" font-size="18">Mole Fraction (χ) = n₁ / (n₁ + n₂)</text>
    <text x="20" y="200" fill="#fef08a" font-size="18">Mass % = (m_solute / m_soln) × 100</text>
  </g>

  <rect x="150" y="450" width="500" height="80" rx="15" fill="rgba(134, 239, 172, 0.05)" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="495" fill="#f8fafc" text-anchor="middle" font-size="22" font-style="italic">"Concentration determines the properties of solutions."</text>

  <text x="780" y="580" font-family="Arial, sans-serif" font-size="12" fill="#f8fafc" text-anchor="end" opacity="0.3">IAra Academy © 2026 | Chemistry Grade 12</text>
</svg>