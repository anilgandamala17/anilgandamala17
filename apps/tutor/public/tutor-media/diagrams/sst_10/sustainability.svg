<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#1a5c2a}
      .title{fill:#fff9c4;font-size:14px;font-weight:bold}
      .sub{fill:#b2f5ea;font-size:10px}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="18" text-anchor="middle" class="title">Sustainability of Development</text>
  <text x="210" y="30" text-anchor="middle" class="sub">Meeting present needs without compromising future generations</text>

  <!-- Sustainability Venn Diagram -->
  <!-- 3 overlapping circles -->
  <circle cx="160" cy="130" r="62" fill="#1a5c3a" stroke="#aed581" stroke-width="1.5" opacity="0.85"/>
  <circle cx="260" cy="130" r="62" fill="#1a3b5c" stroke="#80cbc4" stroke-width="1.5" opacity="0.85"/>
  <circle cx="210" cy="185" r="62" fill="#3b1a1a" stroke="#f06292" stroke-width="1.5" opacity="0.85"/>

  <!-- Labels -->
  <text x="120" y="102" text-anchor="middle" fill="#aed581" font-size="11" font-weight="bold">Environmental</text>
  <text x="120" y="115" text-anchor="middle" fill="#aed581" font-size="9">Ecological balance</text>
  <text x="120" y="128" text-anchor="middle" fill="#b2f5ea" font-size="8">biodiversity, clean</text>
  <text x="120" y="139" text-anchor="middle" fill="#b2f5ea" font-size="8">air, water, soil</text>

  <text x="300" y="102" text-anchor="middle" fill="#80cbc4" font-size="11" font-weight="bold">Social</text>
  <text x="300" y="115" text-anchor="middle" fill="#80cbc4" font-size="9">Equity &amp; welfare</text>
  <text x="300" y="128" text-anchor="middle" fill="#b2f5ea" font-size="8">health, education</text>
  <text x="300" y="139" text-anchor="middle" fill="#b2f5ea" font-size="8">human rights</text>

  <text x="210" y="226" text-anchor="middle" fill="#f06292" font-size="11" font-weight="bold">Economic</text>
  <text x="210" y="238" text-anchor="middle" fill="#f06292" font-size="9">Prosperity</text>
  <text x="210" y="249" text-anchor="middle" fill="#b2f5ea" font-size="8">GDP, jobs, trade</text>
  <text x="210" y="260" text-anchor="middle" fill="#b2f5ea" font-size="8">infrastructure</text>

  <!-- Overlap labels -->
  <text x="175" y="152" text-anchor="middle" fill="#ffd600" font-size="8" font-weight="bold">Viable</text>
  <text x="245" y="152" text-anchor="middle" fill="#ffd600" font-size="8" font-weight="bold">Equitable</text>
  <text x="210" y="175" text-anchor="middle" fill="#ffd600" font-size="8" font-weight="bold">Liveable</text>

  <!-- Center = Sustainable -->
  <circle cx="210" cy="160" r="22" fill="#1a5c2a" stroke="#ffd600" stroke-width="2"/>
  <text x="210" y="156" text-anchor="middle" fill="#ffd600" font-size="8" font-weight="bold">SUSTAIN-</text>
  <text x="210" y="167" text-anchor="middle" fill="#ffd600" font-size="8" font-weight="bold">ABLE</text>

  <!-- Bottom: threats & goals -->
  <rect x="8" y="272" width="200" height="24" fill="#3b1a00" stroke="#ff8a65" stroke-width="1" rx="3"/>
  <text x="108" y="285" text-anchor="middle" fill="#ff8a65" font-size="9" font-weight="bold">⚠ Threats: pollution, fossil fuels</text>

  <rect x="216" y="272" width="196" height="24" fill="#0d3b1a" stroke="#aed581" stroke-width="1" rx="3"/>
  <text x="314" y="285" text-anchor="middle" fill="#aed581" font-size="9" font-weight="bold">✅ UN SDGs: 17 Goals by 2030</text>
  </g>
</svg>
