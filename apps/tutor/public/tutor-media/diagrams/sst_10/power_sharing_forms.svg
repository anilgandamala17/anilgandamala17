<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#1a5c2a}
      .title{fill:#fff9c4;font-size:14px;font-weight:bold}
      .sub{fill:#b2f5ea;font-size:10px}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="18" text-anchor="middle" class="title">Forms of Power Sharing</text>
  <text x="210" y="30" text-anchor="middle" class="sub">Four principal forms by which power is distributed in a democracy</text>

  <!-- 4 quadrants -->
  <!-- Top-left: Horizontal -->
  <rect x="8" y="38" width="196" height="118" fill="#0d3b20" stroke="#ffd600" stroke-width="1.5" rx="5"/>
  <text x="106" y="54" text-anchor="middle" fill="#ffd600" font-size="11" font-weight="bold">① Horizontal Sharing</text>
  <text x="106" y="67" text-anchor="middle" fill="#b2f5ea" font-size="9">Among organs of government</text>
  <!-- 3 pillars -->
  <rect x="16" y="74" width="50" height="70" fill="#3b3000" stroke="#ffd600" stroke-width="1" rx="3"/>
  <text x="41" y="90" text-anchor="middle" fill="#ffd600" font-size="9" font-weight="bold">Legis-</text>
  <text x="41" y="101" text-anchor="middle" fill="#ffd600" font-size="9" font-weight="bold">lature</text>
  <text x="41" y="116" text-anchor="middle" fill="#ffffff" font-size="8">Makes</text>
  <text x="41" y="128" text-anchor="middle" fill="#ffffff" font-size="8">Laws</text>
  <text x="41" y="140" text-anchor="middle" fill="#b2f5ea" font-size="7">Parliament</text>

  <rect x="80" y="74" width="50" height="70" fill="#3b3000" stroke="#80cbc4" stroke-width="1" rx="3"/>
  <text x="105" y="90" text-anchor="middle" fill="#80cbc4" font-size="9" font-weight="bold">Execu-</text>
  <text x="105" y="101" text-anchor="middle" fill="#80cbc4" font-size="9" font-weight="bold">tive</text>
  <text x="105" y="116" text-anchor="middle" fill="#ffffff" font-size="8">Imple-</text>
  <text x="105" y="128" text-anchor="middle" fill="#ffffff" font-size="8">ments</text>
  <text x="105" y="140" text-anchor="middle" fill="#b2f5ea" font-size="7">Cabinet</text>

  <rect x="144" y="74" width="52" height="70" fill="#3b3000" stroke="#f06292" stroke-width="1" rx="3"/>
  <text x="170" y="90" text-anchor="middle" fill="#f06292" font-size="9" font-weight="bold">Judici-</text>
  <text x="170" y="101" text-anchor="middle" fill="#f06292" font-size="9" font-weight="bold">ary</text>
  <text x="170" y="116" text-anchor="middle" fill="#ffffff" font-size="8">Interprets</text>
  <text x="170" y="128" text-anchor="middle" fill="#ffffff" font-size="8">Laws</text>
  <text x="170" y="140" text-anchor="middle" fill="#b2f5ea" font-size="7">Courts</text>

  <!-- Top-right: Vertical -->
  <rect x="216" y="38" width="196" height="118" fill="#0d3b20" stroke="#80cbc4" stroke-width="1.5" rx="5"/>
  <text x="314" y="54" text-anchor="middle" fill="#80cbc4" font-size="11" font-weight="bold">② Vertical Sharing</text>
  <text x="314" y="67" text-anchor="middle" fill="#b2f5ea" font-size="9">Between levels of government</text>
  <!-- Pyramid -->
  <polygon points="314,76 260,138 368,138" fill="none" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="314" y="94" text-anchor="middle" fill="#ffd600" font-size="9" font-weight="bold">Central /</text>
  <text x="314" y="105" text-anchor="middle" fill="#ffd600" font-size="9">Federal</text>
  <line x1="260" y1="110" x2="368" y2="110" stroke="#80cbc4" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="314" y="122" text-anchor="middle" fill="#aed581" font-size="9">State Govts</text>
  <line x1="260" y1="128" x2="368" y2="128" stroke="#80cbc4" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="314" y="138" text-anchor="middle" fill="#ffffff" font-size="9">Local Bodies (Panchayat/Municipal)</text>
  <text x="224" y="151" fill="#b2f5ea" font-size="8">Federalism: Union + State Lists</text>

  <!-- Bottom-left: Community -->
  <rect x="8" y="164" width="196" height="128" fill="#0d3b20" stroke="#aed581" stroke-width="1.5" rx="5"/>
  <text x="106" y="180" text-anchor="middle" fill="#aed581" font-size="11" font-weight="bold">③ Community Sharing</text>
  <text x="106" y="193" text-anchor="middle" fill="#b2f5ea" font-size="9">Among social groups</text>
  <text x="16" y="210" fill="#ffffff" font-size="9">• Religious, linguistic minorities</text>
  <text x="16" y="224" fill="#ffffff" font-size="9">• Representation in legislatures</text>
  <text x="16" y="238" fill="#aed581" font-size="9">Example: India's reserved seats</text>
  <text x="16" y="252" fill="#aed581" font-size="9">Example: Belgium language groups</text>
  <text x="16" y="266" fill="#b2f5ea" font-size="8">Prevents majority domination</text>
  <text x="16" y="282" fill="#ffd600" font-size="8">Constitutional protection of rights</text>

  <!-- Bottom-right: Parties/Pressure -->
  <rect x="216" y="164" width="196" height="128" fill="#0d3b20" stroke="#f06292" stroke-width="1.5" rx="5"/>
  <text x="314" y="180" text-anchor="middle" fill="#f06292" font-size="11" font-weight="bold">④ Political Parties</text>
  <text x="314" y="193" text-anchor="middle" fill="#b2f5ea" font-size="9">&amp; Pressure Groups</text>
  <text x="224" y="210" fill="#ffffff" font-size="9">• Opposition parties as check</text>
  <text x="224" y="224" fill="#ffffff" font-size="9">• Coalition governments</text>
  <text x="224" y="238" fill="#f06292" font-size="9">• Trade unions, media</text>
  <text x="224" y="252" fill="#f06292" font-size="9">• Business groups lobby</text>
  <text x="224" y="266" fill="#b2f5ea" font-size="8">Decentralise power beyond</text>
  <text x="224" y="282" fill="#b2f5ea" font-size="8">formal government institutions</text>
  </g>
</svg>
