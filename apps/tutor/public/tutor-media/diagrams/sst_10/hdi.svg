<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#1a5c2a}
      .title{fill:#fff9c4;font-size:14px;font-weight:bold}
      .sub{fill:#b2f5ea;font-size:10px}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="18" text-anchor="middle" class="title">Human Development Index (HDI)</text>
  <text x="210" y="30" text-anchor="middle" class="sub">UNDP's multi-dimensional measure of development — beyond GDP</text>

  <!-- HDI Triangle -->
  <polygon points="210,46 100,160 320,160" fill="#0d3b20" stroke="#ffd600" stroke-width="2"/>
  <text x="210" y="80" text-anchor="middle" fill="#ffd600" font-size="12" font-weight="bold">HDI</text>
  <text x="210" y="94" text-anchor="middle" fill="#fff9c4" font-size="10">Human Development</text>
  <text x="210" y="107" text-anchor="middle" fill="#fff9c4" font-size="10">Index</text>
  <text x="210" y="122" text-anchor="middle" fill="#b2f5ea" font-size="9">0 ← score → 1</text>

  <!-- 3 components at corners -->
  <!-- Bottom-left: Health -->
  <rect x="8" y="165" width="130" height="70" fill="#0d3b20" stroke="#f06292" stroke-width="1.4" rx="5"/>
  <text x="73" y="180" text-anchor="middle" fill="#f06292" font-size="10" font-weight="bold">① Health</text>
  <text x="16" y="195" fill="#ffffff" font-size="9">Life Expectancy at birth</text>
  <text x="16" y="207" fill="#b2f5ea" font-size="8">Indicator: Years expected</text>
  <text x="16" y="220" fill="#b2f5ea" font-size="8">to live from birth</text>
  <text x="16" y="232" fill="#f06292" font-size="8">India: ~70 years (2022)</text>

  <!-- Bottom-middle: Education -->
  <rect x="148" y="165" width="124" height="70" fill="#0d3b20" stroke="#80cbc4" stroke-width="1.4" rx="5"/>
  <text x="210" y="180" text-anchor="middle" fill="#80cbc4" font-size="10" font-weight="bold">② Education</text>
  <text x="156" y="195" fill="#ffffff" font-size="9">Mean years of schooling</text>
  <text x="156" y="207" fill="#ffffff" font-size="9">Expected school years</text>
  <text x="156" y="219" fill="#b2f5ea" font-size="8">Literacy + enrolment</text>
  <text x="156" y="231" fill="#80cbc4" font-size="8">India: ~6.7 mean yrs</text>

  <!-- Bottom-right: Income -->
  <rect x="282" y="165" width="130" height="70" fill="#0d3b20" stroke="#aed581" stroke-width="1.4" rx="5"/>
  <text x="347" y="180" text-anchor="middle" fill="#aed581" font-size="10" font-weight="bold">③ Income</text>
  <text x="290" y="195" fill="#ffffff" font-size="9">GNI per capita (PPP $)</text>
  <text x="290" y="207" fill="#b2f5ea" font-size="8">Purchasing Power Parity</text>
  <text x="290" y="219" fill="#b2f5ea" font-size="8">Adjusted GDP per person</text>
  <text x="290" y="231" fill="#aed581" font-size="8">India: ~PPP $6,700</text>

  <!-- Country comparison table -->
  <rect x="8" y="244" width="404" height="50" fill="#0d3b20" stroke="#ffd600" stroke-width="1" rx="5"/>
  <text x="210" y="259" text-anchor="middle" fill="#fff9c4" font-size="10" font-weight="bold">HDI Country Comparison (2023)</text>
  <!-- Headers -->
  <text x="66" y="272" text-anchor="middle" fill="#80cbc4" font-size="9">Country</text>
  <text x="160" y="272" text-anchor="middle" fill="#80cbc4" font-size="9">HDI Score</text>
  <text x="250" y="272" text-anchor="middle" fill="#80cbc4" font-size="9">Rank</text>
  <text x="350" y="272" text-anchor="middle" fill="#80cbc4" font-size="9">Category</text>
  <!-- Data rows -->
  <text x="16" y="285" fill="#aed581" font-size="9">Norway  0.966 · Rank 1 · Very High</text>
  <text x="180" y="285" fill="#ffd600" font-size="9">India  0.633 · Rank 134 · Medium</text>
  <text x="320" y="285" fill="#f06292" font-size="9">Niger  0.394 · Low</text>
  <text x="8" y="292" fill="#b2f5ea" font-size="8">HDI &lt; 0.55 = Low  |  0.55–0.70 = Medium  |  0.70–0.80 = High  |  &gt;0.80 = Very High</text>
  </g>
</svg>
