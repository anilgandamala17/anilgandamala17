<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#1a5c2a}
      .title{fill:#fff9c4;font-size:14px;font-weight:bold}
      .sub{fill:#b2f5ea;font-size:10px}
      .wt{fill:#ffffff;font-size:11px}
      .yt{fill:#fff9c4;font-size:11px;font-weight:bold}
      .ct{fill:#b2f5ea;font-size:10px}
      .box1{fill:#155724;stroke:#ffd600;stroke-width:1.4;rx:5}
      .box2{fill:#0d3b20;stroke:#80cbc4;stroke-width:1.2}
      .arr{stroke:#ffd600;stroke-width:2;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffd600"/>
    </marker>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <!-- Title -->
  <text x="210" y="18" text-anchor="middle" class="title">Nation States — The Rise of Nationalism</text>
  <text x="210" y="30" text-anchor="middle" class="sub">A nation-state combines a cultural/ethnic nation with a sovereign state</text>

  <!-- Old Order vs Nation-State -->
  <rect x="8" y="38" width="170" height="100" fill="#155724" stroke="#ffd600" stroke-width="1.4" rx="5"/>
  <text x="93" y="54" text-anchor="middle" fill="#ffd600" font-size="11" font-weight="bold">Old European Order</text>
  <text x="16" y="70" fill="#b2f5ea" font-size="10">• Monarchies &amp; empires ruled</text>
  <text x="16" y="84" fill="#b2f5ea" font-size="10">• Dynastic loyalty (not national)</text>
  <text x="16" y="98" fill="#b2f5ea" font-size="10">• Multi-ethnic empires (Habsburgs)</text>
  <text x="16" y="112" fill="#b2f5ea" font-size="10">• Church authority dominant</text>
  <text x="16" y="126" fill="#b2f5ea" font-size="10">• Trade guilds controlled economy</text>

  <!-- Arrow -->
  <path d="M 178,88 L 242,88" class="arr"/>
  <text x="210" y="82" text-anchor="middle" fill="#fff9c4" font-size="9">Revolution</text>
  <text x="210" y="98" text-anchor="middle" fill="#fff9c4" font-size="9">→ 1789–1848</text>

  <rect x="242" y="38" width="170" height="100" fill="#0d4a28" stroke="#80cbc4" stroke-width="1.4" rx="5"/>
  <text x="327" y="54" text-anchor="middle" fill="#80cbc4" font-size="11" font-weight="bold">Nation-State</text>
  <text x="250" y="70" fill="#ffffff" font-size="10">• Shared language &amp; culture</text>
  <text x="250" y="84" fill="#ffffff" font-size="10">• Defined territory + sovereignty</text>
  <text x="250" y="98" fill="#ffffff" font-size="10">• Citizen loyalty (not dynastic)</text>
  <text x="250" y="112" fill="#ffffff" font-size="10">• Constitution &amp; rule of law</text>
  <text x="250" y="126" fill="#ffffff" font-size="10">• National symbols &amp; flag</text>

  <!-- Features of a Nation State -->
  <rect x="8" y="146" width="404" height="68" fill="#0d3b20" stroke="#ffd600" stroke-width="1" rx="5"/>
  <text x="210" y="162" text-anchor="middle" fill="#fff9c4" font-size="11" font-weight="bold">Key Features of a Nation-State</text>
  <!-- 5 features -->
  <circle cx="50" cy="185" r="16" fill="#ffd600" opacity="0.15" stroke="#ffd600" stroke-width="1.5"/>
  <text x="50" y="189" text-anchor="middle" fill="#ffd600" font-size="9" font-weight="bold">People</text>
  <circle cx="120" cy="185" r="16" fill="#80cbc4" opacity="0.15" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="120" y="189" text-anchor="middle" fill="#80cbc4" font-size="9" font-weight="bold">Territory</text>
  <circle cx="190" cy="185" r="16" fill="#f06292" opacity="0.15" stroke="#f06292" stroke-width="1.5"/>
  <text x="190" y="189" text-anchor="middle" fill="#f06292" font-size="9" font-weight="bold">Sovereignty</text>
  <circle cx="265" cy="185" r="16" fill="#aed581" opacity="0.15" stroke="#aed581" stroke-width="1.5"/>
  <text x="265" y="189" text-anchor="middle" fill="#aed581" font-size="9" font-weight="bold">Govt</text>
  <circle cx="335" cy="185" r="16" fill="#ff8a65" opacity="0.15" stroke="#ff8a65" stroke-width="1.5"/>
  <text x="335" y="189" text-anchor="middle" fill="#ff8a65" font-size="9" font-weight="bold">Identity</text>
  <text x="380" y="189" text-anchor="middle" fill="#b2f5ea" font-size="9">Recognition</text>

  <!-- Timeline -->
  <rect x="8" y="222" width="404" height="72" fill="#155724" stroke="#80cbc4" stroke-width="1" rx="5"/>
  <text x="210" y="237" text-anchor="middle" fill="#fff9c4" font-size="11" font-weight="bold">Key Dates — Nation-State Formation</text>
  <!-- Timeline line -->
  <line x1="28" y1="260" x2="400" y2="260" stroke="#ffd600" stroke-width="2"/>
  <!-- Events -->
  <circle cx="60" cy="260" r="5" fill="#f06292"/>
  <text x="60" y="252" text-anchor="middle" fill="#f06292" font-size="8">1789</text>
  <text x="60" y="272" text-anchor="middle" fill="#ffffff" font-size="8">French Rev.</text>
  <circle cx="130" cy="260" r="5" fill="#80cbc4"/>
  <text x="130" y="252" text-anchor="middle" fill="#80cbc4" font-size="8">1815</text>
  <text x="130" y="272" text-anchor="middle" fill="#ffffff" font-size="8">Vienna Congress</text>
  <circle cx="200" cy="260" r="5" fill="#ffd600"/>
  <text x="200" y="252" text-anchor="middle" fill="#ffd600" font-size="8">1848</text>
  <text x="200" y="272" text-anchor="middle" fill="#ffffff" font-size="8">Year of Rev.</text>
  <circle cx="280" cy="260" r="5" fill="#aed581"/>
  <text x="280" y="252" text-anchor="middle" fill="#aed581" font-size="8">1871</text>
  <text x="280" y="272" text-anchor="middle" fill="#ffffff" font-size="8">Germany unified</text>
  <circle cx="360" cy="260" r="5" fill="#ff8a65"/>
  <text x="360" y="252" text-anchor="middle" fill="#ff8a65" font-size="8">1871</text>
  <text x="360" y="278" text-anchor="middle" fill="#ffffff" font-size="8">Italy unified</text>
  </g>
</svg>
