<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <style>
      .bg{fill:#1a5c2a}
      .title{fill:#fff9c4;font-size:14px;font-weight:bold}
      .sub{fill:#b2f5ea;font-size:10px}
    </style>
  </defs>
  <g transform="translate(75, -5) scale(1.55)">
    <text x="210" y="18" text-anchor="middle" class="title">Nationalism in Europe</text>
  <text x="210" y="30" text-anchor="middle" class="sub">Spread of nationalist ideas through culture, politics and revolution</text>

  <!-- Central circle -->
  <circle cx="210" cy="130" r="38" fill="#0d3b20" stroke="#ffd600" stroke-width="2.5"/>
  <text x="210" y="126" text-anchor="middle" fill="#ffd600" font-size="11" font-weight="bold">NATION</text>
  <text x="210" y="140" text-anchor="middle" fill="#fff9c4" font-size="10">ALISM</text>

  <!-- 6 spokes -->
  <!-- Language -->
  <line x1="175" y1="104" x2="130" y2="72" stroke="#f06292" stroke-width="1.5"/>
  <rect x="50" y="48" width="82" height="42" fill="#3a0d22" stroke="#f06292" stroke-width="1.2" rx="4"/>
  <text x="91" y="63" text-anchor="middle" fill="#f06292" font-size="10" font-weight="bold">Language</text>
  <text x="91" y="76" text-anchor="middle" fill="#ffffff" font-size="9">Vernacular languages</text>
  <text x="91" y="86" text-anchor="middle" fill="#b2f5ea" font-size="8">united common people</text>

  <!-- Romanticism -->
  <line x1="210" y1="92" x2="210" y2="60" stroke="#80cbc4" stroke-width="1.5"/>
  <rect x="143" y="38" width="134" height="42" fill="#0d3b3b" stroke="#80cbc4" stroke-width="1.2" rx="4"/>
  <text x="210" y="53" text-anchor="middle" fill="#80cbc4" font-size="10" font-weight="bold">Romanticism</text>
  <text x="210" y="65" text-anchor="middle" fill="#ffffff" font-size="9">Art, music, poetry</text>
  <text x="210" y="75" text-anchor="middle" fill="#b2f5ea" font-size="8">stirred national feelings</text>

  <!-- French Revolution -->
  <line x1="245" y1="104" x2="290" y2="72" stroke="#ffd600" stroke-width="1.5"/>
  <rect x="286" y="48" width="126" height="42" fill="#3b3000" stroke="#ffd600" stroke-width="1.2" rx="4"/>
  <text x="349" y="63" text-anchor="middle" fill="#ffd600" font-size="10" font-weight="bold">French Revolution</text>
  <text x="349" y="76" text-anchor="middle" fill="#ffffff" font-size="9">Liberty, Equality,</text>
  <text x="349" y="86" text-anchor="middle" fill="#b2f5ea" font-size="8">Fraternity → spread ideas</text>

  <!-- Conservatism -->
  <line x1="248" y1="147" x2="290" y2="170" stroke="#ff8a65" stroke-width="1.5"/>
  <rect x="286" y="158" width="126" height="42" fill="#3b1500" stroke="#ff8a65" stroke-width="1.2" rx="4"/>
  <text x="349" y="173" text-anchor="middle" fill="#ff8a65" font-size="10" font-weight="bold">Conservatism</text>
  <text x="349" y="186" text-anchor="middle" fill="#ffffff" font-size="9">Monarchy + tradition</text>
  <text x="349" y="196" text-anchor="middle" fill="#b2f5ea" font-size="8">Vienna Congress 1815</text>

  <!-- Liberal Nationalism -->
  <line x1="210" y1="168" x2="210" y2="196" stroke="#aed581" stroke-width="1.5"/>
  <rect x="143" y="194" width="134" height="42" fill="#1a3300" stroke="#aed581" stroke-width="1.2" rx="4"/>
  <text x="210" y="209" text-anchor="middle" fill="#aed581" font-size="10" font-weight="bold">Liberal Nationalism</text>
  <text x="210" y="222" text-anchor="middle" fill="#ffffff" font-size="9">Constitution, freedom</text>
  <text x="210" y="232" text-anchor="middle" fill="#b2f5ea" font-size="8">middle class demand</text>

  <!-- Print culture -->
  <line x1="172" y1="147" x2="130" y2="170" stroke="#ce93d8" stroke-width="1.5"/>
  <rect x="8" y="158" width="124" height="42" fill="#2d0a3b" stroke="#ce93d8" stroke-width="1.2" rx="4"/>
  <text x="70" y="173" text-anchor="middle" fill="#ce93d8" font-size="10" font-weight="bold">Print Culture</text>
  <text x="70" y="186" text-anchor="middle" fill="#ffffff" font-size="9">Newspapers &amp; books</text>
  <text x="70" y="196" text-anchor="middle" fill="#b2f5ea" font-size="8">spread national ideas</text>

  <!-- Bottom key figures -->
  <rect x="8" y="248" width="404" height="46" fill="#0d3b20" stroke="#ffd600" stroke-width="1" rx="5"/>
  <text x="210" y="263" text-anchor="middle" fill="#fff9c4" font-size="11" font-weight="bold">Key Thinkers of Nationalism</text>
  <text x="60" y="280" text-anchor="middle" fill="#f06292" font-size="10">Mazzini</text>
  <text x="130" y="280" text-anchor="middle" fill="#80cbc4" font-size="10">Herder</text>
  <text x="200" y="280" text-anchor="middle" fill="#ffd600" font-size="10">Napoleon</text>
  <text x="280" y="280" text-anchor="middle" fill="#aed581" font-size="10">Bismarck</text>
  <text x="360" y="280" text-anchor="middle" fill="#ff8a65" font-size="10">Metternich</text>
  <text x="60" y="290" text-anchor="middle" fill="#b2f5ea" font-size="8">Italy</text>
  <text x="130" y="290" text-anchor="middle" fill="#b2f5ea" font-size="8">Germany</text>
  <text x="200" y="290" text-anchor="middle" fill="#b2f5ea" font-size="8">France</text>
  <text x="280" y="290" text-anchor="middle" fill="#b2f5ea" font-size="8">Prussia</text>
  <text x="360" y="290" text-anchor="middle" fill="#b2f5ea" font-size="8">Austria</text>
  </g>
</svg>
