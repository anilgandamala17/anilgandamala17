<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowW" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.90)" />
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#93c5fd" />
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fca5a5" />
    </marker>
  </defs>

  <!-- Heart outline -->
  <path d="M200 220 C120 180 100 120 130 80 C160 50 200 65 200 90 C200 65 240 50 270 80 C300 120 280 180 200 220"
    fill="none" stroke="#fca5a5" stroke-width="2" />

  <!-- Septum divider -->
  <line x1="200" y1="90" x2="200" y2="200" stroke="rgba(255,255,255,0.30)" stroke-width="1" stroke-dasharray="4,3" />

  <!-- Chambers -->
  <text x="160" y="155" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="bold">Right Atrium</text>
  <text x="240" y="155" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="bold">Left Atrium</text>
  <text x="160" y="195" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="bold">Right Ventricle</text>
  <text x="240" y="195" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="bold">Left Ventricle</text>

  <!-- Blood flow arrows -->
  <path d="M80 200 L80 100 L130 80" fill="none" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrowB)" />
  <text x="50" y="150" font-size="8" fill="#93c5fd" text-anchor="middle">Vena Cava</text>
  <text x="50" y="160" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(deoxygenated)</text>

  <path d="M320 200 L320 100 L270 80" fill="none" stroke="#fca5a5" stroke-width="2" marker-end="url(#arrowR)" />
  <text x="355" y="150" font-size="8" fill="#fca5a5" text-anchor="middle">Aorta</text>
  <text x="355" y="160" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(oxygenated)</text>

  <path d="M130 50 L100 20" fill="none" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrowB)" />
  <text x="90" y="15" font-size="8" fill="#93c5fd">To Lungs</text>
  <path d="M270 50 L300 20" fill="none" stroke="#fca5a5" stroke-width="1.5" marker-end="url(#arrowR)" />
  <text x="295" y="15" font-size="8" fill="#fca5a5">From Lungs</text>

  <!-- Title -->
  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Cardiac Blood Flow</text>
</svg>
