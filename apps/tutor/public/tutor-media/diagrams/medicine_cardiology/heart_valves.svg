<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Heart silhouette (dim) -->
  <path d="M200 230 C120 190 100 130 130 90 C160 60 200 75 200 100 C200 75 240 60 270 90 C300 130 280 190 200 230"
    fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Mitral Valve (top view representation) -->
  <circle cx="170" cy="130" r="25" fill="none" stroke="#93c5fd" stroke-width="2" />
  <line x1="150" y1="130" x2="190" y2="130" stroke="#93c5fd" stroke-width="2" />
  <text x="170" y="100" font-size="9" fill="#93c5fd" text-anchor="middle" font-weight="bold">MITRAL VALVE</text>
  <text x="170" y="110" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(Bicuspid)</text>

  <!-- Aortic Valve (top view representation) -->
  <circle cx="230" cy="130" r="25" fill="none" stroke="#fca5a5" stroke-width="2" />
  <path d="M230 105 L230 130 L210 145 M230 130 L250 145" fill="none" stroke="#fca5a5" stroke-width="2" />
  <text x="230" y="100" font-size="9" fill="#fca5a5" text-anchor="middle" font-weight="bold">AORTIC VALVE</text>
  <text x="230" y="110" font-size="7" fill="rgba(255,255,255,0.30)" text-anchor="middle">(Semilunar)</text>

  <!-- Title -->
  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Heart Valve Structures</text>
</svg>
