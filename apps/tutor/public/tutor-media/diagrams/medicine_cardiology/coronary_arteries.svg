<svg viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Heart silhouette -->
  <path d="M200 230 C110 185 90 115 125 75 C160 45 200 60 200 90 C200 65 240 45 275 75 C310 115 290 185 200 230"
    fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5" />

  <!-- Left coronary artery -->
  <path d="M200 90 C180 100 160 120 150 150 C140 180 135 200 140 220"
    fill="none" stroke="#fef08a" stroke-width="1.5" />
  <text x="110" y="130" font-size="9" fill="#fef08a" font-weight="bold">Left Coronary A.</text>

  <!-- Right coronary artery -->
  <path d="M200 90 C220 100 240 120 250 150 C260 180 265 200 260 220"
    fill="none" stroke="#fca5a5" stroke-width="1.5" />
  <text x="265" y="130" font-size="9" fill="#fca5a5" font-weight="bold">Right Coronary A.</text>

  <!-- Origin label -->
  <circle cx="200" cy="90" r="4" fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="1.5" />
  <text x="200" y="75" font-size="8" fill="rgba(255,255,255,0.90)" text-anchor="middle">Aortic Root</text>

  <text x="200" y="268" font-size="12" fill="#86efac" text-anchor="middle" font-weight="bold">Coronary Artery Supply</text>
</svg>
